<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>프로젝트 2 - 페이지 3 (RHS 합동 탐구 2)</title>
  
  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Two.js 2D Dynamic Geometry Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #0284c7;
      --accent-color: #ec4899;
      --success-color: #059669;
      --bg-main: #ffffff;
      --border-color: #cbd5e1;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      display: flex;
      flex-direction: column;
    }

    /* Header & Control Bar */
    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      min-height: 48px;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
    }

    /* Top Sliders & Control Panel */
    .controls-bar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      z-index: 90;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-color);
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
    }

    input[type="range"] {
      width: 110px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .val-disp {
      font-size: 0.82rem;
      font-weight: 800;
      color: #0f172a;
      min-width: 44px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-anim {
      background: linear-gradient(135deg, #ec4899, #d946ef);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25);
    }

    .btn-anim:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-reset {
      margin-left: auto;
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    /* Full-Screen Two.js Canvas Container */
    .canvas-container {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    #two-container, #two-container canvas, #two-container svg {
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Floating Hint Badge */
    .floating-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.86rem;
      pointer-events: none;
      z-index: 80;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">📐 [페이지 3] RHS 합동 대화형 탐구 2 (좌우 반전 & 삼각형 붙이기)</h1>
  </header>

  <!-- Control Sliders Panel -->
  <div class="controls-bar">
    <!-- Triangle Dimensions Controls -->
    <div class="control-group">
      <span style="font-weight:800; color:#334155; font-size:0.85rem;">도형 치수 조절:</span>
      <label style="margin-left:6px;">빗변 AB (DE):</label>
      <input type="range" id="slider-ab-len" min="10" max="18" value="13" step="0.5" oninput="onSliderChange()">
      <span id="disp-ab-len" class="val-disp">13 cm</span>

      <label style="margin-left:12px;">변 BC (EF):</label>
      <input type="range" id="slider-bc-len" min="5" max="12" value="7" step="0.5" oninput="onSliderChange()">
      <span id="disp-bc-len" class="val-disp">7 cm</span>
    </div>

    <button class="btn btn-anim" onclick="startAttachAnimation()">🎬 [삼각형 붙이기]</button>
    <button class="btn btn-reset" onclick="resetPage3()">🔄 초기 상태로</button>
  </div>

  <main class="canvas-container">
    <div id="two-container"></div>
    <div class="floating-badge">
      💡 <b>탐구 팁:</b> 슬라이더로 치수를 조절한 후 <b>[🎬 삼각형 붙이기]</b> 버튼을 눌러 두 직각삼각형이 변 AC=DF를 축으로 합쳐져 큰 이등변삼각형 ABE가 되는 과정을 확인하세요!
    </div>
  </main>

  <script>
    let twoInstance = null;

    let animProgress = 0; // 0: 분리 상태, 1: 완벽히 붙은 상태
    let isAnimating = false;
    let animReqId = null;

    function initTwoEngine() {
      const container = document.getElementById('two-container');
      if (typeof Two === 'undefined' || !container) return null;

      container.innerHTML = '';
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || (window.innerHeight - 100);

      twoInstance = new Two({
        width: width,
        height: height,
        type: Two.Types.canvas,
        autostart: true
      }).appendTo(container);

      const domEl = twoInstance.renderer.domElement;
      if (domEl) {
        domEl.style.touchAction = 'none';
        domEl.style.userSelect = 'none';
        domEl.style.webkitUserSelect = 'none';
        domEl.style.width = '100%';
        domEl.style.height = '100%';
      }

      updateGeometries();
    }

    function onSliderChange() {
      let ab = parseFloat(document.getElementById('slider-ab-len').value);
      let bc = parseFloat(document.getElementById('slider-bc-len').value);
      if (bc >= ab) {
        bc = ab - 1;
        document.getElementById('slider-bc-len').value = bc;
      }

      // 슬라이더를 변경하면 애니메이션 상태를 분리 상태(0)로 리셋하여 렌더링
      if (isAnimating) {
        cancelAnimationFrame(animReqId);
        isAnimating = false;
      }
      animProgress = 0;

      updateGeometries();
    }

    function updateGeometries() {
      if (!twoInstance) return;

      const width = twoInstance.width;
      const height = twoInstance.height;
      const centerX = width / 2;
      const centerY = height / 2;

      twoInstance.clear();

      // 1. 옅은 정수 격자점 & 축선
      const step = 30;
      for (let x = step; x <= width; x += step) {
        for (let y = step; y <= height; y += step) {
          const dot = twoInstance.makeCircle(x, y, 1.5);
          dot.fill = '#cbd5e1';
          dot.noStroke();
        }
      }

      twoInstance.makeLine(0, centerY, width, centerY).stroke = '#94a3b8';
      twoInstance.makeLine(centerX, 0, centerX, height).stroke = '#94a3b8';

      // 2. 슬라이더 수치 읽기
      const abLenCm = parseFloat(document.getElementById('slider-ab-len').value);
      const bcLenCm = parseFloat(document.getElementById('slider-bc-len').value);

      document.getElementById('disp-ab-len').innerText = `${abLenCm} cm`;
      document.getElementById('disp-bc-len').innerText = `${bcLenCm} cm`;

      const scale = 15; // 1cm = 15px
      const abPx = abLenCm * scale;
      const bcPx = bcLenCm * scale;
      const acPx = Math.sqrt(Math.max(0, abPx * abPx - bcPx * bcPx)); // 피타고라스 정리 높이 AC

      // --- [기준 위치 계산] ---
      // 분리 상태에서 ABC의 B는 centerX - 180, DEF의 E는 centerX + 180
      const bX_initial = centerX - 180;
      const bY = centerY + 60;

      const eX_initial = centerX + 180;
      const eY = centerY + 60;

      // 붙었을 때 DEF의 F(eX - bcPx)가 ABC의 C(bX_initial + bcPx)와 일치해야 함!
      // C_X = bX_initial + bcPx
      // 따라서 붙었을 때 DEF의 E_X_attached = C_X + bcPx = bX_initial + 2 * bcPx
      const eX_target = bX_initial + 2 * bcPx;

      // animProgress (0 -> 1)에 따라 현재 DEF E의 X좌표 보정
      const current_eX = eX_initial + (eX_target - eX_initial) * animProgress;

      // --- [1. 직각삼각형 ABC (좌측, 꼭짓점 B가 좌하단)] ---
      const pB = { x: bX_initial, y: bY };
      const pC = { x: bX_initial + bcPx, y: bY };
      const pA = { x: bX_initial + bcPx, y: bY - acPx };

      const triABC = twoInstance.makePath(pA.x, pA.y, pB.x, pB.y, pC.x, pC.y, false);
      triABC.fill = 'rgba(79, 70, 229, 0.12)';
      triABC.stroke = '#4f46e5';
      triABC.linewidth = 2.5;

      // C 직각 표시
      const rC = twoInstance.makePath(pC.x - 14, pC.y, pC.x - 14, pC.y - 14, pC.x, pC.y - 14, false);
      rC.noFill(); rC.stroke = '#4f46e5'; rC.linewidth = 1.5;

      // 꼭짓점 A, B, C
      twoInstance.makeCircle(pA.x, pA.y, 6).fill = '#4f46e5';
      twoInstance.makeCircle(pB.x, pB.y, 6).fill = '#4f46e5';
      twoInstance.makeCircle(pC.x, pC.y, 6).fill = '#4f46e5';

      twoInstance.makeText('A', pA.x - 14, pA.y - 14).size = 15;
      twoInstance.makeText('B', pB.x - 16, pB.y + 16).size = 15;
      twoInstance.makeText('C', pC.x - 14, pC.y + 16).size = 15;

      // 수치 라벨
      const lblAB = twoInstance.makeText(`${abLenCm} cm`, (pA.x + pB.x)/2 - 18, (pA.y + pB.y)/2 - 10);
      lblAB.fill = '#4f46e5'; lblAB.size = 13; lblAB.weight = 800;

      const lblBC = twoInstance.makeText(`${bcLenCm} cm`, (pB.x + pC.x)/2, pB.y + 18);
      lblBC.fill = '#4f46e5'; lblBC.size = 12; lblBC.weight = 700;


      // --- [2. 직각삼각형 DEF (우측, 좌우 반전된 상태! E가 우하단, F가 좌하단 직각, D가 좌상단)] ---
      const pE = { x: current_eX, y: eY };
      const pF = { x: current_eX - bcPx, y: eY };
      const pD = { x: current_eX - bcPx, y: eY - acPx };

      const triDEF = twoInstance.makePath(pD.x, pD.y, pE.x, pE.y, pF.x, pF.y, false);
      triDEF.fill = 'rgba(2, 132, 199, 0.12)';
      triDEF.stroke = '#0284c7';
      triDEF.linewidth = 2.5;

      // F 직각 표시 (좌우 반전된 직각 ┌)
      const rF = twoInstance.makePath(pF.x + 14, pF.y, pF.x + 14, pF.y - 14, pF.x, pF.y - 14, false);
      rF.noFill(); rF.stroke = '#0284c7'; rF.linewidth = 1.5;

      // 꼭짓점 D, E, F
      twoInstance.makeCircle(pD.x, pD.y, 6).fill = '#0284c7';
      twoInstance.makeCircle(pE.x, pE.y, 6).fill = '#0284c7';
      twoInstance.makeCircle(pF.x, pF.y, 6).fill = '#0284c7';

      if (animProgress < 0.95) {
        twoInstance.makeText('D', pD.x + 14, pD.y - 14).size = 15;
        twoInstance.makeText('E', pE.x + 16, pE.y + 16).size = 15;
        twoInstance.makeText('F', pF.x + 14, pF.y + 16).size = 15;

        // DE 빗변 & EF 변 라벨
        const lblDE = twoInstance.makeText(`${abLenCm} cm`, (pD.x + pE.x)/2 + 18, (pD.y + pE.y)/2 - 10);
        lblDE.fill = '#0284c7'; lblDE.size = 13; lblDE.weight = 800;

        const lblEF = twoInstance.makeText(`${bcLenCm} cm`, (pE.x + pF.x)/2, pE.y + 18);
        lblEF.fill = '#0284c7'; lblEF.size = 12; lblEF.weight = 700;
      } else {
        // 완벽히 맞붙었을 때 라벨 (D는 A 옆, F는 C 밑)
        twoInstance.makeText('D', pD.x + 16, pD.y - 14).size = 15;
        twoInstance.makeText('E', pE.x + 16, pE.y + 16).size = 15;
        twoInstance.makeText('F', pF.x + 14, pF.y + 16).size = 15;

        const lblDE_end = twoInstance.makeText(`${abLenCm} cm`, (pD.x + pE.x)/2 + 18, (pD.y + pE.y)/2 - 10);
        lblDE_end.fill = '#059669'; lblDE_end.size = 13; lblDE_end.weight = 800;

        const lblEF_end = twoInstance.makeText(`${bcLenCm} cm`, (pE.x + pF.x)/2, pE.y + 18);
        lblEF_end.fill = '#059669'; lblEF_end.size = 12; lblEF_end.weight = 700;
      }

      // --- [3. 붙이기 완수 후 이등변삼각형 ABE 하이라이트 (animProgress >= 0.95)] ---
      if (animProgress >= 0.95) {
        const bigIsoTri = twoInstance.makePath(pA.x, pA.y, pB.x, pB.y, pE.x, pE.y, false);
        bigIsoTri.fill = 'rgba(5, 150, 105, 0.10)';
        bigIsoTri.stroke = '#059669';
        bigIsoTri.linewidth = 3;

        // 중앙 높이 선분 AC (DF) 강조 표시
        const heightLine = twoInstance.makeLine(pA.x, pA.y, pC.x, pC.y);
        heightLine.stroke = '#059669';
        heightLine.linewidth = 2;
        heightLine.dashes = [4, 4];

        const banner = twoInstance.makeText('△ABE (이등변삼각형: AB = AE)', centerX, pB.y + 45);
        banner.fill = '#059669';
        banner.size = 16;
        banner.weight = 800;
      }

      twoInstance.update();
    }

    function startAttachAnimation() {
      if (isAnimating) return;
      isAnimating = true;
      animProgress = 0;

      const stepAnim = () => {
        animProgress += 0.025;
        if (animProgress >= 1) {
          animProgress = 1;
          updateGeometries();
          isAnimating = false;
          return;
        }

        updateGeometries();
        animReqId = requestAnimationFrame(stepAnim);
      };

      stepAnim();
    }

    function resetPage3() {
      if (isAnimating) {
        cancelAnimationFrame(animReqId);
        isAnimating = false;
      }
      animProgress = 0;

      document.getElementById('slider-ab-len').value = 13;
      document.getElementById('slider-bc-len').value = 7;

      updateGeometries();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTwoEngine();
      window.addEventListener('resize', () => {
        if (twoInstance) {
          const container = document.getElementById('two-container');
          twoInstance.width = container.clientWidth;
          twoInstance.height = container.clientHeight;
          updateGeometries();
        }
      });
    });
  </script>
</body>
</html>
