<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중2 수학 탐구 웹 애플리케이션 (Redbook Engine)</title>
  
  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Konva.js 2D High-Performance Canvas Engine -->
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #0284c7;
      --accent-color: #ec4899;
      --bg-main: #f8fafc;
      --border-color: #cbd5e1;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: var(--bg-main); }

    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
    }

    .app-title { font-size: 1.1rem; font-weight: 800; color: #0f172a; }

    .main-container {
      display: flex;
      width: 100%;
      height: calc(100vh - 48px);
    }

    .canvas-section {
      flex: 1;
      position: relative;
      background: #ffffff;
      border-right: 1px solid var(--border-color);
    }

    #konva-holder {
      width: 100%;
      height: 100%;
    }

    .sidebar-section {
      width: 360px;
      padding: 20px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }

    .btn {
      padding: 10px 16px;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">📐 중2 수학 직각삼각형 탐구 (Redbook 초기화 상태)</h1>
    <div style="font-size:0.85rem; color:#64748b;">AGENTS.md 규칙 적용 준비 완료</div>
  </header>

  <main class="main-container">
    <div class="canvas-section">
      <div id="konva-holder"></div>
    </div>

    <div class="sidebar-section">
      <div class="card">
        <h3 style="font-size:1rem; margin-bottom:8px; color:#4f46e5;">📋 AGENTS.md 적용 상태</h3>
        <p style="font-size:0.88rem; color:#475569; line-height:1.5;">
          1. 60fps HTML5 Canvas / Konva.js 엔진 탑재<br>
          2. Pointer Events & Grid Snapping 준수<br>
          3. KaTeX 라벨 및 Dynamic Geometry 구속조건 구조 준비 완료
        </p>
      </div>

      <div class="card">
        <button class="btn" style="width:100%;" onclick="initEngine()">🔄 캔버스 초기화</button>
      </div>
    </div>
  </main>

  <script>
    let stage = null;
    let layer = null;

    function initEngine() {
      const container = document.getElementById('konva-holder');
      if (!container || typeof Konva === 'undefined') return;

      if (stage) stage.destroy();

      const width = container.clientWidth || 600;
      const height = container.clientHeight || 450;

      stage = new Konva.Stage({
        container: 'konva-holder',
        width: width,
        height: height
      });

      layer = new Konva.Layer();
      stage.add(layer);

      // 모눈 그리드
      const step = 30;
      for (let x = 0; x < width; x += step) {
        layer.add(new Konva.Line({ points: [x, 0, x, height], stroke: '#f1f5f9', strokeWidth: 1 }));
      }
      for (let y = 0; y < height; y += step) {
        layer.add(new Konva.Line({ points: [0, y, width, y], stroke: '#f1f5f9', strokeWidth: 1 }));
      }

      layer.draw();
    }

    document.addEventListener('DOMContentLoaded', initEngine);
  </script>
</body>
</html>
