<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 수학: 4. 좌표평면과 그래프</title>
  
  <!-- Supabase Cloud DB SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 영서중 수학 LMS Integration SDK -->
  <script src="js/lms-integration-g1.js"></script>

  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Two.js 2D Dynamic Geometry Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --secondary-color: #0284c7;
      --accent-color: #ec4899;
      --success-color: #059669;
      --warning-color: #d97706;

      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #cbd5e1;

      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 48px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 16px;
      text-transform: uppercase;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    /* Tab Navigation Bar */
    .tab-bar-container {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      height: 42px;
      align-items: center;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      font-weight: 700;
      border-color: var(--primary-color);
    }

    .tab-btn.locked {
      opacity: 0.6;
      cursor: not-allowed;
      background: #f1f5f9;
    }

    /* Sub-Step Navigation Pills */
    .substep-bar {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      align-items: center;
      height: 36px;
    }

    .substep-pill {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .substep-pill.active {
      background: var(--secondary-color);
      color: #ffffff;
      border-color: var(--secondary-color);
    }

    /* Main Container */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      height: calc(100vh - 126px);
    }

    .view-panel {
      display: none;
      width: 100%;
      height: 100%;
      flex: 1;
    }

    .view-panel.active {
      display: flex;
    }

    /* View 1: Login View */
    .login-card-container {
      margin: auto;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
      display: block;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #ffffff;
      width: 100%;
    }

    /* Activity Split View (Left 2 : Right 1) */
    .activity-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .plane-section {
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      height: 100%;
      overflow: hidden;
    }

    .plane-toolbar {
      background: #f8fafc;
      padding: 6px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      height: 42px;
    }

    .tool-btn {
      padding: 6px 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tool-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .two-plane-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    #two-container, #two-container canvas, #two-container svg {
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 검정색 손바닥 커서 (Black Hand Cursor) */
    #two-container.tool-select, #two-container.tool-select canvas {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1.5"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V2a2 2 0 0 0-4 0v9M6 14v-2.5a2 2 0 0 0-4 0V16c0 4.4 3.6 8 8 8h3c3.9 0 7.1-3.1 7-7v-3a2 2 0 0 0-4 0v-1"/></svg>') 8 8, grab !important;
    }

    #two-container.tool-select.grabbing, #two-container.tool-select.grabbing canvas {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1.5"><path d="M18 13v-2a2 2 0 0 0-4 0v2M14 12v-2a2 2 0 0 0-4 0v2M10 12.5v-2.5a2 2 0 0 0-4 0v3M6 14.5v-1a2 2 0 0 0-4 0V16c0 4.4 3.6 8 8 8h3c3.9 0 7.1-3.1 7-7v-3.5a2 2 0 0 0-4 0V13"/></svg>') 8 8, grabbing !important;
    }

    .sidebar-section {
      background: #f8fafc;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      height: 100%;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
    }

    .mission-card {
      border-left: 4px solid var(--primary-color);
    }

    .proof-input-text {
      display: inline-block;
      padding: 5px 10px;
      margin: 2px 4px;
      background: #fef08a;
      border: 2px solid #eab308;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #854d0e;
      outline: none;
      transition: all 0.2s ease;
      min-width: 90px;
    }

    .proof-input-text:focus {
      background: #ffffff;
      border-color: #ca8a04;
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.25);
    }

    .verified-answer-card {
      background: #f0fdf4;
      border: 2px solid #059669;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .verified-answer-card h4 {
      color: #065f46;
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
      border-bottom: 1px solid #bbf7d0;
      padding-bottom: 4px;
    }

    .verified-answer-card p {
      font-size: 0.92rem;
      color: #047857;
      line-height: 1.7;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="logo-group">
      <span class="badge-tag">중1 수학</span>
      <h1 class="app-title">📐 4. 좌표평면과 그래프</h1>
    </div>
    <div>
      <span id="current-user-info" style="font-size:0.85rem; font-weight:700; color:#4f46e5; margin-right:8px;">👤 로그인 필요</span>
      <button class="btn" style="padding:4px 10px; font-size:0.78rem; background:#f1f5f9; border:1px solid #cbd5e1;" onclick="openTeacherLoginModal()">🔑 교사 접속</button>
      <button class="btn" style="padding:4px 10px; font-size:0.78rem; background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; margin-left:4px;" onclick="switchView('login')">로그아웃</button>
    </div>
  </header>

  <!-- Tab Navigation Bar -->
  <nav class="tab-bar-container">
    <button id="tab-0" class="tab-btn active" onclick="switchMainTab(0)">0. 되짚어 보기 🔓</button>
    <button id="tab-1" class="tab-btn" onclick="switchMainTab(1)">4.1 순서쌍과 좌표 🔒</button>
    <button id="tab-2" class="tab-btn" onclick="switchMainTab(2)">4.2 사분면 🔒</button>
    <button id="tab-3" class="tab-btn" onclick="switchMainTab(3)">4.3 그래프의 해석 🔒</button>
    <button id="tab-4" class="tab-btn" onclick="switchMainTab(4)">4.4 정비례 그래프 🔒</button>
    <button id="tab-5" class="tab-btn" onclick="switchMainTab(5)">4.5 반비례 그래프 🔒</button>
  </nav>

  <!-- Sub-Step Navigation Pills -->
  <div id="substep-bar" class="substep-bar">
    <span style="font-size:0.78rem; font-weight:700; color:#64748b;">📑 세부 탐구 활동:</span>
    <div id="substep-pills-container" style="display:flex; gap:6px;"></div>
  </div>

  <!-- Main Container -->
  <main class="main-container">
    <!-- VIEW 1: LOGIN VIEW -->
    <section id="view-login" class="view-panel active">
      <div class="login-card-container">
        <h2 style="font-size:1.35rem; margin-bottom:6px; color:#1e293b;">🏫 영서중 수학 LMS 학생 로그인</h2>
        <p style="font-size:0.86rem; color:#64748b; margin-bottom:18px;">LMS 회원가입 DB의 학번과 비밀번호를 입력하고 이어서 학습하세요!</p>
        <form onsubmit="handleLMSLogin(event)">
          <div class="form-group">
            <label for="student-id">학번 (예: 10101)</label>
            <input type="text" id="student-id" class="form-control" placeholder="LMS 가입 학번 5자리" value="10101" required>
          </div>
          <div class="form-group">
            <label for="student-name">비밀번호</label>
            <input type="password" id="student-name" class="form-control" placeholder="LMS 가입 비밀번호" required>
          </div>
          <button id="btn-start-exploration" type="submit" class="btn btn-primary" style="margin-top: 8px; width:100%; font-size:1.05rem; padding:12px; font-weight:800; background:linear-gradient(135deg, #0284c7, #4f46e5);">🔐 영서중 수학 LMS 학생 로그인</button>
        </form>

        <div style="margin-top:14px; border-top:1px solid #e2e8f0; padding-top:12px; display:flex; flex-direction:column; gap:8px;">
          <button type="button" class="btn" style="background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; width:100%; font-weight:700;" onclick="openTestLoginModal()">🧪 체험/테스트 계정 접속</button>
        </div>
      </div>
    </section>

    <!-- VIEW 2: ACTIVITY EXPLORATION VIEW -->
    <section id="view-activity" class="view-panel">
      <div class="activity-layout">
        <!-- Left Plane Section (60fps Canvas) -->
        <div class="plane-section">
          <div class="plane-toolbar">
            <button id="tool-select" class="tool-btn active" onclick="setTool('select')">🖐️ 선택/점 드래그</button>
            <button id="tool-reset" class="tool-btn" onclick="resetCanvasView()">🔄 화면 초기화</button>
            <span id="coord-display" style="margin-left:auto; font-size:0.82rem; font-weight:800; color:#0284c7; background:#e0f2fe; padding:4px 10px; border-radius:10px;">
              📍 현재 선택 점: O(0, 0)
            </span>
          </div>
          <div class="two-plane-wrapper">
            <div id="two-container" class="tool-select"></div>
          </div>
        </div>

        <!-- Right Sidebar Section -->
        <div class="sidebar-section">
          <div class="card mission-card">
            <h3 style="font-size:0.95rem; font-weight:800; color:var(--primary-color); margin-bottom:6px;">🎯 오늘의 수학 탐구 미션</h3>
            <div id="mission-text" style="font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">
              단계를 선택하여 동적 탐구를 시작하세요!
            </div>
          </div>

          <div id="form-work-area" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      studentId: '10101',
      studentName: '학생',
      isTeacherLoggedIn: false,
      currentMainTab: 0,
      subStep: '0-1',
      tool: 'select',
      unlockedTabs: [0],
      pointP: { x: 3, y: 2, label: 'P' },
      slopeA: 2,
      curvedA: 6
    };

    let twoInstance = null;

    function initTwoEngine() {
      const container = document.getElementById('two-container');
      if (!container) return null;
      container.innerHTML = '';

      const width = container.clientWidth || 800;
      const height = container.clientHeight || 500;

      twoInstance = new Two({
        width: width,
        height: height,
        type: Two.Types.canvas,
        autostart: true
      }).appendTo(container);

      return { two: twoInstance, centerX: width / 2, centerY: height / 2, width, height };
    }

    function snapVal(val, step = 30) { return Math.round(val / step) * step; }

    function setTool(toolName) {
      state.tool = toolName;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      const el = document.getElementById(`tool-${toolName}`);
      if (el) el.classList.add('active');
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-panel').forEach(el => { el.classList.remove('active'); el.style.display = 'none'; });
      const targetView = document.getElementById(`view-${viewName}`);
      if (targetView) { targetView.classList.add('active'); targetView.style.display = 'flex'; }
    }

    async function handleLMSLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const idEl = document.getElementById('student-id');
      const pwEl = document.getElementById('student-name');
      const studentId = idEl ? idEl.value.trim() : '';
      const password = pwEl ? pwEl.value.trim() : '';

      if (!studentId || !password) {
        alert("⚠️ 학번과 비밀번호를 모두 입력해 주세요!");
        return false;
      }

      const loginBtn = document.getElementById('btn-start-exploration');
      if (loginBtn) { loginBtn.disabled = true; loginBtn.innerText = "⏳ 영서중 수학 LMS DB 인증 중..."; }

      try {
        const res = await LMSIntegration.loginStudent(studentId, password);
        if (res.success) {
          state.currentUser = res.user;
          state.studentId = res.user.id;
          state.studentName = res.user.name;
          state.isTeacherLoggedIn = (res.user.role === 'teacher' || res.user.id === '661227');

          document.getElementById('current-user-info').innerText = `👤 ${res.user.name} (${res.user.id})`;

          const prog = await LMSIntegration.loadStudentProgress(res.user.id);
          let targetSubStep = '0-1';

          if (prog && prog.lastSubStep) {
            targetSubStep = prog.lastSubStep;
            if (Array.isArray(prog.completedSteps)) {
              prog.completedSteps.forEach(code => {
                const mainIdx = parseInt(code.split('-')[0]);
                unlockNextStep(mainIdx);
              });
            }
          }

          switchView('activity');
          setTimeout(() => { loadSubStep(targetSubStep); }, 80);

          if (typeof LMSIntegration !== 'undefined' && LMSIntegration.startPeriodicAutoSave) {
            LMSIntegration.startPeriodicAutoSave(() => {
              const formArea = document.getElementById('form-work-area');
              let txts = '';
              if (formArea) {
                const inputs = formArea.querySelectorAll('input, textarea');
                txts = Array.from(inputs).map(el => el.value.trim()).filter(Boolean).join(' | ');
              }
              return { subStep: state.subStep, answerText: txts, score: txts ? 30 : 0 };
            }, 15000);
          }
        } else {
          alert(`❌ ${res.message}`);
        }
      } catch (err) {
        console.error(err);
        alert("❌ 영서중 수학 LMS DB 연결 중 오류가 발생했습니다.");
      } finally {
        if (loginBtn) { loginBtn.disabled = false; loginBtn.innerText = "🔐 영서중 수학 LMS 학생 로그인"; }
      }
      return false;
    }

    function openTestLoginModal() {
      const pw = prompt("🔑 체험/테스트 비밀번호를 입력해 주세요:");
      if (pw === '661227') {
        state.isTeacherLoggedIn = true;
        for (let i = 0; i <= 5; i++) unlockNextStep(i);
        document.getElementById('current-user-info').innerText = `🔑 체험/선생님 접속 (전체해금)`;
        switchView('activity');
        setTimeout(() => { loadSubStep('0-1'); }, 80);
      }
    }

    function unlockNextStep(tabIndex) {
      const nextIdx = tabIndex + 1;
      if (nextIdx <= 5 && !state.unlockedTabs.includes(nextIdx)) {
        state.unlockedTabs.push(nextIdx);
        const tabBtn = document.getElementById(`tab-${nextIdx}`);
        if (tabBtn) {
          tabBtn.classList.remove('locked');
          const titles = ['0. 되짚어 보기', '4.1 순서쌍과 좌표', '4.2 사분면', '4.3 그래프의 해석', '4.4 정비례 그래프', '4.5 반비례 그래프'];
          tabBtn.innerText = `${titles[nextIdx]} 🔓`;
        }
      }
    }

    function switchMainTab(idx) {
      if (!state.unlockedTabs.includes(idx) && !state.isTeacherLoggedIn) {
        alert("🔒 이전 단원의 되짚어 보기/탐구 문제를 모두 맞추셔야 해제됩니다!");
        return;
      }
      state.currentMainTab = idx;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        if (i === idx) btn.classList.add('active'); else btn.classList.remove('active');
      });

      const defaultSub = { 0: '0-1', 1: '1-1', 2: '2-1', 3: '3-1', 4: '4-1', 5: '5-1' };
      loadSubStep(defaultSub[idx] || '0-1');
    }

    function updateSubStepPills(mainIdx) {
      const container = document.getElementById('substep-pills-container');
      container.innerHTML = '';

      const pillsConfig = {
        0: [
          { code: '0-1', label: '1. 대응 관계 (초5~6)' },
          { code: '0-2', label: '2. 정수와 유리수 (중1)' },
          { code: '0-3', label: '3. 문자의 사용과 식의 값 (중1)' }
        ],
        1: [{ code: '1-1', label: '4.1 세부활동 1 (좌표평면 구조)' }, { code: '1-2', label: '4.1 세부활동 2 (점 플로팅 & 좌표)' }, { code: '1-3', label: '4.1 좌표 정리' }],

    function formatMathText(txt) {
      if (typeof katex === 'undefined') return txt;
      return txt.replace(/\$(.*?)\$/g, (match, math) => {
        try { return katex.renderToString(math, { throwOnError: false }); } catch (e) { return math; }
      });
    }

    // 60fps Dynamic Plane Renderer (좌표평면 모눈 렌더러)
    function drawCoordinatePlane(two, pointData = null, options = {}) {
      if (!two) return;
      two.clear();

      const width = two.width, height = two.height;
      const step = 30; // Grid step
      const centerX = Math.round(width / 2 / step) * step;
      const centerY = Math.round(height / 2 / step) * step;

      // Grid lines
      for (let x = 0; x <= width; x += step) {
        const line = two.makeLine(x, 0, x, height);
        line.stroke = (x === centerX) ? '#0f172a' : '#e2e8f0';
        line.linewidth = (x === centerX) ? 2.5 : 1;
      }
      for (let y = 0; y <= height; y += step) {
        const line = two.makeLine(0, y, width, y);
        line.stroke = (y === centerY) ? '#0f172a' : '#e2e8f0';
        line.linewidth = (y === centerY) ? 2.5 : 1;
      }

      // Origin & Axis Labels
      const lblO = two.makeText('O', centerX - 14, centerY + 16); lblO.size = 16; lblO.weight = 800; lblO.fill = '#0f172a';
      const lblX = two.makeText('x', width - 18, centerY - 14); lblX.size = 17; lblX.weight = 800; lblX.fill = '#0284c7';
      const lblY = two.makeText('y', centerX + 14, 18); lblY.size = 17; lblY.weight = 800; lblY.fill = '#0284c7';

      // Quadrant Label Overlays
      if (options.showQuadrants) {
        const q1 = two.makeText('제1사분면 (+, +)', centerX + 120, centerY - 100); q1.size = 16; q1.fill = 'rgba(79, 70, 229, 0.4)'; q1.weight = 800;
        const q2 = two.makeText('제2사분면 (-, +)', centerX - 120, centerY - 100); q2.size = 16; q2.fill = 'rgba(2, 132, 199, 0.4)'; q2.weight = 800;
        const q3 = two.makeText('제3사분면 (-, -)', centerX - 120, centerY + 100); q3.size = 16; q3.fill = 'rgba(236, 72, 153, 0.4)'; q3.weight = 800;
        const q4 = two.makeText('제4사분면 (+, -)', centerX + 120, centerY + 100); q4.size = 16; q4.fill = 'rgba(5, 150, 105, 0.4)'; q4.weight = 800;
      }

      // Render Dynamic Point P
      if (pointData) {
        const px = centerX + pointData.x * step;
        const py = centerY - pointData.y * step;

        // Dashed lines to axes
        const dashX = two.makeLine(px, py, px, centerY); dashX.stroke = '#4f46e5'; dashX.linewidth = 1.5;
        const dashY = two.makeLine(px, py, centerX, py); dashY.stroke = '#4f46e5'; dashY.linewidth = 1.5;

        // Point circle
        const circle = two.makeCircle(px, py, 8); circle.fill = '#4f46e5'; circle.stroke = '#ffffff'; circle.linewidth = 2;
        const lblP = two.makeText(`${pointData.label || 'P'}(${pointData.x}, ${pointData.y})`, px + 24, py - 14);
        lblP.size = 17; lblP.weight = 800; lblP.fill = '#4f46e5';
      }

      // Render Direct Proportion y = ax
      if (options.directSlope !== undefined) {
        const a = options.directSlope;
        const x1 = -10, y1 = a * x1;
        const x2 = 10, y2 = a * x2;
        const p1 = { x: centerX + x1 * step, y: centerY - y1 * step };
        const p2 = { x: centerX + x2 * step, y: centerY - y2 * step };

        const line = two.makeLine(p1.x, p1.y, p2.x, p2.y);
        line.stroke = '#ec4899'; line.linewidth = 3.5;
        const lblLine = two.makeText(`y = ${a}x`, p2.x - 30, p2.y - 15);
        lblLine.size = 18; lblLine.weight = 800; lblLine.fill = '#ec4899';
      }

      two.update();
    }

    let realtimeInputDebounceTimer = null;
    function attachRealtimeInputTracker() {
      setTimeout(() => {
        const formArea = document.getElementById('form-work-area');
        if (!formArea) return;
        const inputs = formArea.querySelectorAll('input, textarea');
        inputs.forEach(inp => {
          inp.addEventListener('input', () => {
            clearTimeout(realtimeInputDebounceTimer);
            realtimeInputDebounceTimer = setTimeout(() => {
              const allAnswers = Array.from(inputs).map(el => el.value.trim()).filter(Boolean).join(' | ');
              if (allAnswers && typeof LMSIntegration !== 'undefined') {
                LMSIntegration.saveStudentProgress(state.subStep, {
                  activityTitle: `4. 좌표평면 [작성 중: 단계 ${state.subStep}]`,
                  answerText: allAnswers,
                  score: 30
                });
              }
            }, 1000);
          });
        });
      }, 250);
    }

    // 되짚어 보기 1번 문제 대응 관계 표 렌더러 (초5~6) - 12, 15, 18 빈칸 처리
    function drawTableCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cx = width / 2, cy = height / 2;

      const rect = two.makeRoundedRectangle(cx, cy, 520, 150, 12);
      rect.fill = '#f8fafc'; rect.stroke = '#94a3b8'; rect.linewidth = 2;

      const colW = 70;
      const startX = cx - 210;
      for (let i = 0; i <= 6; i++) {
        const x = startX + i * colW;
        const line = two.makeLine(x, cy - 75, x, cy + 75);
        line.stroke = '#cbd5e1'; line.linewidth = 1.5;
      }
      const hLine = two.makeLine(cx - 260, cy, cx + 260, cy);
      hLine.stroke = '#cbd5e1'; hLine.linewidth = 2;

      const lblRow1 = two.makeText('□', startX - 35, cy - 36); lblRow1.size = 24; lblRow1.weight = 800; lblRow1.fill = '#475569';
      const lblRow2 = two.makeText('△', startX - 35, cy + 36); lblRow2.size = 24; lblRow2.weight = 800; lblRow2.fill = '#0284c7';

      const row1Vals = [1, 2, 3, 4, 5, 6];
      // 4, 5, 6 아래 셀은 정답 유출을 막기 위해 깨끗한 빈칸으로 표기
      const row2Vals = ['3', '6', '9', '', '', ''];

      row1Vals.forEach((val, idx) => {
        const x = startX + idx * colW + colW / 2;
        const t = two.makeText(String(val), x, cy - 36);
        t.size = 20; t.weight = 700; t.fill = '#1e293b';
      });

      row2Vals.forEach((val, idx) => {
        if (val) {
          const x = startX + idx * colW + colW / 2;
          const t = two.makeText(val, x, cy + 36);
          t.size = 20; t.weight = 800; t.fill = '#1e293b';
        }
      });

      two.update();
    }

    // 되짚어 보기 2번 문제 수직선 렌더러 (중1 정수와 유리수 - 점 A 정중앙 수학적 이등분 표기)
    function drawNumberLineCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cy = height / 2 + 10;
      const step = 65;
      const cx = width / 2;

      // 수직선 메인 라인
      const line = two.makeLine(50, cy, width - 50, cy);
      line.stroke = '#1e293b'; line.linewidth = 3;

      // 화살표
      const arrL = two.makePath(50, cy, 65, cy - 8, 65, cy + 8, false); arrL.fill = '#1e293b'; arrL.noStroke();
      const arrR = two.makePath(width - 50, cy, width - 65, cy - 8, width - 65, cy + 8, false); arrR.fill = '#1e293b'; arrR.noStroke();

      // -4부터 4까지 눈금 및 라벨
      for (let i = -4; i <= 4; i++) {
        const x = cx + i * step;
        const tick = two.makeLine(x, cy - 8, x, cy + 8);
        tick.stroke = (i === 0) ? '#4f46e5' : '#475569';
        tick.linewidth = (i === 0) ? 2.5 : 1.5;

        const lbl = two.makeText(String(i), x, cy + 28);
        lbl.size = 17; lbl.weight = 800; lbl.fill = (i === 0) ? '#4f46e5' : '#475569';
      }

      // 점 A (-3.5) 좌표 및 이등분 정밀 수학적 시각화 (교과서 원본 준수)
      const x4 = cx + (-4) * step;
      const x3 = cx + (-3) * step;
      const ax = cx + (-3.5) * step;

      // 1. -4와 -3 사이 정중앙 이등분 틱마크
      const midTick = two.makeLine(ax, cy - 5, ax, cy + 5);
      midTick.stroke = '#ec4899'; midTick.linewidth = 2;

      // 2. 점선 아치 2개 ( -4 -> -3.5 / -3.5 -> -3 )
      const arc1 = two.makeCurve(x4, cy - 4, (x4 + ax) / 2, cy - 26, ax, cy - 4, true);
      arc1.stroke = '#ec4899'; arc1.linewidth = 1.6; arc1.noFill();
      if (arc1.dashes) arc1.dashes = [4, 3];

      const arc2 = two.makeCurve(ax, cy - 4, (ax + x3) / 2, cy - 26, x3, cy - 4, true);
      arc2.stroke = '#ec4899'; arc2.linewidth = 1.6; arc2.noFill();
      if (arc2.dashes) arc2.dashes = [4, 3];

      // 3. 아치 상단 이등분 동등 수직 표시 틱 ( | | )
      const t1 = two.makeLine((x4 + ax) / 2, cy - 21, (x4 + ax) / 2, cy - 11); t1.stroke = '#ec4899'; t1.linewidth = 1.5;
      const t2 = two.makeLine((ax + x3) / 2, cy - 21, (ax + x3) / 2, cy - 11); t2.stroke = '#ec4899'; t2.linewidth = 1.5;

      // 점 A 핑크색 마커 및 라벨
      two.makeCircle(ax, cy, 8).fill = '#ec4899';
      const lblA = two.makeText('A', ax, cy - 38); lblA.size = 22; lblA.weight = 800; lblA.fill = '#ec4899';

      // 점 B (0)
      const bx = cx + 0 * step;
      two.makeCircle(bx, cy, 8).fill = '#0284c7';
      const lblB = two.makeText('B', bx, cy - 25); lblB.size = 22; lblB.weight = 800; lblB.fill = '#0284c7';

      // 점 C (2)
      const cx_pt = cx + 2 * step;
      two.makeCircle(cx_pt, cy, 8).fill = '#059669';
      const lblC = two.makeText('C', cx_pt, cy - 25); lblC.size = 22; lblC.weight = 800; lblC.fill = '#059669';

      two.update();
    }

    // 되짚어 보기 3번 문제 식의 값 렌더러 (중1 문자의 사용과 식의 값)
    function drawAlgebraicCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cx = width / 2, cy = height / 2;

      const card = two.makeRoundedRectangle(cx, cy, 480, 160, 16);
      card.fill = 'rgba(79, 70, 229, 0.05)'; card.stroke = '#4f46e5'; card.linewidth = 2;

      const tTitle = two.makeText('x = 2 일 때, 식의 값 구하기', cx, cy - 45);
      tTitle.size = 21; tTitle.weight = 800; tTitle.fill = '#4f46e5';

      const t1 = two.makeText('(1) 4x  ➔  4 × 2 = ?', cx - 120, cy + 20);
      t1.size = 18; t1.weight = 700; t1.fill = '#1e293b';

      const t2 = two.makeText('(2) x - 5  ➔  2 - 5 = ?', cx + 120, cy + 20);
      t2.size = 18; t2.weight = 700; t2.fill = '#1e293b';

      two.update();
    }

    function renderVerifiedAnswerView(titleHtml, contentHtml, nextStepCode) {
      const formArea = document.getElementById('form-work-area');
      if (!formArea) return;

      formArea.innerHTML = `
        <div class="verified-answer-card">
          <h4>✅ 정답 확인 (수학 기호 정돈 표기)</h4>
          <div style="font-size:0.95rem; font-weight:800; color:#065f46; margin-bottom:8px;">${titleHtml}</div>
          <div style="font-size:0.9rem; color:#047857; line-height:1.7; margin-bottom:14px;">
            ${contentHtml}
          </div>
          <button class="btn btn-primary" style="background:#059669; font-size:1rem; padding:12px; width:100%; font-weight:800;" onclick="loadSubStep('${nextStepCode}')">
            🚀 다음 단계로 진행하기 ➔
          </button>
        </div>
      `;
    }

    function normTxt(v) { return v ? v.trim().replace(/\s+/g, '').toUpperCase() : ''; }

    function check01Submit() {
      const t4 = normTxt(document.getElementById('p01-t4').value);
      const t5 = normTxt(document.getElementById('p01-t5').value);
      const t6 = normTxt(document.getElementById('p01-t6').value);
      const rel = normTxt(document.getElementById('p01-rel').value);

      const okVals = t4 === '12' && t5 === '15' && t6 === '18';
      const okRel = rel.includes('3') && (rel.includes('□') || rel.includes('X') || rel.includes('*') || rel.includes('3'));

      if (okVals && okRel) {
        renderVerifiedAnswerView(
          "되짚어 보기 1 (대응 관계) 정답!",
          "• 표 빈칸: <b>12, 15, 18</b><br>• 대응 관계 식: <b>△ = □ × 3</b>",
          "0-2"
        );
      } else {
        alert("❌ 표의 빈칸(12, 15, 18)과 대응 관계 식(□ × 3)을 다시 확인해 주세요!");
      }
    }

    function check02Submit() {
      const qa = normTxt(document.getElementById('p02-qa').value);
      const qb = normTxt(document.getElementById('p02-qb').value);
      const qc = normTxt(document.getElementById('p02-qc').value);

      const okA = qa.includes('-7/2') || qa.includes('-3.5') || qa.includes('-7분의2');
      const okB = qb === '0';
      const okC = qc === '2';

      if (okA && okB && okC) {
        renderVerifiedAnswerView(
          "되짚어 보기 2 (정수와 유리수) 정답!",
          "• A: <b>-7/2</b> (또는 -3.5)<br>• B: <b>0</b><br>• C: <b>2</b>",
          "0-3"
        );
      } else {
        alert("❌ 수직선 위 점 A, B, C에 대응하는 수를 다시 확인해 주세요!\n(예: A = -7/2 또는 -3.5, B = 0, C = 2)");
      }
    }

    function check03Submit() {
      const q1 = normTxt(document.getElementById('p03-q1').value);
      const q2 = normTxt(document.getElementById('p03-q2').value);
      const q3 = normTxt(document.getElementById('p03-q3').value);

      const ok1 = q1 === '8';
      const ok2 = q2 === '-3';
      const ok3 = q3 === '4';

      if (ok1 && ok2 && ok3) {
        unlockNextStep(1);
        renderVerifiedAnswerView(
          "🏆 되짚어 보기 3문제 완수 완료!",
          "(1) 4x = <b>8</b><br>(2) x - 5 = <b>-3</b><br>(3) 8/x = <b>4</b><br><br>[4.1 순서쌍과 좌표] 단원의 자물쇠가 해제되었습니다!",
          "1-1"
        );
      } else {
        alert("❌ x=2일 때 식의 값 (1) 8, (2) -3, (3) 4 가 맞는지 다시 확인해 주세요!");
      }
    }

    function check11Submit() {
      const q1 = normTxt(document.getElementById('p11-q1').value);
      if (q1.includes('P(3,2)') || q1.includes('(3,2)') || (q1.includes('3') && q1.includes('2'))) {
        renderVerifiedAnswerView("순서쌍과 점의 좌표", "점 P의 좌표 표현: <b>P(3, 2)</b>", "1-2");
      } else { alert("❌ P(3, 2) 형태로 작성해 주세요."); }
    }

    function check12Submit() {
      const q1 = normTxt(document.getElementById('p12-q1').value);
      const q2 = normTxt(document.getElementById('p12-q2').value);
      if ((q1.includes('-2') && q1.includes('4')) && (q2.includes('5') && q2.includes('0'))) {
        unlockNextStep(2);
        renderVerifiedAnswerView("점의 좌표 판별", "① A(-2, 4)<br>② B(5, 0) ($x$축 위의 점의 $y$좌표는 0)", "2-1");
      } else { alert("❌ 좌표를 다시 확인해 주세요. (예: A(-2, 4), B(5, 0))"); }
    }

    function check21Submit() {
      const q1 = normTxt(document.getElementById('p21-q1').value);
      const q2 = normTxt(document.getElementById('p21-q2').value);
      const q3 = normTxt(document.getElementById('p21-q3').value);
      const q4 = normTxt(document.getElementById('p21-q4').value);
      if (q1.includes('1') && q2.includes('2') && q3.includes('3') && q4.includes('4')) {
        unlockNextStep(3);
        renderVerifiedAnswerView("사분면의 위치와 부호", "제1사분면(+,+), 제2사분면(-,+), 제3사분면(-,-), 제4사분면(+,-)", "3-1");
      } else { alert("❌ 사분면 번호를 정확히 입력해 주세요."); }
    }

    function check41Submit() {
      const q1 = normTxt(document.getElementById('p41-q1').value);
      const q2 = normTxt(document.getElementById('p41-q2').value);
      if ((q1.includes('1') && q1.includes('3')) && (q2.includes('2') && q2.includes('4'))) {
        unlockNextStep(5);
        renderVerifiedAnswerView("정비례 y=ax 그래프의 성질", "① $a>0$: 제1, 3사분면을 지남<br>② $a<0$: 제2, 4사분면을 지남", "5-1");
      } else { alert("❌ 지나가는 사분면 번호를 확인해 주세요."); }
    }

    function checkGeneralSubmit() {
      const nextMap = { '3-1': '3-2', '3-2': '4-1', '5-1': '5-2', '5-2': '0-1' };
      const nextCode = nextMap[state.subStep] || '0-1';
      renderVerifiedAnswerView("학습 탐구 완료!", "성공적으로 탐구를 완수하였습니다.", nextCode);
    }

    function resetCanvasView() {
      state.pointP = { x: 3, y: 2, label: 'P' };
      if (twoInstance) drawCoordinatePlane(twoInstance, state.pointP);
    }

    window.onload = function() {
      switchView('login');
    };
  </script>
