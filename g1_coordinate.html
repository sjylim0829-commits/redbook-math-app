<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 수학: 4. 좌표평면과 그래프</title>
  
  <!-- Supabase Cloud DB SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 영서중 수학 LMS Integration SDK -->
  <script src="js/lms-integration-g1.js"></script>

  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Two.js 2D Dynamic Geometry Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --secondary-color: #0284c7;
      --accent-color: #ec4899;
      --success-color: #059669;
      --warning-color: #d97706;

      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #cbd5e1;

      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 48px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 16px;
      text-transform: uppercase;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    /* Tab Navigation Bar */
    .tab-bar-container {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      height: 42px;
      align-items: center;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      font-weight: 700;
      border-color: var(--primary-color);
    }

    .tab-btn.locked {
      opacity: 0.6;
      cursor: not-allowed;
      background: #f1f5f9;
    }

    /* Sub-Step Navigation Pills */
    .substep-bar {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      align-items: center;
      height: 36px;
    }

    .substep-pill {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .substep-pill.active {
      background: var(--secondary-color);
      color: #ffffff;
      border-color: var(--secondary-color);
    }

    /* Main Container */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      height: calc(100vh - 126px);
    }

    .view-panel {
      display: none;
      width: 100%;
      height: 100%;
      flex: 1;
    }

    .view-panel.active {
      display: flex;
    }

    /* View 1: Login View */
    .login-card-container {
      margin: auto;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
      display: block;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #ffffff;
      width: 100%;
    }

    /* Activity Split View (Left 2 : Right 1) */
    .activity-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .plane-section {
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      height: 100%;
      overflow: hidden;
    }

    .plane-toolbar {
      background: #f8fafc;
      padding: 6px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      height: 42px;
    }

    .tool-btn {
      padding: 6px 12px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tool-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
    }

    .two-plane-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    #two-container, #two-container canvas, #two-container svg {
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 검정색 손바닥 커서 (Black Hand Cursor) */
    #two-container.tool-select, #two-container.tool-select canvas {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1.5"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V2a2 2 0 0 0-4 0v9M6 14v-2.5a2 2 0 0 0-4 0V16c0 4.4 3.6 8 8 8h3c3.9 0 7.1-3.1 7-7v-3a2 2 0 0 0-4 0v-1"/></svg>') 8 8, grab !important;
    }

    #two-container.tool-select.grabbing, #two-container.tool-select.grabbing canvas {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1.5"><path d="M18 13v-2a2 2 0 0 0-4 0v2M14 12v-2a2 2 0 0 0-4 0v2M10 12.5v-2.5a2 2 0 0 0-4 0v3M6 14.5v-1a2 2 0 0 0-4 0V16c0 4.4 3.6 8 8 8h3c3.9 0 7.1-3.1 7-7v-3.5a2 2 0 0 0-4 0V13"/></svg>') 8 8, grabbing !important;
    }

    .sidebar-section {
      background: #f8fafc;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      height: 100%;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
    }

    .mission-card {
      border-left: 4px solid var(--primary-color);
    }

    .proof-input-text {
      display: inline-block;
      padding: 5px 10px;
      margin: 2px 4px;
      background: #fef08a;
      border: 2px solid #eab308;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #854d0e;
      outline: none;
      transition: all 0.2s ease;
      min-width: 90px;
    }

    .proof-input-text:focus {
      background: #ffffff;
      border-color: #ca8a04;
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.25);
    }

    .verified-answer-card {
      background: #f0fdf4;
      border: 2px solid #059669;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .verified-answer-card h4 {
      color: #065f46;
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 8px;
      border-bottom: 1px solid #bbf7d0;
      padding-bottom: 4px;
    }

    .verified-answer-card p {
      font-size: 0.92rem;
      color: #047857;
      line-height: 1.7;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="logo-group">
      <span class="badge-tag">중1 수학</span>
      <h1 class="app-title">📐 4. 좌표평면과 그래프</h1>
    </div>
    <div>
      <span id="current-user-info" style="font-size:0.85rem; font-weight:700; color:#4f46e5; margin-right:8px;">👤 로그인 필요</span>
      <button class="btn" style="padding:4px 10px; font-size:0.78rem; background:#f1f5f9; border:1px solid #cbd5e1;" onclick="openTeacherLoginModal()">🔑 교사 접속</button>
      <button class="btn" style="padding:4px 10px; font-size:0.78rem; background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; margin-left:4px;" onclick="switchView('login')">로그아웃</button>
    </div>
  </header>

  <!-- Tab Navigation Bar -->
  <nav class="tab-bar-container">
    <button id="tab-0" class="tab-btn active" onclick="switchMainTab(0)">0. 되짚어 보기 🔓</button>
    <button id="tab-1" class="tab-btn" onclick="switchMainTab(1)">4.1 순서쌍과 좌표 🔒</button>
    <button id="tab-2" class="tab-btn" onclick="switchMainTab(2)">4.2 사분면 🔒</button>
    <button id="tab-3" class="tab-btn" onclick="switchMainTab(3)">4.3 그래프의 해석 🔒</button>
    <button id="tab-4" class="tab-btn" onclick="switchMainTab(4)">4.4 정비례 그래프 🔒</button>
    <button id="tab-5" class="tab-btn" onclick="switchMainTab(5)">4.5 반비례 그래프 🔒</button>
  </nav>

  <!-- Sub-Step Navigation Pills -->
  <div id="substep-bar" class="substep-bar">
    <span style="font-size:0.78rem; font-weight:700; color:#64748b;">📑 세부 탐구 활동:</span>
    <div id="substep-pills-container" style="display:flex; gap:6px;"></div>
  </div>

  <!-- Main Container -->
  <main class="main-container">
    <!-- VIEW 1: LOGIN VIEW -->
    <section id="view-login" class="view-panel active">
      <div class="login-card-container">
        <h2 style="font-size:1.35rem; margin-bottom:6px; color:#1e293b;">🏫 영서중 수학 LMS 학생 로그인</h2>
        <p style="font-size:0.86rem; color:#64748b; margin-bottom:18px;">LMS 회원가입 DB의 학번과 비밀번호를 입력하고 이어서 학습하세요!</p>
        <form onsubmit="handleLMSLogin(event)">
          <div class="form-group">
            <label for="student-id">학번 (예: 10101)</label>
            <input type="text" id="student-id" class="form-control" placeholder="LMS 가입 학번 5자리" value="10101" required>
          </div>
          <div class="form-group">
            <label for="student-name">비밀번호</label>
            <input type="password" id="student-name" class="form-control" placeholder="LMS 가입 비밀번호" required>
          </div>
          <button id="btn-start-exploration" type="submit" class="btn btn-primary" style="margin-top: 8px; width:100%; font-size:1.05rem; padding:12px; font-weight:800; background:linear-gradient(135deg, #0284c7, #4f46e5);">🔐 영서중 수학 LMS 학생 로그인</button>
        </form>

        <div style="margin-top:14px; border-top:1px solid #e2e8f0; padding-top:12px; display:flex; flex-direction:column; gap:8px;">
          <button type="button" class="btn" style="background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; width:100%; font-weight:700;" onclick="openTestLoginModal()">🧪 체험/테스트 계정 접속</button>
        </div>
      </div>
    </section>

    <!-- VIEW 2: ACTIVITY EXPLORATION VIEW -->
    <section id="view-activity" class="view-panel">
      <div class="activity-layout">
        <!-- Left Plane Section (60fps Canvas) -->
        <div class="plane-section">
          <div class="plane-toolbar">
            <button id="tool-select" class="tool-btn active" onclick="setTool('select')">🖐️ 선택/점 드래그</button>
            <button id="tool-reset" class="tool-btn" onclick="resetCanvasView()">🔄 화면 초기화</button>
            <span id="coord-display" style="margin-left:auto; font-size:0.82rem; font-weight:800; color:#0284c7; background:#e0f2fe; padding:4px 10px; border-radius:10px;">
              📍 현재 선택 점: O(0, 0)
            </span>
          </div>
          <div class="two-plane-wrapper">
            <div id="two-container" class="tool-select"></div>
          </div>
        </div>

        <!-- Right Sidebar Section -->
        <div class="sidebar-section">
          <div class="card mission-card">
            <h3 style="font-size:0.95rem; font-weight:800; color:var(--primary-color); margin-bottom:6px;">🎯 오늘의 수학 탐구 미션</h3>
            <div id="mission-text" style="font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">
              단계를 선택하여 동적 탐구를 시작하세요!
            </div>
          </div>

          <div id="form-work-area" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      studentId: '10101',
      studentName: '학생',
      isTeacherLoggedIn: false,
      currentMainTab: 0,
      subStep: '0-1',
      tool: 'select',
      unlockedTabs: [0],
      pointP: { x: 3, y: 2, label: 'P' },
      slopeA: 2,
      curvedA: 6
    };

    let twoInstance = null;

    function initTwoEngine() {
      const container = document.getElementById('two-container');
      if (!container) return null;
      container.innerHTML = '';

      const width = container.clientWidth || 800;
      const height = container.clientHeight || 500;

      twoInstance = new Two({
        width: width,
        height: height,
        type: Two.Types.canvas,
        autostart: true
      }).appendTo(container);

      return { two: twoInstance, centerX: width / 2, centerY: height / 2, width, height };
    }

    function snapVal(val, step = 30) { return Math.round(val / step) * step; }

    function setTool(toolName) {
      state.tool = toolName;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      const el = document.getElementById(`tool-${toolName}`);
      if (el) el.classList.add('active');
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-panel').forEach(el => { el.classList.remove('active'); el.style.display = 'none'; });
      const targetView = document.getElementById(`view-${viewName}`);
      if (targetView) { targetView.classList.add('active'); targetView.style.display = 'flex'; }
    }

    async function handleLMSLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const idEl = document.getElementById('student-id');
      const pwEl = document.getElementById('student-name');
      const studentId = idEl ? idEl.value.trim() : '';
      const password = pwEl ? pwEl.value.trim() : '';

      if (!studentId || !password) {
        alert("⚠️ 학번과 비밀번호를 모두 입력해 주세요!");
        return false;
      }

      const loginBtn = document.getElementById('btn-start-exploration');
      if (loginBtn) { loginBtn.disabled = true; loginBtn.innerText = "⏳ 영서중 수학 LMS DB 인증 중..."; }

      try {
        const res = await LMSIntegration.loginStudent(studentId, password);
        if (res.success) {
          state.currentUser = res.user;
          state.studentId = res.user.id;
          state.studentName = res.user.name;
          state.isTeacherLoggedIn = (res.user.role === 'teacher' || res.user.id === '661227');

          document.getElementById('current-user-info').innerText = `👤 ${res.user.name} (${res.user.id})`;

          const prog = await LMSIntegration.loadStudentProgress(res.user.id);
          let targetSubStep = '0-1';

          if (prog && prog.lastSubStep) {
            targetSubStep = prog.lastSubStep;
            if (Array.isArray(prog.completedSteps)) {
              prog.completedSteps.forEach(code => {
                const mainIdx = parseInt(code.split('-')[0]);
                unlockNextStep(mainIdx);
              });
            }
          }

          switchView('activity');
          setTimeout(() => { loadSubStep(targetSubStep); }, 80);

          if (typeof LMSIntegration !== 'undefined' && LMSIntegration.startPeriodicAutoSave) {
            LMSIntegration.startPeriodicAutoSave(() => {
              const formArea = document.getElementById('form-work-area');
              let txts = '';
              if (formArea) {
                const inputs = formArea.querySelectorAll('input, textarea');
                txts = Array.from(inputs).map(el => el.value.trim()).filter(Boolean).join(' | ');
              }
              return { subStep: state.subStep, answerText: txts, score: txts ? 30 : 0 };
            }, 15000);
          }
        } else {
          alert(`❌ ${res.message}`);
        }
      } catch (err) {
        console.error(err);
        alert("❌ 영서중 수학 LMS DB 연결 중 오류가 발생했습니다.");
      } finally {
        if (loginBtn) { loginBtn.disabled = false; loginBtn.innerText = "🔐 영서중 수학 LMS 학생 로그인"; }
      }
      return false;
    }

    function openTestLoginModal() {
      const pw = prompt("🔑 체험/테스트 비밀번호를 입력해 주세요:");
      if (pw === '661227') {
        state.isTeacherLoggedIn = true;
        for (let i = 0; i <= 5; i++) unlockNextStep(i);
        document.getElementById('current-user-info').innerText = `🔑 체험/선생님 접속 (전체해금)`;
        switchView('activity');
        setTimeout(() => { loadSubStep('0-1'); }, 80);
      }
    }

    function unlockNextStep(tabIndex) {
      const nextIdx = tabIndex + 1;
      if (nextIdx <= 5 && !state.unlockedTabs.includes(nextIdx)) {
        state.unlockedTabs.push(nextIdx);
        const tabBtn = document.getElementById(`tab-${nextIdx}`);
        if (tabBtn) {
          tabBtn.classList.remove('locked');
          const titles = ['0. 되짚어 보기', '4.1 순서쌍과 좌표', '4.2 사분면', '4.3 그래프의 해석', '4.4 정비례 그래프', '4.5 반비례 그래프'];
          tabBtn.innerText = `${titles[nextIdx]} 🔓`;
        }
      }
    }

    function switchMainTab(idx) {
      if (!state.unlockedTabs.includes(idx) && !state.isTeacherLoggedIn) {
        alert("🔒 이전 단원의 되짚어 보기/탐구 문제를 모두 맞추셔야 해제됩니다!");
        return;
      }
      state.currentMainTab = idx;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        if (i === idx) btn.classList.add('active'); else btn.classList.remove('active');
      });

      const defaultSub = { 0: '0-1', 1: '1-1', 2: '2-1', 3: '3-1', 4: '4-1', 5: '5-1' };
      loadSubStep(defaultSub[idx] || '0-1');
    }

    function updateSubStepPills(mainIdx) {
      const container = document.getElementById('substep-pills-container');
      container.innerHTML = '';

      const pillsConfig = {
        0: [
          { code: '0-1', label: '1. 대응 관계 (초5~6)' },
          { code: '0-2', label: '2. 정수와 유리수 (중1)' },
          { code: '0-3', label: '3. 문자의 사용과 식의 값 (중1)' }
        ],
        1: [
          { code: '1-1', label: '1. 생각열기 (건물과 수직선)' },
          { code: '1-2', label: '2. 수직선과 좌표 (동적 점 드래그)' },
          { code: '1-3', label: '3. 문제 1 (수직선 세 점 좌표)' },
          { code: '1-4', label: '4. 순서쌍의 개념 (지도 위치 대조)' },

    function formatMathText(txt) {
      if (typeof katex === 'undefined') return txt;
      return txt.replace(/\$(.*?)\$/g, (match, math) => {
        try { return katex.renderToString(math, { throwOnError: false }); } catch (e) { return math; }
      });
    }

    // 60fps Dynamic Plane Renderer (좌표평면 모눈 렌더러)
    function drawCoordinatePlane(two, pointData = null, options = {}) {
      if (!two) return;
      two.clear();

      const width = two.width, height = two.height;
      const step = 30; // Grid step
      const centerX = Math.round(width / 2 / step) * step;
      const centerY = Math.round(height / 2 / step) * step;

      // Grid lines
      for (let x = 0; x <= width; x += step) {
        const line = two.makeLine(x, 0, x, height);
        line.stroke = (x === centerX) ? '#0f172a' : '#e2e8f0';
        line.linewidth = (x === centerX) ? 2.5 : 1;
      }
      for (let y = 0; y <= height; y += step) {
        const line = two.makeLine(0, y, width, y);
        line.stroke = (y === centerY) ? '#0f172a' : '#e2e8f0';
        line.linewidth = (y === centerY) ? 2.5 : 1;
      }

      // Origin & Axis Labels
      const lblO = two.makeText('O', centerX - 14, centerY + 16); lblO.size = 16; lblO.weight = 800; lblO.fill = '#0f172a';
      const lblX = two.makeText('x', width - 18, centerY - 14); lblX.size = 17; lblX.weight = 800; lblX.fill = '#0284c7';
      const lblY = two.makeText('y', centerX + 14, 18); lblY.size = 17; lblY.weight = 800; lblY.fill = '#0284c7';

      // Quadrant Label Overlays
      if (options.showQuadrants) {
        const q1 = two.makeText('제1사분면 (+, +)', centerX + 120, centerY - 100); q1.size = 16; q1.fill = 'rgba(79, 70, 229, 0.4)'; q1.weight = 800;
        const q2 = two.makeText('제2사분면 (-, +)', centerX - 120, centerY - 100); q2.size = 16; q2.fill = 'rgba(2, 132, 199, 0.4)'; q2.weight = 800;
        const q3 = two.makeText('제3사분면 (-, -)', centerX - 120, centerY + 100); q3.size = 16; q3.fill = 'rgba(236, 72, 153, 0.4)'; q3.weight = 800;
        const q4 = two.makeText('제4사분면 (+, -)', centerX + 120, centerY + 100); q4.size = 16; q4.fill = 'rgba(5, 150, 105, 0.4)'; q4.weight = 800;
      }

      // Render Dynamic Point P
      if (pointData) {
        const px = centerX + pointData.x * step;
        const py = centerY - pointData.y * step;

        // Dashed lines to axes
        const dashX = two.makeLine(px, py, px, centerY); dashX.stroke = '#4f46e5'; dashX.linewidth = 1.5;
        const dashY = two.makeLine(px, py, centerX, py); dashY.stroke = '#4f46e5'; dashY.linewidth = 1.5;

        // Point circle
        const circle = two.makeCircle(px, py, 8); circle.fill = '#4f46e5'; circle.stroke = '#ffffff'; circle.linewidth = 2;
        const lblP = two.makeText(`${pointData.label || 'P'}(${pointData.x}, ${pointData.y})`, px + 24, py - 14);
        lblP.size = 17; lblP.weight = 800; lblP.fill = '#4f46e5';
      }

      // Render Direct Proportion y = ax
      if (options.directSlope !== undefined) {
        const a = options.directSlope;
        const x1 = -10, y1 = a * x1;
        const x2 = 10, y2 = a * x2;
        const p1 = { x: centerX + x1 * step, y: centerY - y1 * step };
        const p2 = { x: centerX + x2 * step, y: centerY - y2 * step };

        const line = two.makeLine(p1.x, p1.y, p2.x, p2.y);
        line.stroke = '#ec4899'; line.linewidth = 3.5;
        const lblLine = two.makeText(`y = ${a}x`, p2.x - 30, p2.y - 15);
        lblLine.size = 18; lblLine.weight = 800; lblLine.fill = '#ec4899';
      }

      two.update();
    }

    function updateSlope(val) {
      state.slopeA = Number(val);

      }

    let realtimeInputDebounceTimer = null;
    function attachRealtimeInputTracker() {
      setTimeout(() => {
        const formArea = document.getElementById('form-work-area');
        if (!formArea) return;
        const inputs = formArea.querySelectorAll('input, textarea');
        inputs.forEach(inp => {
          inp.addEventListener('input', () => {
            clearTimeout(realtimeInputDebounceTimer);
            realtimeInputDebounceTimer = setTimeout(() => {
              const allAnswers = Array.from(inputs).map(el => el.value.trim()).filter(Boolean).join(' | ');
              if (allAnswers && typeof LMSIntegration !== 'undefined') {
                LMSIntegration.saveStudentProgress(state.subStep, {
                  activityTitle: `4. 좌표평면 [작성 중: 단계 ${state.subStep}]`,
                  answerText: allAnswers,
                  score: 30
                });
              }
            }, 1000);
          });
        });
      }, 250);
    }

    // 되짚어 보기 1번 문제 대응 관계 표 렌더러 (초5~6) - 12, 15, 18 빈칸 처리
    function drawTableCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cx = width / 2, cy = height / 2;

      const rect = two.makeRoundedRectangle(cx, cy, 520, 150, 12);
      rect.fill = '#f8fafc'; rect.stroke = '#94a3b8'; rect.linewidth = 2;

      const colW = 70;
      const startX = cx - 210;
      for (let i = 0; i <= 6; i++) {
        const x = startX + i * colW;
        const line = two.makeLine(x, cy - 75, x, cy + 75);
        line.stroke = '#cbd5e1'; line.linewidth = 1.5;
      }
      const hLine = two.makeLine(cx - 260, cy, cx + 260, cy);
      hLine.stroke = '#cbd5e1'; hLine.linewidth = 2;

      const lblRow1 = two.makeText('□', startX - 35, cy - 36); lblRow1.size = 24; lblRow1.weight = 800; lblRow1.fill = '#475569';
      const lblRow2 = two.makeText('△', startX - 35, cy + 36); lblRow2.size = 24; lblRow2.weight = 800; lblRow2.fill = '#0284c7';

      const row1Vals = [1, 2, 3, 4, 5, 6];
      // 4, 5, 6 아래 셀은 정답 유출을 막기 위해 깨끗한 빈칸으로 표기
      const row2Vals = ['3', '6', '9', '', '', ''];

      row1Vals.forEach((val, idx) => {
        const x = startX + idx * colW + colW / 2;
        const t = two.makeText(String(val), x, cy - 36);
        t.size = 20; t.weight = 700; t.fill = '#1e293b';
      });

      row2Vals.forEach((val, idx) => {
        if (val) {
          const x = startX + idx * colW + colW / 2;
          const t = two.makeText(val, x, cy + 36);
          t.size = 20; t.weight = 800; t.fill = '#1e293b';
        }
      });

      two.update();
    }

    // 되짚어 보기 2번 문제 수직선 렌더러 (중1 정수와 유리수 - 점 A 정중앙 수학적 이등분 표기)
    function drawNumberLineCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cy = height / 2 + 10;
      const step = 65;
      const cx = width / 2;

      // 수직선 메인 라인
      const line = two.makeLine(50, cy, width - 50, cy);
      line.stroke = '#1e293b'; line.linewidth = 3;

      // 화살표
      const arrL = two.makePath(50, cy, 65, cy - 8, 65, cy + 8, false); arrL.fill = '#1e293b'; arrL.noStroke();
      const arrR = two.makePath(width - 50, cy, width - 65, cy - 8, width - 65, cy + 8, false); arrR.fill = '#1e293b'; arrR.noStroke();

      // -4부터 4까지 눈금 및 라벨
      for (let i = -4; i <= 4; i++) {
        const x = cx + i * step;
        const tick = two.makeLine(x, cy - 8, x, cy + 8);
        tick.stroke = (i === 0) ? '#4f46e5' : '#475569';
        tick.linewidth = (i === 0) ? 2.5 : 1.5;

        const lbl = two.makeText(String(i), x, cy + 28);
        lbl.size = 17; lbl.weight = 800; lbl.fill = (i === 0) ? '#4f46e5' : '#475569';
      }

      // 점 A (-3.5) 좌표 및 이등분 정밀 수학적 시각화 (교과서 원본 준수)
      const x4 = cx + (-4) * step;
      const x3 = cx + (-3) * step;
      const ax = cx + (-3.5) * step;

      // 1. -4와 -3 사이 정중앙 이등분 틱마크
      const midTick = two.makeLine(ax, cy - 5, ax, cy + 5);
      midTick.stroke = '#ec4899'; midTick.linewidth = 2;

      // 2. 점선 아치 2개 ( -4 -> -3.5 / -3.5 -> -3 )
      const arc1 = two.makeCurve(x4, cy - 4, (x4 + ax) / 2, cy - 26, ax, cy - 4, true);
      arc1.stroke = '#ec4899'; arc1.linewidth = 1.6; arc1.noFill();
      if (arc1.dashes) arc1.dashes = [4, 3];

      const arc2 = two.makeCurve(ax, cy - 4, (ax + x3) / 2, cy - 26, x3, cy - 4, true);
      arc2.stroke = '#ec4899'; arc2.linewidth = 1.6; arc2.noFill();
      if (arc2.dashes) arc2.dashes = [4, 3];

      // 3. 아치 상단 이등분 동등 수직 표시 틱 ( | | )
      const t1 = two.makeLine((x4 + ax) / 2, cy - 21, (x4 + ax) / 2, cy - 11); t1.stroke = '#ec4899'; t1.linewidth = 1.5;
      const t2 = two.makeLine((ax + x3) / 2, cy - 21, (ax + x3) / 2, cy - 11); t2.stroke = '#ec4899'; t2.linewidth = 1.5;

      // 점 A 핑크색 마커 및 라벨
      two.makeCircle(ax, cy, 8).fill = '#ec4899';
      const lblA = two.makeText('A', ax, cy - 38); lblA.size = 22; lblA.weight = 800; lblA.fill = '#ec4899';

      // 점 B (0)
      const bx = cx + 0 * step;
      two.makeCircle(bx, cy, 8).fill = '#0284c7';
      const lblB = two.makeText('B', bx, cy - 25); lblB.size = 22; lblB.weight = 800; lblB.fill = '#0284c7';

      // 점 C (2)
      const cx_pt = cx + 2 * step;
      two.makeCircle(cx_pt, cy, 8).fill = '#059669';
      const lblC = two.makeText('C', cx_pt, cy - 25); lblC.size = 22; lblC.weight = 800; lblC.fill = '#059669';

      two.update();
    }

    // 되짚어 보기 3번 문제 식의 값 렌더러 (중1 문자의 사용과 식의 값)
    function drawAlgebraicCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cx = width / 2, cy = height / 2;

      // Outer card box
      const card = two.makeRoundedRectangle(cx, cy, 580, 180, 16);
      card.fill = 'rgba(79, 70, 229, 0.03)'; card.stroke = '#4f46e5'; card.linewidth = 2;

      // Title
      const tTitle = two.makeText('x = 2 일 때, 다음 식의 값을 구하시오.', cx, cy - 52);
      tTitle.size = 20; tTitle.weight = 800; tTitle.fill = '#4f46e5';

      // Item 1: (1) 4x
      const x1 = cx - 180;
      const t1 = two.makeText('(1)  4x', x1, cy - 5); t1.size = 19; t1.weight = 800; t1.fill = '#1e293b';
      const sub1 = two.makeText('4 × 2 = ?', x1, cy + 32); sub1.size = 15; sub1.weight = 700; sub1.fill = '#64748b';

      // Item 2: (2) x - 5
      const x2 = cx;
      const t2 = two.makeText('(2)  x - 5', x2, cy - 5); t2.size = 19; t2.weight = 800; t2.fill = '#1e293b';
      const sub2 = two.makeText('2 - 5 = ?', x2, cy + 32); sub2.size = 15; sub2.weight = 700; sub2.fill = '#64748b';

      // Item 3: (3) 8/x (Fraction)
      const x3 = cx + 180;
      const lblItem3 = two.makeText('(3)', x3 - 35, cy - 5); lblItem3.size = 19; lblItem3.weight = 800; lblItem3.fill = '#1e293b';

      // Fraction numerator 8 & denominator x with horizontal line
      const num8 = two.makeText('8', x3 + 12, cy - 20); num8.size = 18; num8.weight = 800; num8.fill = '#1e293b';
      const fracLine = two.makeLine(x3, cy - 5, x3 + 24, cy - 5); fracLine.stroke = '#1e293b'; fracLine.linewidth = 2;
      const denX = two.makeText('x', x3 + 12, cy + 12); denX.size = 18; denX.weight = 800; denX.fill = '#0284c7';

      const sub3 = two.makeText('8 ÷ 2 = ?', x3 + 8, cy + 38); sub3.size = 15; sub3.weight = 700; sub3.fill = '#64748b';

      two.update();
    }

    // 생각열기 도로변 건물 및 수직선 렌더러 (첫 번째 스크린샷 연동)
    function drawThinkingOpenRoadCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cx = width / 2;
      const topY = height / 2 - 40;
      const botY = height / 2 + 55;
      const step = 60;

      // 1. 도로변 수직선
      const rLine = two.makeLine(60, topY, width - 60, topY);
      rLine.stroke = '#94a3b8'; rLine.linewidth = 2;

      // 건물 정보 (이름, 위치 X, 라벨 A~D, 색상)
      const buildings = [
        { name: '집', x: cx + (-3.5) * step, code: 'A', color: '#ec4899' },
        { name: '시청', x: cx + (-2) * step, code: 'B', color: '#0284c7' },
        { name: '학교', x: cx + (0) * step, code: 'O', color: '#4f46e5' },
        { name: '도서관', x: cx + (1) * step, code: 'C', color: '#059669' },
        { name: '우체국', x: cx + (3) * step, code: 'D', color: '#d97706' }
      ];

      // 건물 아이콘 & 명칭 표기
      buildings.forEach(b => {
        const iconBox = two.makeRoundedRectangle(b.x, topY - 25, 42, 28, 6);
        iconBox.fill = b.color; iconBox.noStroke();
        const bName = two.makeText(b.name, b.x, topY - 48);
        bName.size = 15; bName.weight = 800; bName.fill = '#1e293b';
      });

      // 거리 지시선 (1.5km, 2km, 1km, 2km)
      const dists = [
        { x1: cx + (-3.5) * step, x2: cx + (-2) * step, text: '1.5 km' },
        { x1: cx + (-2) * step, x2: cx + (0) * step, text: '2 km' },
        { x1: cx + (0) * step, x2: cx + (1) * step, text: '1 km' },
        { x1: cx + (1) * step, x2: cx + (3) * step, text: '2 km' }
      ];

      dists.forEach(d => {
        const curve = two.makeCurve(d.x1, topY + 4, (d.x1 + d.x2) / 2, topY + 22, d.x2, topY + 4, true);
        curve.stroke = '#64748b'; curve.linewidth = 1.5; curve.noFill();
        const dText = two.makeText(d.text, (d.x1 + d.x2) / 2, topY + 28);
        dText.size = 13; dText.weight = 700; dText.fill = '#64748b';
      });

      // 2. 하단 수직선 (-4 ~ 3)
      const line = two.makeLine(50, botY, width - 50, botY);
      line.stroke = '#1e293b'; line.linewidth = 3;

      const arrL = two.makePath(50, botY, 65, botY - 8, 65, botY + 8, false); arrL.fill = '#1e293b'; arrL.noStroke();
      const arrR = two.makePath(width - 50, botY, width - 65, botY - 8, width - 65, botY + 8, false); arrR.fill = '#1e293b'; arrR.noStroke();

      for (let i = -4; i <= 3; i++) {
        const x = cx + i * step;
        const tick = two.makeLine(x, botY - 8, x, botY + 8);
        tick.stroke = (i === 0) ? '#4f46e5' : '#475569';
        tick.linewidth = (i === 0) ? 2.5 : 1.5;

        const lbl = two.makeText(String(i), x, botY + 26);
        lbl.size = 16; lbl.weight = 800; lbl.fill = (i === 0) ? '#4f46e5' : '#475569';
      }

      // 수직선 위 점 A, B, O, C, D 위치 마커
      buildings.forEach(b => {
        two.makeCircle(b.x, botY, 7).fill = b.color;
        const lblCode = two.makeText(b.code, b.x, botY - 22);
        lblCode.size = 18; lblCode.weight = 800; lblCode.fill = b.color;
      });

      two.update();
    }

    // 수직선과 좌표 동적 탐구 렌더러 (두 번째 스크린샷 연동 - 드래그 시 좌표 실시간 60fps 변환)
    function drawInteractiveCoordinateCanvas(two, pointData) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cy = height / 2 + 10;
      const step = 75;
      const cx = width / 2;

      // 수직선
      const line = two.makeLine(50, cy, width - 50, cy);
      line.stroke = '#1e293b'; line.linewidth = 3;

      const arrL = two.makePath(50, cy, 65, cy - 8, 65, cy + 8, false); arrL.fill = '#1e293b'; arrL.noStroke();
      const arrR = two.makePath(width - 50, cy, width - 65, cy - 8, width - 65, cy + 8, false); arrR.fill = '#1e293b'; arrR.noStroke();

      for (let i = -3; i <= 3; i++) {
        const x = cx + i * step;
        const tick = two.makeLine(x, cy - 8, x, cy + 8);
        tick.stroke = (i === 0) ? '#4f46e5' : '#475569';
        tick.linewidth = (i === 0) ? 2.5 : 1.5;

        const lbl = two.makeText(String(i), x, cy + 28);
        lbl.size = 17; lbl.weight = 800; lbl.fill = (i === 0) ? '#4f46e5' : '#475569';
      }

      // 점 O(0)
      const ox = cx;
      two.makeCircle(ox, cy, 7).fill = '#059669';
      const lblOText = two.makeText('O', ox + 14, cy - 10); lblOText.size = 17; lblOText.weight = 800; lblOText.fill = '#059669';
      const bubO = two.makeRoundedRectangle(ox, cy - 35, 54, 26, 12);
      bubO.fill = '#d1fae5'; bubO.stroke = '#059669'; bubO.linewidth = 2;
      const txtO = two.makeText('O(0)', ox, cy - 35); txtO.size = 15; txtO.weight = 800; txtO.fill = '#065f46';

      // 이동 점 P (학생 드래그 조작 연동)
      const pxVal = pointData ? pointData.x : -1;
      const px = cx + pxVal * step;
      two.makeCircle(px, cy, 9).fill = '#d97706';
      const lblPText = two.makeText('P', px - 14, cy - 10); lblPText.size = 17; lblPText.weight = 800; lblPText.fill = '#d97706';
      const bubP = two.makeRoundedRectangle(px, cy - 35, 62, 26, 12);
      bubP.fill = '#fef3c7'; bubP.stroke = '#d97706'; bubP.linewidth = 2;
      const txtP = two.makeText(`P(${pxVal})`, px, cy - 35); txtP.size = 15; txtP.weight = 800; txtP.fill = '#92400e';

      // 점 Q(2)
      const qx = cx + 2 * step;
      two.makeCircle(qx, cy, 7).fill = '#0284c7';
      const lblQText = two.makeText('Q', qx + 14, cy - 10); lblQText.size = 17; lblQText.weight = 800; lblQText.fill = '#0284c7';
      const bubQ = two.makeRoundedRectangle(qx, cy - 35, 54, 26, 12);
      bubQ.fill = '#e0f2fe'; bubQ.stroke = '#0284c7'; bubQ.linewidth = 2;
      const txtQ = two.makeText('Q(2)', qx, cy - 35); txtQ.size = 15; txtQ.weight = 800; txtQ.fill = '#075985';

      two.update();
    }

    // 좌표평면과 좌표축 개념 렌더러 (x축, y축, 좌표축, 원점 말풍선 교과서 원본 연동)
    function drawCoordinateAxesConceptCanvas(two) {
      if (!two) return;
      two.clear();
      const width = two.width, height = two.height;
      const cx = width / 2;
      const cy = height / 2 + 10;
      const step = 38;

      // 1. 배경 격자 렌더링
      for (let i = -4; i <= 4; i++) {
        const gx = cx + i * step;
        const gy = cy - i * step;

        const vLine = two.makeLine(gx, cy - 4 * step, gx, cy + 4 * step);
        vLine.stroke = '#e2e8f0'; vLine.linewidth = 1;

        const hLine = two.makeLine(cx - 4 * step, gy, cx + 4 * step, gy);
        hLine.stroke = '#e2e8f0'; hLine.linewidth = 1;
      }

      // 2. 메인 좌표축 (x축, y축)
      const xAxis = two.makeLine(cx - 4.5 * step, cy, cx + 4.5 * step, cy);
      xAxis.stroke = '#1e293b'; xAxis.linewidth = 2.5;
      const arrX = two.makePath(cx + 4.5 * step, cy, cx + 4.5 * step - 10, cy - 5, cx + 4.5 * step - 10, cy + 5, false);
      arrX.fill = '#1e293b'; arrX.noStroke();

      const yAxis = two.makeLine(cx, cy + 4.5 * step, cx, cy - 4.5 * step);
      yAxis.stroke = '#1e293b'; yAxis.linewidth = 2.5;
      const arrY = two.makePath(cx, cy - 4.5 * step, cx - 5, cy - 4.5 * step + 10, cx + 5, cy - 4.5 * step + 10, false);
      arrY.fill = '#1e293b'; arrY.noStroke();

      // 축 라벨 x, y
      const lblX = two.makeText('x', cx + 4.7 * step, cy + 12); lblX.size = 18; lblX.weight = 800; lblX.style = 'italic';
      const lblY = two.makeText('y', cx - 14, cy - 4.7 * step); lblY.size = 18; lblY.weight = 800; lblY.style = 'italic';

      // 눈금 수치 (-4 ~ 4)
      [-4, -2, 2, 4].forEach(n => {
        const nx = cx + n * step;
        const ny = cy - n * step;
        
        const tickX = two.makeLine(nx, cy - 5, nx, cy + 5); tickX.stroke = '#475569';
        const txtX = two.makeText(String(n), nx, cy + 18); txtX.size = 13; txtX.weight = 700; txtX.fill = '#475569';

        const tickY = two.makeLine(cx - 5, ny, cx + 5, ny); tickY.stroke = '#475569';
        const txtY = two.makeText(String(n), cx + 16, ny + 4); txtY.size = 13; txtY.weight = 700; txtY.fill = '#475569';
      });

      // 원점 O 표기 (알파벳 O)
      const lblO = two.makeText('O', cx - 14, cy + 14);
      lblO.size = 18; lblO.weight = 800; lblO.fill = '#1e293b';

      // 3. 교과서 동일 4종 레전드 말풍선 표기

      // 🟧 x축 오랜지 말풍선
      const bubX = two.makeRoundedRectangle(cx + 2.8 * step, cy - 1.2 * step, 54, 26, 8);
      bubX.fill = '#ffedd5'; bubX.stroke = '#ea580c'; bubX.linewidth = 1.5;
      const txtBx = two.makeText('x축', cx + 2.8 * step, cy - 1.2 * step); txtBx.size = 14; txtBx.weight = 800; txtBx.fill = '#c2410c';

      // 🟦 y축 파란 말풍선

      bubY.fill = '#e0f2fe'; bubY.stroke = '#0284c7'; bubY.linewidth = 1.5;
      const txtBy = two.makeText('y축', cx - 2.2 * step, cy - 2.8 * step); txtBy.size = 14; txtBy.weight = 800; txtBy.fill = '#0369a1';

      // 🟩 좌표축 민트 말풍선 & 화살표 지시선
      const bubAxes = two.makeRoundedRectangle(cx - 2.8 * step, cy + 1.8 * step, 66, 26, 8);
      bubAxes.fill = '#ccfbf1'; bubAxes.stroke = '#0d9488'; bubAxes.linewidth = 1.5;
      const txtBaxes = two.makeText('좌표축', cx - 2.8 * step, cy + 1.8 * step); txtBaxes.size = 14; txtBaxes.weight = 800; txtBaxes.fill = '#0f766e';

      const lineA1 = two.makeLine(cx - 2.0 * step, cy + 1.5 * step, cx - 0.2 * step, cy + 0.2 * step); lineA1.stroke = '#0d9488'; lineA1.linewidth = 1.5;
      const lineA2 = two.makeLine(cx - 2.0 * step, cy + 1.5 * step, cx - 1.5 * step, cy + 0.8 * step); lineA2.stroke = '#0d9488'; lineA2.linewidth = 1.5;

      // 🟪 원점 보라 말풍선 & 화살표 지시선
      const bubOrigin = two.makeRoundedRectangle(cx + 1.8 * step, cy + 1.2 * step, 54, 26, 8);
      bubOrigin.fill = '#f3e8ff'; bubOrigin.stroke = '#9333ea'; bubOrigin.linewidth = 1.5;
      const txtBorg = two.makeText('원점', cx + 1.8 * step, cy + 1.2 * step); txtBorg.size = 14; txtBorg.weight = 800; txtBorg.fill = '#7e22ce';

      const lineO = two.makeLine(cx + 1.0 * step, cy + 0.8 * step, cx + 0.1 * step, cy + 0.1 * step); lineO.stroke = '#9333ea'; lineO.linewidth = 1.5;

      two.update();
    }

    // 점의 좌표 개념 렌더러 (x좌표, y좌표, 원점 (0,0), 반드시 x좌표를 y좌표 '앞'에 표기 교과서 2종 통합)

      // 2. 점 P(-4, 2) 렌더링 (교과서 비주얼 2번째 그림)
      const px = cx + (-4) * step;

      // 수선 점선 & 직각 표시
      const dashH = two.makeLine(px, py, cx, py); dashH.stroke = '#475569'; dashH.linewidth = 1.5;

      // 직각 표시 기호
      two.makePath(cx - 8, py, cx - 8, py + 8, cx, py + 8, false).stroke = '#475569';
      two.makePath(px, cy - 8, px + 8, cy - 8, px + 8, cy, false).stroke = '#475569';

      // 축 눈금 수치 (-4, 2)
      const txt4 = two.makeText('-4', px, cy + 18); txt4.size = 16; txt4.weight = 800; txt4.fill = '#0284c7';
      const txt2 = two.makeText('2', cx + 14, py + 4); txt2.size = 16; txt2.weight = 800; txt2.fill = '#dc2626';

      // 점 P 마커 & 좌표 표기 P(-4, 2)
      two.makeCircle(px, py, 7).fill = '#16a34a';
      const txtP = two.makeText('P(-4, 2)', px + 50, py - 18);
      txtP.size = 22; txtP.weight = 800; txtP.fill = '#16a34a';

      // 3. 말풍선 2종 (x좌표, y좌표 화살표 & "반드시 x좌표를 y좌표 앞에 써야 해")
      const bubRule = two.makeRoundedRectangle(cx + 80, cy - 2.2 * step, 195, 34, 12);
      bubRule.fill = '#fef3c7'; bubRule.stroke = '#d97706'; bubRule.linewidth = 2;
      const txtRule = two.makeText('📢 반드시 x좌표를 y좌표 앞에!', cx + 80, cy - 2.2 * step);
      txtRule.size = 13; txtRule.weight = 800; txtRule.fill = '#92400e';

      // x좌표 화살표 (-4)
      const txtXlbl = two.makeText('x좌표 (-4)', px + 30, py + 30);
      txtXlbl.size = 13; txtXlbl.weight = 800; txtXlbl.fill = '#0284c7';

      // y좌표 화살표 (2)
      const txtYlbl = two.makeText('y좌표 (2)', px + 85, py + 30);
      txtYlbl.size = 13; txtYlbl.weight = 800; txtYlbl.fill = '#dc2626';

      two.update();
    }

    let isNumberLineDragging = false;

    function attachNumberLinePointerDrag() {
      const container = document.getElementById('two-container');
      if (!container) return;

      const getPointPxLocation = (val) => {
        const width = container.clientWidth || 800;
        const cx = width / 2;
        const step = 75;
        return cx + val * step;
      };

      const getValFromPxLocation = (px) => {
        const width = container.clientWidth || 800;
        const cx = width / 2;
        const step = 75;
        let rawVal = (px - cx) / step;
        let snapped = Math.round(rawVal * 2) / 2; // 0.5 단위 자석 스냅
        if (snapped < -3) snapped = -3;
        if (snapped > 3) snapped = 3;
        return snapped;
      };

      container.onpointerdown = function(e) {
        if (state.subStep !== '1-2') return;
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const currentPx = getPointPxLocation(state.pointP ? state.pointP.x : -1);

        if (Math.abs(mouseX - currentPx) < 40) { // 넓은 Hit Test 영역 (40px)
          isNumberLineDragging = true;
          try { container.setPointerCapture(e.pointerId); } catch(err){}
          container.classList.add('grabbing');
        }
      };

      container.onpointermove = function(e) {
        if (!isNumberLineDragging || state.subStep !== '1-2') return;
        const rect = container.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const newVal = getValFromPxLocation(mouseX);

        if (state.pointP && state.pointP.x !== newVal) {
          state.pointP.x = newVal;
          if (twoInstance) {
            drawInteractiveCoordinateCanvas(twoInstance, state.pointP);
          }
          const disp = document.getElementById('coord-display');
          if (disp) disp.innerText = `📍 현재 선택 점: P(${newVal})`;
        }
      };

      container.onpointerup = container.onpointercancel = function(e) {
        if (isNumberLineDragging) {
          isNumberLineDragging = false;
          container.classList.remove('grabbing');
        }
      };
    }

    function check11Submit() {

          "1-2"

      } else {
        alert("❌ [질문 2] 오답입니다. 수직선 위의 점 A, B, O, C, D의 좌표를 다시 한번 확인하고 입력해 보세요!");

    function check12Submit() {
      const cInp = normTxt(document.getElementById('p12-concept').value);

      if (!okConcept || !okSymbol) {
        alert("❌ 오답입니다. 개념 ①의 (좌표)와 기호 (P(a))를 정확히 입력해 주세요!");
        return;
      }

      if (!okDrag) {
        alert("💡 캔버스 상의 점 P를 마우스로 잡고 +2 위치로 옮긴 후 제출해 주세요! (현재 위치: P(" + pPos + "))");
        return;
      }

      unlockNextStep(1);
      renderVerifiedAnswerView(
        "수직선과 좌표 개념 & 실시간 드래그 실습 완수!",
        "• 개념: <b>좌표</b>, <b>P(a)</b><br>• 점 P를 +2 위치로 성공적으로 이동: <b>P(2)</b><br><br>다음 <b>[좌표평면과 순서쌍]</b> 단원이 해제되었습니다!",
        "1-3"
      );
    }

    function check13Submit() {
      const valA = normTxt(document.getElementById('p13-a').value);
      const valB = normTxt(document.getElementById('p13-b').value);
      const valC = normTxt(document.getElementById('p13-c').value);

      const okA = valA.includes('A(-5)') || valA.includes('A(-5.0)');

          "1-4"
        );
      } else {
        alert("❌ 오답입니다. A(-5), B(1), C(4)와 같이 점을 나타내는 알파벳과 좌표값을 함께 정확히 입력해 보세요!");
      }
    }

    function check14Submit() {
      const cInp = normTxt(document.getElementById('p14-concept').value);

    function check15Submit() {

      const vX = normTxt(document.getElementById('p16-x').value);
