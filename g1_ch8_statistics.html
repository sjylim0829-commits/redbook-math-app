<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 수학: 1. 소인수분해</title>
  
  <!-- Supabase Cloud DB SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 영서중 수학 LMS Integration SDK (중1용) -->
  <script src="js/lms-integration-g1.js"></script>

  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Two.js 2D Dynamic Geometry Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --secondary-color: #8b5cf6;
      --accent-color: #ec4899;
      --success-color: #059669;
      --warning-color: #d97706;

      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #cbd5e1;

      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 48px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 16px;
      text-transform: uppercase;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    /* Tab Navigation Bar */
    .tab-bar-container {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      height: 42px;
      align-items: center;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: #ffffff;
      font-weight: 700;
      border-color: var(--primary-color);
    }

    .tab-btn.locked {
      opacity: 0.6;
      cursor: not-allowed;
      background: #f1f5f9;
    }

    /* Sub-Step Navigation Pills */
    .substep-bar {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      align-items: center;
      height: 36px;
      overflow-x: auto;
    }

    .substep-pill {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.76rem;
      font-weight: 700;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .substep-pill.active {
      background: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
    }

    .substep-pill.locked-pill {
      opacity: 0.55;
      cursor: not-allowed;
      background: #e2e8f0;
    }

    .substep-pill.completed:not(.active) {
      background: #ecfdf5;
      color: #059669;
      border-color: #a7f3d0;
    }

    /* Main Container */
    .main-container {
      flex: 1;
      height: calc(100vh - 126px);
      position: relative;
      overflow: hidden;
    }

    .view-panel {
      display: none;
      width: 100%;
      height: 100%;
    }

    .view-panel.active {
      display: flex;
    }

    /* Login View */
    .login-card-container {
      margin: auto;
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    /* Activity Layout (Split-View) */
    .activity-layout {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .plane-section {
      flex: 1.25;
      height: 100%;
      background: #ffffff;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .plane-toolbar {
      height: 44px;
      border-bottom: 1px solid var(--border-color);
      background: #f8fafc;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .tool-btn:hover { background: #f1f5f9; }
    .tool-btn.active {
      background: #6366f1;
      color: #ffffff;
      border-color: #6366f1;
    }

    .two-plane-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    #two-container {
      width: 100%;
      height: 100%;
    }

    .sidebar-section {
      flex: 0.95;
      height: 100%;
      background: #f8fafc;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .mission-card {
      border-left: 4px solid var(--primary-color);
    }

    .form-control {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--primary-color); }

    .proof-input-text {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1.5px solid #94a3b8;
      font-size: 0.9rem;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      background: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .proof-input-text:focus {
      border-color: #6366f1;
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary-color);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .verified-answer-card {
      background: #ecfdf5;
      border: 1.5px solid #10b981;
      border-radius: 12px;
      padding: 16px;
    }
    .verified-answer-card h4 {
      color: #047857;
      font-size: 0.96rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .proof-error-notice {
      background: #fee2e2;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 10px 14px;
      color: #991b1b;
      font-size: 0.86rem;
      font-weight: 600;
      margin-top: 10px;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 20px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 12px 20px;
      background: #f8fafc;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="logo-group">
      <span class="badge-tag">중1 수학 1단원</span>
      <h1 class="app-title">🔢 1. 소인수분해</h1>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <span id="current-user-info" style="font-size:0.85rem; font-weight:700; color:#4f46e5; margin-right:4px;">👤 로그인 필요</span>
      <button id="btn-header-unlock-boundary" class="btn" style="padding:4px 9px; font-size:0.78rem; background:linear-gradient(135deg, #10b981, #059669); color:#fff; font-weight:800; display:none;" onclick="openUnlockBoundaryModal()">🔓 학생 해금 범위 설정</button>
      <button id="btn-header-teacher-dashboard" class="btn" style="padding:4px 9px; font-size:0.78rem; background:linear-gradient(135deg, #6366f1, #8b5cf6); color:#fff; font-weight:800; display:none;" onclick="openTeacherDashboardModal()">📊 교사 5x5 모니터링</button>
      <button class="btn" style="padding:4px 8px; font-size:0.78rem; background:#fef3c7; color:#92400e; border:1px solid #fde68a; font-weight:700;" onclick="openTeacherPassModal()" title="교사 비밀번호로 현재 활동 통과">🔑 교사 패스 (Pass)</button>
      <button class="btn" style="padding:4px 8px; font-size:0.78rem; background:#fee2e2; color:#dc2626; border:1px solid #fca5a5;" onclick="switchView('login')">로그아웃</button>
    </div>
  </header>

  <!-- Tab Navigation Bar (소단원 탭 단추) -->
  <nav id="main-tab-bar" class="tab-bar-container">
    <button id="tab-0" class="tab-btn active" onclick="switchMainTab(0)">0. 되짚어 보기 🔓</button>
    <button id="tab-1" class="tab-btn" onclick="switchMainTab(1)">1.1 소수와 합성수 🔒</button>
    <button id="tab-2" class="tab-btn" onclick="switchMainTab(2)">1.2 소인수분해 🔒</button>
    <button id="tab-3" class="tab-btn" onclick="switchMainTab(3)">1.3 최대공약수 🔒</button>
    <button id="tab-4" class="tab-btn" onclick="switchMainTab(4)">1.4 최소공배수 🔒</button>
    <button id="tab-5" class="tab-btn" onclick="switchMainTab(5)">1.5 스스로 마무리하기 🔒</button>
  </nav>

  <!-- Sub-Step Navigation Pills -->
  <div id="substep-bar" class="substep-bar">
    <span style="font-size:0.78rem; font-weight:700; color:#64748b;">📑 세부 탐구 활동:</span>
    <div id="substep-pills-container" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
  </div>

  <!-- Main Container -->
  <main class="main-container">
    <!-- VIEW 1: LOGIN VIEW -->
    <section id="view-login" class="view-panel active">
      <div class="login-card-container">
        <h2 style="font-size:1.35rem; margin-bottom:6px; color:#1e293b;">🏫 영서중 수학 LMS 학생 로그인</h2>
        <p style="font-size:0.86rem; color:#64748b; margin-bottom:18px;">학번과 비밀번호를 입력하고 1단원 소인수분해 탐구를 시작하세요!</p>
        <form onsubmit="handleLMSLogin(event)">
          <div style="margin-bottom:12px;">
            <label style="font-size:0.82rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">학번 (예: 10101)</label>
            <input type="text" id="student-id" class="form-control" value="10101" required>
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:0.82rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">비밀번호</label>
            <input type="password" id="student-name" class="form-control" placeholder="LMS 가입 비밀번호" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-weight:800; font-size:1rem; background:linear-gradient(135deg, #6366f1, #4f46e5);">
            🔐 영서중 수학 LMS 학생 로그인
          </button>
        </form>
        <div style="margin-top:14px; border-top:1px solid #e2e8f0; padding-top:12px; display:flex; flex-direction:column; gap:8px;">
          <button type="button" class="btn" style="background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; font-weight:700;" onclick="openTestLoginModal()">🔑 교사 계정 접속</button>
          <button type="button" class="btn" style="background:#eef2ff; color:#4338ca; border:1.5px solid #c7d2fe; font-weight:800;" onclick="openTeacherDashboardModal()">📊 교사 5x5 실시간 모니터링 관제실</button>
        </div>
      </div>
    </section>

    <!-- VIEW 2: ACTIVITY EXPLORATION VIEW -->
    <section id="view-activity" class="view-panel">
      <div class="activity-layout">
        <!-- Left Plane Section (Two.js Canvas) -->
        <div class="plane-section">
          <div class="plane-toolbar">
            <button id="tool-select" class="tool-btn active" onclick="setTool('select')">🖐️ 탐구 조작 도구</button>
            <button id="tool-reset" class="tool-btn" onclick="resetCanvasView()">🔄 화면 초기화</button>
            
            <!-- Sieve Toolbar Group (Active on 1-3) -->
            <div id="sieve-toolbar-group" style="display:none; align-items:center; gap:5px; margin-left:8px; padding-left:8px; border-left:1px solid #cbd5e1;">
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#fee2e2; color:#dc2626;" onclick="sieveStep(1)">1 지우기</button>
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#fef3c7; color:#92400e;" onclick="sieveStep(2)">2 배수 지우기</button>
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#dcfce7; color:#15803d;" onclick="sieveStep(3)">3 배수 지우기</button>
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#e0f2fe; color:#0369a1;" onclick="sieveStep(5)">5 배수 지우기</button>
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#f3e8ff; color:#7e22ce;" onclick="sieveStep(7)">7 배수 지우기</button>
            </div>

            <!-- Freehand Drawing Group (Active on 5-1 or when needed) -->
            <div id="drawing-toolbar-group" style="display:none; align-items:center; gap:6px; margin-left:8px; padding-left:8px; border-left:1px solid #cbd5e1;">
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#4f46e5; color:#fff;" onclick="setPenColor('#4f46e5')">파랑</button>
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#e11d48; color:#fff;" onclick="setPenColor('#e11d48')">빨강</button>
              <button class="tool-btn" style="padding:3px 8px; font-size:0.75rem; background:#fee2e2; color:#dc2626;" onclick="clearFreehandDrawing()">🗑️ 드로잉 삭제</button>
            </div>

            <span id="coord-display" style="margin-left:auto; font-size:0.82rem; font-weight:800; color:#4f46e5; background:#eef2ff; padding:4px 10px; border-radius:10px;">
              🔢 소인수분해 대화형 탐구실
            </span>
          </div>

          <div class="two-plane-wrapper" style="position:relative;">
            <div id="two-container"></div>
            <canvas id="freehand-drawing-canvas" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:auto; touch-action:none; z-index:10; cursor:crosshair;"></canvas>
          </div>
        </div>

        <!-- Right Sidebar Section -->
        <div class="sidebar-section">
          <div class="card mission-card">
            <h3 style="font-size:0.95rem; font-weight:800; color:var(--primary-color); margin-bottom:6px;">🎯 오늘의 수학 탐구 미션</h3>
            <div id="mission-text" style="font-size:0.88rem; color:var(--text-secondary); line-height:1.6;">
              단계를 선택하여 소인수분해 동적 탐구를 시작하세요!
            </div>
          </div>

          <div id="form-work-area" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      </div>
    </section>

    <!-- VIEW 3: TEACHER 5X5 DASHBOARD -->
    <section id="view-teacher-dashboard" class="view-panel" style="display:none; flex-direction:column;">
      <div style="padding:16px; background:#ffffff; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:1.15rem; font-weight:800; color:#1e293b;">📊 교사용 실시간 5x5 모니터링 관제실</span>
          <span style="font-size:0.82rem; font-weight:700; color:#4f46e5; background:#eef2ff; padding:3px 10px; border-radius:12px;">중1 수학: 1. 소인수분해</span>
        </div>
        <div>
          <button class="btn" style="padding:6px 12px; font-size:0.82rem; background:#4f46e5; color:#fff; font-weight:800;" onclick="returnToStudentView()">🚪 학생 탐구 화면</button>
        </div>
      </div>
      <div id="teacher-grid-container" style="flex:1; padding:16px; overflow-y:auto; display:grid; grid-template-columns:repeat(5, 1fr); gap:12px;"></div>
    </section>
  </main>

  <!-- Modals -->
  <div id="secure-password-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="secure-modal-title" style="font-size:1rem; font-weight:800; color:#1e293b;">🔑 교사 인증</h3>
        <button class="btn" onclick="closeSecurePasswordModal()" style="background:none; color:#64748b; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <p id="secure-modal-desc" style="font-size:0.86rem; color:#64748b; margin-bottom:12px;">보안 인증 비밀번호를 입력해 주세요.</p>
        <input type="password" id="secure-password-input" class="form-control" placeholder="비밀번호" onkeydown="if(event.key==='Enter') verifySecurePassword()">
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeSecurePasswordModal()" style="background:#f1f5f9; color:#475569;">취소</button>
        <button class="btn btn-primary" onclick="verifySecurePassword()">확인</button>
      </div>
    </div>
  </div>

  <div id="unlock-boundary-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="font-size:1rem; font-weight:800; color:#1e293b;">🔓 학생 해금 범위 설정</h3>
        <button class="btn" onclick="closeUnlockBoundaryModal()" style="background:none; color:#64748b; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:0.86rem; color:#64748b; margin-bottom:12px;">학생들이 학습할 수 있는 최대 단원/단계를 지정합니다.</p>
        <select id="select-unlock-substep-ch1" class="form-control" style="font-size:0.9rem;"></select>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeUnlockBoundaryModal()" style="background:#f1f5f9; color:#475569;">취소</button>
        <button class="btn btn-primary" onclick="applyGlobalUnlockStepCh1()">적용하기</button>
      </div>
    </div>
  </div>

  <script>
    let state = {
      mainTab: 0,
      subStep: '0-1',
      studentAnswers: {},
      isMaster: false,
      tool: 'select'
    };

    const chapterData = {
      0: {
        title: "0. 되짚어보기 (초등 통계 연계)",
        substeps: [
          {
            id: "0-1",
            title: "초등 복습: 평균 구하기",
            concept: "자료의 값의 총합을 자료의 수로 나눈 값을 <strong>평균</strong>이라고 합니다.",
            inquiry: "5명의 수학 점수가 각각 $80, 85, 90, 75, 95$점일 때, 점수의 평균을 구하세요.",
            blanks: [
              { id: "b0_1", answer: "425", label: "점수의 총합", hint: "80 + 85 + 90 + 75 + 95 = 425" },
              { id: "b0_2", answer: "85|85점", label: "평균 점수", hint: "425 / 5 = 85" }
            ],
            canvasType: "mean_review"
          }
        ]
      },
      1: {
        title: "8.1 대푯값 (평균, 중앙값, 최빈값)",
        substeps: [
          {
            id: "1-1",
            title: "자료의 중심 경향을 나타내는 세 가지 대푯값",
            concept: "1. <strong>평균</strong>: 자료의 총합을 개수로 나눈 값<br>2. <strong>중앙값</strong>: 크기순으로 나열할 때 한가운데 있는 값<br>3. <strong>최빈값</strong>: 자료에서 가장 많이 나타난 값",
            inquiry: "자료: $2, 3, 3, 5, 7, 8, 14$ 에서 평균, 중앙값, 최빈값을 각각 구하세요.",
            blanks: [
              { id: "b1_1", answer: "6", label: "평균", hint: "(2+3+3+5+7+8+14) / 7 = 42 / 7 = 6" },
              { id: "b1_2", answer: "5", label: "중앙값", hint: "7개 중 4번째 값 = 5" },
              { id: "b1_3", answer: "3", label: "최빈값", hint: "3이 2번으로 가장 많이 나옴" }
            ],
            canvasType: "averages_canvas"
          }
        ]
      },
      2: {
        title: "8.2 줄기와 잎 그림",
        substeps: [
          {
            id: "2-1",
            title: "줄기와 잎 그림의 작성 및 해석",
            concept: "자료를 십의 자리 수인 <strong>줄기</strong>와 일의 자리 수인 <strong>잎</strong>으로 나누어 나타낸 그림입니다. 자료의 손실 없이 분포 상태를 한눈에 볼 수 있습니다.",
            inquiry: "줄기 '2'에 잎이 '1, 4, 4, 8'이 적혀 있습니다. 이 줄기에 해당하는 자료의 개수와 가장 큰 값은 얼마인가요?",
            blanks: [
              { id: "b2_1", answer: "4|4개", label: "자료의 개수", hint: "잎이 4개이므로 4개" },
              { id: "b2_2", answer: "28", label: "가장 큰 값", hint: "줄기 2, 잎 8 -> 28" }
            ],
            canvasType: "stem_leaf_canvas"
          }
        ]
      },
      3: {
        title: "8.3 도수분포표",
        substeps: [
          {
            id: "3-1",
            title: "계급, 계급의 크기, 계급값, 도수",
            concept: "구간을 <strong>계급</strong>, 구간의 너비를 <strong>계급의 크기</strong>, 계급의 중앙값을 <strong>계급값</strong>, 각 계급에 속하는 자료의 수를 <strong>도수</strong>라고 합니다.",
            inquiry: "계급이 '$60\\,\\text{점 이상 } 70\\,\\text{점 미만}$'일 때 계급의 크기와 계급값을 구하세요.",
            blanks: [
              { id: "b3_1", answer: "10|10점", label: "계급의 크기", hint: "70 - 60 = 10" },
              { id: "b3_2", answer: "65|65점", label: "계급값", hint: "(60 + 70) / 2 = 65" }
            ],
            canvasType: "freq_table"
          }
        ]
      },
      4: {
        title: "8.4 히스토그램과 도수분포다각형",
        substeps: [
          {
            id: "4-1",
            title: "히스토그램의 넓이와 도수분포다각형",
            concept: "히스토그램의 모든 직사각형 넓이의 합은 <strong>$(\\text{계급의 크기}) \\times (\\text{도수의 총합})$</strong>과 같습니다. 도수분포다각형과 가로축으로 둘러싸인 부분의 넓이도 이와 같습니다.",
            inquiry: "계급의 크기가 $5$이고 전체 학생 수가 $30$명일 때, 히스토그램의 모든 직사각형의 넓이의 총합은 얼마인가요?",
            blanks: [
              { id: "b4_1", answer: "150", label: "직사각형 넓이의 합", hint: "5 × 30 = 150" },
              { id: "b4_2", answer: "같다|일치한다|동일하다", label: "도수분포다각형의 넓이와 히스토그램의 넓이는 서로 어떠한가?", hint: "서로 같다" }
            ],
            canvasType: "histogram_canvas"
          }
        ]
      },
      5: {
        title: "8.5 상대도수와 그 그래프",
        substeps: [
          {
            id: "5-1",
            title: "상대도수 = (계급의 도수) ÷ (도수의 총합)",
            concept: "전체 도수에 대한 각 계급의 도수의 비율을 <strong>상대도수</strong>라 합니다. <strong>상대도수의 총합은 항상 $1$</strong>이며, 도수가 다른 두 집단의 분포를 비교할 때 매우 유용합니다.",
            inquiry: "어느 반 전체 학생 수 $40$명 중 어떤 계급의 도수가 $8$명일 때, 이 계급의 상대도수를 구하세요. 또 상대도수의 총합은 항상 얼마인가요?",
            blanks: [
              { id: "b5_1", answer: "0.2|2/10|1/5", label: "해당 계급의 상대도수", hint: "8 / 40 = 0.2" },
              { id: "b5_2", answer: "1|1.0", label: "상대도수의 총합", hint: "상대도수의 총합은 항상 1입니다." }
            ],
            canvasType: "rel_freq_canvas"
          }
        ]
      },
      6: {
        title: "8.6 실생활 자료 해석",
        substeps: [
          {
            id: "6-1",
            title: "공학 도구 및 실생활 데이터 분석",
            concept: "공학적 도구(소프트웨어, 공학용 계산기 등)를 활용하여 대용량 데이터를 처리하고, 극단값의 유무에 따라 평균과 중앙값 중 더 적절한 대푯값을 선택합니다.",
            inquiry: "자료에 극단적으로 매우 크거나 작은 값(이상치)이 포함되어 있을 때, 평균보다 자료의 중심 경향을 더 잘 나타내는 대푯값은 무엇인가요?",
            blanks: [
              { id: "b6_1", answer: "중앙값|median", label: "적절한 대푯값", hint: "극단값의 영향을 받지 않는 중앙값" },
              { id: "b6_2", answer: "영향을받는다|왜곡된다|커진다|작아진다", label: "극단값이 있을 때 평균은 어떻게 되는가?", hint: "영향을 받는다 (왜곡된다)" }
            ],
            canvasType: "data_analysis"
          }
        ]
      },
      7: {
        title: "8.7 스스로 마무리하기 (단원 종합 평가)",
        substeps: [
          {
            id: "7-1",
            title: "자료의 정리와 해석 종합 성취도 평가",
            concept: "8단원 대푯값, 도수분포표, 히스토그램 및 상대도수의 핵심 개념을 종합 평가합니다.",
            inquiry: "다음 4문항을 풀고 답을 입력하세요.<br>1. 자료 $1, 2, 4, 7, 10$의 중앙값은?<br>2. 도수의 총합이 $50$이고 상대도수가 $0.16$인 계급의 도수는 몇 명인가요?<br>3. 모든 상대도수의 합은 항상 얼마인가요?<br>4. 계급의 크기가 $10$이고 도수 총합이 $25$일 때 히스토그램의 넓이의 합은?",
            blanks: [
              { id: "b7_1", answer: "4", label: "1번 중앙값", hint: "가운데 위치한 값 = 4" },
              { id: "b7_2", answer: "8|8명", label: "2번 계급의 도수", hint: "50 × 0.16 = 8" },
              { id: "b7_3", answer: "1", label: "3번 상대도수의 총합", hint: "1" },
              { id: "b7_4", answer: "250", label: "4번 히스토그램 넓이의 합", hint: "10 × 25 = 250" }
            ],
            canvasType: "stat_eval"
          }
        ]
      }
    };

    let twoInstance = null;

    function switchMainTab(tabIdx) {
      state.mainTab = tabIdx;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === tabIdx);
      });

      const subNav = document.getElementById('subTabNav');
      subNav.innerHTML = '';
      const chapter = chapterData[tabIdx];
      if (!chapter) return;

      chapter.substeps.forEach((step, idx) => {
        const btn = document.createElement('button');
        btn.className = `sub-btn ${idx === 0 ? 'active' : ''}`;
        btn.textContent = step.title;
        btn.onclick = () => loadSubStep(step.id);
        subNav.appendChild(btn);
      });

      loadSubStep(chapter.substeps[0].id);
    }

    function loadSubStep(stepId) {
      state.subStep = stepId;
      document.querySelectorAll('.sub-btn').forEach(btn => {
        const text = btn.textContent;
        const curStep = getCurrentStepObj();
        if (curStep && text === curStep.title) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      const curStep = getCurrentStepObj();
      if (!curStep) return;

      document.getElementById('stepTitle').textContent = `[${curStep.id}] ${curStep.title}`;
      document.getElementById('conceptBox').innerHTML = curStep.concept;
      document.getElementById('inquiryQuestion').innerHTML = curStep.inquiry;

      const blankContainer = document.getElementById('blankItems');
      blankContainer.innerHTML = '';

      curStep.blanks.forEach(b => {
        const div = document.createElement('div');
        div.style.marginBottom = '12px';
        div.innerHTML = `
          <label style="display:block; font-size:13px; font-weight:700; color:#374151; margin-bottom:4px;">${b.label}</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="${b.id}" class="blank-input" placeholder="답안 입력..." value="${state.studentAnswers[b.id] || ''}" onchange="saveAnswer('${b.id}', this.value)">
            <span id="mark_${b.id}" style="font-size:18px; font-weight:bold; display:flex; align-items:center;"></span>
          </div>
          <div id="hint_${b.id}" style="display:none; font-size:12px; color:#d97706; margin-top:3px;">힌트: ${b.hint}</div>
        `;
        blankContainer.appendChild(div);
      });

      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ]
      });

      renderCanvas(curStep.canvasType);
    }

    function getCurrentStepObj() {
      const chapter = chapterData[state.mainTab];
      if (!chapter) return null;
      return chapter.substeps.find(s => s.id === state.subStep);
    }

    function saveAnswer(id, val) { state.studentAnswers[id] = val; }
    function normTxt(t) { return (t || '').toString().toLowerCase().replace(/\s+/g, '').replace(/,/g, ''); }

    function checkAnswer() {
      const curStep = getCurrentStepObj();
      if (!curStep) return;

      let allCorrect = true;
      let total = curStep.blanks.length;
      let score = 0;

      curStep.blanks.forEach(b => {
        const input = document.getElementById(b.id);
        const mark = document.getElementById(`mark_${b.id}`);
        const hint = document.getElementById(`hint_${b.id}`);
        const userVal = normTxt(input ? input.value : '');
        const validOptions = b.answer.split('|').map(v => normTxt(v));

        if (validOptions.includes(userVal)) {
          if (mark) { mark.textContent = '⭕ 정답!'; mark.style.color = '#059669'; }
          if (hint) hint.style.display = 'none';
          score++;
        } else {
          if (mark) { mark.textContent = '❌ 다시 생각해보세요'; mark.style.color = '#dc2626'; }
          if (hint) hint.style.display = 'block';
          allCorrect = false;
        }
      });

      const feedback = document.getElementById('feedbackText');
      if (allCorrect) {
        feedback.innerHTML = `<span style="color:#059669; font-weight:800;">🎉 완벽합니다! 통계 분석 능력이 뛰어납니다.</span>`;
        if (typeof LMSIntegration !== 'undefined') {
          LMSIntegration.saveStudentProgress({
            studentId: window.currentStudentId || "student_demo",
            stepId: curStep.id,
            score: 100,
            completed: true
          });
        }
      } else {
        feedback.innerHTML = `<span style="color:#dc2626; font-weight:700;">아직 해결되지 않은 항목이 있습니다. (${score}/${total})</span>`;
      }
    }

    function showAnswer() {
      const curStep = getCurrentStepObj();
      if (!curStep) return;
      curStep.blanks.forEach(b => {
        const input = document.getElementById(b.id);
        if (input) {
          const mainAns = b.answer.split('|')[0];
          input.value = mainAns;
          state.studentAnswers[b.id] = mainAns;
        }
        const mark = document.getElementById(`mark_${b.id}`);
        if (mark) { mark.textContent = '💡 해설 정답'; mark.style.color = '#2563eb'; }
      });
    }

    function resetStep() {
      const curStep = getCurrentStepObj();
      if (!curStep) return;
      curStep.blanks.forEach(b => {
        const input = document.getElementById(b.id);
        if (input) input.value = '';
        delete state.studentAnswers[b.id];
        const mark = document.getElementById(`mark_${b.id}`);
        if (mark) mark.textContent = '';
        const hint = document.getElementById(`hint_${b.id}`);
        if (hint) hint.style.display = 'none';
      });
      document.getElementById('feedbackText').innerHTML = '';
      loadSubStep(state.subStep);
    }

    function renderCanvas(type) {
      const container = document.getElementById('canvasArea');
      container.innerHTML = '';
      const w = container.clientWidth || 600;
      const h = container.clientHeight || 500;

      const two = new Two({ width: w, height: h, type: Two.Types.canvas }).appendTo(container);
      twoInstance = two;

      // Draw grid
      for (let x = 0; x <= w; x += 40) {
        const line = two.makeLine(x, 0, x, h);
        line.stroke = '#f8fafc';
      }
      for (let y = 0; y <= h; y += 40) {
        const line = two.makeLine(0, y, w, y);
        line.stroke = '#f8fafc';
      }

      if (type === 'histogram_canvas') {
        // Draw Histogram and frequency polygon
        const ox = 80, oy = h - 80;
        // Axes
        const xAxis = two.makeLine(ox, oy, w - 40, oy); xAxis.stroke = '#334155'; xAxis.linewidth = 2;
        const yAxis = two.makeLine(ox, oy, ox, 60); yAxis.stroke = '#334155'; yAxis.linewidth = 2;

        const freqs = [3, 7, 12, 6, 2];
        const barW = 70;
        const midPoints = [];

        freqs.forEach((f, i) => {
          const barH = f * 20;
          const rect = two.makeRectangle(ox + i * barW + barW / 2, oy - barH / 2, barW, barH);
          rect.fill = '#bfdbfe'; rect.stroke = '#2563eb'; rect.linewidth = 2;
          midPoints.push({ x: ox + i * barW + barW / 2, y: oy - barH });

          const lbl = two.makeText(`${f}`, ox + i * barW + barW / 2, oy - barH - 12);
          lbl.fill = '#1d4ed8'; lbl.weight = 800;

          const tick = two.makeText(`${50 + i * 10}`, ox + i * barW, oy + 20);
          tick.size = 11;
        });
        two.makeText(`${50 + freqs.length * 10}`, ox + freqs.length * barW, oy + 20).size = 11;

        // Draw Frequency Polygon connecting midpoints
        if (midPoints.length > 0) {
          const polyPts = [
            new Two.Anchor(ox - barW / 2, oy),
            ...midPoints.map(p => new Two.Anchor(p.x, p.y)),
            new Two.Anchor(ox + freqs.length * barW + barW / 2, oy)
          ];
          const polyLine = two.makeCurve(polyPts, false);
          polyLine.stroke = '#dc2626'; polyLine.linewidth = 3; polyLine.fill = 'transparent';
        }

        two.makeText("히스토그램 & 도수분포다각형", w / 2, 40).weight = 800;

      } else if (type === 'stem_leaf_canvas') {
        // Draw Stem-and-leaf plot
        const cx = w / 2, cy = h / 2 - 20;
        const line = two.makeLine(cx - 30, cy - 120, cx - 30, cy + 120);
        line.stroke = '#1e293b'; line.linewidth = 3;

        two.makeText("줄기", cx - 70, cy - 140).weight = 800;
        two.makeText("잎", cx + 70, cy - 140).weight = 800;

        const data = [
          { stem: "1", leaves: "2  5  7  9" },
          { stem: "2", leaves: "1  4  4  8" },
          { stem: "3", leaves: "0  2  5  6  8" },
          { stem: "4", leaves: "1  3" }
        ];

        data.forEach((row, idx) => {
          const ry = cy - 80 + idx * 55;
          const s = two.makeText(row.stem, cx - 70, ry); s.weight = 800; s.size = 16;
          const l = two.makeText(row.leaves, cx + 70, ry); l.fill = '#2563eb'; l.size = 16;
        });

        two.makeText("(1|2 는 12점)", cx, cy + 150).fill = '#64748b';

      } else {
        const title = two.makeText("자료 정리 및 통계 시각화 캔버스", w / 2, 100);
        title.fill = '#1e293b'; title.weight = 800; title.size = 18;
      }

      two.update();
    }

    function toggleTeacherPortal() {
      if (state.isMaster) {
        const p = document.getElementById('teacherPortal');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
        return;
      }
      const pw = prompt("교사 마스터 비밀번호를 입력하십시오:");
      if (pw === "260523" || pw === "260831") {
        state.isMaster = true;
        document.getElementById('teacherPortal').style.display = 'block';
        buildStudentGrid();
        alert("교사 관리자 모드로 인증되었습니다.");
      } else {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }

    function buildStudentGrid() {
      const container = document.getElementById('studentGrid');
      if (!container) return;
      container.innerHTML = '';
      for (let i = 1; i <= 25; i++) {
        const id = `101${String(i).padStart(2, '0')}`;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.padding = '10px';
        card.innerHTML = `<div style="font-weight:800;">👤 ${id} 학생</div><div>단계: ${state.subStep}</div><div style="color:#059669; font-weight:700;">🟢 학습 중</div>`;
        container.appendChild(card);
      }
    }
    function setTool(t) { state.tool = t; }
    function resetCanvasView() { if (twoInstance) loadSubStep(state.subStep); }

    window.addEventListener('DOMContentLoaded', () => {
      switchMainTab(0);
      loadSubStep('0-1');
    });

  </script>
</body>
