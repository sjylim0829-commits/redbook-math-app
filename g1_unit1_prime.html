<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 수학: 1. 소인수분해</title>
  
  <!-- Supabase Cloud DB SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 영서중 수학 LMS Integration SDK (중1용) -->
  <script src="js/lms-integration-g1.js"></script>

  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- Two.js 2D Dynamic Geometry Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --secondary-color: #0284c7;
      --accent-color: #ec4899;
      --success-color: #059669;
      --warning-color: #d97706;

      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #cbd5e1;

      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 48px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 16px;
      text-transform: uppercase;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    /* Tab Navigation Bar */
    .tab-bar-container {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      height: 42px;
      align-items: center;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover:not(:disabled) {
      background: #f1f5f9;
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: #eff6ff;
      color: var(--primary-color);
      border-color: #bfdbfe;
    }

    .tab-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Sub-Step Navigation Dropdown & Stepper */
    .substep-bar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      align-items: center;
      height: 40px;
      box-sizing: border-box;
      z-index: 50;
    }

    .substep-dropdown-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .substep-dropdown-select {
      flex: 1;
      max-width: 540px;
      height: 32px;
      padding: 2px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #1e293b;
      outline: none;
      cursor: pointer;
    }

    .substep-stepper-btn {
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .substep-stepper-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .substep-stepper-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .substep-counter-badge {
      padding: 3px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      background: #e2e8f0;
      color: #334155;
      border-radius: 12px;
      white-space: nowrap;
    }

    /* Main Activity Layout */
    .activity-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .plane-box {
      flex: 1.25;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .form-box {
      flex: 1;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px;
      gap: 12px;
      height: 100%;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .mission-card {
      border-left: 4px solid var(--primary-color) !important;
      background: #ffffff;
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
    }

    .mission-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .proof-input-text::placeholder {
      color: #a16207 !important;
      opacity: 0.75;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn {
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-color) !important;
      color: #ffffff !important;
      width: 100%;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--primary-hover) !important;
    }

    .btn-sky {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
    }

    /* Canvas Elements */
    .canvas-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      gap: 4px;
      padding: 4px;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
    }

    .tool-btn.active {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    #two-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Modal System */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      padding: 24px;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .grid-5x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 12px 0;
      flex: 1;
      overflow-y: auto;
    }

    .student-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .student-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Tier 1: Header -->
  <header class="app-header">
    <div class="logo-group">
      <span class="badge-tag">중1 수학</span>
      <h1 class="app-title">Ⅰ. 소인수분해</h1>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="current-user-info" style="font-size:0.86rem; font-weight:700; color:var(--text-secondary);">👤 로그인 필요</span>
      <button id="btn-header-unlock-boundary" class="btn btn-sky" style="display:none; padding:4px 10px; font-size:0.8rem;" onclick="openUnlockBoundaryModal()">🔓 진도 해금</button>
      <button id="btn-header-teacher-dashboard" class="btn btn-success" style="display:none; padding:4px 10px; font-size:0.8rem;" onclick="openTeacherDashboardModal()">📊 5x5 관제실</button>
      <button id="btn-header-teacher-pass" class="btn" style="background:#fef3c7; color:#b45309; border:1px solid #fde68a; padding:4px 10px; font-size:0.8rem;" onclick="openTeacherPassModal()">🔑 교사 패스 (Pass)</button>
      <button id="btn-header-logout" class="btn" style="background:#f1f5f9; color:#475569; padding:4px 10px; font-size:0.8rem; display:none;" onclick="handleLogout()">로그아웃</button>
    </div>
  </header>

  <!-- Main Content Views -->
  <main style="flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative;">
    <!-- View 1: Student Login -->
    <section id="view-login" class="view-panel" style="display:flex; justify-content:center; align-items:center; flex:1; padding:20px;">
      <div class="card" style="width:100%; max-width:400px; padding:28px; text-align:center;">
        <h2 style="font-size:1.35rem; margin-bottom:6px; color:#1e293b;">🏫 영서중 수학 LMS 학생 로그인</h2>
        <p style="font-size:0.86rem; color:#64748b; margin-bottom:18px;">LMS 학번과 비밀번호를 입력하고 이어서 학습하세요!</p>
        <form onsubmit="handleLMSLogin(event)">
          <div style="margin-bottom:12px; text-align:left;">
            <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">학번 (예: 10101)</label>
            <input type="text" id="student-id" class="form-control" placeholder="LMS 가입 학번 5자리" value="10101">
          </div>
          <div style="margin-bottom:16px; text-align:left;">
            <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">비밀번호</label>
            <input type="password" id="student-name" class="form-control" placeholder="LMS 가입 비밀번호">
          </div>
          <button id="btn-start-exploration" type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:1rem;">🔐 영서중 수학 LMS 학생 로그인</button>
        </form>
        <div id="login-error-notice" style="display:none; color:#dc2626; font-size:0.88rem; font-weight:700; margin-top:12px; background:#fef2f2; padding:10px 14px; border-radius:8px; border:1.5px solid #fca5a5;"></div>
        <div style="margin-top:14px; border-top:1px solid #e2e8f0; padding-top:12px; display:flex; flex-direction:column; gap:8px;">
          <button type="button" class="btn" style="background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; width:100%; font-weight:700;" onclick="openTestLoginModal()">🔑 교사 계정 접속</button>
          <button type="button" class="btn" style="background:#eef2ff; color:#4338ca; border:1.5px solid #c7d2fe; width:100%; font-weight:800;" onclick="openTeacherDashboardModal()">📊 교사 5x5 실시간 모니터링 관제실</button>
        </div>
      </div>
    </section>

    <!-- View 2: Interactive Student Activity Screen -->
    <section id="view-activity" class="view-panel" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
      <!-- Main Tabs -->
      <nav id="main-tab-bar" class="tab-bar-container main-tab-bar">
        <button id="tab-0" class="tab-btn active" onclick="switchMainTab(0)">0. 되짚어보기 & 도입 (pp.6~9) 🔓</button>
        <button id="tab-1" class="tab-btn" onclick="switchMainTab(1)" disabled>1. 소수와 합성수 (pp.10~13) 🔒</button>
        <button id="tab-2" class="tab-btn" onclick="switchMainTab(2)" disabled>2. 소인수분해 (pp.14~17) 🔒</button>
        <button id="tab-3" class="tab-btn" onclick="switchMainTab(3)" disabled>3. 최대공약수 (pp.18~20) 🔒</button>
        <button id="tab-4" class="tab-btn" onclick="switchMainTab(4)" disabled>4. 최소공배수 (pp.21~23) 🔒</button>
        <button id="tab-5" class="tab-btn" onclick="switchMainTab(5)" disabled>5. 알지오매스 코딩 (p.24) 🔒</button>
        <button id="tab-6" class="tab-btn" onclick="switchMainTab(6)" disabled>6. 마무리 (기초·기본) (pp.25~26) 🔒</button>
        <button id="tab-7" class="tab-btn" onclick="switchMainTab(7)" disabled>7. 마무리 (심화·서술형) (pp.26~27) 🔒</button>
        <button id="tab-8" class="tab-btn" onclick="switchMainTab(8)" disabled>🎨 8. 창의 융합 프로젝트 (p.28) 🔒</button>
      </nav>

      <!-- Sub-Step Navigation Bar -->
      <div id="substep-bar" class="substep-bar">
        <div class="substep-dropdown-container">
          <span style="font-size:0.84rem; font-weight:800; color:#334155; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;">
            📑 세부 탐구 활동:
          </span>
          <select id="substep-dropdown-select" class="substep-dropdown-select" onchange="handleSubstepSelect(this.value)"></select>
          <div id="substep-stepper-group" style="display:flex; gap:6px; margin-left:auto; align-items:center;">
            <button id="btn-prev-substep" class="substep-stepper-btn" onclick="goToPrevSubstep()">◀ 이전</button>
            <span id="substep-counter-badge" class="substep-counter-badge">1 / 1</span>
            <button id="btn-next-substep" class="substep-stepper-btn" onclick="goToNextSubstep()">다음 ▶</button>
          </div>
        </div>
      </div>

      <!-- Split Screen Area -->
      <div class="activity-container">
        <!-- Left: 60fps Dynamic Geometry Canvas -->
        <div class="plane-box">
          <div class="canvas-toolbar">
            <button id="tool-pointer" class="tool-btn active" onclick="setTool('pointer')" title="선택/조작 도구">👆</button>
            <button id="tool-pen" class="tool-btn" onclick="setTool('pen')" title="펜 드로잉">✏️</button>
            <button id="tool-eraser" class="tool-btn" onclick="setTool('eraser')" title="지우개">🧹</button>
            <button class="tool-btn" onclick="clearDrawing()" title="전체 지우기">🗑️</button>
          </div>
          <div id="two-container"></div>
        </div>

        <!-- Right: Interactive Mission & Form Area -->
        <div class="form-box">
          <div id="card-mission" class="card mission-card"></div>
          <div id="card-form-interactive" style="display:flex; flex-direction:column; gap:12px;"></div>
          <div id="grade-feedback-box" style="display:none; padding:12px 14px; border-radius:10px; font-weight:700; font-size:0.9rem; line-height:1.5;"></div>
          <div style="display:flex; gap:8px; margin-top:auto;">
            <button id="btn-next-step" class="btn btn-primary" style="flex:1; padding:12px; font-size:0.95rem; display:none;" onclick="goToNextSubStep()">다음 단계로 진행 ➡️</button>
          </div>
        </div>
      </div>
    </section>

    <!-- View 3: Teacher 5x5 Dashboard -->
    <section id="view-teacher-dashboard" class="view-panel" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
      <div class="card" style="margin:14px; flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">
          <div>
            <h2 style="font-size:1.25rem; font-weight:800; color:#0f172a;">📊 1단원 소인수분해 실시간 학급 모니터링 (5x5 관제실)</h2>
            <p style="font-size:0.84rem; color:#64748b;">학생들의 캔버스 조작 및 단계별 정답 상황을 실시간으로 확인합니다.</p>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-success" onclick="openUnlockBoundaryModal()">🔓 해금 범위 설정</button>
            <button class="btn btn-primary" onclick="switchView('activity')">학습 화면으로 돌아가기</button>
          </div>
        </div>
        <div style="display:flex; gap:6px; align-items:center; margin-top:10px;">
          <span style="font-size:0.82rem; font-weight:700; color:#475569; margin-right:4px;">학급 선택:</span>
          <div id="class-filter-buttons" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
        </div>
        <div id="teacher-student-grid" class="grid-5x5"></div>
      </div>
    </section>
  </main>

  <!-- Modals -->
  <!-- 1. Secure Password Modal -->
  <div id="secure-password-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.65); backdrop-filter:blur(4px); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#ffffff; border-radius:16px; width:90%; max-width:400px; padding:24px; box-shadow:0 20px 25px -5px rgba(0, 0, 0, 0.2); border:1.5px solid #e2e8f0;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1.5px solid #f1f5f9; padding-bottom:10px;">
        <h3 id="secure-modal-title" style="margin:0; font-size:1.15rem; color:#1e293b; font-weight:800; display:flex; align-items:center; gap:8px;">
          <span>🔑</span> <span id="secure-modal-title-text">교사 비밀번호 인증</span>
        </h3>
        <button type="button" onclick="closeSecurePasswordModal()" style="background:none; border:none; font-size:1.4rem; color:#94a3b8; cursor:pointer; line-height:1;">&times;</button>
      </div>
      <p id="secure-modal-desc" style="font-size:0.86rem; color:#64748b; line-height:1.5; margin-bottom:16px;">
        보안 인증을 위해 교사 비밀번호를 입력해 주세요.
      </p>
      <form id="secure-password-form" onsubmit="handleSecurePasswordSubmit(event)">
        <div style="margin-bottom:16px; text-align:left;">
          <label for="secure-modal-input" style="font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:6px; display:block;">비밀번호</label>
          <input type="password" id="secure-modal-input" class="form-control" placeholder="비밀번호 입력" style="letter-spacing:3px; font-size:1.1rem; width:100%;" autocomplete="off" required>
        </div>
        <div id="secure-modal-error" style="display:none; color:#dc2626; font-size:0.82rem; font-weight:700; margin-bottom:12px; background:#fef2f2; padding:8px 10px; border-radius:6px; border:1px solid #fca5a5;"></div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn" style="flex:1; background:#f1f5f9; color:#475569; font-weight:700;" onclick="closeSecurePasswordModal()">취소</button>
          <button type="submit" id="secure-modal-submit-btn" class="btn btn-primary" style="flex:2; font-weight:800;">확인 및 인증</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Unlock Boundary Modal -->
  <div id="unlock-boundary-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:520px;">
      <h3 style="margin-bottom:8px; font-size:1.15rem; color:#1e293b;">🔓 학생 진도 해금 범위 설정</h3>
      <p style="font-size:0.86rem; color:#64748b; margin-bottom:14px;">학생들이 자율적으로 탐구할 수 있는 최대 단원/단계를 지정합니다.</p>
      <div style="margin-bottom:14px;">
        <label style="font-size:0.82rem; font-weight:700; color:#475569; display:block; margin-bottom:6px;">최대 해금 단계 선택:</label>
        <select id="select-unlock-substep-g1" class="form-control" style="font-weight:700;"></select>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="flex:1; background:#f1f5f9; color:#475569;" onclick="closeModal('unlock-boundary-modal')">취소</button>
        <button class="btn btn-success" style="flex:2;" onclick="applyUnlockBoundary()">해금 범위 적용 및 학생 동기화</button>
      </div>
    </div>
  </div>

  <!-- 3. Student 1:1 Zoom Modal -->
  <div id="student-zoom-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:720px; width:95%;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid #e2e8f0; padding-bottom:8px;">
        <h3 id="zoom-student-name" style="font-size:1.15rem; color:#1e293b; font-weight:800;">👤 학생 상세 활동 모니터링</h3>
        <button class="btn" style="padding:4px 8px; font-size:1rem;" onclick="closeModal('student-zoom-modal')">&times;</button>
      </div>
      <div id="zoom-student-details" style="font-size:0.9rem; line-height:1.6; color:#334155;"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. Constants & Core State
    // ==========================================
    const TEACHER_MASTER_PASSWORDS = ['260523', '260831', '661227'];
    window.TEACHER_MASTER_PASSWORDS = TEACHER_MASTER_PASSWORDS;

    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playTone(freq, type, duration) {
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      success() {
        this.playTone(523.25, 'sine', 0.1);
        setTimeout(() => this.playTone(659.25, 'sine', 0.1), 100);
        setTimeout(() => this.playTone(783.99, 'sine', 0.2), 200);
      },
      error() {
        this.playTone(250, 'sawtooth', 0.15);
        setTimeout(() => this.playTone(200, 'sawtooth', 0.25), 150);
      },
      unlock() {
        this.playTone(440, 'triangle', 0.1);
        setTimeout(() => this.playTone(880, 'sine', 0.25), 120);
      }
    };
    window.SoundFX = SoundFX;

    const state = {
      studentId: '10101',
      studentName: '학생',
      studentClass: 1,
      isTeacherLoggedIn: false,
      currentMainTab: 0,
      currentSubStep: '0-1',
      currentTool: 'pointer',
      unlockedTabs: [0],
      unlockedSubSteps: ['0-1'],
      completedSteps: new Set(),
      userAnswers: {},
      selectedClass: 1
    };
    window.state = state;

    function normTxt(t) {
      if (t === null || t === undefined) return '';
      return String(t).trim().replace(/\s+/g, '').toLowerCase()
        .replace(/,/g, ',')
        .replace(/×/g, '*')
        .replace(/·/g, '*')
        .replace(/제곱/g, '^2')
        .replace(/세제곱/g, '^3')
        .replace(/네제곱/g, '^4');
    }
    window.normTxt = normTxt;

    // ==========================================
    // 2. Tab SubSteps Master Registry
    // ==========================================
    const tabSubSteps = {
      "0": [
        { code: "0-1", tab: 0, label: "0-1. 대단원 계통도 탐구 (p.6)", mission: "<b>[대단원 도입] Ⅰ. 소인수분해 (p.6)</b><br>초등학교의 '약수와 배수'가 중학교 1학년 '소인수분해', 중2 '순환소수', 중3 '제곱근'으로 어떻게 확장되는지 수학 계통도를 탐구해 봅시다." },
        { code: "0-2", tab: 0, label: "0-2. 물질 원소와 자연수의 구성 (p.7)", mission: "<b>[생각열기] 자연수를 이루는 기본 요소 (p.7)</b><br>물질을 이루는 기본 구성 요소로 수소, 산소 등이 있듯이, 자연수를 이루는 기본 구성 요소를 알아봅시다." },
        { code: "0-3", tab: 0, label: "0-3. 정보화 시대의 암호와 소수 (p.8)", mission: "<b>[수학 산책] 현대 사회의 암호와 소수 (p.8)</b><br>소수는 현대 사회에서 금융과 정보를 보호하는 거대한 암호의 핵심 원리입니다. 소수의 중요성을 탐구해 봅시다." },
        { code: "0-4", tab: 0, label: "0-4. 되짚어보기 1: 약수와 배수 (p.9)", mission: "<b>[되짚어보기 1] 약수와 배수 구하기 (초등 5~6 연계)</b><br>주어진 자연수의 약수와 배수를 정확하게 구해 봅시다." },
        { code: "0-5", tab: 0, label: "0-5. 되짚어보기 2: 공약수와 최대공약수 (p.9)", mission: "<b>[되짚어보기 2] 공약수와 최대공약수 (초등 5~6 연계)</b><br>두 수의 공통인 약수와 그중 가장 큰 최대공약수를 구해 봅시다." },
        { code: "0-6", tab: 0, label: "0-6. 되짚어보기 3: 공배수와 최소공배수 (p.9)", mission: "<b>[되짚어보기 3] 공배수와 최소공배수 (초등 5~6 연계)</b><br>두 수의 공통인 배수와 그중 가장 작은 최소공배수를 구해 봅시다." }
      ],
      "1": [],
      "2": [],
      "3": [],
      "4": [],
      "5": [],
      "6": [],
      "7": [],
      "8": []
    };
    window.tabSubSteps = tabSubSteps;

    // ==========================================
    // 3. Navigation & View Controller
    // ==========================================
    function switchView(viewName) {
      document.querySelectorAll('.view-panel').forEach(p => {
        p.classList.remove('active');
        p.style.display = 'none';
      });
      const target = document.getElementById(`view-${viewName}`);
      if (target) {
        target.classList.add('active');
        target.style.display = (viewName === 'login') ? 'flex' : 'flex';
      }
    }
    window.switchView = switchView;

    function switchMainTab(tabIdx) {
      if (!state.isTeacherLoggedIn && !state.unlockedTabs.includes(tabIdx)) {
        alert('🔒 이전 단원을 먼저 완료해야 합니다!');
        return;
      }
      state.currentMainTab = tabIdx;
      document.querySelectorAll('#main-tab-bar .tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === tabIdx);
      });
      renderSubstepDropdown();
      const steps = tabSubSteps[String(tabIdx)] || [];
      if (steps.length > 0) {
        switchSubStep(steps[0].code);
      }
    }
    window.switchMainTab = switchMainTab;

    function renderSubstepDropdown() {
      const select = document.getElementById('substep-dropdown-select');
      if (!select) return;
      select.innerHTML = '';
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      steps.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = s.code;
        const isDone = state.completedSteps.has(s.code);
        opt.textContent = `${s.label} ${isDone ? '✓' : ''}`;
        select.appendChild(opt);
      });
      updateStepperUI();
    }
    window.renderSubstepDropdown = renderSubstepDropdown;

    function handleSubstepSelect(code) {
      if (code) switchSubStep(code);
    }
    window.handleSubstepSelect = handleSubstepSelect;

    function updateStepperUI() {
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const curIdx = steps.findIndex(s => s.code === state.currentSubStep);
      const total = steps.length;
      const counter = document.getElementById('substep-counter-badge');
      if (counter) counter.textContent = `${curIdx >= 0 ? curIdx + 1 : 1} / ${Math.max(1, total)}`;
      
      const prevBtn = document.getElementById('btn-prev-substep');
      const nextBtn = document.getElementById('btn-next-substep');
      if (prevBtn) prevBtn.disabled = (curIdx <= 0);
      if (nextBtn) nextBtn.disabled = (curIdx < 0 || curIdx >= total - 1);
    }
    window.updateStepperUI = updateStepperUI;

    function goToPrevSubstep() {
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const curIdx = steps.findIndex(s => s.code === state.currentSubStep);
      if (curIdx > 0) switchSubStep(steps[curIdx - 1].code);
    }
    window.goToPrevSubstep = goToPrevSubstep;

    function goToNextSubstep() {
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const curIdx = steps.findIndex(s => s.code === state.currentSubStep);
      if (curIdx >= 0 && curIdx < steps.length - 1) switchSubStep(steps[curIdx + 1].code);
    }
    window.goToNextSubstep = goToNextSubstep;

    function switchSubStep(stepCode) {
      state.currentSubStep = stepCode;
      const select = document.getElementById('substep-dropdown-select');
      if (select) select.value = stepCode;
      updateStepperUI();

      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const stepData = steps.find(s => s.code === stepCode);

      // Render Mission Card
      const missionBox = document.getElementById('card-mission');
      if (missionBox && stepData) {
        missionBox.innerHTML = `
          <div class="mission-title">🎯 오늘의 탐구 미션</div>
          <div style="font-size:0.9rem; line-height:1.5; color:#334155;">${stepData.mission}</div>
        `;
      }

      // Render Form
      renderSubStepForm(stepCode);

      // Render Canvas
      renderSubStepCanvas(stepCode);

      // Feedback Box Reset
      const fBox = document.getElementById('grade-feedback-box');
      if (fBox) fBox.style.display = 'none';

      const nextBtn = document.getElementById('btn-next-step');
      if (nextBtn) nextBtn.style.display = 'none';

      // KaTeX Auto-render
      if (window.renderMathInElement) {
        renderMathInElement(document.getElementById('card-form-interactive'), {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }
    window.switchSubStep = switchSubStep;

    // Placeholder for Canvas & Form Dynamic Renderers
    function renderSubStepForm(code) {
      const box = document.getElementById('card-form-interactive');
      if (!box) return;
      const funcName = `renderForm_${code.replace('-', '_')}`;
      if (typeof window[funcName] === 'function') {
        window[funcName](box);
      } else {
        box.innerHTML = `<div class="card" style="text-align:center; padding:30px; color:#64748b;">
          🚧 <b>${code}</b> 단계의 탐구 워크 폼을 불러오는 중입니다...
        </div>`;
      }
    }
    window.renderSubStepForm = renderSubStepForm;

    function renderSubStepCanvas(code) {
      const container = document.getElementById('two-container');
      if (!container) return;
      container.innerHTML = '';
      const funcName = `drawCanvas_${code.replace('-', '_')}`;
      if (typeof window[funcName] === 'function') {
        window[funcName](container);
      } else {
        container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:700;">
          🎨 <b>${code}</b> 60fps 인터랙티브 캔버스 로딩
        </div>`;
      }
    }
    window.renderSubStepCanvas = renderSubStepCanvas;

    // ==========================================
    // 4. LMS Login & Teacher Auth
    // ==========================================
    async function handleLMSLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const idInput = document.getElementById('student-id');
      const pwInput = document.getElementById('student-name');
      const errBox = document.getElementById('login-error-notice');
      if (errBox) errBox.style.display = 'none';

      const val = idInput ? idInput.value.trim() : '';
      const password = pwInput ? pwInput.value.trim() : '';

      if (!val || !password) {
        showLoginError('⚠️ 학번 5자리와 비밀번호를 모두 입력해 주세요!');
        return false;
      }

      // Check Teacher Master PIN directly
      if (TEACHER_MASTER_PASSWORDS.includes(password) || TEACHER_MASTER_PASSWORDS.includes(val)) {
        applyLoggedInUser({
          id: val,
          name: '임종윤 선생님',
          role: 'teacher',
          grade: 1,
          classNum: parseInt(val[2] || '1', 10)
        });
        return true;
      }

      if (val.length !== 5) {
        showLoginError('⚠️ 올바른 학번 5자리를 입력하세요 (예: 10101)');
        return false;
      }

      const loginBtn = document.getElementById('btn-start-exploration');
      const origText = loginBtn ? loginBtn.innerText : '';
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.innerText = '⏳ 영서중 수학 LMS DB 인증 중...';
      }

      try {
        let res = null;
        if (typeof LMSIntegration !== 'undefined' && LMSIntegration.loginStudent) {
          res = await LMSIntegration.loginStudent(val, password);
        } else {
          res = {
            success: true,
            user: { id: val, name: `학생(${val})`, grade: val[0], classNum: val[2], role: 'student' }
          };
        }

        if (res && res.success) {
          applyLoggedInUser(res.user);
          return true;
        } else {
          showLoginError(`❌ ${res ? res.message : '학번 또는 비밀번호가 일치하지 않습니다.'}`);
          return false;
        }
      } catch (err) {
        console.error(err);
        showLoginError('❌ 영서중 수학 LMS DB 연결 중 오류가 발생했습니다.');
        return false;
      } finally {
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.innerText = origText || '🔐 영서중 수학 LMS 학생 로그인';
        }
      }
    }
    window.handleLMSLogin = handleLMSLogin;

    function showLoginError(msg) {
      const box = document.getElementById('login-error-notice');
      if (box) {
        box.innerText = msg;
        box.style.display = 'block';
      } else {
        alert(msg);
      }
    }
    window.showLoginError = showLoginError;

    function applyLoggedInUser(user) {
      state.studentId = user.id;
      state.studentName = user.name;
      state.studentClass = parseInt(user.classNum || user.id[2] || '1', 10);
      state.isTeacherLoggedIn = (user.role === 'teacher' || TEACHER_MASTER_PASSWORDS.includes(user.id));

      const infoSpan = document.getElementById('current-user-info');
      if (infoSpan) {
        infoSpan.textContent = state.isTeacherLoggedIn
          ? `👨‍🏫 ${user.name} (교사 관리자)`
          : `👤 ${user.name} (${user.id})`;
        infoSpan.style.color = state.isTeacherLoggedIn ? '#059669' : '#4f46e5';
      }

      document.getElementById('btn-header-unlock-boundary').style.display = state.isTeacherLoggedIn ? 'inline-flex' : 'none';
      document.getElementById('btn-header-teacher-dashboard').style.display = state.isTeacherLoggedIn ? 'inline-flex' : 'none';
      document.getElementById('btn-header-logout').style.display = 'inline-flex';

      if (state.isTeacherLoggedIn) {
        state.unlockedTabs = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        document.querySelectorAll('#main-tab-bar .tab-btn').forEach(btn => {
          btn.disabled = false;
          btn.innerHTML = btn.innerHTML.replace('🔒', '🔓');
        });
      }

      switchView('activity');
      switchMainTab(0);
      SoundFX.success();
    }
    window.applyLoggedInUser = applyLoggedInUser;

    function handleLogout() {
      state.isTeacherLoggedIn = false;
      state.studentId = '10101';
      state.studentName = '학생';
      state.unlockedTabs = [0];
      switchView('login');
      document.getElementById('current-user-info').textContent = '👤 로그인 필요';
      document.getElementById('current-user-info').style.color = 'var(--text-secondary)';
      document.getElementById('btn-header-unlock-boundary').style.display = 'none';
      document.getElementById('btn-header-teacher-dashboard').style.display = 'none';
      document.getElementById('btn-header-logout').style.display = 'none';
    }
    window.handleLogout = handleLogout;

    // Secure Modal
    let pendingSecureAction = null;
    function openSecureModal(title, desc, action) {
      document.getElementById('secure-modal-title-text').textContent = title;
      document.getElementById('secure-modal-desc').textContent = desc;
      document.getElementById('secure-modal-input').value = '';
      document.getElementById('secure-modal-error').style.display = 'none';
      pendingSecureAction = action;
      document.getElementById('secure-password-modal').style.display = 'flex';
      setTimeout(() => document.getElementById('secure-modal-input').focus(), 80);
    }
    window.openSecureModal = openSecureModal;

    function closeSecurePasswordModal() {
      document.getElementById('secure-password-modal').style.display = 'none';
      pendingSecureAction = null;
    }
    window.closeSecurePasswordModal = closeSecurePasswordModal;

    function handleSecurePasswordSubmit(e) {
      if (e && e.preventDefault) e.preventDefault();
      const pin = document.getElementById('secure-modal-input').value.trim();
      if (TEACHER_MASTER_PASSWORDS.includes(pin)) {
        closeSecurePasswordModal();
        SoundFX.unlock();
        if (pendingSecureAction === 'teacherDashboard') {
          applyLoggedInUser({ id: '260523', name: '임종윤 선생님', role: 'teacher', grade: 1 });
          switchView('teacher-dashboard');
          renderTeacherDashboard();
        } else if (pendingSecureAction === 'testLogin') {
          applyLoggedInUser({ id: '260523', name: '임종윤 선생님', role: 'teacher', grade: 1 });
        } else if (pendingSecureAction === 'teacherPass') {
          executeTeacherPass(state.currentSubStep);
        }
      } else {
        const err = document.getElementById('secure-modal-error');
        if (err) {
          err.innerText = '❌ 올바른 교사 비밀번호가 아닙니다!';
          err.style.display = 'block';
        }
        SoundFX.error();
      }
    }
    window.handleSecurePasswordSubmit = handleSecurePasswordSubmit;

    function openTestLoginModal() {
      openSecureModal('교사 계정 접속', '교사 마스터 비밀번호를 입력해 관리자 모드로 즉시 접속하세요.', 'testLogin');
    }
    window.openTestLoginModal = openTestLoginModal;

    function openTeacherDashboardModal() {
      if (state.isTeacherLoggedIn) {
        switchView('teacher-dashboard');
        renderTeacherDashboard();
      } else {
        openSecureModal('교사 5x5 관제실 접속', '학급 전체 모니터링을 위해 교사 비밀번호를 인증하세요.', 'teacherDashboard');
      }
    }
    window.openTeacherDashboardModal = openTeacherDashboardModal;

    function openTeacherPassModal() {
      openSecureModal('현재 단계 교사 패스 (Pass)', '학생의 탐구를 즉시 통과 처리하기 위해 교사 비밀번호를 입력하세요.', 'teacherPass');
    }
    window.openTeacherPassModal = openTeacherPassModal;

    function executeTeacherPass(code) {
      state.completedSteps.add(code);
      SoundFX.success();
      alert(`🎉 [교사 마스터 승인] ${code} 서브스텝이 정상 통과 처리되었습니다!`);
      renderSubstepDropdown();
      const nextBtn = document.getElementById('btn-next-step');
      if (nextBtn) nextBtn.style.display = 'block';
    }
    window.executeTeacherPass = executeTeacherPass;

    // ==========================================
    // 5. 5x5 Teacher Dashboard Grid
    // ==========================================
    function renderTeacherDashboard() {
      const filterBox = document.getElementById('class-filter-buttons');
      if (filterBox) {
        filterBox.innerHTML = '';
        for (let c = 1; c <= 8; c++) {
          const btn = document.createElement('button');
          btn.className = `btn ${state.selectedClass === c ? 'btn-primary' : ''}`;
          btn.style.padding = '4px 10px';
          btn.style.fontSize = '0.8rem';
          btn.textContent = `${c}반`;
          btn.onclick = () => {
            state.selectedClass = c;
            renderTeacherDashboard();
          };
          filterBox.appendChild(btn);
        }
      }

      const grid = document.getElementById('teacher-student-grid');
      if (!grid) return;
      grid.innerHTML = '';
      for (let num = 1; num <= 25; num++) {
        const studentId = `10${state.selectedClass}${String(num).padStart(2, '0')}`;
        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; font-weight:800; font-size:0.85rem;">
            <span>${studentId}</span>
            <span style="color:#059669;">진도 0-1</span>
          </div>

// --- Helper Functions ---
function parseNumList(str) {
  if (!str) return [];
  return String(str)
    .replace(/[^\d,，\s]/g, '')
    .split(/[,，\s]+/)
    .filter(Boolean)
    .map(Number)
    .sort((a, b) => a - b);
}

function areListsEqual(l1, l2) {
  if (!l1 || !l2 || l1.length !== l2.length) return false;
  for (let i = 0; i < l1.length; i++) {
    if (l1[i] !== l2[i]) return false;
  }
  return true;
}

function showFeedback(isSuccess, message) {

  box.style.background = isSuccess ? '#ecfdf5' : '#fef2f2';

  box.style.color = isSuccess ? '#065f46' : '#991b1b';
  box.innerHTML = message;
}

function completeSubStep(code, successMsg) {
  state.completedSteps.add(code);
  if (window.SoundFX && window.SoundFX.success) SoundFX.success();

}

function drawCanvas_0_1(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;
  let t = 0;

  const nodes = [
    { id: 'elem', title: '초등 5~6학년', concept: '약수와 배수', desc: '나누어떨어지는 수의 규칙과 배수 원리 탐구', x: 0.16, y: 0.32, color: '#0284c7' },
    { id: 'g1', title: '중1 (현재 단원)', concept: '소인수분해', desc: '자연수를 소수들의 곱으로 분해하는 기본 벽돌 탐구', x: 0.38, y: 0.68, color: '#4f46e5', isTarget: true },
    { id: 'g2', title: '중2 연계', concept: '유리수와 순환소수', desc: '분수를 소수로 나타낼 때 유한소수와 순환소수 판별', x: 0.62, y: 0.32, color: '#059669' },
    { id: 'g3', title: '중3 연계', concept: '제곱근과 실수', desc: '제곱하여 a가 되는 수와 무리수의 도입', x: 0.84, y: 0.68, color: '#d97706' }
  ];

  let selectedNode = nodes[1];

  function resize() {
    if (!container || !canvas) return;
    canvas.width = container.clientWidth || 560;
    canvas.height = container.clientHeight || 460;
  }
  window.addEventListener('resize', resize);

  function draw() {
    t += 0.025;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Background Grid
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // Connect Lines (Bezier Curves)
    for (let i = 0; i < nodes.length - 1; i++) {
      const n1 = nodes[i];
      const n2 = nodes[i + 1];
      const x1 = n1.x * w;
      const y1 = n1.y * h;
      const x2 = n2.x * w;
      const y2 = n2.y * h;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const cx1 = (x1 + x2) / 2;
      const cy1 = y1;
      const cx2 = (x1 + x2) / 2;
      const cy2 = y2;
      ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Flowing particle
      const pRatio = (t * 0.4 + i * 0.33) % 1;
      const px = Math.pow(1 - pRatio, 3) * x1 + 3 * Math.pow(1 - pRatio, 2) * pRatio * cx1 + 3 * (1 - pRatio) * Math.pow(pRatio, 2) * cx2 + Math.pow(pRatio, 3) * x2;
      const py = Math.pow(1 - pRatio, 3) * y1 + 3 * Math.pow(1 - pRatio, 2) * pRatio * cy1 + 3 * (1 - pRatio) * Math.pow(pRatio, 2) * cy2 + Math.pow(pRatio, 3) * y2;
      ctx.fillStyle = '#4f46e5';
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw Nodes
    nodes.forEach(n => {
      const nx = n.x * w;
      const ny = n.y * h;
      const isCur = n === selectedNode;

      // Pulse ring for target node
      if (n.isTarget) {
        const pulse = (Math.sin(t * 3) + 1) / 2;
        ctx.strokeStyle = `rgba(79, 70, 229, ${0.2 + pulse * 0.4})`;
        ctx.lineWidth = 4 + pulse * 6;
        ctx.beginPath();
        ctx.arc(nx, ny, 44 + pulse * 6, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Node Circle
      ctx.fillStyle = isCur ? n.color : '#ffffff';
      ctx.strokeStyle = n.color;
      ctx.lineWidth = isCur ? 4 : 3;
      ctx.beginPath();
      ctx.arc(nx, ny, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Node Label
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = isCur ? '#ffffff' : '#475569';
      ctx.fillText(n.title, nx, ny - 10);

      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillStyle = isCur ? '#ffffff' : n.color;
      ctx.fillText(n.concept, nx, ny + 10);
    });

    // Detail Card at bottom
    if (selectedNode) {
      const cardY = h - 90;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = selectedNode.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(30, cardY, w - 60, 75, 12) : ctx.rect(30, cardY, w - 60, 75);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillStyle = selectedNode.color;
      ctx.fillText(`📌 [${selectedNode.title}] ${selectedNode.concept}`, 45, cardY + 28);

      ctx.font = '13px Pretendard, sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText(selectedNode.desc, 45, cardY + 52);
    }

    // Interactive guide
    ctx.textAlign = 'center';
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('💡 노드를 클릭하여 각 학년별 수학 계통도 연계 개념을 확인하세요.', w / 2, 25);

    animId = requestAnimationFrame(draw);
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const w = canvas.width;
    const h = canvas.height;

    nodes.forEach(n => {
      const nx = n.x * w;
      const ny = n.y * h;
      const dist = Math.hypot(mx - nx, my - ny);
      if (dist <= 40) {
        selectedNode = n;
        if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(580, 'sine', 0.1);
      }
    });
  });

  draw();
}

// 0-2 (p.7): 물질 원소와 자연수의 구성 요소

function drawCanvas_0_2(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;
  let t = 0;

  // Atoms
  const palette = [
    { type: 'atom', label: 'H', sub: '수소', color: '#0284c7', r: 24 },
    { type: 'atom', label: 'O', sub: '산소', color: '#dc2626', r: 28 },
    { type: 'prime', label: '2', sub: '소수', color: '#4f46e5', r: 26 },
    { type: 'prime', label: '3', sub: '소수', color: '#7c3aed', r: 26 },
    { type: 'prime', label: '5', sub: '소수', color: '#d97706', r: 26 }
  ];

  let activeAtoms = [
    { id: 1, type: 'atom', label: 'H', color: '#0284c7', r: 22, x: 80, y: 70 },
    { id: 2, type: 'atom', label: 'H', color: '#0284c7', r: 22, x: 140, y: 70 },
    { id: 3, type: 'atom', label: 'O', color: '#dc2626', r: 26, x: 210, y: 70 },
    { id: 4, type: 'prime', label: '2', color: '#4f46e5', r: 24, x: 300, y: 70 },
    { id: 5, type: 'prime', label: '2', color: '#4f46e5', r: 24, x: 360, y: 70 },
    { id: 6, type: 'prime', label: '3', color: '#7c3aed', r: 24, x: 420, y: 70 },
    { id: 7, type: 'prime', label: '5', color: '#d97706', r: 24, x: 480, y: 70 }
  ];

  let draggedAtom = null;
  let dragOffset = { x: 0, y: 0 };

  function draw() {
    t += 0.02;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Chamber Area (Center bottom)
    const cx = w / 2;
    const cy = h * 0.62;
    const cr = Math.min(w, h) * 0.32;

    // Glowing chamber ring
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = 'rgba(248, 250, 252, 0.6)';
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('⚗️ 원자 & 소수 결합 챔버 (원형 안으로 드래그)', cx, cy - cr + 25);

    // Check atoms inside chamber
    const inside = activeAtoms.filter(a => Math.hypot(a.x - cx, a.y - cy) < cr - 10);
    const hCount = inside.filter(a => a.label === 'H').length;
    const oCount = inside.filter(a => a.label === 'O').length;
    const p2Count = inside.filter(a => a.label === '2').length;
    const p3Count = inside.filter(a => a.label === '3').length;
    const p5Count = inside.filter(a => a.label === '5').length;

    // Chamber Result Banner
    let resultText = '';
    let resultSub = '';
    if (hCount === 2 && oCount === 1) {
      resultText = '💥 화학 결합: 물 분자 (H₂O) 형성!';
      resultSub = '기본 원소인 수소(H)와 산소(O)가 결합하여 물질을 이룹니다.';
    } else if (p2Count > 0 || p3Count > 0 || p5Count > 0) {
      let val = Math.pow(2, p2Count) * Math.pow(3, p3Count) * Math.pow(5, p5Count);
      let formula = [];
      if (p2Count > 0) formula.push(p2Count === 1 ? '2' : `2^${p2Count}`);
      if (p3Count > 0) formula.push(p3Count === 1 ? '3' : `3^${p3Count}`);
      if (p5Count > 0) formula.push(p5Count === 1 ? '5' : `5^${p5Count}`);
      resultText = `🔢 자연수 결합: ${val} = ${formula.join(' × ')}`;
      resultSub = `자연수의 기본 원소인 소수(2, 3, 5)들이 곱해져 합성수 ${val}을 만듭니다!`;
    }

    if (resultText) {
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#4f46e5';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cx - 180, cy + cr - 45, 360, 50, 10) : ctx.rect(cx - 180, cy + cr - 45, 360, 50);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#4f46e5';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillText(resultText, cx, cy + cr - 26);
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(resultSub, cx, cy + cr - 10);
    }

    // Atoms draw
    activeAtoms.forEach(a => {
      ctx.save();
      // Drop shadow
      ctx.shadowColor = 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 3;

      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillText(a.label, a.x, a.y);
    });

    animId = requestAnimationFrame(draw);
  }

  // Pointer events
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    for (let i = activeAtoms.length - 1; i >= 0; i--) {
      const a = activeAtoms[i];
      if (Math.hypot(mx - a.x, my - a.y) <= a.r) {
        draggedAtom = a;
        dragOffset.x = mx - a.x;
        dragOffset.y = my - a.y;
        canvas.setPointerCapture(e.pointerId);
        break;
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!draggedAtom) return;
    const rect = canvas.getBoundingClientRect();
    draggedAtom.x = e.clientX - rect.left - dragOffset.x;
    draggedAtom.y = e.clientY - rect.top - dragOffset.y;
  });

  const stopDrag = (e) => {
    if (draggedAtom) {
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(440, 'sine', 0.05);
      draggedAtom = null;
    }
  };
  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);

  draw();
}

// -------------------------------------------------------------
// 0-3 (p.8): 정보화 시대의 암호와 소수
// -------------------------------------------------------------
function drawCanvas_0_3(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;
  let t = 0;

  let primeP = 61;
  let primeQ = 53;
  let isLocked = false;
  let lockAngle = 0;
  let attackMode = false;
  let attackProgress = 0;

  function draw() {
    t += 0.02;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const N = primeP * primeQ; // 3233

    // Background security grid
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }

    // Top Title & Explanation
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('🔐 현대 정보보호 RSA 공개키 암호 시뮬레이터', w / 2, 35);
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('거대한 두 소수를 곱하기는 쉽지만, 곱한 합성수를 다시 소인수분해하기는 불가능에 가깝습니다.', w / 2, 58);

    // Left Key: Prime P
    const kx1 = w * 0.22;
    const ky = 150;
    ctx.fillStyle = '#eff6ff';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(kx1 - 55, ky - 40, 110, 80, 12) : ctx.rect(kx1 - 55, ky - 40, 110, 80);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#1d4ed8';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillText('🔑 소수 키 p', kx1, ky - 16);
    ctx.font = 'bold 24px Pretendard, sans-serif';
    ctx.fillText(String(primeP), kx1, ky + 16);

    // Multiplication Symbol
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 22px Pretendard, sans-serif';
    ctx.fillText('×', w * 0.37, ky + 5);

    // Right Key: Prime Q
    const kx2 = w * 0.52;
    ctx.fillStyle = '#faf5ff';
    ctx.strokeStyle = '#8b5cf6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(kx2 - 55, ky - 40, 110, 80, 12) : ctx.rect(kx2 - 55, ky - 40, 110, 80);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#6d28d9';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillText('🔑 소수 키 q', kx2, ky - 16);
    ctx.font = 'bold 24px Pretendard, sans-serif';
    ctx.fillText(String(primeQ), kx2, ky + 16);

    // Equals Symbol
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 22px Pretendard, sans-serif';
    ctx.fillText('=', w * 0.67, ky + 5);

    // Lock Core Result (N = p * q)
    const kx3 = w * 0.82;
    ctx.fillStyle = isLocked ? '#ecfdf5' : '#fef2f2';
    ctx.strokeStyle = isLocked ? '#10b981' : '#f87171';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(kx3 - 60, ky - 40, 120, 80, 12) : ctx.rect(kx3 - 60, ky - 40, 120, 80);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isLocked ? '#065f46' : '#991b1b';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillText('공개키 N (합성수)', kx3, ky - 16);
    ctx.font = 'bold 22px Pretendard, sans-serif';
    ctx.fillText(String(N), kx3, ky + 16);

    // Center Big Padlock
    const lx = w / 2;
    const ly = h * 0.68;

    // Shield Wave if locked
    if (isLocked) {
      const pulse = (Math.sin(t * 4) + 1) / 2;
      ctx.strokeStyle = `rgba(16, 185, 129, ${0.15 + pulse * 0.25})`;
      ctx.lineWidth = 3 + pulse * 4;
      ctx.beginPath();
      ctx.arc(lx, ly, 75 + pulse * 10, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Shackle (U-shape)
    ctx.strokeStyle = isLocked ? '#cbd5e1' : '#94a3b8';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const shackleY = isLocked ? ly - 42 : ly - 60;
    ctx.arc(lx, shackleY, 32, Math.PI, 0);
    ctx.lineTo(lx + 32, ly - 15);
    ctx.moveTo(lx - 32, shackleY);
    ctx.lineTo(lx - 32, ly - 15);
    ctx.stroke();
    ctx.lineCap = 'butt';

    // Lock Body
    ctx.fillStyle = isLocked ? '#f59e0b' : '#64748b';
    ctx.strokeStyle = isLocked ? '#d97706' : '#475569';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(lx - 50, ly - 15, 100, 75, 14) : ctx.rect(lx - 50, ly - 15, 100, 75);
    ctx.fill();
    ctx.stroke();

    // Keyhole
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(lx, ly + 15, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lx - 4, ly + 17);
    ctx.lineTo(lx + 4, ly + 17);
    ctx.lineTo(lx + 6, ly + 36);
    ctx.lineTo(lx - 6, ly + 36);
    ctx.closePath();
    ctx.fill();

    // Attack simulation status
    if (attackMode) {
      attackProgress += 0.015;
      ctx.fillStyle = 'rgba(239, 68, 68, 0.95)';
      ctx.strokeStyle = '#b91c1c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(w / 2 - 200, h - 65, 400, 50, 10) : ctx.rect(w / 2 - 200, h - 65, 400, 50);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText(`🚨 슈퍼컴퓨터 무차별 소인수분해 공격 중... (해독 불가)`, w / 2, h - 42);
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillText(`수백 자리의 두 소수를 곱한 합성수는 현재 인류 기술로 분해 불가능!`, w / 2, h - 24);
    } else {
      ctx.textAlign = 'center';
      ctx.font = '12px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(isLocked ? '✅ 암호화 완료! 아래 버튼으로 공격 방어력을 확인해 보세요.' : '👇 버튼을 눌러 소수 암호 자물쇠를 잠그세요.', w / 2, h - 30);
    }

    animId = requestAnimationFrame(draw);
  }

  // Buttons in canvas container
  const btnRow = document.createElement('div');
  btnRow.style.position = 'absolute';
  btnRow.style.bottom = '12px';
  btnRow.style.left = '50%';
  btnRow.style.transform = 'translateX(-50%)';
  btnRow.style.display = 'flex';
  btnRow.style.gap = '8px';
  btnRow.style.zIndex = '20';

  const btnLock = document.createElement('button');
  btnLock.className = 'btn btn-primary';
  btnLock.style.padding = '6px 14px';
  btnLock.style.fontSize = '0.84rem';
  btnLock.textContent = '🔒 소수 암호 잠그기';
  btnLock.onclick = () => {
    isLocked = true;
    attackMode = false;
    if (window.SoundFX && window.SoundFX.unlock) SoundFX.unlock();
  };

  const btnAttack = document.createElement('button');
  btnAttack.className = 'btn';
  btnAttack.style.background = '#fef2f2';
  btnAttack.style.color = '#dc2626';
  btnAttack.style.border = '1px solid #fecaca';
  btnAttack.style.padding = '6px 14px';
  btnAttack.style.fontSize = '0.84rem';
  btnAttack.textContent = '⚡ 해독 공격 시뮬레이션';
  btnAttack.onclick = () => {
    attackMode = true;
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(320, 'sawtooth', 0.2);
  };

  btnRow.appendChild(btnLock);
  btnRow.appendChild(btnAttack);
  container.appendChild(btnRow);

  draw();
}

// -------------------------------------------------------------
// 0-4 (p.9): 되짚어보기 1: 약수와 배수 구하기
// -------------------------------------------------------------
function drawCanvas_0_4(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let currentMode = 'div6'; // div6, div13, mul24, mul36

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    if (currentMode === 'div6') {
      // 6 Divisor Grid
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText('🟣 6의 약수 모눈 배열 (1, 2, 3, 6)', w / 2, 40);

      const configs = [
        { r: 1, c: 6, label: '1 × 6' },
        { r: 2, c: 3, label: '2 × 3' },
        { r: 3, c: 2, label: '3 × 2' },
        { r: 6, c: 1, label: '6 × 1' }
      ];

      const startY = 80;
      configs.forEach((cfg, idx) => {
        const cx = (w / 5) * (idx + 1);
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillText(cfg.label, cx, startY);

        const beadR = 10;
        const gap = 24;
        const totalW = (cfg.c - 1) * gap;
        const totalH = (cfg.r - 1) * gap;
        const bx = cx - totalW / 2;
        const by = startY + 25;

        for (let row = 0; row < cfg.r; row++) {
          for (let col = 0; col < cfg.c; col++) {
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.arc(bx + col * gap, by + row * gap, beadR, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });

      ctx.fillStyle = '#059669';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillText('✅ 6은 1, 2, 3, 6으로 직사각형이 깔끔하게 완성됩니다 (나머지 없음)', w / 2, h - 50);

    } else if (currentMode === 'div13') {
      // 13 Divisor Grid
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText('🔴 13의 약수 모눈 배열 (오직 1과 13뿐!)', w / 2, 40);

      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText('1 × 13 (일렬 나열)', w / 2, 90);

      const beadR = 9;
      const gap = 22;
      const startX = w / 2 - (12 * gap) / 2;
      for (let i = 0; i < 13; i++) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(startX + i * gap, 120, beadR, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#64748b';
      ctx.font = '13px Pretendard, sans-serif';
      ctx.fillText('2줄, 3줄, 4줄 등으로 나누면 항상 나머지가 생겨 직사각형을 만들 수 없습니다.', w / 2, 180);

      // Attempt 2x6 + 1
      ctx.fillText('2줄로 배열 시: 2 × 6 + 1 (1개가 남아 직사각형 실패!)', w / 2, 220);
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 6; col++) {
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.arc(w / 2 - (5 * 22) / 2 + col * 22, 245 + row * 22, 8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(w / 2 - (5 * 22) / 2 + 6 * 22, 245, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#b91c1c';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillText('✅ 13의 약수는 오직 1과 13뿐입니다! (소수)', w / 2, h - 50);

    } else if (currentMode === 'mul24') {
      // 24 Multiples Rail
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText('🚆 24의 배수 수직선 레일', w / 2, 40);

      const lineY = h / 2;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(40, lineY);
      ctx.lineTo(w - 40, lineY);
      ctx.stroke();

      const mults = [
        { n: 1, val: 24, x: 0.22 },
        { n: 2, val: 48, x: 0.44 },
        { n: 3, val: 72, x: 0.66 },
        { n: 4, val: 96, x: 0.88 }
      ];

      mults.forEach(m => {
        const mx = 40 + (w - 80) * m.x;
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.arc(mx, lineY, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px Pretendard, sans-serif';
        ctx.fillText(String(m.n), mx, lineY + 4);

        ctx.fillStyle = '#0369a1';
        ctx.font = 'bold 15px Pretendard, sans-serif';
        ctx.fillText(String(m.val), mx, lineY - 22);

        ctx.fillStyle = '#64748b';
        ctx.font = '11px Pretendard, sans-serif';
        ctx.fillText(`24×${m.n}`, mx, lineY + 30);
      });

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillText('24의 배수: 24, 48, 72, 96, ...', w / 2, h - 50);

    } else if (currentMode === 'mul36') {
      // 36 Multiples Rail
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText('🚆 36의 배수 수직선 레일', w / 2, 40);

      const lineY = h / 2;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(40, lineY);
      ctx.lineTo(w - 40, lineY);
      ctx.stroke();

      const mults = [
        { n: 1, val: 36, x: 0.25 },
        { n: 2, val: 72, x: 0.52 },
        { n: 3, val: 108, x: 0.78 }
      ];

      mults.forEach(m => {
        const mx = 40 + (w - 80) * m.x;
        ctx.fillStyle = '#7c3aed';
        ctx.beginPath();
        ctx.arc(mx, lineY, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Pretendard, sans-serif';
        ctx.fillText(String(m.n), mx, lineY + 4);

        ctx.fillStyle = '#5b21b6';
        ctx.font = 'bold 16px Pretendard, sans-serif';
        ctx.fillText(String(m.val), mx, lineY - 24);

        ctx.fillStyle = '#64748b';
        ctx.font = '12px Pretendard, sans-serif';
        ctx.fillText(`36×${m.n}`, mx, lineY + 32);
      });

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillText('36의 배수: 36, 72, 108, 144, ...', w / 2, h - 50);
    }
  }

  // Nav buttons for 0-4
  const tabRow = document.createElement('div');
  tabRow.style.position = 'absolute';
  tabRow.style.top = '10px';
  tabRow.style.right = '10px';
  tabRow.style.display = 'flex';
  tabRow.style.gap = '4px';
  tabRow.style.zIndex = '20';

  const modes = [
    { id: 'div6', label: '6의 약수' },
    { id: 'div13', label: '13의 약수' },
    { id: 'mul24', label: '24의 배수' },
    { id: 'mul36', label: '36의 배수' }
  ];

  modes.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.style.padding = '4px 8px';
    btn.style.fontSize = '0.78rem';
    btn.style.background = (currentMode === m.id) ? '#4f46e5' : '#ffffff';
    btn.style.color = (currentMode === m.id) ? '#ffffff' : '#334155';
    btn.style.border = '1px solid #cbd5e1';
    btn.textContent = m.label;
    btn.onclick = () => {
      currentMode = m.id;
      tabRow.querySelectorAll('button').forEach((b, idx) => {
        b.style.background = (modes[idx].id === m.id) ? '#4f46e5' : '#ffffff';
        b.style.color = (modes[idx].id === m.id) ? '#ffffff' : '#334155';
      });
      draw();
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(500, 'sine', 0.08);
    };
    tabRow.appendChild(btn);
  });

  container.appendChild(tabRow);
  draw();
}

// 0-5 (p.9): 되짚어보기 2: 공약수와 최대공약수
// -------------------------------------------------------------
function drawCanvas_0_5(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let currentPair = 'pair1'; // pair1: (12, 18), pair2: (45, 54)

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const is1 = (currentPair === 'pair1');
    const numA = is1 ? 12 : 45;
    const numB = is1 ? 18 : 54;
    const divA = is1 ? [1, 2, 3, 4, 6, 12] : [1, 3, 5, 9, 15, 45];
    const divB = is1 ? [1, 2, 3, 6, 9, 18] : [1, 2, 3, 6, 9, 18, 27, 54];
    const common = is1 ? [1, 2, 3, 6] : [1, 3, 9];
    const gcd = is1 ? 6 : 9;
    const onlyA = divA.filter(x => !common.includes(x));
    const onlyB = divB.filter(x => !common.includes(x));

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText(`⭕ 벤다이어그램 공약수와 최대공약수 (${numA}, ${numB})`, w / 2, 35);

    // Two overlapping circles
    const cy = h * 0.52;
    const r = Math.min(w, h) * 0.32;
    const cx1 = w / 2 - r * 0.55;
    const cx2 = w / 2 + r * 0.55;

    // Circle A
    ctx.fillStyle = 'rgba(59, 130, 246, 0.12)';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx1, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Circle B
    ctx.fillStyle = 'rgba(236, 72, 153, 0.12)';
    ctx.strokeStyle = '#ec4899';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx2, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#1d4ed8';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText(`${numA}의 약수`, cx1 - 40, cy - r + 24);

    ctx.fillStyle = '#be185d';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText(`${numB}의 약수`, cx2 + 40, cy - r + 24);

    ctx.fillStyle = '#059669';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillText('공약수 (교집합)', w / 2, cy - r + 24);

    // Draw Numbers in Only A
    onlyA.forEach((val, idx) => {
      const angle = Math.PI + (idx - (onlyA.length - 1) / 2) * 0.45;
      const nx = cx1 + Math.cos(angle) * (r * 0.55);
      const ny = cy + Math.sin(angle) * (r * 0.55);
      drawPill(nx, ny, String(val), '#3b82f6');
    });

    // Draw Numbers in Only B
    onlyB.forEach((val, idx) => {
      const angle = (idx - (onlyB.length - 1) / 2) * 0.45;
      const nx = cx2 + Math.cos(angle) * (r * 0.55);
      const ny = cy + Math.sin(angle) * (r * 0.55);
      drawPill(nx, ny, String(val), '#ec4899');
    });

    // Draw Common Numbers in Intersection
    common.forEach((val, idx) => {
      const isGcd = (val === gcd);
      const stepY = (idx - (common.length - 1) / 2) * 36;
      const nx = w / 2;
      const ny = cy + stepY;
      drawPill(nx, ny, String(val), isGcd ? '#d97706' : '#059669', isGcd);
    });

    // Bottom Summary
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText(`공약수: { ${common.join(', ')} }  ➔  최대공약수(GCD): ${gcd}`, w / 2, h - 35);
  }

  function drawPill(x, y, text, color, isHighlight = false) {
    ctx.save();
    if (isHighlight) {
      ctx.shadowColor = 'rgba(217, 119, 6, 0.4)';
      ctx.shadowBlur = 8;
    }
    ctx.fillStyle = isHighlight ? '#fef3c7' : '#ffffff';
    ctx.strokeStyle = color;
    ctx.lineWidth = isHighlight ? 3 : 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = color;
    ctx.font = isHighlight ? 'bold 15px Pretendard, sans-serif' : 'bold 13px Pretendard, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);

    if (isHighlight) {
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillText('👑', x, y - 22);
    }
  }

  // Toggle buttons
  const tabRow = document.createElement('div');
  tabRow.style.position = 'absolute';
  tabRow.style.top = '10px';
  tabRow.style.right = '10px';
  tabRow.style.display = 'flex';
  tabRow.style.gap = '6px';
  tabRow.style.zIndex = '20';

  const b1 = document.createElement('button');
  b1.className = 'btn btn-primary';
  b1.style.padding = '4px 10px';
  b1.style.fontSize = '0.8rem';
  b1.textContent = '⑴ 12와 18';

  const b2 = document.createElement('button');
  b2.className = 'btn';
  b2.style.background = '#ffffff';
  b2.style.border = '1px solid #cbd5e1';
  b2.style.padding = '4px 10px';
  b2.style.fontSize = '0.8rem';
  b2.textContent = '⑵ 45와 54';

  b1.onclick = () => {
    currentPair = 'pair1';
    b1.className = 'btn btn-primary';
    b1.style.background = '#4f46e5';
    b1.style.color = '#ffffff';
    b2.className = 'btn';
    b2.style.background = '#ffffff';
    b2.style.color = '#334155';
    draw();
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(550, 'sine', 0.08);
  };

  b2.onclick = () => {
    currentPair = 'pair2';
    b2.className = 'btn btn-primary';
    b2.style.background = '#4f46e5';
    b2.style.color = '#ffffff';
    b1.className = 'btn';
    b1.style.background = '#ffffff';
    b1.style.color = '#334155';
    draw();
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(600, 'sine', 0.08);
  };

  tabRow.appendChild(b1);
  tabRow.appendChild(b2);
  container.appendChild(tabRow);
  draw();
}

function drawCanvas_0_6(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let currentPair = 'pair1'; // pair1: (4, 6), pair2: (9, 12)
  let isRunning = true;
  let progress = 0;
  let animId = null;

  function draw() {
    if (isRunning) {
      progress += 0.008;
      if (progress > 1) progress = 0;
    }

    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const is1 = (currentPair === 'pair1');
    const stepA = is1 ? 4 : 9;
    const stepB = is1 ? 6 : 12;
    const maxVal = is1 ? 40 : 120;
    const lcm = is1 ? 12 : 36;
    const commonMults = is1 ? [12, 24, 36] : [36, 72, 108];

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText(`🐸 개구리 수직선 점프 레이스 (${stepA}와 ${stepB}의 공배수)`, w / 2, 35);

    // Number line rails
    const railY1 = h * 0.38;
    const railY2 = h * 0.65;
    const startX = 50;
    const endX = w - 50;
    const railLen = endX - startX;

    // Draw rails
    [railY1, railY2].forEach((ry, rIdx) => {
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(startX, ry);
      ctx.lineTo(endX, ry);
      ctx.stroke();

      ctx.fillStyle = rIdx === 0 ? '#3b82f6' : '#f97316';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${rIdx === 0 ? stepA : stepB}의 배수 레일`, startX, ry - 35);
    });

    // Draw Common Multiple Highlight Columns
    commonMults.forEach(cm => {
      const cx = startX + (cm / maxVal) * railLen;
      const isLcm = (cm === lcm);

      // Light column
      ctx.fillStyle = isLcm ? 'rgba(234, 179, 8, 0.15)' : 'rgba(16, 185, 129, 0.12)';
      ctx.fillRect(cx - 16, railY1 - 25, 32, railY2 - railY1 + 50);

      // Dotted line
      ctx.strokeStyle = isLcm ? '#eab308' : '#10b981';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(cx, railY1 - 25);
      ctx.lineTo(cx, railY2 + 25);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.textAlign = 'center';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = isLcm ? '#ca8a04' : '#059669';
      ctx.fillText(isLcm ? `🏆 최소공배수 ${cm}` : `공배수 ${cm}`, cx, railY2 + 42);
    });

    // Frog A (stepA)
    const curValA = progress * maxVal;
    const hopsA = Math.floor(curValA / stepA);
    const hopProgressA = (curValA % stepA) / stepA;
    const hopX1 = startX + ((hopsA * stepA) / maxVal) * railLen;
    const hopX2 = startX + (((hopsA + 1) * stepA) / maxVal) * railLen;
    const curXA = hopX1 + (hopX2 - hopX1) * hopProgressA;
    const jumpH_A = Math.sin(hopProgressA * Math.PI) * 28;
    const curYA = railY1 - jumpH_A;

    // Draw Frog A
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.arc(curXA, curYA, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillText('🐸', curXA, curYA + 4);

    // Frog B (stepB)
    const curValB = progress * maxVal;
    const hopsB = Math.floor(curValB / stepB);
    const hopProgressB = (curValB % stepB) / stepB;
    const hopX1_B = startX + ((hopsB * stepB) / maxVal) * railLen;
    const hopX2_B = startX + (((hopsB + 1) * stepB) / maxVal) * railLen;
    const curXB = hopX1_B + (hopX2_B - hopX1_B) * hopProgressB;
    const jumpH_B = Math.sin(hopProgressB * Math.PI) * 28;
    const curYB = railY2 - jumpH_B;

    // Draw Frog B
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.arc(curXB, curYB, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillText('🐸', curXB, curYB + 4);

    // Current Value Banner
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText(`두 개구리가 동시에 착지하는 위치 = 공배수 { ${commonMults.join(', ')} ... }`, w / 2, h - 25);

    animId = requestAnimationFrame(draw);
  }

  // Toggle buttons
  const tabRow = document.createElement('div');
  tabRow.style.position = 'absolute';
  tabRow.style.top = '10px';
  tabRow.style.right = '10px';
  tabRow.style.display = 'flex';
  tabRow.style.gap = '6px';
  tabRow.style.zIndex = '20';

  const b1 = document.createElement('button');
  b1.className = 'btn btn-primary';
  b1.style.padding = '4px 10px';
  b1.style.fontSize = '0.8rem';
  b1.textContent = '⑴ 4와 6';

  const b2 = document.createElement('button');
  b2.className = 'btn';
  b2.style.background = '#ffffff';
  b2.style.border = '1px solid #cbd5e1';
  b2.style.padding = '4px 10px';
  b2.style.fontSize = '0.8rem';
  b2.textContent = '⑵ 9와 12';

  b1.onclick = () => {
    currentPair = 'pair1';
    progress = 0;
    b1.className = 'btn btn-primary';
    b1.style.background = '#4f46e5';
    b1.style.color = '#ffffff';
    b2.className = 'btn';
    b2.style.background = '#ffffff';
    b2.style.color = '#334155';
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(520, 'sine', 0.08);
  };

  b2.onclick = () => {
    currentPair = 'pair2';
    progress = 0;
    b2.className = 'btn btn-primary';
    b2.style.background = '#4f46e5';
    b2.style.color = '#ffffff';
    b1.className = 'btn';
    b1.style.background = '#ffffff';
    b1.style.color = '#334155';
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(580, 'sine', 0.08);
  };

  tabRow.appendChild(b1);
  tabRow.appendChild(b2);
  container.appendChild(tabRow);

  draw();
}

              <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">공배수 3개 (쉼표 구분):</label>
              <input type="text" id="ans-0-6-2-cm" class="form-control" placeholder="수 입력 (쉼표 구분)" autocomplete="off">
            </div>
            <div>
              <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">최소공배수:</label>
              <input type="text" id="ans-0-6-2-lcm" class="form-control" placeholder="수 입력" autocomplete="off">
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="checkStep_0_6()">정답 확인 및 채점</button>
    </div>
  `;
}

function checkStep_0_6() {
  const cm1 = parseNumList(document.getElementById('ans-0-6-1-cm')?.value);
  const lcm1 = normTxt(document.getElementById('ans-0-6-1-lcm')?.value);
  const cm2 = parseNumList(document.getElementById('ans-0-6-2-cm')?.value);
  const lcm2 = normTxt(document.getElementById('ans-0-6-2-lcm')?.value);

  const ok1 = areListsEqual(cm1, [12, 24, 36]) && (lcm1 === '12');
  const ok2 = areListsEqual(cm2, [36, 72, 108]) && (lcm2 === '36');

  if (ok1 && ok2) {
    completeSubStep('0-6', '🎉 <b>모두 정답입니다!</b> 4와 6의 공배수(12, 24, 36)와 최소공배수(12), 9와 12의 공배수(36, 72, 108)와 최소공배수(36)를 완벽하게 구했습니다.');
  } else {
    let wrong = [];
    if (!ok1) wrong.push('⑴ 4와 6');
    if (!ok2) wrong.push('⑵ 9와 12');
    if (window.SoundFX && window.SoundFX.error) SoundFX.error();
    showFeedback(false, `❌ <b>오답 항목이 있습니다:</b> [${wrong.join(', ')}]<br>공배수 3개와 최소공배수를 다시 확인해 보세요.`);
  }
}


    // Window bindings for Tab 0
