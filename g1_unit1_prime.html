      ctx.restore();
    });

    // 3. 공(수 카드) Lerp 및 렌더링
    numbers.forEach(n => {
      if (!n.isDragging) {
        n.x += (n.targetX - n.x) * 0.22;
        n.y += (n.targetY - n.y) * 0.22;
      }

      const targetScale = n.isDragging ? 1.25 : 1.0;
      n.scale += (targetScale - n.scale) * 0.25;
      const r = n.r * n.scale;

      ctx.save();
      ctx.shadowColor = n.isDragging ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.1)';
      ctx.shadowBlur = n.isDragging ? 12 : 5;
      ctx.shadowOffsetY = n.isDragging ? 6 : 2;

      let fillColor = '#eff6ff';
      let strokeColor = '#3b82f6';
      let textColor = '#1e40af';

      if (n.inBasket === 1) {
        fillColor = '#e0f2fe';
        strokeColor = '#0284c7';
        textColor = '#0369a1';
      } else if (n.inBasket === 2) {
        fillColor = '#e0e7ff';
        strokeColor = '#4f46e5';
        textColor = '#3730a3';
      } else if (n.inBasket === 3) {
        fillColor = '#f3e8ff';
        strokeColor = '#9333ea';
        textColor = '#6b21a8';
      }

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = fillColor;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 2.5;
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.round(14 * n.scale)}px Pretendard, sans-serif`;
      ctx.fillStyle = textColor;
      ctx.fillText(String(n.val), n.x, n.y);

      ctx.restore();
    });

    // 4. 드래그 중인 카드의 힌트 버블 표시
    if (draggedNum) {
      const n = draggedNum;
      const bubbleText = `💡 ${n.val}의 약수: [${n.divs.join(', ')}] (${n.divCount}개)`;
      ctx.save();
      ctx.font = 'bold 12px Pretendard, sans-serif';
      const tw = ctx.measureText(bubbleText).width + 20;
      const th = 28;
      const bx = Math.max(10, Math.min(w - tw - 10, n.x - tw / 2));
      const by = n.y - n.r * n.scale - th - 10;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(bx, by, tw, th, 6);
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.fillRect(bx, by, tw, th);
        ctx.strokeRect(bx, by, tw, th);
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(bubbleText, bx + tw / 2, by + th / 2);
      ctx.restore();
    }

    // 5. 오개념 피드백 배너
    if (feedbackMsg && now < feedbackTimer) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      const tw = ctx.measureText(feedbackMsg).width + 24;
      const bx = (w - tw) / 2;
      const by = h * 0.44;

      ctx.fillStyle = '#fef2f2';
      ctx.strokeStyle = '#fca5a5';
      ctx.lineWidth = 1.5;
      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(bx, by, tw, 30, 8);
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.fillRect(bx, by, tw, 30);
      }
      ctx.fillStyle = '#dc2626';
      ctx.fillText(feedbackMsg, w / 2, by + 15);
      ctx.restore();
    }

    // 6. 전체 완료 축하 배너
    if (celebrationTriggered) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = '#059669';
      ctx.fillText('🎉 12개 자연수를 약수의 개수에 따라 3개 그룹으로 완벽하게 분류했습니다!', w / 2, h * 0.44);
      ctx.restore();
    }

    // 7. 파티클 애니메이션
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.alpha -= p.decay;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  container._animId_1_1 = requestAnimationFrame(animate);
}

        <div style="background:#f8fafc; padding:10px 12px; border-radius:8px; border:1px solid #e2e8f0;">
          <label for="ans-1-1-2" style="font-size:0.84rem; font-weight:700; color:#334155; display:block; margin-bottom:4px;">
            ⑵ 약수가 2개인 수:
          </label>
          <input type="text" id="ans-1-1-2" class="form-control" placeholder="수 입력 (쉼표 구분)" autocomplete="off">
        </div>

        <div style="background:#f8fafc; padding:10px 12px; border-radius:8px; border:1px solid #e2e8f0;">
          <label for="ans-1-1-3" style="font-size:0.84rem; font-weight:700; color:#334155; display:block; margin-bottom:4px;">
            ⑶ 약수가 3개 이상인 수:
          </label>
          <input type="text" id="ans-1-1-3" class="form-control" placeholder="수 입력 (쉼표 구분)" autocomplete="off">
        </div>
      </div>

      <button class="btn btn-primary" onclick="checkStep_1_1()" style="width:100%;">정답 확인 및 채점</button>
    </div>
  `;

  const inputs = box.querySelectorAll('input[type="text"]');
  inputs.forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        checkStep_1_1();
      }
    });
  });
}

function checkStep_1_1() {
  const a1 = parseNumList(document.getElementById('ans-1-1-1')?.value);
  const a2 = parseNumList(document.getElementById('ans-1-1-2')?.value);
  const a3 = parseNumList(document.getElementById('ans-1-1-3')?.value);

  const ok1 = areListsEqual(a1, [1]);
  const ok2 = areListsEqual(a2, [2, 3, 5, 7, 11]);
  const ok3 = areListsEqual(a3, [4, 6, 8, 9, 10, 12]);

  if (ok1 && ok2 && ok3) {
    completeSubStep('1-1', '🎉 <b>정답입니다!</b> 자연수는 약수의 개수에 따라 <b>1</b>, 약수가 2개인 <b>소수</b>, 약수가 3개 이상인 <b>합성수</b>로 완벽하게 분류됩니다.');
    const nextBtn = document.getElementById('btn-next-step');
    if (nextBtn) {
      nextBtn.style.display = 'inline-flex';
    }
  } else {
    let wrong = [];
    if (!ok1) wrong.push('⑴ 약수가 1개인 수');
    if (!ok2) wrong.push('⑵ 약수가 2개인 수');
    if (!ok3) wrong.push('⑶ 약수가 3개 이상인 수');
    if (window.SoundFX && window.SoundFX.error) SoundFX.error();
    showFeedback(false, `❌ <b>오답 항목이 있습니다:</b> [${wrong.join(', ')}]<br>왼쪽 캔버스에서 수를 바구니에 담아 약수의 개수를 확인해 보세요.`);
  }
}

// -------------------------------------------------------------
// 1-2 (p.10): 개념: 소수와 합성수의 뜻
// -------------------------------------------------------------
function drawCanvas_1_2(container) {
  if (container._animId_1_2) {
    cancelAnimationFrame(container._animId_1_2);
    container._animId_1_2 = null;
  }
  container.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.style.position = 'relative';
  wrapper.style.width = '100%';
  wrapper.style.height = '100%';
  wrapper.style.minHeight = '420px';
  wrapper.style.overflow = 'hidden';
  wrapper.style.background = 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)';
  wrapper.style.borderRadius = '12px';
  wrapper.style.userSelect = 'none';
  wrapper.style.webkitUserSelect = 'none';
  container.appendChild(wrapper);

  const canvas = document.createElement('canvas');
  canvas.style.display = 'block';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.touchAction = 'none';
  wrapper.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  let w = 560;
  let h = 460;
  let dpr = window.devicePixelRatio || 1;

  let selectedBranch = 'prime'; // 'one' | 'prime' | 'composite'
  let hoveredBranch = null;
  let showEtymology = false;
  let t = 0;

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    w = rect.width || 560;
    h = rect.height || 460;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();

  // 상단 툴바 UI
  const topBar = document.createElement('div');
  topBar.style.position = 'absolute';
  topBar.style.top = '10px';
  topBar.style.left = '12px';
  topBar.style.right = '12px';
  topBar.style.display = 'flex';
  topBar.style.justifyContent = 'space-between';
  topBar.style.alignItems = 'center';
  topBar.style.pointerEvents = 'none';
  topBar.style.zIndex = '10';

  const titleBadge = document.createElement('div');
  titleBadge.style.display = 'inline-flex';
  titleBadge.style.alignItems = 'center';
  titleBadge.style.gap = '6px';
  titleBadge.style.background = 'rgba(255, 255, 255, 0.92)';
  titleBadge.style.backdropFilter = 'blur(6px)';
  titleBadge.style.padding = '5px 12px';
  titleBadge.style.borderRadius = '20px';
  titleBadge.style.border = '1px solid #cbd5e1';
  titleBadge.style.fontSize = '0.84rem';
  titleBadge.style.fontWeight = '700';
  titleBadge.style.color = '#1e293b';
  titleBadge.innerHTML = '<span>🏛️ <b>자연수의 3대 분류 체계 트리</b></span>';

  const btnGroup = document.createElement('div');
  btnGroup.style.display = 'flex';
  btnGroup.style.gap = '6px';
  btnGroup.style.pointerEvents = 'auto';

  const btnEtym = document.createElement('button');
  btnEtym.className = 'btn';
  btnEtym.style.background = '#ffffff';
  btnEtym.style.border = '1px solid #cbd5e1';
  btnEtym.style.color = '#4338ca';
  btnEtym.style.padding = '5px 10px';
  btnEtym.style.fontSize = '0.8rem';
  btnEtym.style.fontWeight = '700';
  btnEtym.style.borderRadius = '8px';
  btnEtym.textContent = '🌿 소수(素數) vs 소수(小數) 어원 비교';

  btnEtym.onclick = () => {
    showEtymology = !showEtymology;
    btnEtym.style.background = showEtymology ? '#e0e7ff' : '#ffffff';
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(showEtymology ? 550 : 440, 'sine', 0.06);
  };

  const btnReset = document.createElement('button');
  btnReset.className = 'btn';
  btnReset.style.background = '#ffffff';
  btnReset.style.border = '1px solid #cbd5e1';
  btnReset.style.color = '#475569';
  btnReset.style.padding = '5px 10px';
  btnReset.style.fontSize = '0.8rem';
  btnReset.style.fontWeight = '600';
  btnReset.style.borderRadius = '8px';
  btnReset.textContent = '⟲ 트리 리셋';

  btnReset.onclick = () => {
    selectedBranch = 'prime';
    showEtymology = false;
    btnEtym.style.background = '#ffffff';
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(440, 'sine', 0.08);
  };

  btnGroup.appendChild(btnEtym);
  btnGroup.appendChild(btnReset);

  topBar.appendChild(titleBadge);
  topBar.appendChild(btnGroup);
  wrapper.appendChild(topBar);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);

  function getBranchesData() {
    const cardW = Math.min(160, (w - 60) / 3);
    const cardH = 92;
    const branchY = 160;

    return [
      {
        id: 'one',
        title: '자연수 1',
        tag: '약수 1개 (오직 1)',
        note: '소수도 합성수도 아님 ❌',
        color: '#475569',
        border: '#94a3b8',
        bg: '#f8fafc',
        x: w * 0.18,
        y: branchY,
        w: cardW,
        h: cardH
      },
      {
        id: 'prime',
        title: '소수 (Prime)',
        tag: '약수 2개뿐',
        note: '1과 자기 자신만 (2, 3, 5, 7..)',
        color: '#4f46e5',
        border: '#818cf8',
        bg: '#eef2ff',
        x: w * 0.5,
        y: branchY,
        w: cardW,
        h: cardH
      },
      {
        id: 'composite',
        title: '합성수 (Composite)',
        tag: '약수 3개 이상',
        note: '1과 자신 외의 약수 (4, 6, 8..)',
        color: '#059669',
        border: '#34d399',
        bg: '#ecfdf5',
        x: w * 0.82,
        y: branchY,
        w: cardW,
        h: cardH
      }
    ];
  }

  function getCanvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: e.clientX - r.left,
      y: e.clientY - r.top
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    const pos = getCanvasPos(e);

    if (showEtymology) {
      showEtymology = false;
      btnEtym.style.background = '#ffffff';
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(400, 'sine', 0.05);
      return;
    }

    const branches = getBranchesData();
    for (let i = 0; i < branches.length; i++) {
      const b = branches[i];
      if (pos.x >= b.x - b.w / 2 && pos.x <= b.x + b.w / 2 && pos.y >= b.y - b.h / 2 && pos.y <= b.y + b.h / 2) {
        selectedBranch = b.id;
        if (window.SoundFX && window.SoundFX.playTone) {
          SoundFX.playTone(b.id === 'prime' ? 660 : (b.id === 'composite' ? 580 : 480), 'sine', 0.08);
        }
        break;
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pos = getCanvasPos(e);
    const branches = getBranchesData();
    let hit = null;
    for (let i = 0; i < branches.length; i++) {
      const b = branches[i];
      if (pos.x >= b.x - b.w / 2 && pos.x <= b.x + b.w / 2 && pos.y >= b.y - b.h / 2 && pos.y <= b.y + b.h / 2) {
        hit = b.id;
        break;
      }
    }
    hoveredBranch = hit;
    canvas.style.cursor = hit ? 'pointer' : 'default';
  });

  // 60fps 렌더 루프
  function animate() {
    container._animId_1_2 = requestAnimationFrame(animate);
    t += 0.025;

    ctx.clearRect(0, 0, w, h);

    // 1. 배경 미세 격자
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    const step = 40;
    for (let x = 0; x < w; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // 2. 루트 노드 (자연수)
    const rootX = w / 2;
    const rootY = 62;
    const rootW = 160;
    const rootH = 38;

    ctx.save();
    ctx.shadowColor = 'rgba(15, 23, 42, 0.15)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(rootX - rootW / 2, rootY - rootH / 2, rootW, rootH, 10);
    else ctx.rect(rootX - rootW / 2, rootY - rootH / 2, rootW, rootH);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText('자연수 (Natural Numbers)', rootX, rootY);
    ctx.restore();

    // 3. 가지선(Branch Connecting Lines)
    const branches = getBranchesData();
    branches.forEach(b => {
      const isSelected = (selectedBranch === b.id);
      ctx.save();
      ctx.strokeStyle = isSelected ? b.color : '#cbd5e1';
      ctx.lineWidth = isSelected ? 3 : 2;
      ctx.beginPath();
      ctx.moveTo(rootX, rootY + rootH / 2);
      ctx.bezierCurveTo(rootX, rootY + 50, b.x, b.y - 60, b.x, b.y - b.h / 2);
      ctx.stroke();
      ctx.restore();
    });

    // 4. 브랜치 카드 드로잉
    branches.forEach(b => {
      const isSelected = (selectedBranch === b.id);
      const isHovered = (hoveredBranch === b.id);

      ctx.save();
      if (isSelected) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 3);
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10 + pulse * 6;
      } else if (isHovered) {
        ctx.shadowColor = 'rgba(0,0,0,0.12)';
        ctx.shadowBlur = 6;
      }

      ctx.fillStyle = b.bg;
      ctx.strokeStyle = isSelected ? b.color : (isHovered ? b.border : '#cbd5e1');
      ctx.lineWidth = isSelected ? 2.5 : 1.5;

      const bx = b.x - b.w / 2;
      const by = b.y - b.h / 2;

      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, b.w, b.h, 12);
      else ctx.rect(bx, by, b.w, b.h);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = b.color;
      ctx.fillText(b.title, b.x, b.y - 20);

      ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText(b.tag, b.x, b.y + 4);

      ctx.font = '10px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(b.note, b.x, b.y + 26);

      if (isSelected) {
        ctx.font = 'bold 10px Pretendard, sans-serif';
        ctx.fillStyle = b.color;
        ctx.fillText('▼ 상세 보기 선택됨', b.x, b.y + b.h / 2 + 12);
      }
      ctx.restore();
    });

    // 5. 선택된 브랜치 인터랙티브 상세 디테일 박스
    const detailY = 245;
    const detailH = 125;
    const detailW = w - 40;
    const detailX = 20;

    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(0,0,0,0.06)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;

    if (ctx.roundRect) ctx.roundRect(detailX, detailY, detailW, detailH, 12);
    else ctx.rect(detailX, detailY, detailW, detailH);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.save();
    if (selectedBranch === 'one') {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#334155';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText('🔍 [자연수 1의 특별한 성질]', detailX + 16, detailY + 22);

      ctx.font = '12px Pretendard, sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText('• 1의 약수: { 1 } ➔ 약수가 오직 1개뿐입니다.', detailX + 16, detailY + 46);
      ctx.fillText('• 소수(약수 2개)도 아니고, 합성수(약수 3개 이상)도 아닙니다.', detailX + 16, detailY + 68);

      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillText('⚠️ 시험 단골 함정: "1은 가장 작은 소수이다"는 완전히 틀린 거짓 명제입니다!', detailX + 16, detailY + 95);
    } else if (selectedBranch === 'prime') {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#4338ca';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText('🔍 [소수(Prime Numbers)의 핵심 개념과 특징]', detailX + 16, detailY + 22);

      ctx.font = '12px Pretendard, sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText('• 정의: 1보다 큰 자연수 중 1과 자기 자신만을 약수로 가지는 수 (약수 정확히 2개)', detailX + 16, detailY + 46);
      ctx.fillText('• 소수 예시: 2 (1×2), 3 (1×3), 5 (1×5), 7 (1×7), 11 (1×11), 13 (1×13)...', detailX + 16, detailY + 68);

      ctx.fillStyle = '#b45309';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillText('👑 핵심 팁: 2는 짝수 중 유일한 소수이며, 가장 작은 소수입니다! (다른 짝수는 모두 2의 배수 ➔ 합성수)', detailX + 16, detailY + 95);
    } else {
      ctx.textAlign = 'left';
      ctx.fillStyle = '#065f46';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText('🔍 [합성수(Composite Numbers)의 핵심 개념과 특징]', detailX + 16, detailY + 22);

      ctx.font = '12px Pretendard, sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText('• 정의: 1보다 큰 자연수 중 1과 자기 자신 이외의 수를 약수로 가지는 수 (약수 3개 이상)', detailX + 16, detailY + 46);
      ctx.fillText('• 합성수 예시: 4 (1, 2, 4), 6 (1, 2, 3, 6), 8 (1, 2, 4, 8), 9 (1, 3, 9)...', detailX + 16, detailY + 68);

      ctx.fillStyle = '#047857';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillText('💡 어원: 합성(合成)은 둘 이상의 소수가 곱셈으로 결합되어 이루어진 수라는 뜻입니다.', detailX + 16, detailY + 95);
    }
    ctx.restore();

    // 6. 하단 강조 주의 배너
    const noteY = h - 38;
    ctx.save();
    ctx.fillStyle = '#fffbeb';
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(20, noteY - 16, w - 40, 32, 8);
    else ctx.rect(20, noteY - 16, w - 40, 32);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillStyle = '#b45309';
    ctx.fillText('⚠️ 핵심 주의: 1은 약수가 1개뿐이므로 소수도 아니고 합성수도 아닙니다!', w / 2, noteY);
    ctx.restore();

    // 7. 한자/어원 비교 오버레이 팝업 모달
    if (showEtymology) {
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
      ctx.fillRect(0, 0, w, h);

      const mw = Math.min(480, w - 40);
      const mh = 250;
      const mx = (w - mw) / 2;
      const my = (h - mh) / 2;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 18;
      if (ctx.roundRect) ctx.roundRect(mx, my, mw, mh, 16);
      else ctx.rect(mx, my, mw, mh);
      ctx.fill();
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillText('🌿 [수학 상식] 소수(素數) vs 소수(小數) 한자/어원 비교', w / 2, my + 16);

      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(mx + 20, my + 44);
      ctx.lineTo(mx + mw - 20, my + 44);
      ctx.stroke();

      const colW = (mw - 50) / 2;

      const lx = mx + 20;
      ctx.fillStyle = '#eef2ff';
      if (ctx.roundRect) ctx.roundRect(lx, my + 54, colW, 140, 10);
      else ctx.fillRect(lx, my + 54, colW, 140);

      ctx.textAlign = 'left';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = '#4338ca';
      ctx.fillText('1. 소수 (素數, Prime)', lx + 12, my + 66);

      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText('• 素: 본디 소 (바탕, 원소)', lx + 12, my + 88);
      ctx.fillText('• 數: 셈 수 (숫자)', lx + 12, my + 106);
      ctx.fillStyle = '#475569';
      ctx.fillText('• 의미: 모든 자연수를 만드는', lx + 12, my + 130);
      ctx.fillText('  가장 근본적인 "원소"가 되는 수', lx + 12, my + 146);
      ctx.fillText('• 예: 2, 3, 5, 7, 11...', lx + 12, my + 168);

      const rx = mx + 30 + colW;
      ctx.fillStyle = '#f8fafc';
      if (ctx.roundRect) ctx.roundRect(rx, my + 54, colW, 140, 10);
      else ctx.fillRect(rx, my + 54, colW, 140);

      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = '#0284c7';
      ctx.fillText('2. 소수 (小數, Decimal)', rx + 12, my + 66);

      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#334155';

      ctx.fillText('• 數: 셈 수 (숫자)', rx + 12, my + 106);
      ctx.fillStyle = '#475569';
      ctx.fillText('• 의미: 1보다 작은 자리의 값을', rx + 12, my + 130);
      ctx.fillText('  나타내는 "작은 수"', rx + 12, my + 146);
      ctx.fillText('• 예: 0.1, 0.5, 3.14...', rx + 12, my + 168);

      ctx.textAlign = 'center';
      ctx.font = '11px Pretendard, sans-serif';

      ctx.fillText('(화면 아무 곳이나 클릭하면 닫힙니다)', w / 2, my + mh - 22);

  }

  container._animId_1_2 = requestAnimationFrame(animate);
}

// 1-3 (p.11): 문제 1: 소수와 합성수 구분하기

function drawCanvas_1_3(container) {
  if (container._animId_1_3) {
    cancelAnimationFrame(container._animId_1_3);
    container._animId_1_3 = null;
  }
  container.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.style.position = 'relative';
  wrapper.style.width = '100%';
  wrapper.style.height = '100%';
  wrapper.style.minHeight = '450px';
  wrapper.style.overflow = 'hidden';
  wrapper.style.background = 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)';
  wrapper.style.borderRadius = '12px';
  wrapper.style.userSelect = 'none';
  wrapper.style.webkitUserSelect = 'none';
  container.appendChild(wrapper);

  const canvas = document.createElement('canvas');
  canvas.style.display = 'block';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.touchAction = 'none';
  wrapper.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  let w = 560;
  let h = 460;
  let dpr = window.devicePixelRatio || 1;

  // 상단 툴바 UI
  const topBar = document.createElement('div');
  topBar.style.position = 'absolute';
  topBar.style.top = '10px';
  topBar.style.left = '12px';
  topBar.style.right = '12px';
  topBar.style.display = 'flex';
  topBar.style.justifyContent = 'space-between';
  topBar.style.alignItems = 'center';
  topBar.style.zIndex = '10';
  wrapper.appendChild(topBar);

  const titleBadge = document.createElement('div');
  titleBadge.style.display = 'inline-flex';
  titleBadge.style.alignItems = 'center';
  titleBadge.style.gap = '6px';
  titleBadge.style.background = 'rgba(255, 255, 255, 0.94)';
  titleBadge.style.padding = '6px 14px';
  titleBadge.style.borderRadius = '20px';
  titleBadge.style.boxShadow = '0 2px 6px rgba(0, 0, 0, 0.05)';
  titleBadge.style.fontSize = '12px';
  titleBadge.style.fontWeight = '700';
  titleBadge.style.color = '#334155';
  titleBadge.innerHTML = '🔖 <b>[문제 1]</b> 각 카드의 약수를 확인하고 [소수] 또는 [합성수] 도장을 찍어보세요!';
  topBar.appendChild(titleBadge);

  const resetBtn = document.createElement('button');
  resetBtn.style.padding = '6px 12px';
  resetBtn.style.fontSize = '12px';
  resetBtn.style.fontWeight = '600';
  resetBtn.style.color = '#475569';
  resetBtn.style.background = '#ffffff';
  resetBtn.style.border = '1px solid #cbd5e1';
  resetBtn.style.borderRadius = '8px';
  resetBtn.style.cursor = 'pointer';
  resetBtn.style.boxShadow = '0 1px 3px rgba(0, 0, 0, 0.05)';
  resetBtn.style.transition = 'all 0.15s ease';
  resetBtn.innerHTML = '⟲ 도장 초기화';
  resetBtn.onmouseenter = () => { resetBtn.style.background = '#f1f5f9'; };
  resetBtn.onmouseleave = () => { resetBtn.style.background = '#ffffff'; };
  topBar.appendChild(resetBtn);

  // 안내 토스트 바
  let toastMessage = '';
  let toastTimer = 0;
  function showToast(msg) {
    toastMessage = msg;
    toastTimer = 180;
  }

  // 카드 데이터 (교과서 p.11 문제 1: 13, 15, 20, 23, 29)
  const items = [
    { num: 13, divs: [1, 13], isPrime: true, stamp: null, stampScale: 1, stampAngle: -0.14, shake: 0, hover: false },
    { num: 15, divs: [1, 3, 5, 15], isPrime: false, stamp: null, stampScale: 1, stampAngle: 0.12, shake: 0, hover: false },
    { num: 20, divs: [1, 2, 4, 5, 10, 20], isPrime: false, stamp: null, stampScale: 1, stampAngle: -0.16, shake: 0, hover: false },
    { num: 23, divs: [1, 23], isPrime: true, stamp: null, stampScale: 1, stampAngle: 0.14, shake: 0, hover: false },
    { num: 29, divs: [1, 29], isPrime: true, stamp: null, stampScale: 1, stampAngle: -0.12, shake: 0, hover: false }
  ];

  // 축하 파티클
  let particles = [];
  let allCelebrated = false;

  function createConfetti() {
    particles = [];
    const colors = ['#4f46e5', '#059669', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6', '#ef4444'];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: w / 2 + (Math.random() - 0.5) * 180,
        y: h / 2,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 12 - 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 7 + 4,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        life: 1.0,
        decay: Math.random() * 0.008 + 0.006
      });
    }
  }

  resetBtn.onclick = () => {
    items.forEach(item => {
      item.stamp = null;
      item.stampScale = 1;
      item.shake = 0;
    });
    particles = [];
    allCelebrated = false;
    showToast('⟲ 도장이 모두 초기화되었습니다.');
    if (window.SoundFX && window.SoundFX.click) SoundFX.click();
  };

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    w = rect.width || 560;
    h = rect.height || 460;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();

  // 날인 함수
  function stampCard(item, chosenType) {
    const isCorrect = (chosenType === '소수' && item.isPrime) || (chosenType === '합성수' && !item.isPrime);
    if (isCorrect) {
      item.stamp = chosenType;
      item.stampScale = 2.4;
      if (window.SoundFX && window.SoundFX.playTone) {
        SoundFX.playTone(chosenType === '소수' ? 700 : 540, 'sine', 0.14);
      }
      showToast(`✨ [${item.num}] 판별 완료! ${chosenType} 도장이 날인되었습니다.`);

      // 5개 모두 판별 완료 확인
      const allDone = items.every(it => it.stamp !== null);
      if (allDone && !allCelebrated) {
        allCelebrated = true;
        createConfetti();
        if (window.SoundFX && window.SoundFX.success) SoundFX.success();
        showToast('🎉 5개 수의 소수·합성수 도장 날인을 모두 완료했습니다! 아래에 정답을 적어보세요.');
      }
    } else {
      item.shake = 1.0;
      if (window.SoundFX && window.SoundFX.error) SoundFX.error();
      const divStr = item.divs.join(', ');
      if (item.isPrime) {
        showToast(`⚠️ [${item.num}]의 약수는 ${divStr} (${item.divs.length}개)뿐이므로 소수입니다!`);
      } else {
        showToast(`⚠️ [${item.num}]의 약수는 ${divStr} (${item.divs.length}개)로 3개 이상이므로 합성수입니다!`);
      }
    }
  }

  // 포인터 좌표 및 레이아웃 계산
  let pointerX = -1;
  let pointerY = -1;

  function getCardLayout() {
    const cardCount = items.length;
    const padX = 14;
    const availW = w - padX * 2;
    const cardW = Math.min(96, Math.max(76, (availW - (cardCount - 1) * 8) / cardCount));
    const cardH = 172;
    const totalW = cardCount * cardW + (cardCount - 1) * 8;
    const startX = (w - totalW) / 2;
    const startY = 52;

    return items.map((item, idx) => {
      const cx = startX + idx * (cardW + 8);
      const cy = startY;
      const btnW = (cardW - 12) / 2;
      const btnH = 26;
      const btnY = cy + cardH - 32;
      const primeBtn = { x: cx + 4, y: btnY, w: btnW, h: btnH };
      const compBtn = { x: cx + 8 + btnW, y: btnY, w: btnW, h: btnH };

      return {
        item,
        idx,
        cx,
        cy,
        cardW,
        cardH,
        primeBtn,
        compBtn
      };
    });
  }

  function handlePointer(e, type) {
    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;
    pointerY = e.clientY - rect.top;

    if (type === 'move') {
      const layouts = getCardLayout();
      let anyHover = false;
      layouts.forEach(l => {
        const inCard = (pointerX >= l.cx && pointerX <= l.cx + l.cardW && pointerY >= l.cy && pointerY <= l.cy + l.cardH);
        l.item.hover = inCard;
        if (inCard) anyHover = true;
      });
      canvas.style.cursor = anyHover ? 'pointer' : 'default';
    } else if (type === 'down') {
      const layouts = getCardLayout();
      layouts.forEach(l => {
        // 소수 도장 버튼 클릭
        if (pointerX >= l.primeBtn.x && pointerX <= l.primeBtn.x + l.primeBtn.w &&
            pointerY >= l.primeBtn.y && pointerY <= l.primeBtn.y + l.primeBtn.h) {
          stampCard(l.item, '소수');
          return;
        }
        // 합성수 도장 버튼 클릭
        if (pointerX >= l.compBtn.x && pointerX <= l.compBtn.x + l.compBtn.w &&
            pointerY >= l.compBtn.y && pointerY <= l.compBtn.y + l.compBtn.h) {
          stampCard(l.item, '합성수');
          return;
        }
        // 카드 본체 클릭 시 올바른 도장 날인
        if (pointerX >= l.cx && pointerX <= l.cx + l.cardW &&
            pointerY >= l.cy && pointerY <= l.cy + l.cardH) {
          stampCard(l.item, l.item.isPrime ? '소수' : '합성수');
        }
      });
    }
  }

  canvas.addEventListener('pointermove', (e) => handlePointer(e, 'move'));
  canvas.addEventListener('pointerdown', (e) => handlePointer(e, 'down'));
  canvas.addEventListener('pointerleave', () => {
    pointerX = -1;
    pointerY = -1;
    items.forEach(it => it.hover = false);
  });

  // 애니메이션 루프
  function animate() {
    ctx.clearRect(0, 0, w, h);

    const layouts = getCardLayout();

    // 1. 카드 렌더링
    layouts.forEach(l => {
      const { item, cx, cy, cardW, cardH, primeBtn, compBtn } = l;

      // 쉐이크 오프셋
      let ox = 0;
      if (item.shake > 0) {
        ox = Math.sin(item.shake * Math.PI * 8) * 6 * item.shake;
        item.shake -= 0.04;
        if (item.shake < 0) item.shake = 0;
      }

      // 스탬프 스케일 이징
      if (item.stampScale > 1.0) {
        item.stampScale += (1.0 - item.stampScale) * 0.22;
        if (item.stampScale < 1.01) item.stampScale = 1.0;
      }

      const drawX = cx + ox;
      const drawY = cy;

      // 카드 배경 그림자
      ctx.save();
      ctx.shadowColor = item.hover ? 'rgba(99, 102, 241, 0.22)' : 'rgba(0, 0, 0, 0.05)';
      ctx.shadowBlur = item.hover ? 12 : 6;
      ctx.shadowOffsetY = item.hover ? 4 : 2;

      // 카드 본체
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = item.stamp === '소수' ? '#818cf8' : (item.stamp === '합성수' ? '#34d399' : (item.hover ? '#94a3b8' : '#e2e8f0'));
      ctx.lineWidth = item.stamp ? 2.5 : 1.5;

      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(drawX, drawY, cardW, cardH, 12);
      } else {
        ctx.rect(drawX, drawY, cardW, cardH);
      }
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 수 표시 헤더 영역
      ctx.fillStyle = item.stamp === '소수' ? 'rgba(99, 102, 241, 0.08)' : (item.stamp === '합성수' ? 'rgba(16, 185, 129, 0.08)' : '#f8fafc');
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(drawX + 4, drawY + 4, cardW - 8, 42, [8, 8, 4, 4]);
      } else {
        ctx.rect(drawX + 4, drawY + 4, cardW - 8, 42);
      }
      ctx.fill();

      // 수 숫자
      ctx.textAlign = 'center';
      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 22px Pretendard, sans-serif';
      ctx.fillText(String(item.num), drawX + cardW / 2, drawY + 32);

      // 약수 정보 박스
      ctx.fillStyle = '#64748b';
      ctx.font = '10px Pretendard, sans-serif';
      ctx.fillText(`약수 (${item.divs.length}개)`, drawX + cardW / 2, drawY + 62);

      // 약수 목록
      ctx.fillStyle = '#334155';
      const divStr = item.divs.join(', ');
      ctx.font = (divStr.length > 10) ? 'bold 10px Pretendard, sans-serif' : 'bold 11px Pretendard, sans-serif';
      ctx.fillText(divStr, drawX + cardW / 2, drawY + 78);

      // 약수 개수 판별 힌트 배지
      ctx.fillStyle = item.divs.length === 2 ? '#eef2ff' : '#ecfdf5';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(drawX + 8, drawY + 88, cardW - 16, 18, 9);
      } else {
        ctx.rect(drawX + 8, drawY + 88, cardW - 16, 18);
      }
      ctx.fill();
      ctx.fillStyle = item.divs.length === 2 ? '#4338ca' : '#047857';
      ctx.font = 'bold 9.5px Pretendard, sans-serif';
      ctx.fillText(item.divs.length === 2 ? '약수 2개' : `약수 ${item.divs.length}개`, drawX + cardW / 2, drawY + 100);

      // 도장 날인 스탬프 표시 (중앙에 쾅!)
      if (item.stamp) {
        ctx.save();
        ctx.translate(drawX + cardW / 2, drawY + 70);
        ctx.rotate(item.stampAngle);
        ctx.scale(item.stampScale, item.stampScale);

        const isPrimeStamp = (item.stamp === '소수');
        const stampColor = isPrimeStamp ? '#4f46e5' : '#059669';

        ctx.strokeStyle = stampColor;
        ctx.lineWidth = 2.5;
        ctx.fillStyle = isPrimeStamp ? 'rgba(79, 70, 229, 0.12)' : 'rgba(5, 150, 105, 0.12)';

        const sw = 56;
        const sh = 28;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(-sw / 2, -sh / 2, sw, sh, 6);
        } else {
          ctx.rect(-sw / 2, -sh / 2, sw, sh);
        }
        ctx.fill();
        ctx.stroke();

        ctx.lineWidth = 1;
        ctx.strokeRect(-sw / 2 + 2.5, -sh / 2 + 2.5, sw - 5, sh - 5);

        ctx.fillStyle = stampColor;
        ctx.font = '900 13px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.stamp, 0, 0);

        ctx.restore();
      }

      // 하단 도장 날인 버튼 2개
      // [소수] 버튼
      ctx.save();
      const inPrimeBtn = (pointerX >= primeBtn.x && pointerX <= primeBtn.x + primeBtn.w && pointerY >= primeBtn.y && pointerY <= primeBtn.y + primeBtn.h);
      ctx.fillStyle = item.stamp === '소수' ? '#4f46e5' : (inPrimeBtn ? '#e0e7ff' : '#f1f5f9');
      ctx.strokeStyle = '#c7d2fe';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(primeBtn.x, primeBtn.y, primeBtn.w, primeBtn.h, 6);
      } else {
        ctx.rect(primeBtn.x, primeBtn.y, primeBtn.w, primeBtn.h);
      }
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = item.stamp === '소수' ? '#ffffff' : '#4338ca';
      ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('소수', primeBtn.x + primeBtn.w / 2, primeBtn.y + primeBtn.h / 2);
      ctx.restore();

      // [합성수] 버튼
      ctx.save();
      const inCompBtn = (pointerX >= compBtn.x && pointerX <= compBtn.x + compBtn.w && pointerY >= compBtn.y && pointerY <= compBtn.y + compBtn.h);
      ctx.fillStyle = item.stamp === '합성수' ? '#059669' : (inCompBtn ? '#d1fae5' : '#f1f5f9');
      ctx.strokeStyle = '#a7f3d0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(compBtn.x, compBtn.y, compBtn.w, compBtn.h, 6);
      } else {
        ctx.rect(compBtn.x, compBtn.y, compBtn.w, compBtn.h);
      }
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = item.stamp === '합성수' ? '#ffffff' : '#065f46';
      ctx.font = 'bold 10.5px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('합성수', compBtn.x + compBtn.w / 2, compBtn.y + compBtn.h / 2);
      ctx.restore();
    });

    // 2. 하단 실시간 분류 트레이 (Zero-Spoiler: 날인된 카드만 실시간 누적 집계)
    const trayY = 240;
    const trayH = 150;
    const pad = 14;
    const trayW = (w - pad * 3) / 2;

    // 소수 트레이 (좌측)
    const primeTrayX = pad;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#c7d2fe';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(primeTrayX, trayY, trayW, trayH, 12);
    } else {
      ctx.rect(primeTrayX, trayY, trayW, trayH);
    }
    ctx.fill();
    ctx.stroke();

    // 소수 트레이 헤더
    ctx.fillStyle = 'rgba(79, 70, 229, 0.08)';
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(primeTrayX + 2, trayY + 2, trayW - 4, 32, [10, 10, 0, 0]);
    } else {
      ctx.rect(primeTrayX + 2, trayY + 2, trayW - 4, 32);
    }
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#4338ca';
    ctx.font = 'bold 12.5px Pretendard, sans-serif';
    ctx.fillText('🔴 소수 분류함 (약수 2개)', primeTrayX + 12, trayY + 18);

    // 날인된 소수 목록
    const stampedPrimes = items.filter(it => it.stamp === '소수');
    if (stampedPrimes.length === 0) {
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('카드에 [소수] 도장을 찍으면', primeTrayX + trayW / 2, trayY + 70);
      ctx.fillText('이곳에 수가 모입니다.', primeTrayX + trayW / 2, trayY + 90);
    } else {
      let chipX = primeTrayX + 14;
      let chipY = trayY + 52;
      stampedPrimes.forEach(p => {
        ctx.fillStyle = '#4f46e5';
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(chipX, chipY, 44, 28, 8);
        } else {
          ctx.rect(chipX, chipY, 44, 28);
        }
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(p.num), chipX + 22, chipY + 14);

        chipX += 50;
      });

      ctx.fillStyle = '#64748b';
      ctx.font = '11px Pretendard, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`현재 ${stampedPrimes.length}개 소수 수집 완료`, primeTrayX + 14, trayY + 104);
      ctx.fillStyle = '#4338ca';
      ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillText('1과 자기 자신만을 약수로 가지는 수', primeTrayX + 14, trayY + 124);
    }
    ctx.restore();

    // 합성수 트레이 (우측)
    const compTrayX = pad * 2 + trayW;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#a7f3d0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(compTrayX, trayY, trayW, trayH, 12);
    } else {
      ctx.rect(compTrayX, trayY, trayW, trayH);
    }
    ctx.fill();
    ctx.stroke();

    // 합성수 트레이 헤더
    ctx.fillStyle = 'rgba(5, 150, 105, 0.08)';
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(compTrayX + 2, trayY + 2, trayW - 4, 32, [10, 10, 0, 0]);
    } else {
      ctx.rect(compTrayX + 2, trayY + 2, trayW - 4, 32);
    }
    ctx.fill();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#065f46';
    ctx.font = 'bold 12.5px Pretendard, sans-serif';
    ctx.fillText('🟢 합성수 분류함 (약수 3개 이상)', compTrayX + 12, trayY + 18);

    // 날인된 합성수 목록
    const stampedComps = items.filter(it => it.stamp === '합성수');
    if (stampedComps.length === 0) {
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('카드에 [합성수] 도장을 찍으면', compTrayX + trayW / 2, trayY + 70);
      ctx.fillText('이곳에 수가 모입니다.', compTrayX + trayW / 2, trayY + 90);
    } else {
      let chipX = compTrayX + 14;
      let chipY = trayY + 52;
      stampedComps.forEach(c => {
        ctx.fillStyle = '#059669';
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(chipX, chipY, 44, 28, 8);
        } else {
          ctx.rect(chipX, chipY, 44, 28);
        }
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(c.num), chipX + 22, chipY + 14);

        chipX += 50;
      });

      ctx.fillStyle = '#64748b';
      ctx.font = '11px Pretendard, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`현재 ${stampedComps.length}개 합성수 수집 완료`, compTrayX + 14, trayY + 104);
      ctx.fillStyle = '#059669';
      ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillText('1과 자기 자신 이외의 약수를 가짐', compTrayX + 14, trayY + 124);
    }
    ctx.restore();

    // 3. 토스트 메시지 렌더링
    if (toastTimer > 0) {
      toastTimer--;
      const alpha = Math.min(1.0, toastTimer / 20);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      const toastW = Math.min(w - 30, ctx.measureText(toastMessage).width + 48);
      const toastH = 34;
      const toastX = (w - toastW) / 2;
      const toastY = trayY - 40;

      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(toastX, toastY, toastW, toastH, 17);
      } else {
        ctx.rect(toastX, toastY, toastW, toastH);
      }
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(toastMessage, w / 2, toastY + toastH / 2);
      ctx.restore();
    }

    // 4. 축하 파티클 렌더링
    if (particles.length > 0) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > h + 20) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }

    container._animId_1_3 = requestAnimationFrame(animate);
  }

  container._animId_1_3 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

  rightActions.style.gap = '6px';
  topBar.appendChild(rightActions);

  // 1~100 / 1~50 토글 버튼
  const toggleBtn = document.createElement('button');
  toggleBtn.style.padding = '5px 10px';
  toggleBtn.style.fontSize = '11px';
  toggleBtn.style.fontWeight = '700';

  toggleBtn.onclick = () => {

  resetBtn.style.cursor = 'pointer';
  resetBtn.innerHTML = '⟲ 체 리셋';
  resetBtn.onclick = () => {
    applyStep('reset');
  };
  rightActions.appendChild(resetBtn);

  // 하단 컨트롤 바 (단계별 소거 버튼)
  const bottomBar = document.createElement('div');
  bottomBar.style.position = 'absolute';
  bottomBar.style.bottom = '10px';
  bottomBar.style.left = '8px';
  bottomBar.style.right = '8px';
  bottomBar.style.display = 'flex';
  bottomBar.style.justifyContent = 'center';
  bottomBar.style.flexWrap = 'wrap';
  bottomBar.style.gap = '6px';
  bottomBar.style.zIndex = '10';
  wrapper.appendChild(bottomBar);

  const stepsConfig = [
    { label: '➊ 1 지우기', step: 1, color: '#64748b', bg: '#ffffff' },
    { label: '➋ 2 남기고 배수 소거', step: 2, color: '#dc2626', bg: '#fef2f2' },
    { label: '➌ 3 남기고 배수 소거', step: 3, color: '#d97706', bg: '#fffbeb' },
    { label: '➍ 5 남기고 배수 소거', step: 5, color: '#059669', bg: '#ecfdf5' },
    { label: '➎ 7 남기고 배수 소거', step: 7, color: '#2563eb', bg: '#eff6ff' },
    { label: '🚀 자동 완성', step: 'all', color: '#ffffff', bg: '#4f46e5', primary: true }
  ];

  stepsConfig.forEach(cfg => {
    const btn = document.createElement('button');
    btn.style.padding = '6px 10px';
    btn.style.fontSize = '11.5px';
    btn.style.fontWeight = '700';
    btn.style.color = cfg.color;
    btn.style.background = cfg.bg;
    btn.style.border = cfg.primary ? 'none' : `1px solid ${cfg.color}44`;
    btn.style.borderRadius = '8px';
    btn.style.cursor = 'pointer';
    btn.style.boxShadow = '0 1px 3px rgba(0, 0, 0, 0.05)';
    btn.style.transition = 'all 0.15s ease';
    btn.innerHTML = cfg.label;
    btn.onmouseenter = () => {
      btn.style.transform = 'translateY(-1px)';
      btn.style.boxShadow = '0 3px 6px rgba(0, 0, 0, 0.1)';
    };
    btn.onmouseleave = () => {
      btn.style.transform = 'none';
      btn.style.boxShadow = '0 1px 3px rgba(0, 0, 0, 0.05)';
    };
    btn.onclick = () => {
      applyStep(cfg.step);
    };
    bottomBar.appendChild(btn);
  });

  // 안내 토스트 바
  let toastMessage = '';
  let toastTimer = 0;
  function showToast(msg) {
    toastMessage = msg;
    toastTimer = 180;
  }

  // 축하 파티클
  let particles = [];
  let allCompleted = false;

  function createConfetti() {
    particles = [];
    const colors = ['#f59e0b', '#fbbf24', '#4f46e5', '#10b981', '#ec4899', '#3b82f6'];
    for (let i = 0; i < 70; i++) {
      particles.push({
        x: w / 2 + (Math.random() - 0.5) * 260,
        y: h / 2 - 50,
        vx: (Math.random() - 0.5) * 14,
        vy: -Math.random() * 12 - 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 8 + 4,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        life: 1.0,
        decay: Math.random() * 0.008 + 0.005
      });
    }
  }

  function applyStep(step) {
    if (step === 1) {
      cells[0].state = 'crossed';
      cells[0].shake = 0.8;
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(380, 'sine', 0.1);
      showToast('➊ 1은 약수가 1개뿐이므로 지웁니다.');
    } else if (step === 2) {
      cells[1].state = 'prime';
      for (let i = 4; i <= maxNum; i += 2) {
        cells[i - 1].state = 'crossed';
      }
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(460, 'sine', 0.1);
      showToast('➋ 2는 소수로 남기고 2의 배수를 모두 지웠습니다.');
    } else if (step === 3) {
      cells[2].state = 'prime';
      for (let i = 6; i <= maxNum; i += 3) {
        cells[i - 1].state = 'crossed';
      }
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(520, 'sine', 0.1);
      showToast('➌ 3은 소수로 남기고 3의 배수를 모두 지웠습니다.');
    } else if (step === 5) {
      cells[4].state = 'prime';
      for (let i = 10; i <= maxNum; i += 5) {
        cells[i - 1].state = 'crossed';
      }
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(580, 'sine', 0.1);
      showToast('➍ 5는 소수로 남기고 5의 배수를 모두 지웠습니다.');
    } else if (step === 7) {
      cells[6].state = 'prime';
      for (let i = 14; i <= maxNum; i += 7) {
        cells[i - 1].state = 'crossed';
      }
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(660, 'sine', 0.1);
      showToast('➎ 7은 소수로 남기고 7의 배수를 모두 지웠습니다.');
    } else if (step === 'all') {
      applyStep(1);
      applyStep(2);
      applyStep(3);
      applyStep(5);
      applyStep(7);
      cells.forEach(c => {
        if (c.state === 'normal') {
          c.state = 'prime';
          c.glow = 1.0;
        }
      });
      const pCount = cells.filter(c => c.state === 'prime').length;
      allCompleted = true;
      createConfetti();
      if (window.SoundFX && window.SoundFX.success) SoundFX.success();
      showToast(`🎉 1부터 ${maxNum}까지 체 완료! 걸러진 소수는 총 ${pCount}개입니다.`);
    } else if (step === 'reset') {
      initCells();
      particles = [];
      allCompleted = false;
      showToast('⟲ 에라토스테네스의 체가 초기화되었습니다.');
      if (window.SoundFX && window.SoundFX.click) SoundFX.click();
    }
  }

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    w = rect.width || 560;
    h = rect.height || 520;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();

  // 셀 좌표 및 레이아웃
  let pointerX = -1;
  let pointerY = -1;

  function getGridLayout() {
    const cols = 10;
    const rows = Math.ceil(maxNum / cols);
    const startX = 14;
    const startY = 48;
    const availW = w - startX * 2;
    const availH = h - startY - 80;
    const gap = 3;
    const cellW = (availW - (cols - 1) * gap) / cols;
    const cellH = Math.min(36, (availH - (rows - 1) * gap) / rows);

    return cells.map((c, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const x = startX + col * (cellW + gap);
      const y = startY + row * (cellH + gap);

      return {
        cell: c,
        idx,
        x,
        y,
        w: cellW,
        h: cellH
      };
    });
  }

  function handlePointer(e, type) {
    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;
    pointerY = e.clientY - rect.top;

    const layouts = getGridLayout();

    if (type === 'move') {
      let anyHover = false;
      layouts.forEach(l => {
        const inCell = (pointerX >= l.x && pointerX <= l.x + l.w && pointerY >= l.y && pointerY <= l.y + l.h);
        l.cell.hover = inCell;
        if (inCell) anyHover = true;
      });
      canvas.style.cursor = anyHover ? 'pointer' : 'default';
    } else if (type === 'down') {
      layouts.forEach(l => {
        if (pointerX >= l.x && pointerX <= l.x + l.w && pointerY >= l.y && pointerY <= l.y + l.h) {
          if (l.cell.state === 'normal') {
            l.cell.state = 'crossed';
            if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(360, 'sine', 0.08);
          } else if (l.cell.state === 'crossed') {
            l.cell.state = 'prime';
            if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(600, 'sine', 0.08);
          } else {
            l.cell.state = 'normal';
            if (window.SoundFX && window.SoundFX.click) SoundFX.click();
          }
        }
      });
    }
  }

  canvas.addEventListener('pointermove', (e) => handlePointer(e, 'move'));
  canvas.addEventListener('pointerdown', (e) => handlePointer(e, 'down'));
  canvas.addEventListener('pointerleave', () => {
    pointerX = -1;
    pointerY = -1;
    cells.forEach(c => c.hover = false);
  });

  // 애니메이션 루프
  let t = 0;
  function animate() {
    t += 0.05;
    ctx.clearRect(0, 0, w, h);

    const layouts = getGridLayout();

    // 격자 렌더링
    layouts.forEach(l => {
      const { cell, x, y, w: cw, h: ch } = l;

      let ox = 0;
      if (cell.shake > 0) {
        ox = Math.sin(cell.shake * Math.PI * 6) * 4 * cell.shake;
        cell.shake -= 0.05;
        if (cell.shake < 0) cell.shake = 0;
      }

      const dx = x + ox;
      const dy = y;

      let bg = '#ffffff';
      let stroke = '#e2e8f0';
      let txtColor = '#1e293b';

      if (cell.state === 'prime') {
        bg = '#ede9fe';
        stroke = '#818cf8';
        txtColor = '#4338ca';
      } else if (cell.state === 'crossed') {
        bg = '#f1f5f9';
        stroke = '#cbd5e1';
        txtColor = '#94a3b8';
      } else if (cell.hover) {
        bg = '#f8fafc';
        stroke = '#94a3b8';
      }

      ctx.save();
      if (cell.state === 'prime' && (allCompleted || cell.glow > 0)) {
        ctx.shadowColor = 'rgba(245, 158, 11, 0.45)';
        ctx.shadowBlur = 8 + Math.sin(t * 3) * 3;
      }

      ctx.fillStyle = bg;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = (cell.state === 'prime') ? 1.8 : 1;

      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(dx, dy, cw, ch, 6);
      } else {
        ctx.rect(dx, dy, cw, ch);
      }
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 소수 원형 링
      if (cell.state === 'prime') {
        ctx.save();
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        const r = Math.min(cw, ch) * 0.42;
        ctx.arc(dx + cw / 2, dy + ch / 2, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 숫자
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = (cell.state === 'prime') ? 'bold 12.5px Pretendard, sans-serif' : '11.5px Pretendard, sans-serif';
      ctx.fillStyle = txtColor;
      ctx.fillText(String(cell.num), dx + cw / 2, dy + ch / 2);

      // 소거된 수 (붉은 대각선 X)
      if (cell.state === 'crossed') {
        ctx.save();
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
        ctx.lineWidth = 1.5;
        const padL = 4;
        ctx.beginPath();
        ctx.moveTo(dx + padL, dy + padL);
        ctx.lineTo(dx + cw - padL, dy + ch - padL);
        ctx.moveTo(dx + cw - padL, dy + padL);
        ctx.lineTo(dx + padL, dy + ch - padL);
        ctx.stroke();
        ctx.restore();
      }
    });

    // 상태 요약 바 (실시간 진행 상황 집계 - Zero Spoiler)
    const crossedCount = cells.filter(c => c.state === 'crossed').length;
    const primeCount = cells.filter(c => c.state === 'prime').length;
    const remainingCount = cells.filter(c => c.state === 'normal').length;

    const summaryY = h - 68;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px Pretendard, sans-serif';

    if (allCompleted) {
      ctx.fillStyle = '#059669';
      ctx.fillText(`✨ 1~${maxNum} 에라토스테네스의 체 완성! 걸러진 소수 총 ${primeCount}개`, w / 2, summaryY);
    } else {
      ctx.fillStyle = '#475569';
      ctx.fillText(`📊 소거된 수: ${crossedCount}개  |  확정 소수: ${primeCount}개  |  남은 수: ${remainingCount}개`, w / 2, summaryY);
    }

    // 토스트 메시지
    if (toastTimer > 0) {
      toastTimer--;
      const alpha = Math.min(1.0, toastTimer / 20);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      const toastW = Math.min(w - 30, ctx.measureText(toastMessage).width + 48);
      const toastH = 34;
      const toastX = (w - toastW) / 2;
      const toastY = summaryY - 38;

      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(toastX, toastY, toastW, toastH, 17);
      } else {
        ctx.rect(toastX, toastY, toastW, toastH);
      }
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(toastMessage, w / 2, toastY + toastH / 2);
      ctx.restore();
    }

    // 축하 파티클
    if (particles.length > 0) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.32;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > h + 20) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }

    container._animId_1_4 = requestAnimationFrame(animate);
  }

  container._animId_1_4 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

    ctx.fillText('곱한 횟수', expBoxX + expBoxW / 2, expBoxY - 10);

    // 2. 수식 전개 박스
    const factors = Array(currentExp).fill(currentBase);
    const expandedStr = factors.join(' × ');
    const computedVal = Math.pow(currentBase, currentExp);

    const calcY = cy + 104;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    const calcBoxW = Math.min(w - 40, Math.max(300, expandedStr.length * 16 + 120));
    const calcBoxH = 68;
    const calcBoxX = (w - calcBoxW) / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.04)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(calcBoxX, calcY, calcBoxW, calcBoxH, 12);
    } else {
      ctx.rect(calcBoxX, calcY, calcBoxW, calcBoxH);
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 18px Pretendard, sans-serif';
    ctx.fillText(`${currentBase}`, calcBoxX + 35, calcY + 24);
    ctx.font = 'bold 11px Pretendard, sans-serif';
    ctx.fillStyle = '#dc2626';
    ctx.fillText(`${currentExp}`, calcBoxX + 46, calcY + 16);

    ctx.fillStyle = '#475569';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillText(`=  ${expandedStr}  =  ${computedVal.toLocaleString()}`, calcBoxX + calcBoxW / 2 + 15, calcY + 24);

    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(`${currentBase}를 ${currentExp}번 거듭 곱한 수 ➔ '${currentBase}의 거듭제곱'`, calcBoxX + calcBoxW / 2, calcY + 48);

    // 3. 오개념 방지 비교 배너 (하단 배너)
    const misY = calcY + 80;
    const misW = Math.min(w - 36, 520);
    const misH = 58;
    const misX = (w - misW) / 2;

    ctx.save();
    ctx.fillStyle = '#fffbeb';
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(misX, misY, misW, misH, 10);
    } else {
      ctx.rect(misX, misY, misW, misH);
    }
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillStyle = '#b45309';
    ctx.fillText('💡 [흔한 오개념 주의 경고!]', misX + 16, misY + 18);

    const multVal = currentBase * currentExp;
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#78350f';
    ctx.fillText(
      `거듭제곱 ${currentBase}^${currentExp}은 ${currentBase} × ${currentExp} = ${multVal}이 아니라,  ${expandedStr} = ${computedVal}입니다!`,
      misX + 16,
      misY + 38
    );
    ctx.restore();

    container._animId_1_5 = requestAnimationFrame(animate);
  }

  container._animId_1_5 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

  wrapper.style.height = '100%';
  wrapper.style.minHeight = '480px';
  wrapper.style.overflow = 'hidden';

  let w = 560;

  const prob1 = {

    ]
  };

  // 탭 2 상태
  const prob2 = {
    title: '⑵ 3 × 3 × 7 × 11 × 11 × 11',
    groups: [
      { base: 3, count: 2, merged: false, mergeScale: 1, color: '#f59e0b', bg: '#fffbeb', border: '#fde68a' },
      { base: 7, count: 1, merged: false, mergeScale: 1, color: '#8b5cf6', bg: '#f5f3ff', border: '#ddd6fe' },
      { base: 11, count: 3, merged: false, mergeScale: 1, color: '#ec4899', bg: '#fdf2f8', border: '#fbcfe8' }
    ]
  };

  function getActiveProb() {
    return currentTab === 1 ? prob1 : prob2;
  }

  // 상단 툴바 UI
  const topBar = document.createElement('div');
  topBar.style.position = 'absolute';
  topBar.style.top = '10px';
  topBar.style.left = '12px';
  topBar.style.right = '12px';
  topBar.style.display = 'flex';
  topBar.style.justifyContent = 'space-between';
  topBar.style.alignItems = 'center';
  topBar.style.zIndex = '10';
  wrapper.appendChild(topBar);

  // 탭 선택 그룹
  const tabGroup = document.createElement('div');
  tabGroup.style.display = 'flex';
  tabGroup.style.gap = '6px';
  topBar.appendChild(tabGroup);

  const tab1Btn = document.createElement('button');
  tab1Btn.style.padding = '6px 12px';
  tab1Btn.style.fontSize = '12px';
  tab1Btn.style.fontWeight = '700';
  tab1Btn.style.borderRadius = '8px';
  tab1Btn.style.cursor = 'pointer';
  tab1Btn.style.transition = 'all 0.15s ease';
  tab1Btn.innerHTML = '⑴ 2×2×2×5×5';

  const tab2Btn = document.createElement('button');
  tab2Btn.style.padding = '6px 12px';
  tab2Btn.style.fontSize = '12px';
  tab2Btn.style.fontWeight = '700';
  tab2Btn.style.borderRadius = '8px';
  tab2Btn.style.cursor = 'pointer';
  tab2Btn.style.transition = 'all 0.15s ease';
  tab2Btn.innerHTML = '⑵ 3×3×7×11×11×11';

  tabGroup.appendChild(tab1Btn);
  tabGroup.appendChild(tab2Btn);

  function updateTabButtons() {
    if (currentTab === 1) {
      tab1Btn.style.background = '#4f46e5';
      tab1Btn.style.color = '#ffffff';
      tab1Btn.style.border = '1px solid #4338ca';
      tab2Btn.style.background = '#ffffff';
      tab2Btn.style.color = '#475569';
      tab2Btn.style.border = '1px solid #cbd5e1';
    } else {
      tab2Btn.style.background = '#4f46e5';
      tab2Btn.style.color = '#ffffff';
      tab2Btn.style.border = '1px solid #4338ca';
      tab1Btn.style.background = '#ffffff';
      tab1Btn.style.color = '#475569';
      tab1Btn.style.border = '1px solid #cbd5e1';
    }
  }

  tab1Btn.onclick = () => {
    currentTab = 1;
    updateTabButtons();
    updateActionButtons();
    if (window.SoundFX && window.SoundFX.click) SoundFX.click();
  };

  tab2Btn.onclick = () => {
    currentTab = 2;
    updateTabButtons();
    updateActionButtons();
    if (window.SoundFX && window.SoundFX.click) SoundFX.click();
  };

  updateTabButtons();

  const resetBtn = document.createElement('button');
  resetBtn.style.padding = '6px 12px';
  resetBtn.style.fontSize = '11.5px';
  resetBtn.style.fontWeight = '600';
  resetBtn.style.color = '#475569';
  resetBtn.style.background = '#ffffff';
  resetBtn.style.border = '1px solid #cbd5e1';
  resetBtn.style.borderRadius = '8px';
  resetBtn.style.cursor = 'pointer';
  resetBtn.style.boxShadow = '0 1px 3px rgba(0, 0, 0, 0.05)';
  resetBtn.innerHTML = '⟲ 다시 조립하기';
  resetBtn.onclick = () => {
    const prob = getActiveProb();
    prob.groups.forEach(g => {
      g.merged = false;
      g.mergeScale = 1;
    });
    particles = [];
    if (window.SoundFX && window.SoundFX.click) SoundFX.click();
  };
  topBar.appendChild(resetBtn);

  // 하단 조작 컨트롤러 바
  const bottomBar = document.createElement('div');
  bottomBar.style.position = 'absolute';
  bottomBar.style.bottom = '10px';
  bottomBar.style.left = '12px';
  bottomBar.style.right = '12px';
  bottomBar.style.display = 'flex';
  bottomBar.style.justifyContent = 'center';
  bottomBar.style.alignItems = 'center';
  bottomBar.style.gap = '8px';
  bottomBar.style.zIndex = '10';
  wrapper.appendChild(bottomBar);

  function updateActionButtons() {
    bottomBar.innerHTML = '';
    const prob = getActiveProb();

    prob.groups.forEach((g, idx) => {
      const bBtn = document.createElement('button');
      bBtn.style.padding = '6px 14px';
      bBtn.style.fontSize = '12px';
      bBtn.style.fontWeight = '700';
      bBtn.style.borderRadius = '8px';
      bBtn.style.cursor = 'pointer';
      bBtn.style.background = g.merged ? g.bg : '#ffffff';
      bBtn.style.color = g.color;
      bBtn.style.border = `1.5px solid ${g.color}`;
      bBtn.style.transition = 'all 0.15s ease';
      bBtn.innerHTML = g.merged ? `✓ [${g.base}] 합체 완료` : `🔗 [${g.base}] 블록 합체하기`;
      bBtn.onclick = () => {
        mergeGroup(g);
      };
      bottomBar.appendChild(bBtn);
    });

    const mergeAllBtn = document.createElement('button');
    mergeAllBtn.style.padding = '6px 16px';
    mergeAllBtn.style.fontSize = '12px';
    mergeAllBtn.style.fontWeight = '700';
    mergeAllBtn.style.borderRadius = '8px';
    mergeAllBtn.style.cursor = 'pointer';
    mergeAllBtn.style.background = '#4f46e5';
    mergeAllBtn.style.color = '#ffffff';
    mergeAllBtn.style.border = 'none';
    mergeAllBtn.style.boxShadow = '0 2px 6px rgba(79, 70, 229, 0.3)';
    mergeAllBtn.innerHTML = '⚡ 전체 거듭제곱 합체';
    mergeAllBtn.onclick = () => {
      prob.groups.forEach(g => mergeGroup(g, false));
      checkAllCelebration();
    };
    bottomBar.appendChild(mergeAllBtn);
  }

  function mergeGroup(g, triggerCheck = true) {
    if (!g.merged) {
      g.merged = true;
      g.mergeScale = 1.45;
      if (window.SoundFX && window.SoundFX.playTone) {
        SoundFX.playTone(550 + g.base * 25, 'triangle', 0.14);
      }
      if (triggerCheck) {
        checkAllCelebration();
      }
      updateActionButtons();
    }
  }

  function checkAllCelebration() {
    const prob = getActiveProb();
    const allDone = prob.groups.every(g => g.merged);
    if (allDone) {
      createConfetti();
      if (window.SoundFX && window.SoundFX.success) SoundFX.success();
    }
  }

  updateActionButtons();

  // 파티클
  let particles = [];
  function createConfetti() {
    particles = [];
    const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: w / 2 + (Math.random() - 0.5) * 160,
        y: h / 2 - 20,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 10 - 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 7 + 4,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        life: 1.0,
        decay: Math.random() * 0.01 + 0.008
      });
    }
  }

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    w = rect.width || 560;
    h = rect.height || 480;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();

  let t = 0;
  function animate() {
    t += 0.04;
    ctx.clearRect(0, 0, w, h);

    const prob = getActiveProb();

    // 1. 헤더 안내
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillText(`🧩 [문제 2] ${prob.title}`, w / 2, 54);

    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('곱해진 같은 수 카드를 합체하여 거듭제곱 블록을 완성해 보세요!', w / 2, 74);

    // 2. 카드 그룹 렌더링
    const groupCount = prob.groups.length;
    const startY = 110;
    const rowH = 135;

    prob.groups.forEach((g, gIdx) => {
      const gy = startY + gIdx * rowH;

      // 스케일 이징
      if (g.mergeScale > 1.0) {
        g.mergeScale += (1.0 - g.mergeScale) * 0.18;
        if (g.mergeScale < 1.01) g.mergeScale = 1.0;
      }

      ctx.save();
      // 그룹 영역 배경 박스
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = g.merged ? g.color : '#e2e8f0';
      ctx.lineWidth = g.merged ? 2 : 1;
      const boxW = Math.min(w - 32, 520);
      const boxX = (w - boxW) / 2;
      const boxH = 115;

      ctx.shadowColor = g.merged ? 'rgba(79, 70, 229, 0.12)' : 'rgba(0, 0, 0, 0.03)';
      ctx.shadowBlur = g.merged ? 10 : 4;
      ctx.shadowOffsetY = 2;

      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(boxX, gy, boxW, boxH, 12);
      } else {
        ctx.rect(boxX, gy, boxW, boxH);
      }
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 그룹 제목 라벨
      ctx.textAlign = 'left';
      ctx.font = 'bold 12.5px Pretendard, sans-serif';
      ctx.fillStyle = g.color;
      ctx.fillText(`밑 [ ${g.base} ] 그룹  (${g.count}번 곱함)`, boxX + 16, gy + 22);

      if (!g.merged) {
        // 합체 전: 펼쳐진 개별 카드들 나열
        const cardW = 42;
        const cardH = 52;
        const totalW = g.count * cardW + (g.count - 1) * 36;
        const cStartX = boxX + (boxW - totalW) / 2;
        const cY = gy + 42;

        for (let i = 0; i < g.count; i++) {
          const cx = cStartX + i * (cardW + 36);

          // 카드 사각형
          ctx.save();
          ctx.fillStyle = g.bg;
          ctx.strokeStyle = g.border;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(cx, cY, cardW, cardH, 8);
          } else {
            ctx.rect(cx, cY, cardW, cardH);
          }
          ctx.fill();
          ctx.stroke();

          // 카드 숫자
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = 'bold 20px Pretendard, sans-serif';
          ctx.fillStyle = g.color;
          ctx.fillText(String(g.base), cx + cardW / 2, cY + cardH / 2);
          ctx.restore();

          // 곱하기 기호
          if (i < g.count - 1) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 16px Pretendard, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('×', cx + cardW + 18, cY + cardH / 2);
          }
        }
      } else {
        // 합체 완료: 거듭제곱 블록 렌더링
        ctx.save();
        const blockCx = boxX + boxW / 2;
        const blockCy = gy + 62;

        ctx.translate(blockCx, blockCy);
        ctx.scale(g.mergeScale, g.mergeScale);

        // 블록 본체 (밑 박스)
        ctx.fillStyle = g.bg;
        ctx.strokeStyle = g.color;
        ctx.lineWidth = 2.5;
        const bw = 54;
        const bh = 58;

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(-bw / 2 - 12, -bh / 2, bw, bh, 10);
        } else {
          ctx.rect(-bw / 2 - 12, -bh / 2, bw, bh);
        }
        ctx.fill();
        ctx.stroke();

        // 밑 숫자
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = g.color;
        ctx.font = 'bold 30px Pretendard, sans-serif';
        ctx.fillText(String(g.base), -12, 0);

        // 지수 박스 (우상단)
        if (g.count > 1) {
          const ew = 32;
          const eh = 34;
          const ex = 18;
          const ey = -bh / 2 - 6;

          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#dc2626';
          ctx.lineWidth = 2;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(ex, ey, ew, eh, 6);
          } else {
            ctx.rect(ex, ey, ew, eh);
          }
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#dc2626';
          ctx.font = 'bold 18px Pretendard, sans-serif';
          ctx.fillText(String(g.count), ex + ew / 2, ey + eh / 2);
        } else {
          // 지수가 1인 경우 (예: 7) 안내 태그
          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 12px Pretendard, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('(지수 1 생략)', 20, 0);
        }

        ctx.restore();

        // 합체 성공 뱃지
        ctx.textAlign = 'right';
        ctx.font = 'bold 11px Pretendard, sans-serif';
        ctx.fillStyle = '#059669';
        ctx.fillText('✨ 거듭제곱 압축 완성!', boxX + boxW - 16, gy + 22);
      }
    });

    // 3. 전체 합체 완료 상태 결과 표시 배너
    const allMerged = prob.groups.every(g => g.merged);
    if (allMerged) {
      const bannerY = h - 68;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillStyle = '#4f46e5';
      ctx.fillText('🎉 모든 카드가 거듭제곱으로 합체되었습니다! 아래 폼에 입력해 보세요.', w / 2, bannerY);
    }

    // 4. 파티클
    if (particles.length > 0) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.32;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > h + 20) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }

    container._animId_1_6 = requestAnimationFrame(animate);
  }

  container._animId_1_6 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

function parsePowerProduct(str) {
  if (!str) return null;
  let s = str.trim();
  const supMap = { '⁰': '^0', '¹': '^1', '²': '^2', '³': '^3', '⁴': '^4', '⁵': '^5', '⁶': '^6', '⁷': '^7', '⁸': '^8', '⁹': '^9' };
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, m => supMap[m]);
  s = s.replace(/\\times/g, '*').replace(/[xX×·]/g, '*');
  s = s.replace(/\s+/g, '');

  const tokens = s.split('*').filter(t => t.length > 0);
  if (tokens.length === 0) return null;

  const result = {};
  for (const token of tokens) {
    let base, exp;
    if (token.includes('^')) {
      const parts = token.split('^');
      if (parts.length !== 2) return null;
      base = parseInt(parts[0], 10);
      exp = parseInt(parts[1], 10);
    } else {
      base = parseInt(token, 10);
      exp = 1;
    }
    if (isNaN(base) || isNaN(exp)) return null;
    result[base] = (result[base] || 0) + exp;
  }
  return result;
}

function comparePowerMaps(map1, map2) {
  if (!map1 || !map2) return false;
  const k1 = Object.keys(map1);
  const k2 = Object.keys(map2);
  if (k1.length !== k2.length) return false;
  for (const k of k1) {
    if (map1[k] !== map2[k]) return false;
  }
  return true;
}

  }
}

        thicknessDisplay = '439,805 km';

      } else if (folds >= 32) {
        unitDesc = '(우주 궤도 진입!)';
      } else {
        unitDesc = '(성층권 돌파!)';

    }

    // 2. 좌측 영역: 종이 접기 시각화 박스

    const leftX = 20;
    const leftY = 56;
    const leftH = h - leftY - 70;

    ctx.save();
    ctx.fillStyle = 'rgba(30, 41, 59, 0.75)';
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(leftX, leftY, leftW, leftH, 14);
    } else {
      ctx.rect(leftX, leftY, leftW, leftH);
    }
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11.5px Pretendard, sans-serif';
    ctx.fillText('현재 접은 횟수', leftX + leftW / 2, leftY + 24);

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 32px Pretendard, sans-serif';
    ctx.fillText(`${folds} 번`, leftX + leftW / 2, leftY + 56);

    // 3D 종이 겹 표현 (두께 애니메이션)

    const paperBaseW = leftW - 40;
    const paperBaseH = Math.min(65, 8 + animFolds * 1.35);

    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(paperPx, paperPy, paperBaseW, paperBaseH, 4);
    } else {
      ctx.rect(paperPx, paperPy, paperBaseW, paperBaseH);
    }
    ctx.fill();
    ctx.stroke();

    if (folds > 0) {
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
      ctx.lineWidth = 1;
      const stripeCount = Math.min(10, folds);
      for (let s = 1; s <= stripeCount; s++) {
        const sy = paperPy + (paperBaseH * s) / (stripeCount + 1);
        ctx.beginPath();
        ctx.moveTo(paperPx + 4, sy);
        ctx.lineTo(paperPx + paperBaseW - 4, sy);

    ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';

    if (ctx.roundRect) {
      ctx.roundRect(rightX, rightY, rightW, rightH, 14);

    ctx.stroke();

    // 레일 배경선

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(railX, railBottomY);
    ctx.lineTo(railX, railTopY);
    ctx.stroke();

    const moonRatio = 0.80;
    const moonY = railBottomY - railLen * moonRatio;

    const currentProgress = (animFolds / 42) * 0.92;
    const currentPaperY = railBottomY - railLen * currentProgress;

    // 채워지는 궤도선
    ctx.strokeStyle = folds === 42 ? '#f59e0b' : '#38bdf8';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(railX, railBottomY);
    ctx.lineTo(railX, currentPaperY);
    ctx.stroke();

    // 1) 지구 (하단)
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🌍', railX, railBottomY + 22);

    ctx.textAlign = 'left';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('지구 (출발점: 0 km)', railX + 30, railBottomY + 22);

    // 2) 달 (상단 목표)
    ctx.save();
    if (folds === 42) {
      ctx.shadowColor = '#f59e0b';
      ctx.shadowBlur = 16 + Math.sin(t * 3) * 6;
    }
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🌕', railX, moonY);
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.font = 'bold 12.5px Pretendard, sans-serif';
    ctx.fillStyle = folds === 42 ? '#fbbf24' : '#e2e8f0';
    ctx.fillText('달 (Moon): 384,400 km', railX + 30, moonY - 6);

    ctx.font = '10.5px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('지구에서 달까지의 평균 거리', railX + 30, moonY + 12);

    // 달 기준 점선 가이드
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(railX + 16, moonY);
    ctx.lineTo(rightX + rightW - 20, moonY);
    ctx.stroke();
    ctx.setLineDash([]);

    // 3) 42번 접었을 때 도달선 (달 궤도 돌파 지점)
    const topGoalY = railBottomY - railLen * 0.92;
    if (folds >= 40) {
      ctx.textAlign = 'left';
      ctx.font = 'bold 11.5px Pretendard, sans-serif';
      ctx.fillStyle = '#f59e0b';
      ctx.fillText('★ 42번 접은 두께: 439,805 km (돌파!)', railX + 30, topGoalY);
    }

    // 4) 현재 종이 탐사선 마커
    ctx.save();
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(railX, currentPaperY, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = folds === 42 ? '#f59e0b' : '#38bdf8';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();

    ctx.font = '16px sans-serif';
    ctx.fillText('📄', railX - 24, currentPaperY);

    // 42번 돌파 축하 배너
    if (folds === 42) {
      ctx.save();
      const bannerW = rightW - 40;
      const bannerH = 50;
      const bannerX = rightX + 20;
      const bannerY = rightY + rightH - 74;

      ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(bannerX, bannerY, bannerW, bannerH, 10);
      } else {
        ctx.rect(bannerX, bannerY, bannerW, bannerH);
      }
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('🎉 0.1 mm 종이 42번 접기 달 도달 성공!', bannerX + bannerW / 2, bannerY + 16);
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#fde68a';
      ctx.fillText('439,805 km > 384,400 km (거듭제곱의 경이로움!)', bannerX + bannerW / 2, bannerY + 34);
      ctx.restore();
    }

    ctx.restore();

    // 4. 파티클
    if (particles.length > 0) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > h + 20) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }

    container._animId_1_7 = requestAnimationFrame(animate);
  }

  container._animId_1_7 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

  resetBtn.style.fontWeight = '600';
  resetBtn.style.color = '#475569';
  resetBtn.style.background = '#ffffff';
  resetBtn.style.border = '1px solid #cbd5e1';
  resetBtn.style.borderRadius = '8px';
  resetBtn.style.cursor = 'pointer';
  resetBtn.style.boxShadow = '0 1px 3px rgba(0, 0, 0, 0.05)';
  resetBtn.innerHTML = '⟲ 노선 리셋';
  resetBtn.onclick = () => {
    resetSimulation();
  };
  topBar.appendChild(resetBtn);

  // 하단 컨트롤러 바
  const ctrlRow = document.createElement('div');
  ctrlRow.style.position = 'absolute';
  ctrlRow.style.bottom = '10px';
  ctrlRow.style.left = '10px';

  wrapper.appendChild(ctrlRow);

  function createBtn(label, onClick, isPrimary = false, isAccent = false) {
