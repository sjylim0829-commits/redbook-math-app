          거대한 두 소수를 곱하기는 매우 쉽지만, 곱한 결과를 다시 소인수분해하는 것은 슈퍼컴퓨터로도 불가능에 가깝습니다. 현대 인터넷 보안과 암호화의 핵심이 되는 이 수의 종류는 무엇일까요?
        </div>
        <div style="margin-bottom:6px;">
          <label for="ans-0-3" style="font-size:0.84rem; font-weight:700; color:#334155; display:block; margin-bottom:6px;">용어 입력:</label>
          <input type="text" id="ans-0-3" class="form-control" placeholder="용어 입력" autocomplete="off" onkeydown="if(event.key==='Enter') checkStep_0_3()">
        </div>
      </div>

      <button class="btn btn-primary" onclick="checkStep_0_3()" style="width:100%; padding:10px 16px; font-size:0.92rem;">
        정답 확인 및 채점
      </button>
    </div>
  `;
}

function checkStep_0_3() {
  const input = document.getElementById('ans-0-3') || document.getElementById('input-0-3');
  const val = input ? input.value : '';
  if (normTxt(val) === '소수') {
    completeSubStep('0-3', '🎉 <b>정답입니다!</b> <b>소수(Prime)</b>의 비대칭적 곱셈과 분해의 난이도 차이가 바로 전 세계 인터넷 금융과 보안을 지키는 든든한 방패입니다.');
  } else {
    if (window.SoundFX && window.SoundFX.error) SoundFX.error();
    showFeedback(false, '❌ <b>다시 확인해 보세요.</b> 1보다 큰 자연수 중 1과 자기 자신만을 약수로 갖는 2글자 수의 이름입니다.');
  }
}

// -------------------------------------------------------------
// 0-4 (p.9): 되짚어보기 1: 약수와 배수 구하기
// -------------------------------------------------------------
function drawCanvas_0_4(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  canvas.style.touchAction = 'none';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;
  let t = 0;

  let currentMode = 'div6'; // 'div6', 'div13', 'mul24', 'mul36'

  // State for div6
  let div6Config = 1; // 0: 1x6, 1: 2x3, 2: 3x2, 3: 6x1
  const div6Options = [
    { r: 1, c: 6, label: '1 × 6' },
    { r: 2, c: 3, label: '2 × 3' },
    { r: 3, c: 2, label: '3 × 2' },
    { r: 6, c: 1, label: '6 × 1' }
  ];

  // State for div13
  let div13Rows = 1; // 1, 2, 3, 4, 5
  const div13Options = [
    { rows: 1, cols: 13, rem: 0, label: '1줄 (1 × 13)' },
    { rows: 2, cols: 6, rem: 1, label: '2줄 (2 × 6 + 1)' },
    { rows: 3, cols: 4, rem: 1, label: '3줄 (3 × 4 + 1)' },
    { rows: 4, cols: 3, rem: 1, label: '4줄 (4 × 3 + 1)' },
    { rows: 5, cols: 2, rem: 3, label: '5줄 (5 × 2 + 3)' }
  ];

  // State for mul24 & mul36
  let trainPosRatio = 0.2;
  let isDraggingTrain = false;
  let lastStationTriggered = -1;

  // Particle system
  let particles = [];
  function spawnSparks(x, y, color) {
    for (let i = 0; i < 22; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 3.5;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 2.5 + Math.random() * 2.5,
        color: color || '#f59e0b',
        life: 1.0,
        decay: 0.025 + Math.random() * 0.02
      });
    }
  }

  function resize() {
    if (!container || !canvas) return;
    const newW = container.clientWidth || 560;
    const newH = container.clientHeight || 460;
    if (canvas.width !== newW || canvas.height !== newH) {
      canvas.width = newW;
      canvas.height = newH;
    }
  }
  window.addEventListener('resize', resize);

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / (rect.width || 1);
    const scaleY = canvas.height / (rect.height || 1);
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  // Hit test buttons
  const modeTabs = [
    { id: 'div6', label: '6의 약수' },
    { id: 'div13', label: '13의 약수' },
    { id: 'mul24', label: '24의 배수' },
    { id: 'mul36', label: '36의 배수' }
  ];

  function hitTestTab(pos) {
    const w = canvas.width;
    const tabW = Math.min(105, (w - 30) / 4);
    const tabH = 28;
    const startX = (w - tabW * 4 - 18) / 2;
    const tabY = 10;

    for (let i = 0; i < 4; i++) {
      const tx = startX + i * (tabW + 6);
      if (pos.x >= tx && pos.x <= tx + tabW && pos.y >= tabY && pos.y <= tabY + tabH) {
        return modeTabs[i].id;
      }
    }
    return null;
  }

  function hitTestDiv6Option(pos) {
    const w = canvas.width;
    const btnW = 90;
    const btnH = 30;
    const startX = (w - btnW * 4 - 30) / 2;
    const btnY = 82;
    for (let i = 0; i < 4; i++) {
      const bx = startX + i * (btnW + 10);
      if (pos.x >= bx && pos.x <= bx + btnW && pos.y >= btnY && pos.y <= btnY + btnH) {
        return i;
      }
    }
    return null;
  }

  function hitTestDiv13Option(pos) {
    const w = canvas.width;
    const btnW = Math.min(94, (w - 40) / 5);
    const btnH = 30;
    const startX = (w - btnW * 5 - 24) / 2;
    const btnY = 82;
    for (let i = 0; i < 5; i++) {
      const bx = startX + i * (btnW + 6);
      if (pos.x >= bx && pos.x <= bx + btnW && pos.y >= btnY && pos.y <= btnY + btnH) {
        return div13Options[i].rows;
      }
    }
    return null;
  }

  function hitTestTrain(pos, railX1, railX2, railY) {
    const trainX = railX1 + trainPosRatio * (railX2 - railX1);
    return Math.hypot(pos.x - trainX, pos.y - railY) <= 30;
  }

  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    const pos = getCanvasPos(e);
    const w = canvas.width;
    const h = canvas.height;

    // Mode tab click
    const clickedTab = hitTestTab(pos);
    if (clickedTab) {
      currentMode = clickedTab;
      particles = [];
      lastStationTriggered = -1;
      trainPosRatio = (clickedTab === 'mul24') ? 0.2 : (clickedTab === 'mul36' ? 0.25 : 0.2);
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(500, 'sine', 0.06);
      return;
    }

    if (currentMode === 'div6') {
      const optIdx = hitTestDiv6Option(pos);
      if (optIdx !== null) {
        div6Config = optIdx;
        spawnSparks(pos.x, pos.y, '#6366f1');
        if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(580, 'sine', 0.08);
      }
    } else if (currentMode === 'div13') {
      const r = hitTestDiv13Option(pos);
      if (r !== null) {
        div13Rows = r;
        spawnSparks(pos.x, pos.y, r === 1 ? '#10b981' : '#ef4444');
        if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(r === 1 ? 640 : 360, 'sine', 0.08);
      }
    } else if (currentMode === 'mul24' || currentMode === 'mul36') {
      const railX1 = 50;
      const railX2 = w - 50;
      const railY = h * 0.58;

      if (pos.y >= railY - 40 && pos.y <= railY + 40 && pos.x >= railX1 - 20 && pos.x <= railX2 + 20) {
        isDraggingTrain = true;
        trainPosRatio = Math.max(0, Math.min(1, (pos.x - railX1) / (railX2 - railX1)));
        if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(480, 'sine', 0.05);
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pos = getCanvasPos(e);
    const w = canvas.width;
    const h = canvas.height;
    const railX1 = 50;
    const railX2 = w - 50;
    const railY = h * 0.58;

    if (isDraggingTrain && (currentMode === 'mul24' || currentMode === 'mul36')) {
      trainPosRatio = Math.max(0, Math.min(1, (pos.x - railX1) / (railX2 - railX1)));
      canvas.style.cursor = 'grabbing';
    } else {
      const onTab = !!hitTestTab(pos);
      const onDiv6 = (currentMode === 'div6' && hitTestDiv6Option(pos) !== null);
      const onDiv13 = (currentMode === 'div13' && hitTestDiv13Option(pos) !== null);
      const onTrain = ((currentMode === 'mul24' || currentMode === 'mul36') && hitTestTrain(pos, railX1, railX2, railY));
      canvas.style.cursor = (onTab || onDiv6 || onDiv13 || onTrain) ? 'pointer' : 'default';
    }
  });

  function stopTrainDrag(e) {
    if (isDraggingTrain) {
      isDraggingTrain = false;
      canvas.style.cursor = 'default';
    }
    try {
      if (canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
    } catch(err) {}
  }

  canvas.addEventListener('pointerup', stopTrainDrag);
  canvas.addEventListener('pointercancel', stopTrainDrag);

  function draw() {
    if (!container.isConnected || !container.contains(canvas)) {
      if (animId) cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      return;
    }

    t += 0.025;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Subtle background grid
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 36) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += 36) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // Draw Mode Tabs (Top Center)
    const tabW = Math.min(105, (w - 30) / 4);
    const tabH = 28;
    const tabStartX = (w - tabW * 4 - 18) / 2;
    const tabY = 10;

    modeTabs.forEach((tab, i) => {
      const tx = tabStartX + i * (tabW + 6);
      const isCur = (currentMode === tab.id);

      ctx.save();
      ctx.fillStyle = isCur ? '#4f46e5' : '#ffffff';
      ctx.strokeStyle = isCur ? '#4f46e5' : '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(tx, tabY, tabW, tabH, 6);
      else ctx.rect(tx, tabY, tabW, tabH);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillStyle = isCur ? '#ffffff' : '#475569';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(tab.label, tx + tabW / 2, tabY + tabH / 2);
      ctx.restore();
    });

    if (currentMode === 'div6') {
      // 6의 약수 모드
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText('🟣 6의 약수 모눈 직사각형 조립기', w / 2, 54);

      // Div 6 Option Buttons
      const btnW = 90;
      const btnH = 30;
      const startX = (w - btnW * 4 - 30) / 2;
      const btnY = 82;

      div6Options.forEach((opt, idx) => {
        const bx = startX + idx * (btnW + 10);
        const isSel = (div6Config === idx);

        ctx.save();
        ctx.fillStyle = isSel ? '#4f46e5' : '#f1f5f9';
        ctx.strokeStyle = isSel ? '#4338ca' : '#cbd5e1';
        ctx.lineWidth = isSel ? 2 : 1;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bx, btnY, btnW, btnH, 6);
        else ctx.rect(bx, btnY, btnW, btnH);
        ctx.fill();
        ctx.stroke();

        ctx.font = 'bold 12px Pretendard, sans-serif';
        ctx.fillStyle = isSel ? '#ffffff' : '#334155';
        ctx.textBaseline = 'middle';
        ctx.fillText(opt.label, bx + btnW / 2, btnY + btnH / 2);
        ctx.restore();
      });

      // Visual Bead Arrangement for selected config
      const curCfg = div6Options[div6Config];
      const gap = 36;
      const beadR = 13;
      const gridW = (curCfg.c - 1) * gap;
      const gridH = (curCfg.r - 1) * gap;
      const gridX = w / 2 - gridW / 2;
      const gridY = 220 - gridH / 2;

      // Bounding Box around beads
      ctx.save();
      ctx.fillStyle = 'rgba(79, 70, 229, 0.05)';
      ctx.strokeStyle = '#4f46e5';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(gridX - beadR - 14, gridY - beadR - 14, gridW + beadR * 2 + 28, gridH + beadR * 2 + 28, 12);
      else ctx.rect(gridX - beadR - 14, gridY - beadR - 14, gridW + beadR * 2 + 28, gridH + beadR * 2 + 28);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Dimension labels
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = '#4f46e5';
      ctx.textAlign = 'center';
      ctx.fillText(`가로 ${curCfg.c}개`, w / 2, gridY - beadR - 22);

      ctx.save();
      ctx.translate(gridX - beadR - 24, gridY + gridH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(`세로 ${curCfg.r}개`, 0, 0);
      ctx.restore();

      // Beads
      for (let r = 0; r < curCfg.r; r++) {
        for (let c = 0; c < curCfg.c; c++) {
          const bx = gridX + c * gap;
          const by = gridY + r * gap;

          ctx.save();
          ctx.shadowColor = 'rgba(79, 70, 229, 0.4)';
          ctx.shadowBlur = 8;
          ctx.fillStyle = '#4f46e5';
          ctx.beginPath();
          ctx.arc(bx, by, beadR, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();

          // Bead index
          ctx.font = 'bold 10px Pretendard, sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(r * curCfg.c + c + 1), bx, by);
        }
      }

      // Bottom Result Card
      ctx.save();
      ctx.fillStyle = '#ecfdf5';
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(w / 2 - 210, h - 68, 420, 52, 8);
      else ctx.rect(w / 2 - 210, h - 68, 420, 52);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#065f46';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText(`✅ 직사각형 완성! 6 = ${curCfg.r} × ${curCfg.c} (나누어떨어짐)`, w / 2, h - 51);
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#047857';
      ctx.fillText(`나머지가 없으므로 1, 2, 3, 6은 모두 6의 약수입니다.`, w / 2, h - 33);

    } else if (currentMode === 'div13') {
      // 13의 약수 모드
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px Pretendard, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText('🔴 13의 약수 분할 실험실 (오직 1줄뿐!)', w / 2, 54);

      // 5 Rows selection buttons
      const btnW = Math.min(94, (w - 40) / 5);
      const btnH = 30;
      const startX = (w - btnW * 5 - 24) / 2;
      const btnY = 82;

      div13Options.forEach((opt, idx) => {
        const bx = startX + idx * (btnW + 6);
        const isSel = (div13Rows === opt.rows);

        ctx.save();
        ctx.fillStyle = isSel ? (opt.rem === 0 ? '#10b981' : '#ef4444') : '#f1f5f9';
        ctx.strokeStyle = isSel ? (opt.rem === 0 ? '#059669' : '#dc2626') : '#cbd5e1';
        ctx.lineWidth = isSel ? 2 : 1;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bx, btnY, btnW, btnH, 6);
        else ctx.rect(bx, btnY, btnW, btnH);
        ctx.fill();
        ctx.stroke();

        ctx.font = 'bold 11px Pretendard, sans-serif';
        ctx.fillStyle = isSel ? '#ffffff' : '#334155';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${opt.rows}줄`, bx + btnW / 2, btnY + btnH / 2);
        ctx.restore();
      });

      const curOpt = div13Options.find(o => o.rows === div13Rows);
      const gap = 30;
      const beadR = 11;
      const gridW = (curOpt.cols - 1) * gap;
      const gridH = (curOpt.rows - 1) * gap;
      const gridX = w / 2 - (gridW + (curOpt.rem > 0 ? 40 : 0)) / 2;
      const gridY = 210 - gridH / 2;

      // Draw Main Completed Rows
      for (let r = 0; r < curOpt.rows; r++) {
        for (let c = 0; c < curOpt.cols; c++) {
          const bx = gridX + c * gap;
          const by = gridY + r * gap;

          ctx.save();
          ctx.fillStyle = curOpt.rem === 0 ? '#10b981' : '#64748b';
          ctx.beginPath();
          ctx.arc(bx, by, beadR, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();

          ctx.font = 'bold 9px Pretendard, sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(r * curOpt.cols + c + 1), bx, by);
        }
      }

      // Draw Remainder Beads (in Red with Pulse)
      if (curOpt.rem > 0) {
        const pulse = Math.sin(t * 5) * 2;
        const remStartX = gridX + curOpt.cols * gap + 15;

        ctx.font = 'bold 11px Pretendard, sans-serif';
        ctx.fillStyle = '#ef4444';
        ctx.textAlign = 'left';
        ctx.fillText(`⚠️ 나머지 ${curOpt.rem}개!`, remStartX - 6, gridY - 14);

        for (let remI = 0; remI < curOpt.rem; remI++) {
          const rx = remStartX;
          const ry = gridY + remI * gap;

          ctx.save();
          ctx.shadowColor = '#ef4444';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(rx, ry, beadR + pulse * 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();

          ctx.font = 'bold 9px Pretendard, sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(curOpt.rows * curOpt.cols + remI + 1), rx, ry);
        }
      }

      // Result Card at bottom
      ctx.save();
      ctx.fillStyle = curOpt.rem === 0 ? '#ecfdf5' : '#fef2f2';
      ctx.strokeStyle = curOpt.rem === 0 ? '#10b981' : '#f87171';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(w / 2 - 210, h - 68, 420, 52, 8);
      else ctx.rect(w / 2 - 210, h - 68, 420, 52);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (curOpt.rem === 0) {
        ctx.fillStyle = '#065f46';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillText(`🎉 직사각형 성공! 13 = 1 × 13 (나머지 0)`, w / 2, h - 51);
        ctx.font = '11px Pretendard, sans-serif';
        ctx.fillStyle = '#047857';
        ctx.fillText(`13의 약수는 오직 1과 13뿐입니다! ➔ [소수]`, w / 2, h - 33);
      } else {
        ctx.fillStyle = '#991b1b';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillText(`❌ 직사각형 실패: 13 = ${curOpt.rows} × ${curOpt.cols} + ${curOpt.rem} (나머지 발생)`, w / 2, h - 51);
        ctx.font = '11px Pretendard, sans-serif';
        ctx.fillStyle = '#b91c1c';
        ctx.fillText(`나누어떨어지지 않으므로 ${curOpt.rows}은(는) 13의 약수가 아닙니다.`, w / 2, h - 33);
      }

    } else if (currentMode === 'mul24' || currentMode === 'mul36') {
      // 24 / 36 배수 모드
      const stepVal = (currentMode === 'mul24') ? 24 : 36;
      const maxVal = (currentMode === 'mul24') ? 120 : 144;
      const colorPrimary = (currentMode === 'mul24') ? '#0284c7' : '#7c3aed';
      const colorGlow = (currentMode === 'mul24') ? '#38bdf8' : '#c084fc';

      const stations = (currentMode === 'mul24') ? [
        { n: 1, val: 24 },
        { n: 2, val: 48 },
        { n: 3, val: 72 },
        { n: 4, val: 96 },
        { n: 5, val: 120 }
      ] : [
        { n: 1, val: 36 },
        { n: 2, val: 72 },
        { n: 3, val: 108 },
        { n: 4, val: 144 }
      ];

      ctx.textAlign = 'center';
      ctx.font = '800 15px Pretendard, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(`🚆 ${stepVal}의 배수 수직선 레일 기차 여행`, w / 2, 54);

      // Rail Line
      const railX1 = 50;
      const railX2 = w - 50;
      const railY = h * 0.52;
      const railLen = railX2 - railX1;

      // Rail Sleepers
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 3;
      for (let rx = railX1; rx <= railX2; rx += 14) {
        ctx.beginPath();
        ctx.moveTo(rx, railY - 10);
        ctx.lineTo(rx, railY + 10);
        ctx.stroke();
      }

      // Rail Tracks
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(railX1, railY - 5);
      ctx.lineTo(railX2, railY - 5);
      ctx.moveTo(railX1, railY + 5);
      ctx.lineTo(railX2, railY + 5);
      ctx.stroke();

      const trainX = railX1 + trainPosRatio * railLen;
      const curTrainVal = Math.round(trainPosRatio * maxVal);

      // Check Station Approaching / Hit
      let curStationHit = null;
      stations.forEach((st, sIdx) => {
        const sx = railX1 + (st.val / maxVal) * railLen;
        const dist = Math.abs(trainX - sx);

        const isHit = dist < 12;
        if (isHit) {
          curStationHit = st;
          if (lastStationTriggered !== sIdx) {
            lastStationTriggered = sIdx;
            spawnSparks(sx, railY, colorPrimary);
            if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(600 + sIdx * 60, 'sine', 0.1);
          }
        }

        // Draw Station Board & Marker
        ctx.save();
        if (isHit) {
          ctx.shadowColor = colorGlow;
          ctx.shadowBlur = 14;
        }

        // Marker pin
        ctx.fillStyle = isHit ? colorGlow : colorPrimary;
        ctx.beginPath();
        ctx.arc(sx, railY, isHit ? 14 : 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // Station Board above
        ctx.save();
        ctx.fillStyle = isHit ? colorPrimary : '#f8fafc';
        ctx.strokeStyle = colorPrimary;
        ctx.lineWidth = isHit ? 2 : 1.2;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(sx - 32, railY - 60, 64, 38, 6);
        else ctx.rect(sx - 32, railY - 60, 64, 38);
        ctx.fill();
        ctx.stroke();

        ctx.font = 'bold 9px Pretendard, sans-serif';
        ctx.fillStyle = isHit ? '#ffffff' : '#64748b';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(`제 ${st.n}역`, sx, railY - 56);

        ctx.font = 'bold 15px Pretendard, sans-serif';
        ctx.fillStyle = isHit ? '#ffffff' : colorPrimary;
        ctx.fillText(String(st.val), sx, railY - 42);
        ctx.restore();

        // Formula label below rail
        ctx.font = '11px Pretendard, sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(`${stepVal}×${st.n}`, sx, railY + 18);
      });

      // Draw Locomotive / Train Handle at (trainX, railY)
      ctx.save();
      ctx.translate(trainX, railY);

      // Glow on train
      ctx.shadowColor = isDraggingTrain ? '#38bdf8' : 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = isDraggingTrain ? 12 : 6;

      // Train Body
      ctx.fillStyle = isDraggingTrain ? '#0284c7' : '#0369a1';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-22, -18, 44, 36, 8);
      else ctx.rect(-22, -18, 44, 36);
      ctx.fill();

      // Train Window
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.arc(0, -4, 8, 0, Math.PI * 2);
      ctx.fill();

      // Train Wheels
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(-12, 16, 5, 0, Math.PI * 2);
      ctx.arc(12, 16, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // Bottom Result Card
      ctx.save();
      ctx.fillStyle = curStationHit ? '#f0fdf4' : '#f8fafc';
      ctx.strokeStyle = curStationHit ? '#22c55e' : '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(w / 2 - 210, h - 68, 420, 52, 8);
      else ctx.rect(w / 2 - 210, h - 68, 420, 52);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (curStationHit) {
        ctx.fillStyle = '#15803d';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillText(`🎉 [제 ${curStationHit.n}역 정차] ${stepVal}의 ${curStationHit.n}배 = ${curStationHit.val}!`, w / 2, h - 51);
        ctx.font = '11px Pretendard, sans-serif';
        ctx.fillStyle = '#166534';
        ctx.fillText(`어떤 수에 자연수(1, 2, 3...)를 곱한 수를 그 수의 '배수'라고 합니다.`, w / 2, h - 33);
      } else {
        ctx.fillStyle = '#334155';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillText(`현재 기차 위치: ${curTrainVal} (레일을 마우스/터치로 드래그하세요)`, w / 2, h - 51);
        ctx.font = '11px Pretendard, sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText(`${stepVal}의 배수 역(${stations.map(s => s.val).join(', ')})으로 기차를 이동시켜 보세요.`, w / 2, h - 33);
      }
    }

    // Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    animId = requestAnimationFrame(draw);
  }

  draw();
}

// 0-5 (p.9): 되짚어보기 2: 공약수와 최대공약수
// -------------------------------------------------------------
function drawCanvas_0_5(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let currentPair = 'pair1'; // pair1: (12, 18), pair2: (45, 54)

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const is1 = (currentPair === 'pair1');
    const numA = is1 ? 12 : 45;
    const numB = is1 ? 18 : 54;
    const divA = is1 ? [1, 2, 3, 4, 6, 12] : [1, 3, 5, 9, 15, 45];
    const divB = is1 ? [1, 2, 3, 6, 9, 18] : [1, 2, 3, 6, 9, 18, 27, 54];
    const common = is1 ? [1, 2, 3, 6] : [1, 3, 9];
    const gcd = is1 ? 6 : 9;
    const onlyA = divA.filter(x => !common.includes(x));
    const onlyB = divB.filter(x => !common.includes(x));

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText(`⭕ 벤다이어그램 공약수와 최대공약수 (${numA}, ${numB})`, w / 2, 35);

    // Two overlapping circles
    const cy = h * 0.52;
    const r = Math.min(w, h) * 0.32;
    const cx1 = w / 2 - r * 0.55;
    const cx2 = w / 2 + r * 0.55;

    // Circle A
    ctx.fillStyle = 'rgba(59, 130, 246, 0.12)';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx1, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Circle B
    ctx.fillStyle = 'rgba(236, 72, 153, 0.12)';
    ctx.strokeStyle = '#ec4899';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx2, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#1d4ed8';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText(`${numA}의 약수`, cx1 - 40, cy - r + 24);

    ctx.fillStyle = '#be185d';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText(`${numB}의 약수`, cx2 + 40, cy - r + 24);

    ctx.fillStyle = '#059669';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillText('공약수 (교집합)', w / 2, cy - r + 24);

    // Draw Numbers in Only A
    onlyA.forEach((val, idx) => {
      const angle = Math.PI + (idx - (onlyA.length - 1) / 2) * 0.45;
      const nx = cx1 + Math.cos(angle) * (r * 0.55);
      const ny = cy + Math.sin(angle) * (r * 0.55);
      drawPill(nx, ny, String(val), '#3b82f6');
    });

    // Draw Numbers in Only B
    onlyB.forEach((val, idx) => {
      const angle = (idx - (onlyB.length - 1) / 2) * 0.45;
      const nx = cx2 + Math.cos(angle) * (r * 0.55);
      const ny = cy + Math.sin(angle) * (r * 0.55);
      drawPill(nx, ny, String(val), '#ec4899');
    });

    // Draw Common Numbers in Intersection
    common.forEach((val, idx) => {
      const isGcd = (val === gcd);
      const stepY = (idx - (common.length - 1) / 2) * 36;
      const nx = w / 2;
      const ny = cy + stepY;
      drawPill(nx, ny, String(val), isGcd ? '#d97706' : '#059669', isGcd);
    });

    // Bottom Summary
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText(`공약수: { ${common.join(', ')} }  ➔  최대공약수(GCD): ${gcd}`, w / 2, h - 35);
  }

  function drawPill(x, y, text, color, isHighlight = false) {
    ctx.save();
    if (isHighlight) {
      ctx.shadowColor = 'rgba(217, 119, 6, 0.4)';
      ctx.shadowBlur = 8;
    }
    ctx.fillStyle = isHighlight ? '#fef3c7' : '#ffffff';
    ctx.strokeStyle = color;
    ctx.lineWidth = isHighlight ? 3 : 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = color;
    ctx.font = isHighlight ? 'bold 15px Pretendard, sans-serif' : 'bold 13px Pretendard, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);

    if (isHighlight) {
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillText('👑', x, y - 22);
    }
  }

  // Toggle buttons
  const tabRow = document.createElement('div');
  tabRow.style.position = 'absolute';
  tabRow.style.top = '10px';
  tabRow.style.right = '10px';
  tabRow.style.display = 'flex';
  tabRow.style.gap = '6px';
  tabRow.style.zIndex = '20';

  const b1 = document.createElement('button');
  b1.className = 'btn btn-primary';
  b1.style.padding = '4px 10px';
  b1.style.fontSize = '0.8rem';
  b1.textContent = '⑴ 12와 18';

  const b2 = document.createElement('button');
  b2.className = 'btn';
  b2.style.background = '#ffffff';
  b2.style.border = '1px solid #cbd5e1';
  b2.style.padding = '4px 10px';
  b2.style.fontSize = '0.8rem';
  b2.textContent = '⑵ 45와 54';

  b1.onclick = () => {
    currentPair = 'pair1';
    b1.className = 'btn btn-primary';
    b1.style.background = '#4f46e5';
    b1.style.color = '#ffffff';
    b2.className = 'btn';
    b2.style.background = '#ffffff';
    b2.style.color = '#334155';
    draw();
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(550, 'sine', 0.08);
  };

  b2.onclick = () => {
    currentPair = 'pair2';
    b2.className = 'btn btn-primary';
    b2.style.background = '#4f46e5';
    b2.style.color = '#ffffff';
    b1.className = 'btn';
    b1.style.background = '#ffffff';
    b1.style.color = '#334155';
    draw();
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(600, 'sine', 0.08);
  };

  tabRow.appendChild(b1);
  tabRow.appendChild(b2);
  container.appendChild(tabRow);
  draw();
}

    ctx.fillText(`🐸 개구리 수직선 점프 레이스 (${stepA}와 ${stepB}의 공배수)`, w / 2, 35);

    // Number line rails
    const railY1 = h * 0.38;
    const railY2 = h * 0.65;
    const startX = 50;
    const endX = w - 50;
    const railLen = endX - startX;

    // Draw rails
    [railY1, railY2].forEach((ry, rIdx) => {
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(startX, ry);
      ctx.lineTo(endX, ry);
      ctx.stroke();

      ctx.fillStyle = rIdx === 0 ? '#3b82f6' : '#f97316';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${rIdx === 0 ? stepA : stepB}의 배수 레일`, startX, ry - 35);
    });

    // Draw Common Multiple Highlight Columns
    commonMults.forEach(cm => {
      const cx = startX + (cm / maxVal) * railLen;
      const isLcm = (cm === lcm);

      // Light column
      ctx.fillStyle = isLcm ? 'rgba(234, 179, 8, 0.15)' : 'rgba(16, 185, 129, 0.12)';
      ctx.fillRect(cx - 16, railY1 - 25, 32, railY2 - railY1 + 50);

      // Dotted line
      ctx.strokeStyle = isLcm ? '#eab308' : '#10b981';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(cx, railY1 - 25);
      ctx.lineTo(cx, railY2 + 25);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.textAlign = 'center';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = isLcm ? '#ca8a04' : '#059669';
      ctx.fillText(isLcm ? `🏆 최소공배수 ${cm}` : `공배수 ${cm}`, cx, railY2 + 42);
    });

    // Frog A (stepA)
    const curValA = progress * maxVal;
    const hopsA = Math.floor(curValA / stepA);
    const hopProgressA = (curValA % stepA) / stepA;
    const hopX1 = startX + ((hopsA * stepA) / maxVal) * railLen;
    const hopX2 = startX + (((hopsA + 1) * stepA) / maxVal) * railLen;
    const curXA = hopX1 + (hopX2 - hopX1) * hopProgressA;
    const jumpH_A = Math.sin(hopProgressA * Math.PI) * 28;
    const curYA = railY1 - jumpH_A;

    // Draw Frog A
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.arc(curXA, curYA, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillText('🐸', curXA, curYA + 4);

    // Frog B (stepB)
    const curValB = progress * maxVal;
    const hopsB = Math.floor(curValB / stepB);
    const hopProgressB = (curValB % stepB) / stepB;
    const hopX1_B = startX + ((hopsB * stepB) / maxVal) * railLen;
    const hopX2_B = startX + (((hopsB + 1) * stepB) / maxVal) * railLen;
    const curXB = hopX1_B + (hopX2_B - hopX1_B) * hopProgressB;
    const jumpH_B = Math.sin(hopProgressB * Math.PI) * 28;
    const curYB = railY2 - jumpH_B;

    // Draw Frog B
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.arc(curXB, curYB, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillText('🐸', curXB, curYB + 4);

    // Current Value Banner
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText(`두 개구리가 동시에 착지하는 위치 = 공배수 { ${commonMults.join(', ')} ... }`, w / 2, h - 25);

    animId = requestAnimationFrame(draw);
  }

  // Toggle buttons
  const tabRow = document.createElement('div');
  tabRow.style.position = 'absolute';
  tabRow.style.top = '10px';
  tabRow.style.right = '10px';
  tabRow.style.display = 'flex';

  b1.onclick = () => {

function drawCanvas_1_1(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;

  // Numbers 1 to 12
  const numbers = [];
  for (let i = 1; i <= 12; i++) {
    // compute divisors
    let divs = [];
    for (let d = 1; d <= i; d++) {
      if (i % d === 0) divs.push(d);
    }
    const cat = (divs.length === 1) ? 1 : (divs.length === 2 ? 2 : 3);
    const colIdx = (i - 1) % 6;
    const rowIdx = Math.floor((i - 1) / 6);
    numbers.push({
      val: i,
      divs: divs,
      cat: cat,
      x: 60 + colIdx * 75,
      y: 60 + rowIdx * 55,
      origX: 60 + colIdx * 75,
      origY: 60 + rowIdx * 55,
      r: 18,
      inBasket: 0
    });
  }

  let draggedNum = null;
  let dragOffset = { x: 0, y: 0 };

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('🧺 약수의 개수에 따른 자연수 분류기 (1부터 12까지)', w / 2, 28);

    // 3 Baskets
    const bW = (w - 60) / 3;
    const bH = 140;
    const bY = h - bH - 30;

    const baskets = [
      { id: 1, label: '약수가 1개', sub: '(자연수 1)', color: '#0284c7', bg: 'rgba(2, 132, 199, 0.08)' },
      { id: 2, label: '약수가 2개', sub: '(소수: 2, 3, 5, 7, 11)', color: '#4f46e5', bg: 'rgba(79, 70, 229, 0.08)' },
      { id: 3, label: '약수가 3개 이상', sub: '(합성수: 4, 6, 8, ...)', color: '#7c3aed', bg: 'rgba(124, 58, 237, 0.08)' }
    ];

    baskets.forEach((b, idx) => {
      const bx = 20 + idx * (bW + 10);
      ctx.fillStyle = b.bg;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(bx, bY, bW, bH, 12) : ctx.rect(bx, bY, bW, bH);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = b.color;
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText(b.label, bx + bW / 2, bY + 24);
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(b.sub, bx + bW / 2, bY + 40);
    });

    // Draw Numbers
    numbers.forEach(n => {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.12)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;

      let ballColor = '#3b82f6';
      if (n.inBasket === 1) ballColor = '#0284c7';
      if (n.inBasket === 2) ballColor = '#4f46e5';
      if (n.inBasket === 3) ballColor = '#7c3aed';

      ctx.fillStyle = ballColor;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText(String(n.val), n.x, n.y);
    });

    // Bottom Guide
    ctx.textAlign = 'center';
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('💡 수 공을 드래그하여 알맞은 약수 개수 바구니에 담아보세요.', w / 2, h - 8);

    animId = requestAnimationFrame(draw);
  }

  // Pointer events
  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    for (let i = numbers.length - 1; i >= 0; i--) {
      const n = numbers[i];
      if (Math.hypot(mx - n.x, my - n.y) <= n.r) {
        draggedNum = n;
        dragOffset.x = mx - n.x;
        dragOffset.y = my - n.y;
        canvas.setPointerCapture(e.pointerId);
        break;
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!draggedNum) return;
    const rect = canvas.getBoundingClientRect();
    draggedNum.x = e.clientX - rect.left - dragOffset.x;
    draggedNum.y = e.clientY - rect.top - dragOffset.y;
  });

  const stopDrag = () => {
    if (!draggedNum) return;
    const w = canvas.width;
    const h = canvas.height;
    const bW = (w - 60) / 3;
    const bH = 140;
    const bY = h - bH - 30;

    let targetBasket = 0;
    for (let idx = 0; idx < 3; idx++) {
      const bx = 20 + idx * (bW + 10);
      if (draggedNum.x >= bx && draggedNum.x <= bx + bW && draggedNum.y >= bY && draggedNum.y <= bY + bH) {
        targetBasket = idx + 1;
        break;
      }
    }

    if (targetBasket > 0) {
      draggedNum.inBasket = targetBasket;
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(targetBasket === draggedNum.cat ? 620 : 300, 'sine', 0.1);
    } else {
      draggedNum.inBasket = 0;
    }
    draggedNum = null;
  };

  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);

  // Auto classify button
  const btnAuto = document.createElement('button');
  btnAuto.className = 'btn btn-sky';
  btnAuto.style.position = 'absolute';
  btnAuto.style.top = '10px';
  btnAuto.style.right = '10px';
  btnAuto.style.padding = '4px 10px';
  btnAuto.style.fontSize = '0.78rem';
  btnAuto.textContent = '✨ 자동 분류 예시';
  btnAuto.onclick = () => {
    const w = canvas.width;
    const h = canvas.height;
    const bW = (w - 60) / 3;
    const bH = 140;
    const bY = h - bH - 30;

    let counts = { 1: 0, 2: 0, 3: 0 };
    numbers.forEach(n => {
      n.inBasket = n.cat;
      const idx = n.cat - 1;
      const bx = 20 + idx * (bW + 10);
      const slot = counts[n.cat]++;
      n.x = bx + 25 + (slot % 3) * 35;
      n.y = bY + 65 + Math.floor(slot / 3) * 32;
    });
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(550, 'sine', 0.1);
  };
  container.appendChild(btnAuto);

  draw();
}

function drawCanvas_1_3(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  const items = [
    { num: 13, divs: [1, 13], isPrime: true, stamp: null },
    { num: 15, divs: [1, 3, 5, 15], isPrime: false, stamp: null },
    { num: 20, divs: [1, 2, 4, 5, 10, 20], isPrime: false, stamp: null },
    { num: 23, divs: [1, 23], isPrime: true, stamp: null },
    { num: 29, divs: [1, 29], isPrime: true, stamp: null }
  ];

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('🔖 [문제 1] 5개 수 카드 약수 분석 및 도장 날인기', w / 2, 35);

    const cardW = 90;
    const cardH = 140;
    const gap = (w - cardW * 5) / 6;

    items.forEach((item, idx) => {
      const cx = gap + idx * (cardW + gap);
      const cy = 70;

      // Card Box
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cx, cy, cardW, cardH, 10) : ctx.rect(cx, cy, cardW, cardH);
      ctx.fill();
      ctx.stroke();

      // Number
      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 24px Pretendard, sans-serif';
      ctx.fillText(String(item.num), cx + cardW / 2, cy + 40);

      // Divisors info
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(`약수 (${item.divs.length}개):`, cx + cardW / 2, cy + 68);
      ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillText(item.divs.join(','), cx + cardW / 2, cy + 86);

      // Stamp button area
      if (item.stamp) {
        ctx.save();
        ctx.translate(cx + cardW / 2, cy + 115);
        ctx.rotate(-0.15);
        ctx.strokeStyle = item.stamp === '소수' ? '#4f46e5' : '#059669';
        ctx.lineWidth = 2;
        ctx.strokeRect(-30, -12, 60, 24);
        ctx.fillStyle = item.stamp === '소수' ? '#4f46e5' : '#059669';
        ctx.font = 'bold 13px Pretendard, sans-serif';
        ctx.fillText(item.stamp, 0, 4);
        ctx.restore();
      } else {
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '10px Pretendard, sans-serif';
        ctx.fillText('클릭하여 판별', cx + cardW / 2, cy + 120);
      }
    });

    // Summary Box
    const sy = h - 140;
    ctx.fillStyle = '#f8fafc';
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(30, sy, w - 60, 110, 12) : ctx.rect(30, sy, w - 60, 110);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#4f46e5';
    ctx.fillText('🔵 소수 (약수가 2개뿐인 수):', 50, sy + 35);
    ctx.font = '13px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('13 (약수 1, 13), 23 (약수 1, 23), 29 (약수 1, 29)', 240, sy + 35);

    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#059669';
    ctx.fillText('🟢 합성수 (약수가 3개 이상인 수):', 50, sy + 75);
    ctx.font = '13px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('15 (약수 1, 3, 5, 15), 20 (약수 1, 2, 4, 5, 10, 20)', 240, sy + 75);
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const w = canvas.width;
    const cardW = 90;
    const cardH = 140;
    const gap = (w - cardW * 5) / 6;

    items.forEach((item, idx) => {
      const cx = gap + idx * (cardW + gap);
      const cy = 70;
      if (mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH) {
        item.stamp = item.isPrime ? '소수' : '합성수';
        if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(item.isPrime ? 650 : 500, 'sine', 0.1);
        draw();
      }
    });
  });

  draw();
}

// 1-4 (p.11): 에라토스테네스의 체
// -------------------------------------------------------------
function drawCanvas_1_4(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  // 1 to 50 grid
  const cells = [];
  for (let i = 1; i <= 50; i++) {
    cells.push({ num: i, state: 'normal' }); // normal, crossed, prime
  }

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('🏛️ 에라토스테네스의 체 (1부터 50까지 소수 걸러내기)', w / 2, 30);

    // Grid: 5 rows x 10 cols
    const cols = 10;
    const rows = 5;
    const cellW = (w - 60) / cols;
    const cellH = 46;
    const startX = 30;
    const startY = 55;

    cells.forEach((c, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const x = startX + col * cellW;
      const y = startY + row * cellH;

      ctx.fillStyle = (c.state === 'prime') ? '#e0e7ff' : (c.state === 'crossed' ? '#f1f5f9' : '#ffffff');
      ctx.strokeStyle = (c.state === 'prime') ? '#4f46e5' : '#cbd5e1';
      ctx.lineWidth = (c.state === 'prime') ? 2 : 1;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x + 2, y + 2, cellW - 4, cellH - 4, 6) : ctx.rect(x + 2, y + 2, cellW - 4, cellH - 4);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = (c.state === 'prime') ? '#4f46e5' : (c.state === 'crossed' ? '#94a3b8' : '#1e293b');
      ctx.fillText(String(c.num), x + cellW / 2, y + cellH / 2);

      if (c.state === 'crossed') {
        // Red cross
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(x + 8, y + 8);
        ctx.lineTo(x + cellW - 8, y + cellH - 8);
        ctx.moveTo(x + cellW - 8, y + 8);
        ctx.lineTo(x + 8, y + cellH - 8);
        ctx.stroke();
      } else if (c.state === 'prime') {
        // Circle around prime
        ctx.strokeStyle = '#4f46e5';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x + cellW / 2, y + cellH / 2, 14, 0, Math.PI * 2);
        ctx.stroke();
      }
    });

    // Count primes
    const primeCount = cells.filter(c => c.state === 'prime').length;
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#059669';
    ctx.fillText(`현재 걸러진 소수 개수: ${primeCount}개`, w / 2, startY + rows * cellH + 30);
  }

  // Stepper controls
  const ctrlRow = document.createElement('div');
  ctrlRow.style.position = 'absolute';
  ctrlRow.style.bottom = '12px';
  ctrlRow.style.left = '50%';
  ctrlRow.style.transform = 'translateX(-50%)';
  ctrlRow.style.display = 'flex';
  ctrlRow.style.gap = '6px';
  ctrlRow.style.zIndex = '20';

  function applyStep(step) {
    if (step === 1) {
      // 1 is not prime
      cells[0].state = 'crossed';
    } else if (step === 2) {
      // 2 is prime, cross multiples of 2
      cells[1].state = 'prime';
      for (let i = 4; i <= 50; i += 2) cells[i - 1].state = 'crossed';
    } else if (step === 3) {
      // 3 is prime, cross multiples of 3
      cells[2].state = 'prime';
      for (let i = 6; i <= 50; i += 3) cells[i - 1].state = 'crossed';
    } else if (step === 5) {
      // 5 is prime, cross multiples of 5
      cells[4].state = 'prime';
      for (let i = 10; i <= 50; i += 5) cells[i - 1].state = 'crossed';
    } else if (step === 7) {
      // 7 is prime, cross multiples of 7
      cells[6].state = 'prime';
      for (let i = 14; i <= 50; i += 7) cells[i - 1].state = 'crossed';
    } else if (step === 'all') {
      applyStep(1);
      applyStep(2);
      applyStep(3);
      applyStep(5);
      applyStep(7);
      cells.forEach(c => {
        if (c.state === 'normal') c.state = 'prime';
      });
    } else if (step === 'reset') {
      cells.forEach(c => c.state = 'normal');
    }
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(520, 'sine', 0.08);
    draw();
  }

  const btnStep1 = document.createElement('button');
  btnStep1.className = 'btn';
  btnStep1.style.background = '#ffffff';
  btnStep1.style.border = '1px solid #cbd5e1';
  btnStep1.style.padding = '4px 8px';
  btnStep1.style.fontSize = '0.78rem';
  btnStep1.textContent = '1 지우기';
  btnStep1.onclick = () => applyStep(1);

  const btnStep2 = document.createElement('button');
  btnStep2.className = 'btn';
  btnStep2.style.background = '#ffffff';
  btnStep2.style.border = '1px solid #cbd5e1';
  btnStep2.style.padding = '4px 8px';
  btnStep2.style.fontSize = '0.78rem';
  btnStep2.textContent = '2 배수 지우기';
  btnStep2.onclick = () => applyStep(2);

  const btnStep3 = document.createElement('button');
  btnStep3.className = 'btn';
  btnStep3.style.background = '#ffffff';
  btnStep3.style.border = '1px solid #cbd5e1';
  btnStep3.style.padding = '4px 8px';
  btnStep3.style.fontSize = '0.78rem';
  btnStep3.textContent = '3 배수 지우기';
  btnStep3.onclick = () => applyStep(3);

  const btnAll = document.createElement('button');
  btnAll.className = 'btn btn-primary';
  btnAll.style.padding = '4px 10px';
  btnAll.style.fontSize = '0.78rem';
  btnAll.textContent = '✨ 전체 체 완성';
  btnAll.onclick = () => applyStep('all');

  const btnReset = document.createElement('button');
  btnReset.className = 'btn';
  btnReset.style.background = '#f1f5f9';
  btnReset.style.border = '1px solid #cbd5e1';
  btnReset.style.padding = '4px 8px';
  btnReset.style.fontSize = '0.78rem';
  btnReset.textContent = '🔄 초기화';
  btnReset.onclick = () => applyStep('reset');

  ctrlRow.appendChild(btnStep1);
  ctrlRow.appendChild(btnStep2);
  ctrlRow.appendChild(btnStep3);
  ctrlRow.appendChild(btnAll);
  ctrlRow.appendChild(btnReset);
  container.appendChild(ctrlRow);

  draw();
}

  box.innerHTML = `
    <div class="card">
      <div style="font-weight:800; font-size:1.02rem; margin-bottom:8px; color:#1e293b;">
        🔍 [생각 나누기] 에라토스테네스의 체 (p.11)

function drawCanvas_1_5(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let currentBase = 2;
  let currentExp = 3;

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('⚡ 거듭제곱과 밑·지수의 시각화 인터랙터 (p.12)', w / 2, 35);

    // Center Big Expression: Base^Exp
    const cx = w / 2;
    const cy = 140;

    // Base Box
    ctx.fillStyle = '#eff6ff';
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx - 50, cy - 40, 70, 80, 12) : ctx.rect(cx - 50, cy - 40, 70, 80);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#1d4ed8';
    ctx.font = 'bold 44px Pretendard, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(currentBase), cx - 15, cy + 16);

    // Base Label Arrow
    ctx.fillStyle = '#1d4ed8';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText('밑 (Base)', cx - 15, cy + 65);
    ctx.font = '11px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('곱하는 수', cx - 15, cy + 82);

    // Exponent Box
    ctx.fillStyle = '#fef2f2';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx + 30, cy - 55, 48, 55, 10) : ctx.rect(cx + 30, cy - 55, 48, 55);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#dc2626';
    ctx.font = 'bold 28px Pretendard, sans-serif';
    ctx.fillText(String(currentExp), cx + 54, cy - 16);

    // Exponent Label Arrow
    ctx.fillStyle = '#dc2626';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText('지수 (Exponent)', cx + 54, cy - 70);
    ctx.font = '11px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('곱한 횟수', cx + 54, cy - 88);

    // Expanded Multiplication Formula
    const factors = Array(currentExp).fill(currentBase);
    const expandedStr = factors.join(' × ');
    const computedVal = Math.pow(currentBase, currentExp);

    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 16px Pretendard, sans-serif';
    ctx.fillText(`${expandedStr} = ${computedVal}`, w / 2, cy + 130);

    ctx.font = '13px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(`${currentBase}를 ${currentExp}번 곱한 것을 통틀어 '${currentBase}의 거듭제곱'이라 부릅니다.`, w / 2, cy + 155);

    // Bottom Controller Guide
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('👇 아래 버튼으로 밑과 지수를 조절해 보세요.', w / 2, h - 50);
  }

  // Controller Row
  const ctrlRow = document.createElement('div');
  ctrlRow.style.position = 'absolute';
  ctrlRow.style.bottom = '12px';
  ctrlRow.style.left = '50%';
  ctrlRow.style.transform = 'translateX(-50%)';
  ctrlRow.style.display = 'flex';
  ctrlRow.style.gap = '10px';
  ctrlRow.style.alignItems = 'center';
  ctrlRow.style.zIndex = '20';

  // Base buttons
  const baseLabel = document.createElement('span');
  baseLabel.style.fontSize = '0.82rem';
  baseLabel.style.fontWeight = '700';
  baseLabel.textContent = '밑:';
  ctrlRow.appendChild(baseLabel);

  [2, 3, 5].forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.style.padding = '3px 8px';
    btn.style.fontSize = '0.78rem';
    btn.style.background = (currentBase === b) ? '#3b82f6' : '#ffffff';
    btn.style.color = (currentBase === b) ? '#ffffff' : '#1e293b';
    btn.style.border = '1px solid #cbd5e1';
    btn.textContent = String(b);
    btn.onclick = () => {
      currentBase = b;
      draw();
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(480, 'sine', 0.08);
    };
    ctrlRow.appendChild(btn);
  });

  // Exponent slider
  const expLabel = document.createElement('span');
  expLabel.style.fontSize = '0.82rem';
  expLabel.style.fontWeight = '700';
  expLabel.style.marginLeft = '10px';
  expLabel.textContent = '지수:';
  ctrlRow.appendChild(expLabel);

  [1, 2, 3, 4, 5].forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.style.padding = '3px 8px';
    btn.style.fontSize = '0.78rem';
    btn.style.background = (currentExp === e) ? '#ef4444' : '#ffffff';
    btn.style.color = (currentExp === e) ? '#ffffff' : '#1e293b';
    btn.style.border = '1px solid #cbd5e1';
    btn.textContent = String(e);
    btn.onclick = () => {
      currentExp = e;
      draw();
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(580, 'sine', 0.08);
    };
    ctrlRow.appendChild(btn);
  });

  container.appendChild(ctrlRow);
  draw();
}

// -------------------------------------------------------------
// 1-8 (p.13): 생각열기: 열차 배수 승객 내리기
// -------------------------------------------------------------
function drawCanvas_1_8(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let selectedStation = 25;

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('🚆 열차 배수 승객 하차 시뮬레이터 (1번부터 30번 역)', w / 2, 30);

    // Draw Stations grid: 3 rows of 10
    const cols = 10;
    const rows = 3;
    const cellW = (w - 50) / cols;
    const cellH = 40;
    const startX = 25;
    const startY = 55;

    for (let i = 1; i <= 30; i++) {
      const col = (i - 1) % cols;
      const row = Math.floor((i - 1) / cols);
      const x = startX + col * cellW;
      const y = startY + row * cellH;
      const isSel = (i === selectedStation);

      ctx.fillStyle = isSel ? '#eff6ff' : '#ffffff';
      ctx.strokeStyle = isSel ? '#3b82f6' : '#cbd5e1';
      ctx.lineWidth = isSel ? 2.5 : 1;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x + 2, y + 2, cellW - 4, cellH - 4, 6) : ctx.rect(x + 2, y + 2, cellW - 4, cellH - 4);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = isSel ? 'bold 13px Pretendard, sans-serif' : '12px Pretendard, sans-serif';
      ctx.fillStyle = isSel ? '#1d4ed8' : '#334155';
      ctx.fillText(String(i), x + cellW / 2, y + cellH / 2);
    }

    // Detail for selected station
    const divs = [];
    for (let d = 1; d <= selectedStation; d++) {
      if (selectedStation % d === 0) divs.push(d);
    }

    const dy = startY + rows * cellH + 30;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#4f46e5';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(30, dy, w - 60, 130, 12) : ctx.rect(30, dy, w - 60, 130);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 16px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText(`📍 ${selectedStation}번 역 하차 분석`, w / 2, dy + 30);

    ctx.font = '13px Pretendard, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText(`정차한 열차(약수): [ ${divs.join('번째, ')}번째 열차 ]`, w / 2, dy + 60);

    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#4f46e5';
    ctx.fillText(`총 하차 승객 수: ${divs.length}명 (${selectedStation}의 약수의 개수)`, w / 2, dy + 90);

    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = divs.length === 2 ? '#059669' : '#64748b';
    ctx.fillText(divs.length === 2 ? '★ 내린 승객이 2명인 역 ➔ 약수가 2개뿐인 소수(Prime) 역!' : '내린 승객 수 = 역 번호의 약수의 개수', w / 2, dy + 115);

    // Guide
    ctx.font = '11px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('💡 위의 역 번호 타일을 클릭하여 각 역의 승객 수를 탐색해 보세요.', w / 2, h - 15);
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const w = canvas.width;
    const cols = 10;
    const cellW = (w - 50) / cols;
    const cellH = 40;
    const startX = 25;
    const startY = 55;

    for (let i = 1; i <= 30; i++) {
      const col = (i - 1) % cols;
      const row = Math.floor((i - 1) / cols);
      const x = startX + col * cellW;
      const y = startY + row * cellH;
      if (mx >= x && mx <= x + cellW && my >= y && my <= y + cellH) {
        selectedStation = i;
        if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(500, 'sine', 0.08);
        draw();
        break;
      }
    }
  });

  draw();
}

  } else {
    let wrong = [];
    if (!ok1) wrong.push('⑴ 5^4');
    if (!ok2) wrong.push('⑵ 2*3^2*5');

      ctx.stroke();

      ctx.textAlign = 'left';

      ctx.fillStyle = '#475569';
      ctx.fillText(`➔ ${s.reason}`, 40, y + 58);

      ctx.textAlign = 'right';
      ctx.font = 'bold 22px Pretendard, sans-serif';
      ctx.fillStyle = s.isTrue ? '#16a34a' : '#dc2626';
      ctx.fillText(s.isTrue ? 'O' : 'X', w - 45, y + 46);
    });

    ctx.textAlign = 'center';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#4f46e5';
    ctx.fillText('따라서 옳은 보기: ㄷ, ㄹ', w / 2, h - 20);
  }

  draw();
}
