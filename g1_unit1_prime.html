    } else if (isAccent) {
      btn.style.background = '#fef3c7';
      btn.style.color = '#92400e';
      btn.style.border = '1px solid #fde68a';
    } else {
      btn.style.background = '#ffffff';
      btn.style.color = '#334155';
      btn.style.border = '1px solid #cbd5e1';
    }
    btn.innerHTML = label;
    btn.onclick = onClick;
    return btn;
  }

  const nextTrainBtn = createBtn('🚂 다음 열차 운행 (+1호차)', () => runNextTrain());
  const allTrainBtn = createBtn('⚡ 30호차까지 전체 운행', () => runAllTrains(), true);
  const focus25Btn = createBtn('🔍 25번 역 포커스', () => {
    selectedStation = 25;
    stations[24].pulse = 1.2;
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(650, 'sine', 0.1);
  }, false, true);

  ctrlRow.appendChild(nextTrainBtn);
  ctrlRow.appendChild(allTrainBtn);
  ctrlRow.appendChild(focus25Btn);

  function runNextTrain() {
    if (currentTrain >= 30) return;
    currentTrain++;
    stations.forEach(st => {
      if (st.id % currentTrain === 0) {
        st.passengers.push(currentTrain);
        st.pulse = 1.0;
      }
    });

    if (window.SoundFX && window.SoundFX.playTone) {
      SoundFX.playTone(380 + currentTrain * 14, 'sine', 0.08);
    }

    if (currentTrain === 30 && !allRunDone) {
      allRunDone = true;
      createConfetti();
      if (window.SoundFX && window.SoundFX.success) SoundFX.success();
    }
  }

  function runAllTrains() {
    stations.forEach(st => {
      st.passengers = [];
      for (let tNum = 1; tNum <= 30; tNum++) {
        if (st.id % tNum === 0) {
          st.passengers.push(tNum);
        }
      }
      st.pulse = 1.0;
    });
    currentTrain = 30;
    allRunDone = true;
    createConfetti();
    if (window.SoundFX && window.SoundFX.success) SoundFX.success();
  }

  function resetSimulation() {
    stations.forEach(st => {
      st.passengers = [];
      st.pulse = 0;
    });
    currentTrain = 0;
    allRunDone = false;
    particles = [];
    if (window.SoundFX && window.SoundFX.click) SoundFX.click();
  }

  // 파티클
  let particles = [];
  function createConfetti() {
    particles = [];
    const colors = ['#f59e0b', '#fbbf24', '#4f46e5', '#10b981', '#ec4899', '#3b82f6'];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: w / 2 + (Math.random() - 0.5) * 200,
        y: 120 + (Math.random() - 0.5) * 60,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 10 - 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 7 + 4,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        life: 1.0,
        decay: Math.random() * 0.01 + 0.007
      });
    }
  }

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    w = rect.width || 560;
    h = rect.height || 500;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();

  // 역 클릭 이벤트
  let pointerX = -1;
  let pointerY = -1;

  function getStationLayouts() {
    const cols = 10;
    const rows = 3;
    const startX = 14;
    const startY = 56;
    const availW = w - startX * 2;
    const gapX = 4;
    const gapY = 16;
    const cellW = (availW - (cols - 1) * gapX) / cols;
    const cellH = 50;

    return stations.map((st, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const x = startX + col * (cellW + gapX);
      const y = startY + row * (cellH + gapY);

      return {
        st,
        idx,
        x,
        y,
        w: cellW,
        h: cellH,
        row
      };
    });
  }

  function handlePointer(e, type) {
    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;
    pointerY = e.clientY - rect.top;

    const layouts = getStationLayouts();

    if (type === 'move') {
      let anyHover = false;
      layouts.forEach(l => {
        const inBox = (pointerX >= l.x && pointerX <= l.x + l.w && pointerY >= l.y && pointerY <= l.y + l.h);
        l.st.hover = inBox;
        if (inBox) anyHover = true;
      });
      canvas.style.cursor = anyHover ? 'pointer' : 'default';
    } else if (type === 'down') {
      layouts.forEach(l => {
        if (pointerX >= l.x && pointerX <= l.x + l.w && pointerY >= l.y && pointerY <= l.y + l.h) {
          selectedStation = l.st.id;
          l.st.pulse = 1.0;
          if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(520, 'sine', 0.08);
        }
      });
    }
  }

  canvas.addEventListener('pointermove', (e) => handlePointer(e, 'move'));
  canvas.addEventListener('pointerdown', (e) => handlePointer(e, 'down'));
  canvas.addEventListener('pointerleave', () => {
    pointerX = -1;
    pointerY = -1;
    stations.forEach(s => s.hover = false);
  });

  let t = 0;
  function animate() {
    t += 0.04;
    ctx.clearRect(0, 0, w, h);

    const layouts = getStationLayouts();

    // 1. 철로 레일 배경 라인
    ctx.save();
    for (let r = 0; r < 3; r++) {
      const rowLayouts = layouts.filter(l => l.row === r);
      if (rowLayouts.length > 0) {
        const ry = rowLayouts[0].y + rowLayouts[0].h / 2;
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(rowLayouts[0].x, ry);
        ctx.lineTo(rowLayouts[rowLayouts.length - 1].x + rowLayouts[0].w, ry);
        ctx.stroke();

        // 침목(Sleeper) 효과
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        rowLayouts.forEach(l => {
          ctx.beginPath();
          ctx.moveTo(l.x + l.w / 2, ry - 14);
          ctx.lineTo(l.x + l.w / 2, ry + 14);
          ctx.stroke();
        });
      }
    }
    ctx.restore();

    // 2. 30개 역 타일 렌더링
    layouts.forEach(l => {
      const { st, x, y, w: cw, h: ch } = l;

      // 펄스 이징
      if (st.pulse > 0) {
        st.pulse -= 0.04;
        if (st.pulse < 0) st.pulse = 0;
      }

      const isSel = (st.id === selectedStation);
      const isPrime = (allRunDone && st.passengers.length === 2);

      ctx.save();
      // 그림자
      if (isSel) {
        ctx.shadowColor = 'rgba(79, 70, 229, 0.35)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 2;
      } else if (isPrime) {
        ctx.shadowColor = 'rgba(245, 158, 11, 0.45)';
        ctx.shadowBlur = 8 + Math.sin(t * 3) * 3;
      }

      // 배경 및 테두리
      ctx.fillStyle = isSel ? '#eef2ff' : (isPrime ? '#fefce8' : (st.hover ? '#f8fafc' : '#ffffff'));
      ctx.strokeStyle = isSel ? '#4f46e5' : (isPrime ? '#f59e0b' : '#cbd5e1');
      ctx.lineWidth = isSel ? 2.5 : (isPrime ? 2 : 1);

      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, cw, ch, 8);
      } else {
        ctx.rect(x, y, cw, ch);
      }
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 역 번호 (상단)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = isSel ? 'bold 13px Pretendard, sans-serif' : 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = isSel ? '#4338ca' : (isPrime ? '#b45309' : '#1e293b');
      ctx.fillText(String(st.id), x + cw / 2, y + 16);

      // 내린 승객 수 배지 (하단)
      const count = st.passengers.length;
      ctx.save();
      ctx.fillStyle = isPrime ? '#f59e0b' : (count > 0 ? '#3b82f6' : '#e2e8f0');
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x + 3, y + 28, cw - 6, 17, 4);
      } else {
        ctx.rect(x + 3, y + 28, cw - 6, 17);
      }
      ctx.fill();

      ctx.fillStyle = count > 0 ? '#ffffff' : '#64748b';
      ctx.font = 'bold 9.5px Pretendard, sans-serif';
      ctx.fillText(`${count}명`, x + cw / 2, y + 36.5);
      ctx.restore();

      // 펄스 하이라이트 링
      if (st.pulse > 0) {
        ctx.save();
        ctx.strokeStyle = `rgba(79, 70, 229, ${st.pulse})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 2, y - 2, cw + 4, ch + 4);
        ctx.restore();
      }
    });

    // 3. 하단 상세 분석 정보 카드
    const cardY = 270;
    const cardW = Math.min(w - 28, 524);
    const cardH = 168;
    const cardX = (w - cardW) / 2;

    const curSt = stations[selectedStation - 1];
    const isPrimeStation = (allRunDone && curSt.passengers.length === 2);

    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = isPrimeStation ? '#f59e0b' : '#4f46e5';
    ctx.lineWidth = 1.8;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.05)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;

    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(cardX, cardY, cardW, cardH, 14);
    } else {
      ctx.rect(cardX, cardY, cardW, cardH);
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // 카드 헤더
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillStyle = isPrimeStation ? '#b45309' : '#1e293b';
    ctx.fillText(`📍 [ ${selectedStation}번 역 ] 승객 하차 정밀 분석`, cardX + 18, cardY + 24);

    // 진행 상태 안내 배지
    ctx.textAlign = 'right';
    ctx.font = 'bold 11px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(`현재 운행: ${currentTrain} / 30호차`, cardX + cardW - 18, cardY + 24);

    // 내린 열차 목록
    ctx.textAlign = 'left';
    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#475569';
    ctx.fillText('정차한 열차(역 번호의 약수):', cardX + 18, cardY + 54);

    // 열차 번호 태그 칩
    let tagX = cardX + 18;
    const tagY = cardY + 70;
    if (curSt.passengers.length === 0) {
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11.5px Pretendard, sans-serif';
      ctx.fillText('아직 정차한 열차가 없습니다. 아래 [다음 열차 운행]을 눌러보세요.', tagX, tagY + 10);
    } else {
      curSt.passengers.forEach(p => {
        ctx.fillStyle = '#eff6ff';
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(tagX, tagY, 36, 22, 6);
        } else {
          ctx.rect(tagX, tagY, 36, 22);
        }
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1d4ed8';
        ctx.font = 'bold 11px Pretendard, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${p}호`, tagX + 18, tagY + 11);
        ctx.textAlign = 'left';

        tagX += 42;
      });
    }

    // 총 승객 수 강조
    const countY = cardY + 115;
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText(`총 내린 승객 수:`, cardX + 18, countY);

    ctx.font = 'bold 16px Pretendard, sans-serif';
    ctx.fillStyle = isPrimeStation ? '#d97706' : '#4f46e5';
    ctx.fillText(`${curSt.passengers.length}명`, cardX + 120, countY);

    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(`(${selectedStation}의 약수의 개수와 동일)`, cardX + 160, countY);

    // 수학적 성질 결론 배너
    const noteY = cardY + 144;
    ctx.font = 'bold 11.5px Pretendard, sans-serif';
    if (selectedStation === 25) {
      ctx.fillStyle = '#2563eb';
      ctx.fillText('💡 25번 역: 1, 5, 25번 열차가 정차하여 총 3명이 내립니다! (25는 5²인 합성수)', cardX + 18, noteY);
    } else if (isPrimeStation) {
      ctx.fillStyle = '#d97706';
      ctx.fillText('★ 승객이 2명인 역: 약수가 1과 자기 자신뿐인 [소수(Prime)] 역입니다!', cardX + 18, noteY);
    } else if (curSt.passengers.length > 2) {
      ctx.fillStyle = '#059669';
      ctx.fillText(`약수가 3개 이상인 합성수 역입니다. (승객 ${curSt.passengers.length}명)`, cardX + 18, noteY);
    } else {
      ctx.fillStyle = '#64748b';
      ctx.fillText('1번 역은 약수가 1개뿐이므로 승객이 1명만 내립니다.', cardX + 18, noteY);
    }

    // 4. 파티클
    if (particles.length > 0) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > h + 20) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }

    container._animId_1_8 = requestAnimationFrame(animate);
  }

  container._animId_1_8 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

function drawCanvas_1_9(container) {
  if (container._animId_1_9) {
    cancelAnimationFrame(container._animId_1_9);
  }
  container.innerHTML = '';

  const wrapper = document.createElement('div');

  wrapper.style.height = '100%';

  const canvas = document.createElement('canvas');
  canvas.style.width = '100%';
  canvas.style.height = '100%';

  const ctx = canvas.getContext('2d');

  // 데이터 모델
  const items = [

      revealed: false,

      shake: 0,
      scale: 1,
      targetScale: 1,
      stampAnim: 0,
      hint: '1 × 17 = 17'
    },
    {
      id: 3,
      num: 39,
      label: '⑶ 39',
      divs: [1, 3, 13, 39],
      count: 4,
      type: '합성수',
      revealed: false,
      tray: null,
      shake: 0,
      scale: 1,
      targetScale: 1,
      stampAnim: 0,
      hint: '3 × 13 = 39'
    },
    {
      id: 4,
      num: 53,
      label: '⑷ 53',
      divs: [1, 53],
      count: 2,
      type: '소수',
      revealed: false,
      tray: null,
      shake: 0,
      scale: 1,
      targetScale: 1,
      stampAnim: 0,
      hint: '1 × 53 = 53'
    }
  ];

  let particles = [];
  let confettiFired = false;
  let feedbackMsg = { text: '', color: '#64748b', time: 0 };
  let hoverInfo = null;

  function setFeedback(text, isError = false) {
    feedbackMsg = {
      text,
      color: isError ? '#ef4444' : '#2563eb',
      time: Date.now() + 4500
    };
  }

  function createConfetti() {
    const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: canvas.width / 2 + (Math.random() - 0.5) * 100,
        y: canvas.height * 0.45,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 10 - 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 7 + 4,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        life: 1.0,
        decay: Math.random() * 0.012 + 0.008
      });
    }
  }

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width || 560;
    const h = Math.max(490, rect.height || 490);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  resize();

  function revealCard(item) {
    if (!item.revealed) {
      item.revealed = true;
      item.targetScale = 1.05;
      setTimeout(() => { item.targetScale = 1; }, 180);
      if (window.SoundFX && window.SoundFX.click) SoundFX.click();
      setFeedback(`🔍 ${item.num}의 약수를 분해했습니다! 약수의 개수를 확인하고 트레이로 분류하세요.`);
    }
  }

  function classifyCard(item, targetTray) {
    if (item.tray) {
      setFeedback(`이미 [${item.tray === 'prime' ? '소수' : '합성수'}] 트레이에 분류되었습니다.`);
      return;
    }

    if (!item.revealed) {
      revealCard(item);
    }

    const isPrime = (item.type === '소수');
    const chosenPrime = (targetTray === 'prime');

    if (isPrime === chosenPrime) {
      item.tray = targetTray;
      item.stampAnim = 1.0;
      if (window.SoundFX && window.SoundFX.click) SoundFX.click();
      setFeedback(`✔ 올바른 분류! ${item.num}은(는) 약수가 [${item.divs.join(', ')}] ${item.count}개이므로 ${item.type}입니다.`);

      const allDone = items.every(it => it.tray !== null);
      if (allDone && !confettiFired) {
        confettiFired = true;
        createConfetti();
        if (window.SoundFX && window.SoundFX.success) SoundFX.success();
        setFeedback(`🎉 4개 수를 모두 올바르게 분류했습니다! 오른쪽 문제에 답을 적고 채점해 보세요.`);
      }
    } else {
      item.shake = 16;
      if (window.SoundFX && window.SoundFX.error) SoundFX.error();
      if (chosenPrime) {
        setFeedback(`❌ 오답입니다! ${item.num}의 약수는 [${item.divs.join(', ')}] 총 ${item.count}개입니다. 약수가 3개 이상이면 '합성수'입니다!`, true);
      } else {
        setFeedback(`❌ 오답입니다! ${item.num}의 약수는 [${item.divs.join(', ')}] 2개뿐입니다. 약수가 1과 자기 자신 2개뿐이면 '소수'입니다!`, true);
      }
    }
  }

  function resetAll() {
    items.forEach(it => {
      it.revealed = false;
      it.tray = null;
      it.shake = 0;
      it.scale = 1;
      it.stampAnim = 0;
    });
    particles = [];
    confettiFired = false;
    feedbackMsg = { text: '', color: '#64748b', time: 0 };
    if (window.SoundFX && window.SoundFX.click) SoundFX.click();
    setFeedback('⟲ 모든 카드를 초기화했습니다. 다시 탐구해 보세요!');
  }

  function getLayout(w, h) {
    const padX = 14;
    const cardY = 56;
    const cardH = 175;
    const gap = 10;
    const cardW = Math.max(80, (w - padX * 2 - gap * 3) / 4);

    const resetBtn = { x: w - 85, y: 12, w: 72, h: 26 };

    const trayY = cardY + cardH + 18;
    const trayH = Math.max(165, h - trayY - 34);
    const trayW = (w - padX * 2 - gap) / 2;

    const trayPrime = {
      x: padX,
      y: trayY,
      w: trayW,
      h: trayH,
      type: 'prime',
      title: '🔵 소수 트레이 (약수 2개)',
      sub: '1보다 큰 자연수 중 1과 자기 자신만을 약수로 가지는 수',
      accent: '#2563eb',
      bg: '#eff6ff',
      border: '#93c5fd'
    };

    const trayComp = {
      x: padX + trayW + gap,
      y: trayY,
      w: trayW,
      h: trayH,
      type: 'composite',
      title: '🟢 합성수 트레이 (약수 3개 이상)',
      sub: '1보다 큰 자연수 중 소수가 아닌 수 (약수가 3개 이상)',
      accent: '#059669',
      bg: '#ecfdf5',
      border: '#6ee7b7'
    };

    return { padX, cardY, cardH, gap, cardW, resetBtn, trayPrime, trayComp };
  }

  function hitTest(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const mx = clientX - rect.left;
    const my = clientY - rect.top;
    const w = rect.width;
    const h = rect.height;
    const layout = getLayout(w, h);

    if (mx >= layout.resetBtn.x && mx <= layout.resetBtn.x + layout.resetBtn.w &&
        my >= layout.resetBtn.y && my <= layout.resetBtn.y + layout.resetBtn.h) {
      return { type: 'btnReset' };
    }

    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const cx = layout.padX + i * (layout.cardW + layout.gap);
      const cy = layout.cardY;
      const cw = layout.cardW;
      const ch = layout.cardH;

      if (mx >= cx && mx <= cx + cw && my >= cy && my <= cy + ch) {
        if (!it.revealed) {
          return { type: 'card', index: i };
        } else if (!it.tray) {
          const btnY = cy + ch - 38;
          const btnH = 28;
          const btnW = (cw - 12) / 2;
          const pBtnX = cx + 4;
          const cBtnX = cx + 4 + btnW + 4;

          if (my >= btnY && my <= btnY + btnH) {
            if (mx >= pBtnX && mx <= pBtnX + btnW) {
              return { type: 'btnPrime', index: i };
            }
            if (mx >= cBtnX && mx <= cBtnX + btnW) {
              return { type: 'btnComp', index: i };
            }
          }
          return { type: 'card', index: i };
        } else {
          return { type: 'card', index: i };
        }
      }
    }

    return null;
  }

  canvas.addEventListener('click', (e) => {
    const hit = hitTest(e.clientX, e.clientY);
    if (!hit) return;

    if (hit.type === 'btnReset') {
      resetAll();
    } else if (hit.type === 'card') {
      const item = items[hit.index];
      if (!item.revealed) {
        revealCard(item);
      } else if (!item.tray) {
        setFeedback('하단의 [소수] 또는 [합성수] 버튼을 눌러 트레이에 분류해 보세요.');
      }
    } else if (hit.type === 'btnPrime') {
      classifyCard(items[hit.index], 'prime');
    } else if (hit.type === 'btnComp') {
      classifyCard(items[hit.index], 'composite');
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    const hit = hitTest(e.clientX, e.clientY);
    hoverInfo = hit;
    canvas.style.cursor = hit ? 'pointer' : 'default';
  });

  canvas.addEventListener('mouseleave', () => {
    hoverInfo = null;
    canvas.style.cursor = 'default';
  });

  function animate() {
    const rect = wrapper.getBoundingClientRect();
    const w = rect.width || 560;
    const h = Math.max(490, rect.height || 490);

    ctx.clearRect(0, 0, w, h);
    const layout = getLayout(w, h);

    // 1. 헤더 타이틀
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('⚖️ [스스로 확인하기 1] 약수 개수 탐구 & 수 분류 트레이 (p.13)', layout.padX, 24);

    // ⟲ 초기화 버튼
    const isResetHover = (hoverInfo && hoverInfo.type === 'btnReset');
    ctx.save();
    ctx.fillStyle = isResetHover ? '#f1f5f9' : '#ffffff';
    ctx.strokeStyle = isResetHover ? '#64748b' : '#cbd5e1';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(layout.resetBtn.x, layout.resetBtn.y, layout.resetBtn.w, layout.resetBtn.h, 6) : ctx.rect(layout.resetBtn.x, layout.resetBtn.y, layout.resetBtn.w, layout.resetBtn.h);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillStyle = isResetHover ? '#0f172a' : '#475569';
    ctx.fillText('⟲ 초기화', layout.resetBtn.x + layout.resetBtn.w / 2, layout.resetBtn.y + layout.resetBtn.h / 2);
    ctx.restore();

    // 2. 상단 4개 수 카드 렌더링
    items.forEach((it, idx) => {
      if (it.shake > 0) {
        it.shake *= 0.85;
        if (it.shake < 0.2) it.shake = 0;
      }
      it.scale += (it.targetScale - it.scale) * 0.18;
      if (it.stampAnim > 0) {
        it.stampAnim = Math.max(0, it.stampAnim - 0.06);
      }

      const cx = layout.padX + idx * (layout.cardW + layout.gap) + (it.shake ? Math.sin(Date.now() * 0.05) * it.shake : 0);
      const cy = layout.cardY;
      const cw = layout.cardW;
      const ch = layout.cardH;
      const isCardHover = (hoverInfo && hoverInfo.index === idx);

      ctx.save();
      let cardBg = '#ffffff';
      let cardBorder = '#cbd5e1';
      let borderWidth = 1.5;

      if (it.tray === 'prime') {
        cardBg = '#eff6ff';
        cardBorder = '#3b82f6';
        borderWidth = 2;
      } else if (it.tray === 'composite') {
        cardBg = '#ecfdf5';
        cardBorder = '#10b981';
        borderWidth = 2;
      } else if (isCardHover) {
        cardBorder = '#6366f1';
        borderWidth = 2;
      }

      ctx.fillStyle = cardBg;
      ctx.strokeStyle = cardBorder;
      ctx.lineWidth = borderWidth;
      ctx.shadowColor = isCardHover ? 'rgba(99, 102, 241, 0.15)' : 'rgba(0, 0, 0, 0.04)';
      ctx.shadowBlur = isCardHover ? 12 : 6;
      ctx.shadowOffsetY = isCardHover ? 4 : 2;

      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(cx, cy, cw, ch, 12) : ctx.rect(cx, cy, cw, ch);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(it.label, cx + cw / 2, cy + 18);

      ctx.font = 'bold 26px Pretendard, sans-serif';
      ctx.fillStyle = it.tray ? (it.tray === 'prime' ? '#1d4ed8' : '#047857') : '#1e293b';
      ctx.fillText(String(it.num), cx + cw / 2, cy + 45);

      if (!it.revealed) {
        const btnY = cy + 76;
        const btnH = 34;
        const btnW = cw - 20;
        const btnX = cx + 10;
        const isHover = (isCardHover && (!hoverInfo.type || hoverInfo.type === 'card'));

        ctx.fillStyle = isHover ? '#e0e7ff' : '#f1f5f9';
        ctx.strokeStyle = isHover ? '#6366f1' : '#cbd5e1';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(btnX, btnY, btnW, btnH, 8) : ctx.rect(btnX, btnY, btnW, btnH);
        ctx.fill();
        ctx.stroke();

        ctx.font = 'bold 12px Pretendard, sans-serif';
        ctx.fillStyle = isHover ? '#4338ca' : '#475569';
        ctx.fillText('🔍 약수 분해', cx + cw / 2, btnY + btnH / 2);

        ctx.font = '10.5px Pretendard, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('탭하여 약수 구슬 확인', cx + cw / 2, cy + ch - 22);
      } else {
        const beads = it.divs;
        if (beads.length === 2) {
          const bY = cy + 74;
          const r = 13;
          const spacing = 36;
          const startX = cx + cw / 2 - spacing / 2;

          beads.forEach((d, bIdx) => {
            const bx = startX + bIdx * spacing;
            ctx.fillStyle = '#dbeafe';
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(bx, bY, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 11px Pretendard, sans-serif';
            ctx.fillStyle = '#1e40af';
            ctx.fillText(String(d), bx, bY);
          });
        } else {
          const r = 11;
          const row1Y = cy + 68;
          const row2Y = cy + 92;
          const spacingX = 30;
          const bStartX = cx + cw / 2 - spacingX / 2;

          beads.forEach((d, bIdx) => {
            const bx = bStartX + (bIdx % 2) * spacingX;
            const by = (bIdx < 2) ? row1Y : row2Y;

            ctx.fillStyle = '#d1fae5';
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(bx, by, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.font = 'bold 10px Pretendard, sans-serif';
            ctx.fillStyle = '#065f46';
            ctx.fillText(String(d), bx, by);
          });
        }

        const countY = (beads.length === 2) ? cy + 104 : cy + 118;
        ctx.font = 'bold 11px Pretendard, sans-serif';
        if (it.count === 2) {
          ctx.fillStyle = '#2563eb';
          ctx.fillText(`약수 2개 (1, 자기 자신)`, cx + cw / 2, countY);
        } else {
          ctx.fillStyle = '#059669';
          ctx.fillText(`약수 ${it.count}개 (3개 이상)`, cx + cw / 2, countY);
        }

        if (!it.tray) {
          const btnY = cy + ch - 38;
          const btnH = 28;
          const btnW = (cw - 12) / 2;
          const pBtnX = cx + 4;
          const cBtnX = cx + 4 + btnW + 4;

          const isPHover = (hoverInfo && hoverInfo.type === 'btnPrime' && hoverInfo.index === idx);
          const isCHover = (hoverInfo && hoverInfo.type === 'btnComp' && hoverInfo.index === idx);

          ctx.fillStyle = isPHover ? '#3b82f6' : '#eff6ff';
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(pBtnX, btnY, btnW, btnH, 6) : ctx.rect(pBtnX, btnY, btnW, btnH);
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 11px Pretendard, sans-serif';
          ctx.fillStyle = isPHover ? '#ffffff' : '#1d4ed8';
          ctx.fillText('소수', pBtnX + btnW / 2, btnY + btnH / 2);

          ctx.fillStyle = isCHover ? '#10b981' : '#ecfdf5';
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(cBtnX, btnY, btnW, btnH, 6) : ctx.rect(cBtnX, btnY, btnW, btnH);
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 11px Pretendard, sans-serif';
          ctx.fillStyle = isCHover ? '#ffffff' : '#047857';
          ctx.fillText('합성수', cBtnX + btnW / 2, btnY + btnH / 2);
        } else {
          const stampY = cy + ch - 34;
          ctx.save();
          if (it.stampAnim > 0) {
            ctx.translate(cx + cw / 2, stampY);
            ctx.scale(1 + it.stampAnim * 0.6, 1 + it.stampAnim * 0.6);
            ctx.translate(-(cx + cw / 2), -stampY);
          }
          ctx.fillStyle = (it.tray === 'prime') ? '#2563eb' : '#059669';
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(cx + 8, stampY - 10, cw - 16, 22, 6) : ctx.rect(cx + 8, stampY - 10, cw - 16, 22);
          ctx.fill();

          ctx.font = 'bold 11px Pretendard, sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(`✔ ${it.tray === 'prime' ? '소수 분류' : '합성수 분류'}`, cx + cw / 2, stampY + 1);
          ctx.restore();
        }
      }
    });

    // 3. 하단 2대 분류 트레이 렌더링
    [layout.trayPrime, layout.trayComp].forEach(tr => {
      ctx.save();
      ctx.fillStyle = tr.bg;
      ctx.strokeStyle = tr.border;
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(tr.x, tr.y, tr.w, tr.h, 12) : ctx.rect(tr.x, tr.y, tr.w, tr.h);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = tr.accent;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(tr.x + 8, tr.y + 8, tr.w - 16, 28, 8) : ctx.rect(tr.x + 8, tr.y + 8, tr.w - 16, 28);
      ctx.fill();

      ctx.textAlign = 'center';
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(tr.title, tr.x + tr.w / 2, tr.y + 22);

      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(tr.sub, tr.x + tr.w / 2, tr.y + 48);

      const classifiedItems = items.filter(it => it.tray === tr.type);
      if (classifiedItems.length === 0) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px Pretendard, sans-serif';
        ctx.fillText('상단 카드에서 해당되는 수를 분류하세요', tr.x + tr.w / 2, tr.y + tr.h / 2 + 15);
      } else {
        classifiedItems.forEach((it, cIdx) => {
          const chipW = tr.w - 24;
          const chipH = 38;
          const chipX = tr.x + 12;
          const chipY = tr.y + 64 + cIdx * (chipH + 8);

          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = tr.border;
          ctx.lineWidth = 1.2;
          ctx.shadowColor = 'rgba(0,0,0,0.03)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetY = 1;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(chipX, chipY, chipW, chipH, 8) : ctx.rect(chipX, chipY, chipW, chipH);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'left';
          ctx.font = 'bold 16px Pretendard, sans-serif';
          ctx.fillStyle = tr.accent;
          ctx.fillText(`[ ${it.num} ]`, chipX + 12, chipY + chipH / 2);

          ctx.font = '12px Pretendard, sans-serif';
          ctx.fillStyle = '#334155';
          ctx.fillText(`약수: ${it.divs.join(', ')} (${it.count}개)`, chipX + 68, chipY + chipH / 2);

          ctx.textAlign = 'right';
          ctx.font = 'bold 12px Pretendard, sans-serif';
          ctx.fillStyle = tr.accent;
          ctx.fillText(`✔ ${tr.type === 'prime' ? '소수' : '합성수'}`, chipX + chipW - 12, chipY + chipH / 2);
        });
      }
    });

    // 4. 파티클
    if (particles.length > 0) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28;
        p.rot += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > h + 20) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }

    // 5. 하단 안내 및 실시간 피드백 배너
    const isCustomMsg = (feedbackMsg.time > Date.now() && feedbackMsg.text);
    const bannerText = isCustomMsg ? feedbackMsg.text : '💡 상단 수 카드를 탭하여 약수를 분해하고, [소수] 또는 [합성수] 트레이에 분류해 보세요.';
    const bannerColor = isCustomMsg ? feedbackMsg.color : '#64748b';

    ctx.textAlign = 'center';
    ctx.font = isCustomMsg ? 'bold 12.5px Pretendard, sans-serif' : '12px Pretendard, sans-serif';
    ctx.fillStyle = bannerColor;
    ctx.fillText(bannerText, w / 2, h - 14);

    container._animId_1_9 = requestAnimationFrame(animate);
  }

  container._animId_1_9 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

      ]
    },

      groups: [
        { base: 2, count: 3, merged: false, mergeScale: 1, color: '#3b82f6', bg: '#eff6ff', border: '#bfdbfe' },
        { base: 5, count: 1, merged: false, mergeScale: 1, color: '#059669', bg: '#ecfdf5', border: '#a7f3d0' },

  resetBtn.onclick = () => {

  bottomBar.style.justifyContent = 'center';
  bottomBar.style.alignItems = 'center';
  bottomBar.style.gap = '8px';
  bottomBar.style.zIndex = '10';
  bottomBar.style.flexWrap = 'wrap';
  wrapper.appendChild(bottomBar);

    prob.groups.forEach(g => {
      const bBtn = document.createElement('button');
      bBtn.style.padding = '5px 12px';
      bBtn.style.fontSize = '12px';
      bBtn.style.fontWeight = '700';
      bBtn.style.borderRadius = '8px';
      bBtn.style.cursor = 'pointer';
      bBtn.style.background = g.merged ? g.bg : '#ffffff';
      bBtn.style.color = g.color;
      bBtn.style.border = `1.5px solid ${g.color}`;
      bBtn.style.transition = 'all 0.15s ease';
      bBtn.innerHTML = g.merged ? `✓ [${g.base}] 합체 완료` : `🔗 [${g.base}] 블록 합체하기`;

    mergeAllBtn.style.fontSize = '12px';
    mergeAllBtn.style.fontWeight = '700';
    mergeAllBtn.style.borderRadius = '8px';
    mergeAllBtn.style.cursor = 'pointer';
    mergeAllBtn.style.background = '#4f46e5';
    mergeAllBtn.style.color = '#ffffff';
    mergeAllBtn.style.border = 'none';
    mergeAllBtn.style.boxShadow = '0 2px 6px rgba(79, 70, 229, 0.3)';
    mergeAllBtn.innerHTML = '⚡ 전체 거듭제곱 합체';
    mergeAllBtn.onclick = () => {
      prob.groups.forEach(g => mergeGroup(g, false));
      checkAllCelebration();
    };
    bottomBar.appendChild(mergeAllBtn);
  }

  function mergeGroup(g, triggerCheck = true) {
    if (!g.merged) {
      g.merged = true;
      g.mergeScale = 1.45;
      if (window.SoundFX && window.SoundFX.click) {
        SoundFX.click();
      } else if (window.SoundFX && window.SoundFX.playTone) {
        SoundFX.playTone(550 + g.base * 20, 'triangle', 0.12);
      }
      if (triggerCheck) {
        checkAllCelebration();
      }
      updateActionButtons();
    }
  }

  function checkAllCelebration() {
    const prob = getActiveProb();
    const allDone = prob.groups.every(g => g.merged);
    if (allDone) {
      createConfetti();
      if (window.SoundFX && window.SoundFX.success) SoundFX.success();
    }
  }

  updateActionButtons();

  // Canvas 엘리먼트 생성
  const canvas = document.createElement('canvas');
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  wrapper.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let w = 560;
  let h = 480;
  let dpr = 1;

  // 파티클 (콘페티)
  let particles = [];
  function createConfetti() {
    particles = [];
    const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'];
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: w / 2 + (Math.random() - 0.5) * 180,
        y: h / 2 - 20,
        vx: (Math.random() - 0.5) * 12,
        vy: -Math.random() * 10 - 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: Math.random() * 7 + 4,
        rotation: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.25,
        life: 1.0,
        decay: Math.random() * 0.01 + 0.008
      });
    }
  }

  function resize() {
    const rect = wrapper.getBoundingClientRect();
    w = rect.width || 560;
    h = Math.max(480, rect.height || 480);
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  // 캔버스 클릭 시 해당 그룹 합체 지원
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const my = e.clientY - rect.top;
    const prob = getActiveProb();
    const groupCount = prob.groups.length;
    const startY = 86;
    const rowH = groupCount === 1 ? 170 : (groupCount === 2 ? 120 : 88);

    prob.groups.forEach((g, gIdx) => {
      const gy = startY + gIdx * (rowH + 10);
      if (my >= gy && my <= gy + rowH) {
        mergeGroup(g);
      }
    });
  });

  // 애니메이션 루프
  function animate() {
    ctx.clearRect(0, 0, w, h);

    const prob = getActiveProb();

    // 1. 헤더 안내 텍스트
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillText(`🧩 [스스로 확인하기 2] ${prob.title}`, w / 2, 50);

    ctx.font = '11.5px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('💡 같은 밑끼리 묶어 거듭제곱 블록으로 압축해 보세요! (카드나 아래 버튼 클릭)', w / 2, 68);

    // 2. 그룹별 카드 박스 렌더링
    const groupCount = prob.groups.length;
    const startY = 86;
    const rowH = groupCount === 1 ? 170 : (groupCount === 2 ? 120 : 88);

    prob.groups.forEach((g, gIdx) => {
      const gy = startY + gIdx * (rowH + 10);

      // 스케일 이징
      if (g.mergeScale > 1.0) {
        g.mergeScale += (1.0 - g.mergeScale) * 0.18;
        if (g.mergeScale < 1.01) g.mergeScale = 1.0;
      }

      ctx.save();
      // 그룹 외곽 박스
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = g.merged ? g.color : '#e2e8f0';
      ctx.lineWidth = g.merged ? 2 : 1;
      const boxW = Math.min(w - 32, 520);
      const boxX = (w - boxW) / 2;
      const boxH = rowH;

      ctx.shadowColor = g.merged ? 'rgba(79, 70, 229, 0.12)' : 'rgba(0, 0, 0, 0.03)';
      ctx.shadowBlur = g.merged ? 10 : 4;
      ctx.shadowOffsetY = 2;

      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(boxX, gy, boxW, boxH, 12) : ctx.rect(boxX, gy, boxW, boxH);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // 그룹 제목 라벨
      ctx.textAlign = 'left';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = g.color;
      ctx.fillText(`밑 [ ${g.base} ] 그룹 (${g.count}번 곱함)`, boxX + 16, gy + 18);

      if (!g.merged) {
        // 합체 전: 펼쳐진 개별 카드들 나열
        const cardW = Math.min(44, Math.floor((boxW - 60 - (g.count - 1) * 24) / g.count));
        const cardH = groupCount === 1 ? 64 : (groupCount === 2 ? 52 : 42);
        const gapW = Math.min(26, Math.max(14, (boxW - 60 - g.count * cardW) / Math.max(1, g.count - 1)));
        const totalW = g.count * cardW + (g.count - 1) * gapW;
        const cStartX = boxX + (boxW - totalW) / 2;
        const cY = gy + 28 + (boxH - 36 - cardH) / 2;

        for (let i = 0; i < g.count; i++) {
          const cx = cStartX + i * (cardW + gapW);

          ctx.save();
          ctx.fillStyle = g.bg;
          ctx.strokeStyle = g.border;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(cx, cY, cardW, cardH, 8) : ctx.rect(cx, cY, cardW, cardH);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `bold ${groupCount === 3 ? 16 : 20}px Pretendard, sans-serif`;
          ctx.fillStyle = g.color;
          ctx.fillText(String(g.base), cx + cardW / 2, cY + cardH / 2);
          ctx.restore();

          if (i < g.count - 1) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 15px Pretendard, sans-serif';
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('×', cx + cardW + gapW / 2, cY + cardH / 2);
          }
        }

        // 미합체 힌트
        ctx.textAlign = 'right';
        ctx.font = '11px Pretendard, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('탭하여 합체 ⚡', boxX + boxW - 16, gy + 18);
      } else {
        // 합체 완료: 거듭제곱 블록
        ctx.save();
        const centerX = boxX + boxW / 2;
        const centerY = gy + boxH / 2 + 6;

        ctx.translate(centerX, centerY);
        ctx.scale(g.mergeScale, g.mergeScale);

        // 거듭제곱 밑 박스
        const bSize = groupCount === 1 ? 64 : (groupCount === 2 ? 52 : 44);
        const bx = -bSize / 2;
        const by = -bSize / 2;

        ctx.fillStyle = g.color;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(bx, by, bSize, bSize, 10) : ctx.rect(bx, by, bSize, bSize);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `bold ${groupCount === 1 ? 32 : 24}px Pretendard, sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(String(g.base), 0, 1);

        // 지수 뱃지 (count가 2 이상일 때)
        if (g.count > 1) {
          const ew = groupCount === 1 ? 30 : 26;
          const eh = groupCount === 1 ? 30 : 26;
          const ex = bSize / 2 - 8;
          const ey = -bSize / 2 - 10;

          ctx.fillStyle = '#fef2f2';
          ctx.strokeStyle = '#dc2626';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(ex, ey, ew, eh, 6) : ctx.rect(ex, ey, ew, eh);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#dc2626';
          ctx.font = `bold ${groupCount === 1 ? 18 : 15}px Pretendard, sans-serif`;
          ctx.fillText(String(g.count), ex + ew / 2, ey + eh / 2);
        } else {
          // 지수 1 생략 안내 뱃지
          ctx.fillStyle = '#64748b';
          ctx.font = 'bold 11px Pretendard, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('(지수 1 생략)', bSize / 2 + 8, 2);
        }

        ctx.restore();

        // 합체 성공 뱃지
        ctx.textAlign = 'right';
        ctx.font = 'bold 11.5px Pretendard, sans-serif';
        ctx.fillStyle = '#059669';
        ctx.fillText('✨ 거듭제곱 압축 완성!', boxX + boxW - 16, gy + 18);
      }
    });

    // 3. 전체 합체 완료 상태 결과 표시 배너
    const allMerged = prob.groups.every(g => g.merged);
    if (allMerged) {
      const bannerY = h - 52;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 13.5px Pretendard, sans-serif';
      ctx.fillStyle = '#4f46e5';
      ctx.fillText('🎉 모든 카드가 거듭제곱으로 합체되었습니다! 오른쪽 폼에 식을 입력해 보세요.', w / 2, bannerY);
    }

    // 4. 파티클 (콘페티)
    if (particles.length > 0) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.rotation += p.vRot;
        p.life -= p.decay;

        if (p.life <= 0 || p.y > h + 20) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }

    container._animId_1_10 = requestAnimationFrame(animate);
  }

  container._animId_1_10 = requestAnimationFrame(animate);

  const ro = new ResizeObserver(() => {
    resize();
  });
  ro.observe(wrapper);
}

function checkStep_1_10() {
  const v1 = document.getElementById('ans-1-10-1')?.value;
  const v2 = document.getElementById('ans-1-10-2')?.value;
  const v3 = document.getElementById('ans-1-10-3')?.value;
  const v4 = document.getElementById('ans-1-10-4')?.value;

  const map1 = parsePowerProduct(v1);
  const map2 = parsePowerProduct(v2);
  const map3 = parsePowerProduct(v3);
  const map4 = parsePowerProduct(v4);

  const ok1 = comparePowerMaps(map1, { 5: 4 });
  const ok2 = comparePowerMaps(map2, { 2: 1, 3: 2, 5: 1 });
  const ok3 = comparePowerMaps(map3, { 3: 2, 7: 5 });
  const ok4 = comparePowerMaps(map4, { 2: 3, 5: 1, 13: 3 });

  if (ok1 && ok2 && ok3 && ok4) {
    completeSubStep('1-10', '🎉 <b>모두 정답입니다!</b> 4개 곱셈 식을 거듭제곱 꼴(⑴ $5^4$, ⑵ $2 \\times 3^2 \\times 5$, ⑶ $3^2 \\times 7^5$, ⑷ $2^3 \\times 5 \\times 13^3$)로 완벽하게 나타냈습니다.');
    const nextBtn = document.getElementById('btn-next-step');
    if (nextBtn) {
      nextBtn.style.display = 'inline-flex';
    }
  } else {
    let wrong = [];

    if (!ok2) wrong.push('⑵');
    if (!ok3) wrong.push('⑶');
    if (!ok4) wrong.push('⑷');
    if (window.SoundFX && window.SoundFX.error) SoundFX.error();
    showFeedback(false, `❌ <b>오답 문항이 있습니다:</b> [${wrong.join(', ')}]<br>밑과 곱한 횟수(지수)를 정확히 세어 거듭제곱으로 나타내 보세요. (예: 2^3 * 5)`);
  }
}

function drawCanvas_1_11(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  const statements = [
    { label: 'ㄱ', text: '모든 자연수는 약수가 2개 이상이다.', isTrue: false, reason: '거짓: 1의 약수는 1개뿐입니다!' },
    { label: 'ㄴ', text: '모든 소수는 홀수이다.', isTrue: false, reason: '거짓: 2는 짝수 소수입니다!' },
    { label: 'ㄷ', text: '43은 소수이다.', isTrue: true, reason: '참: 43의 약수는 1과 43뿐입니다.' },
    { label: 'ㄹ', text: '3의 배수 중에서 소수는 1개이다.', isTrue: true, reason: '참: 3의 배수 중 3만 소수이고 나머지는 합성수!' }
  ];

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('⚖️ [스스로 확인하기 3] 소수와 합성수 명제 판정기 (p.13)', w / 2, 32);

    const cardH = 80;
    const startY = 55;

    statements.forEach((s, idx) => {
      const y = startY + idx * (cardH + 12);
      ctx.fillStyle = s.isTrue ? '#f0fdf4' : '#fef2f2';
      ctx.strokeStyle = s.isTrue ? '#86efac' : '#fca5a5';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(25, y, w - 50, cardH, 8) : ctx.rect(25, y, w - 50, cardH);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillStyle = s.isTrue ? '#166534' : '#991b1b';
      ctx.fillText(`${s.label}. ${s.text}`, 40, y + 30);

      ctx.font = '12px Pretendard, sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText(`➔ ${s.reason}`, 40, y + 58);

      ctx.textAlign = 'right';
      ctx.font = 'bold 22px Pretendard, sans-serif';
      ctx.fillStyle = s.isTrue ? '#16a34a' : '#dc2626';
      ctx.fillText(s.isTrue ? 'O' : 'X', w - 45, y + 46);
    });

    ctx.textAlign = 'center';
    ctx.font = 'bold 13px Pretendard, sans-serif';
    ctx.fillStyle = '#4f46e5';
    ctx.fillText('따라서 옳은 보기: ㄷ, ㄹ', w / 2, h - 20);
  }

  draw();
}

function drawCanvas_1_12(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  function draw() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px Pretendard, sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText('🎯 [스스로 확인하기 4] 두 자리 자연수 소수 탐색 레이더 (p.13)', w / 2, 35);

    // Left Panel: Smallest 2-digit prime
    const cx1 = w * 0.28;
    const cy = 180;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx1 - 95, cy - 100, 190, 200, 12) : ctx.rect(cx1 - 95, cy - 100, 190, 200);
    ctx.fill();
    ctx.stroke();

    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillStyle = '#0284c7';
    ctx.fillText('⑴ 가장 작은 두 자리 소수', cx1, cy - 65);

    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('10부터 차례대로 탐색:', cx1, cy - 35);
    ctx.fillText('10 : 2 × 5 (합성수 ❌)', cx1, cy - 10);
    ctx.fillStyle = '#0369a1';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText('11 : 약수 1, 11 (소수 ⭕)', cx1, cy + 18);

    ctx.fillStyle = '#0284c7';
    ctx.font = 'bold 38px Pretendard, sans-serif';
    ctx.fillText('11', cx1, cy + 68);

    // Right Panel: Largest 2-digit prime
    const cx2 = w * 0.72;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#7c3aed';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx2 - 95, cy - 100, 190, 200, 12) : ctx.rect(cx2 - 95, cy - 100, 190, 200);
    ctx.fill();
    ctx.stroke();

    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillStyle = '#7c3aed';
    ctx.fillText('⑵ 가장 큰 두 자리 소수', cx2, cy - 65);

    ctx.font = '12px Pretendard, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText('99부터 거꾸로 탐색:', cx2, cy - 35);
    ctx.fillText('99 : 3 × 33 (합성수 ❌)', cx2, cy - 15);
    ctx.fillText('98 : 2 × 49 (합성수 ❌)', cx2, cy + 5);
    ctx.fillStyle = '#6d28d9';
    ctx.font = 'bold 14px Pretendard, sans-serif';
    ctx.fillText('97 : 약수 1, 97 (소수 ⭕)', cx2, cy + 30);

    ctx.fillStyle = '#7c3aed';
    ctx.font = 'bold 38px Pretendard, sans-serif';
    ctx.fillText('97', cx2, cy + 72);

    // Bottom Note
    ctx.font = '13px Pretendard, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.fillText('두 자리 소수의 범위: 11, 13, 17, ... , 89, 97 (총 21개)', w / 2, h - 35);
  }

  draw();
}
