<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 수학: 1. 소인수분해</title>
  
  <!-- Supabase Cloud DB SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 영서중 수학 LMS Integration SDK (중1용) -->
  <script src="js/lms-integration-g1.js"></script>

  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- Two.js 2D Dynamic Geometry Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --secondary-color: #0284c7;
      --accent-color: #ec4899;
      --success-color: #059669;
      --warning-color: #d97706;

      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #cbd5e1;

      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
    }

    /* Top Header */
    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 48px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 16px;
      text-transform: uppercase;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    /* Tab Navigation Bar */
    .tab-bar-container {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      height: 42px;
      align-items: center;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover:not(:disabled) {
      background: #f1f5f9;
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: #eff6ff;
      color: var(--primary-color);
      border-color: #bfdbfe;
    }

    .tab-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Sub-Step Navigation Dropdown & Stepper */
    .substep-bar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 4px 16px;
      display: flex;
      align-items: center;
      height: 40px;
      box-sizing: border-box;
      z-index: 50;
    }

    .substep-dropdown-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .substep-dropdown-select {
      flex: 1;
      max-width: 540px;
      height: 32px;
      padding: 2px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      color: #1e293b;
      outline: none;
      cursor: pointer;
    }

    .substep-stepper-btn {
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .substep-stepper-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
      color: #0f172a;
    }

    .substep-stepper-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .substep-counter-badge {
      padding: 3px 10px;
      font-size: 0.82rem;
      font-weight: 800;
      background: #e2e8f0;
      color: #334155;
      border-radius: 12px;
      white-space: nowrap;
    }

    /* Main Activity Layout */
    .activity-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .plane-box {
      flex: 1.25;
      background: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .form-box {
      flex: 1;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px;
      gap: 12px;
      height: 100%;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .mission-card {
      border-left: 4px solid var(--primary-color) !important;
      background: #ffffff;
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
    }

    .mission-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .proof-input-text::placeholder {
      color: #a16207 !important;
      opacity: 0.75;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn {
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-color) !important;
      color: #ffffff !important;
      width: 100%;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--primary-hover) !important;
    }

    .btn-sky {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
    }

    /* Canvas Elements */
    .canvas-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      gap: 4px;
      padding: 4px;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      font-size: 1rem;
    }

    .tool-btn.active {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    #two-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Modal System */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      padding: 24px;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .grid-5x5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 12px 0;
      flex: 1;
      overflow-y: auto;
    }

    .student-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .student-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Tier 1: Header -->
  <header class="app-header">
    <div class="logo-group">
      <span class="badge-tag">중1 수학</span>
      <h1 class="app-title">Ⅰ. 소인수분해</h1>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="current-user-info" style="font-size:0.86rem; font-weight:700; color:var(--text-secondary);">👤 로그인 필요</span>
      <button id="btn-header-unlock-boundary" class="btn btn-sky" style="display:none; padding:4px 10px; font-size:0.8rem;" onclick="openUnlockBoundaryModal()">🔓 진도 해금</button>
      <button id="btn-header-teacher-dashboard" class="btn btn-success" style="display:none; padding:4px 10px; font-size:0.8rem;" onclick="openTeacherDashboardModal()">📊 5x5 관제실</button>
      <button id="btn-header-teacher-pass" class="btn" style="background:#fef3c7; color:#b45309; border:1px solid #fde68a; padding:4px 10px; font-size:0.8rem;" onclick="openTeacherPassModal()">🔑 교사 패스 (Pass)</button>
      <button id="btn-header-logout" class="btn" style="background:#f1f5f9; color:#475569; padding:4px 10px; font-size:0.8rem; display:none;" onclick="handleLogout()">로그아웃</button>
    </div>
  </header>

  <!-- Main Content Views -->
  <main style="flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative;">
    <!-- View 1: Student Login -->
    <section id="view-login" class="view-panel" style="display:flex; justify-content:center; align-items:center; flex:1; padding:20px;">
      <div class="card" style="width:100%; max-width:400px; padding:28px; text-align:center;">
        <h2 style="font-size:1.35rem; margin-bottom:6px; color:#1e293b;">🏫 영서중 수학 LMS 학생 로그인</h2>
        <p style="font-size:0.86rem; color:#64748b; margin-bottom:18px;">LMS 학번과 비밀번호를 입력하고 이어서 학습하세요!</p>
        <form onsubmit="handleLMSLogin(event)">
          <div style="margin-bottom:12px; text-align:left;">
            <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">학번 (예: 10101)</label>
            <input type="text" id="student-id" class="form-control" placeholder="LMS 가입 학번 5자리" value="10101">
          </div>
          <div style="margin-bottom:16px; text-align:left;">
            <label style="font-size:0.8rem; font-weight:700; color:#475569; display:block; margin-bottom:4px;">비밀번호</label>
            <input type="password" id="student-name" class="form-control" placeholder="LMS 가입 비밀번호">
          </div>
          <button id="btn-start-exploration" type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:1rem;">🔐 영서중 수학 LMS 학생 로그인</button>
        </form>
        <div id="login-error-notice" style="display:none; color:#dc2626; font-size:0.88rem; font-weight:700; margin-top:12px; background:#fef2f2; padding:10px 14px; border-radius:8px; border:1.5px solid #fca5a5;"></div>
        <div style="margin-top:14px; border-top:1px solid #e2e8f0; padding-top:12px; display:flex; flex-direction:column; gap:8px;">
          <button type="button" class="btn" style="background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; width:100%; font-weight:700;" onclick="openTestLoginModal()">🔑 교사 계정 접속</button>
          <button type="button" class="btn" style="background:#eef2ff; color:#4338ca; border:1.5px solid #c7d2fe; width:100%; font-weight:800;" onclick="openTeacherDashboardModal()">📊 교사 5x5 실시간 모니터링 관제실</button>
        </div>
      </div>
    </section>

    <!-- View 2: Interactive Student Activity Screen -->
    <section id="view-activity" class="view-panel" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
      <!-- Main Tabs -->
      <nav id="main-tab-bar" class="tab-bar-container main-tab-bar">
        <button id="tab-0" class="tab-btn active" onclick="switchMainTab(0)">0. 되짚어보기 & 도입 (pp.6~9) 🔓</button>
        <button id="tab-1" class="tab-btn" onclick="switchMainTab(1)" disabled>1. 소수와 합성수 (pp.10~13) 🔒</button>
        <button id="tab-2" class="tab-btn" onclick="switchMainTab(2)" disabled>2. 소인수분해 (pp.14~17) 🔒</button>
        <button id="tab-3" class="tab-btn" onclick="switchMainTab(3)" disabled>3. 최대공약수 (pp.18~20) 🔒</button>
        <button id="tab-4" class="tab-btn" onclick="switchMainTab(4)" disabled>4. 최소공배수 (pp.21~23) 🔒</button>
        <button id="tab-5" class="tab-btn" onclick="switchMainTab(5)" disabled>5. 알지오매스 코딩 (p.24) 🔒</button>
        <button id="tab-6" class="tab-btn" onclick="switchMainTab(6)" disabled>6. 마무리 (기초·기본) (pp.25~26) 🔒</button>
        <button id="tab-7" class="tab-btn" onclick="switchMainTab(7)" disabled>7. 마무리 (심화·서술형) (pp.26~27) 🔒</button>
        <button id="tab-8" class="tab-btn" onclick="switchMainTab(8)" disabled>🎨 8. 창의 융합 프로젝트 (p.28) 🔒</button>
      </nav>

      <!-- Sub-Step Navigation Bar -->
      <div id="substep-bar" class="substep-bar">
        <div class="substep-dropdown-container">
          <span style="font-size:0.84rem; font-weight:800; color:#334155; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;">
            📑 세부 탐구 활동:
          </span>
          <select id="substep-dropdown-select" class="substep-dropdown-select" onchange="handleSubstepSelect(this.value)"></select>
          <div id="substep-stepper-group" style="display:flex; gap:6px; margin-left:auto; align-items:center;">
            <button id="btn-prev-substep" class="substep-stepper-btn" onclick="goToPrevSubstep()">◀ 이전</button>
            <span id="substep-counter-badge" class="substep-counter-badge">1 / 1</span>
            <button id="btn-next-substep" class="substep-stepper-btn" onclick="goToNextSubstep()">다음 ▶</button>
          </div>
        </div>
      </div>

      <!-- Split Screen Area -->
      <div class="activity-container">
        <!-- Left: 60fps Dynamic Geometry Canvas -->
        <div class="plane-box">
          <div class="canvas-toolbar">
            <button id="tool-pointer" class="tool-btn active" onclick="setTool('pointer')" title="선택/조작 도구">👆</button>
            <button id="tool-pen" class="tool-btn" onclick="setTool('pen')" title="펜 드로잉">✏️</button>
            <button id="tool-eraser" class="tool-btn" onclick="setTool('eraser')" title="지우개">🧹</button>
            <button class="tool-btn" onclick="clearDrawing()" title="전체 지우기">🗑️</button>
          </div>
          <div id="two-container"></div>
        </div>

        <!-- Right: Interactive Mission & Form Area -->
        <div class="form-box">
          <div id="card-mission" class="card mission-card"></div>
          <div id="card-form-interactive" style="display:flex; flex-direction:column; gap:12px;"></div>
          <div id="grade-feedback-box" style="display:none; padding:12px 14px; border-radius:10px; font-weight:700; font-size:0.9rem; line-height:1.5;"></div>
          <div style="display:flex; gap:8px; margin-top:auto;">
            <button id="btn-next-step" class="btn btn-primary" style="flex:1; padding:12px; font-size:0.95rem; display:none;" onclick="goToNextSubStep()">다음 단계로 진행 ➡️</button>
          </div>
        </div>
      </div>
    </section>

    <!-- View 3: Teacher 5x5 Dashboard -->
    <section id="view-teacher-dashboard" class="view-panel" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
      <div class="card" style="margin:14px; flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:12px;">
          <div>
            <h2 style="font-size:1.25rem; font-weight:800; color:#0f172a;">📊 1단원 소인수분해 실시간 학급 모니터링 (5x5 관제실)</h2>
            <p style="font-size:0.84rem; color:#64748b;">학생들의 캔버스 조작 및 단계별 정답 상황을 실시간으로 확인합니다.</p>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-success" onclick="openUnlockBoundaryModal()">🔓 해금 범위 설정</button>
            <button class="btn btn-primary" onclick="switchView('activity')">학습 화면으로 돌아가기</button>
          </div>
        </div>
        <div style="display:flex; gap:6px; align-items:center; margin-top:10px;">
          <span style="font-size:0.82rem; font-weight:700; color:#475569; margin-right:4px;">학급 선택:</span>
          <div id="class-filter-buttons" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
        </div>
        <div id="teacher-student-grid" class="grid-5x5"></div>
      </div>
    </section>
  </main>

  <!-- Modals -->
  <!-- 1. Secure Password Modal -->
  <div id="secure-password-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.65); backdrop-filter:blur(4px); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#ffffff; border-radius:16px; width:90%; max-width:400px; padding:24px; box-shadow:0 20px 25px -5px rgba(0, 0, 0, 0.2); border:1.5px solid #e2e8f0;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1.5px solid #f1f5f9; padding-bottom:10px;">
        <h3 id="secure-modal-title" style="margin:0; font-size:1.15rem; color:#1e293b; font-weight:800; display:flex; align-items:center; gap:8px;">
          <span>🔑</span> <span id="secure-modal-title-text">교사 비밀번호 인증</span>
        </h3>
        <button type="button" onclick="closeSecurePasswordModal()" style="background:none; border:none; font-size:1.4rem; color:#94a3b8; cursor:pointer; line-height:1;">&times;</button>
      </div>
      <p id="secure-modal-desc" style="font-size:0.86rem; color:#64748b; line-height:1.5; margin-bottom:16px;">
        보안 인증을 위해 교사 비밀번호를 입력해 주세요.
      </p>
      <form id="secure-password-form" onsubmit="handleSecurePasswordSubmit(event)">
        <div style="margin-bottom:16px; text-align:left;">
          <label for="secure-modal-input" style="font-size:0.85rem; font-weight:700; color:#334155; margin-bottom:6px; display:block;">비밀번호</label>
          <input type="password" id="secure-modal-input" class="form-control" placeholder="비밀번호 입력" style="letter-spacing:3px; font-size:1.1rem; width:100%;" autocomplete="off" required>
        </div>
        <div id="secure-modal-error" style="display:none; color:#dc2626; font-size:0.82rem; font-weight:700; margin-bottom:12px; background:#fef2f2; padding:8px 10px; border-radius:6px; border:1px solid #fca5a5;"></div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn" style="flex:1; background:#f1f5f9; color:#475569; font-weight:700;" onclick="closeSecurePasswordModal()">취소</button>
          <button type="submit" id="secure-modal-submit-btn" class="btn btn-primary" style="flex:2; font-weight:800;">확인 및 인증</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Unlock Boundary Modal -->
  <div id="unlock-boundary-modal" class="modal-overlay">
    <div class="modal-box" style="max-width:520px;">

    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      playTone(freq, type, duration) {
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      success() {
        this.playTone(523.25, 'sine', 0.1);
        setTimeout(() => this.playTone(659.25, 'sine', 0.1), 100);
        setTimeout(() => this.playTone(783.99, 'sine', 0.2), 200);
      },
      error() {
        this.playTone(250, 'sawtooth', 0.15);
        setTimeout(() => this.playTone(200, 'sawtooth', 0.25), 150);
      },
      unlock() {
        this.playTone(440, 'triangle', 0.1);
        setTimeout(() => this.playTone(880, 'sine', 0.25), 120);
      }
    };

        { code: "1-2", tab: 1, label: "1-2. 개념: 소수와 합성수의 뜻 (p.10)", mission: "<b>[개념 탐구] 소수와 합성수의 뜻 (p.10)</b><br>1보다 큰 자연수 중 약수가 2개뿐인 '소수'와 약수가 3개 이상인 '합성수'의 의미를 이해하고 1의 특수성을 알아봅시다." },

    // ==========================================
    // 3. Navigation & View Controller
    // ==========================================
    function switchView(viewName) {
      document.querySelectorAll('.view-panel').forEach(p => {
        p.classList.remove('active');
        p.style.display = 'none';
      });
      const target = document.getElementById(`view-${viewName}`);
      if (target) {
        target.classList.add('active');
        target.style.display = (viewName === 'login') ? 'flex' : 'flex';
      }
    }
    window.switchView = switchView;

    function switchMainTab(tabIdx) {
      if (!state.isTeacherLoggedIn && !state.unlockedTabs.includes(tabIdx)) {
        alert('🔒 이전 단원을 먼저 완료해야 합니다!');
        return;
      }
      state.currentMainTab = tabIdx;
      document.querySelectorAll('#main-tab-bar .tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === tabIdx);
      });
      renderSubstepDropdown();
      const steps = tabSubSteps[String(tabIdx)] || [];
      if (steps.length > 0) {
        switchSubStep(steps[0].code);
      }
    }
    window.switchMainTab = switchMainTab;

    function renderSubstepDropdown() {
      const select = document.getElementById('substep-dropdown-select');
      if (!select) return;
      select.innerHTML = '';
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      steps.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = s.code;
        const isDone = state.completedSteps.has(s.code);
        opt.textContent = `${s.label} ${isDone ? '✓' : ''}`;
        select.appendChild(opt);
      });
      updateStepperUI();
    }
    window.renderSubstepDropdown = renderSubstepDropdown;

    function handleSubstepSelect(code) {
      if (code) switchSubStep(code);
    }
    window.handleSubstepSelect = handleSubstepSelect;

    function updateStepperUI() {
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const curIdx = steps.findIndex(s => s.code === state.currentSubStep);
      const total = steps.length;
      const counter = document.getElementById('substep-counter-badge');
      if (counter) counter.textContent = `${curIdx >= 0 ? curIdx + 1 : 1} / ${Math.max(1, total)}`;
      
      const prevBtn = document.getElementById('btn-prev-substep');
      const nextBtn = document.getElementById('btn-next-substep');
      if (prevBtn) prevBtn.disabled = (curIdx <= 0);
      if (nextBtn) nextBtn.disabled = (curIdx < 0 || curIdx >= total - 1);
    }
    window.updateStepperUI = updateStepperUI;

    function goToPrevSubstep() {
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const curIdx = steps.findIndex(s => s.code === state.currentSubStep);
      if (curIdx > 0) switchSubStep(steps[curIdx - 1].code);
    }
    window.goToPrevSubstep = goToPrevSubstep;

    function goToNextSubstep() {
      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const curIdx = steps.findIndex(s => s.code === state.currentSubStep);
      if (curIdx >= 0 && curIdx < steps.length - 1) switchSubStep(steps[curIdx + 1].code);
    }
    window.goToNextSubstep = goToNextSubstep;

    function switchSubStep(stepCode) {
      state.currentSubStep = stepCode;
      const select = document.getElementById('substep-dropdown-select');
      if (select) select.value = stepCode;
      updateStepperUI();

      const steps = tabSubSteps[String(state.currentMainTab)] || [];
      const stepData = steps.find(s => s.code === stepCode);

      // Render Mission Card
      const missionBox = document.getElementById('card-mission');
      if (missionBox && stepData) {
        missionBox.innerHTML = `
          <div class="mission-title">🎯 오늘의 탐구 미션</div>
          <div style="font-size:0.9rem; line-height:1.5; color:#334155;">${stepData.mission}</div>
        `;
      }

      // Render Form
      renderSubStepForm(stepCode);

      // Render Canvas
      renderSubStepCanvas(stepCode);

      // Feedback Box Reset
      const fBox = document.getElementById('grade-feedback-box');
      if (fBox) fBox.style.display = 'none';

      const nextBtn = document.getElementById('btn-next-step');
      if (nextBtn) nextBtn.style.display = 'none';

      // KaTeX Auto-render
      if (window.renderMathInElement) {
        renderMathInElement(document.getElementById('card-form-interactive'), {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }
    window.switchSubStep = switchSubStep;

    // Placeholder for Canvas & Form Dynamic Renderers
    function renderSubStepForm(code) {
      const box = document.getElementById('card-form-interactive');
      if (!box) return;
      const funcName = `renderForm_${code.replace('-', '_')}`;
      if (typeof window[funcName] === 'function') {
        window[funcName](box);
      } else {
        box.innerHTML = `<div class="card" style="text-align:center; padding:30px; color:#64748b;">
          🚧 <b>${code}</b> 단계의 탐구 워크 폼을 불러오는 중입니다...
        </div>`;
      }
    }
    window.renderSubStepForm = renderSubStepForm;

    function renderSubStepCanvas(code) {
      const container = document.getElementById('two-container');
      if (!container) return;
      container.innerHTML = '';
      const funcName = `drawCanvas_${code.replace('-', '_')}`;
      if (typeof window[funcName] === 'function') {
        window[funcName](container);
      } else {
        container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-weight:700;">
          🎨 <b>${code}</b> 60fps 인터랙티브 캔버스 로딩
        </div>`;
      }
    }
    window.renderSubStepCanvas = renderSubStepCanvas;

    // ==========================================
    // 4. LMS Login & Teacher Auth
    // ==========================================
    async function handleLMSLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const idInput = document.getElementById('student-id');
      const pwInput = document.getElementById('student-name');
      const errBox = document.getElementById('login-error-notice');
      if (errBox) errBox.style.display = 'none';

      const val = idInput ? idInput.value.trim() : '';
      const password = pwInput ? pwInput.value.trim() : '';

      if (!val || !password) {
        showLoginError('⚠️ 학번 5자리와 비밀번호를 모두 입력해 주세요!');
        return false;
      }

      // Check Teacher Master PIN directly (교사 관리자 모드 프리패스)
      if (TEACHER_MASTER_PASSWORDS.includes(password) || TEACHER_MASTER_PASSWORDS.includes(val)) {
        const masterUser = {
          id: '260523',
          name: '임종윤 선생님',
          role: 'teacher',
          grade: 1,
          classNum: 1
        };
        if (typeof LMSIntegration !== 'undefined' && LMSIntegration.setCurrentUser) {
          LMSIntegration.setCurrentUser(masterUser);
        }
        applyLoggedInUser(masterUser);
        return true;
      }

      if (val.length !== 5) {
        showLoginError('⚠️ 올바른 학번 5자리를 입력하세요 (예: 10101)');
        return false;
      }

      const loginBtn = document.getElementById('btn-start-exploration');
      const origText = loginBtn ? loginBtn.innerText : '';
      if (loginBtn) {
        loginBtn.disabled = true;
        loginBtn.innerText = '⏳ 영서중 수학 LMS DB 인증 중...';
      }

      try {
        if (typeof LMSIntegration === 'undefined' || !LMSIntegration.loginStudent) {
          showLoginError('❌ LMS Integration SDK가 준비되지 않았습니다. 페이지를 새로고침해 주세요.');
          return false;
        }

        const res = await LMSIntegration.loginStudent(val, password);

        if (res && res.success) {
          applyLoggedInUser(res.user);

          // Supabase DB에서 학생 진도 실시간 로드 및 복원
          try {
            const progressData = await LMSIntegration.loadStudentProgress(res.user.id, 'u1');
            if (progressData && Array.isArray(progressData.completedSteps)) {
              progressData.completedSteps.forEach(s => state.completedSteps.add(s));
              if (typeof renderSubstepDropdown === 'function') renderSubstepDropdown();
              if (progressData.lastSubStep && typeof selectSubstepByCode === 'function') {
                selectSubstepByCode(progressData.lastSubStep);
              }
            }
          } catch (loadErr) {
            console.warn('[LMS] Progress load warning:', loadErr);
          }

          return true;
        } else {
          showLoginError(`❌ ${res && res.message ? res.message : '학번 또는 비밀번호가 일치하지 않습니다.'}`);
          return false;
        }
      } catch (err) {
        console.error(err);

// --- Helper Functions ---
function parseNumList(str) {
  if (!str) return [];
  return String(str)
    .replace(/[^\d,，\s]/g, '')
    .split(/[,，\s]+/)
    .filter(Boolean)
    .map(Number)
    .sort((a, b) => a - b);
}

function areListsEqual(l1, l2) {
  if (!l1 || !l2 || l1.length !== l2.length) return false;
  for (let i = 0; i < l1.length; i++) {
    if (l1[i] !== l2[i]) return false;
  }
  return true;
}

function showFeedback(isSuccess, message) {
  const box = document.getElementById('grade-feedback-box');
  if (!box) return;
  box.style.display = 'block';
  box.style.background = isSuccess ? '#ecfdf5' : '#fef2f2';
  box.style.border = isSuccess ? '1.5px solid #6ee7b7' : '1.5px solid #fca5a5';
  box.style.color = isSuccess ? '#065f46' : '#991b1b';
  box.innerHTML = message;
}

function completeSubStep(code, successMsg) {
  state.completedSteps.add(code);
  if (window.SoundFX && window.SoundFX.success) SoundFX.success();
  showFeedback(true, successMsg);
  const nextBtn = document.getElementById('btn-next-step');
  if (nextBtn) nextBtn.style.display = 'block';
  if (typeof renderSubstepDropdown === 'function') renderSubstepDropdown();

  // Supabase Cloud DB 실시간 진도 저장
  if (typeof LMSIntegration !== 'undefined' && LMSIntegration.saveStudentProgress) {
    LMSIntegration.saveStudentProgress(code, {
      unitId: 'u1',
      completedSteps: Array.from(state.completedSteps),
      lastSubStep: code
    }).catch(err => console.warn('[LMS] Save progress error:', err));
  }
}

function drawCanvas_0_0(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  canvas.style.touchAction = 'none';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;
  let t = 0;

  const subUnits = [
    {
      id: 'sub1',
      code: '01',
      title: '01 소수와 합성수',
      subtitle: '약수의 개수로 수의 성질 분류',
      desc: '1과 자기 자신만을 약수로 갖는 소수와 3개 이상인 합성수 탐구',
      color: '#0284c7',
      defaultRelX: -170,
      defaultRelY: -115,
      width: 175,
      height: 74,
      x: 0,
      y: 0,
      isHovered: false,
      isDragging: false
    },
    {
      id: 'sub2',
      code: '02',
      title: '02 소인수분해',
      subtitle: '자연수를 소수의 곱으로 분해',
      desc: '자연수를 오직 소수들의 곱으로 나타내어 수의 본질을 분석',
      color: '#4f46e5',
      defaultRelX: 170,
      defaultRelY: -115,
      width: 175,
      height: 74,
      x: 0,
      y: 0,
      isHovered: false,
      isDragging: false
    },
    {
      id: 'sub3',
      code: '03',
      title: '03 최대공약수',
      subtitle: '공통인 약수 중 가장 큰 수',
      desc: '소인수분해를 활용하여 공통 소인수의 거듭제곱으로 최대공약수 계산',
      color: '#059669',
      defaultRelX: -170,
      defaultRelY: 115,
      width: 175,
      height: 74,
      x: 0,
      y: 0,
      isHovered: false,
      isDragging: false
    },
    {
      id: 'sub4',
      code: '04',
      title: '04 최소공배수',
      subtitle: '공통인 배수 중 가장 작은 수',
      desc: '소인수분해를 활용하여 모든 소인수의 최고 거듭제곱으로 최소공배수 계산',
      color: '#d97706',
      defaultRelX: 170,
      defaultRelY: 115,
      width: 175,
      height: 74,
      x: 0,
      y: 0,
      isHovered: false,
      isDragging: false
    }
  ];

  let selectedCard = subUnits[1];

  let initialized = false;
  function updateCardPositions() {
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2 - 12;
    const scale = Math.min(1, Math.max(0.65, w / 620));

    subUnits.forEach(card => {
      if (!initialized) {
        card.x = cx + card.defaultRelX * scale - card.width / 2;
        card.y = cy + card.defaultRelY * scale - card.height / 2;
      }
      card.x = Math.max(10, Math.min(w - card.width - 10, card.x));
      card.y = Math.max(55, Math.min(h - card.height - 85, card.y));
    });
    initialized = true;
  }
  updateCardPositions();

  const primeAtoms = [
    { num: '2', color: '#0284c7', rx: 90, ry: 45, tilt: -25 * Math.PI / 180, speed: 1.1, phase: 0 },
    { num: '3', color: '#059669', rx: 125, ry: 55, tilt: 35 * Math.PI / 180, speed: -0.85, phase: 1.5 },
    { num: '5', color: '#d97706', rx: 155, ry: 65, tilt: -65 * Math.PI / 180, speed: 0.7, phase: 3.0 },
    { num: '7', color: '#ec4899', rx: 185, ry: 75, tilt: 75 * Math.PI / 180, speed: -0.55, phase: 4.5 }
  ];

  function resize() {
    if (!container || !canvas) return;
    const newW = container.clientWidth || 560;
    const newH = container.clientHeight || 460;
    if (canvas.width !== newW || canvas.height !== newH) {
      canvas.width = newW;
      canvas.height = newH;
      updateCardPositions();
    }
  }
  window.addEventListener('resize', resize);

  let isDragging = false;
  let dragCard = null;
  let dragStartX = 0;
  let dragStartY = 0;
  let cardStartX = 0;
  let cardStartY = 0;
  let hasMoved = false;

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / (rect.width || 1);
    const scaleY = canvas.height / (rect.height || 1);
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function hitTest(pos) {
    for (let i = subUnits.length - 1; i >= 0; i--) {
      const c = subUnits[i];
      if (pos.x >= c.x && pos.x <= c.x + c.width &&
          pos.y >= c.y && pos.y <= c.y + c.height) {
        return c;
      }
    }
    return null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    const pos = getCanvasPos(e);
    const card = hitTest(pos);
    if (card) {
      isDragging = true;
      dragCard = card;
      dragStartX = pos.x;
      dragStartY = pos.y;
      cardStartX = card.x;
      cardStartY = card.y;
      hasMoved = false;
      card.isDragging = true;
      selectedCard = card;
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(520, 'sine', 0.08);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pos = getCanvasPos(e);
    if (isDragging && dragCard) {
      const dx = pos.x - dragStartX;
      const dy = pos.y - dragStartY;
      if (Math.hypot(dx, dy) > 3) hasMoved = true;
      dragCard.x = Math.max(10, Math.min(canvas.width - dragCard.width - 10, cardStartX + dx));
      dragCard.y = Math.max(55, Math.min(canvas.height - dragCard.height - 85, cardStartY + dy));
      canvas.style.cursor = 'grabbing';
    } else {
      const card = hitTest(pos);
      subUnits.forEach(c => c.isHovered = (c === card));
      canvas.style.cursor = card ? 'grab' : 'default';
    }
  });

  function handlePointerUp(e) {
    if (isDragging && dragCard) {
      dragCard.isDragging = false;
      isDragging = false;
      if (!hasMoved) {
        selectedCard = dragCard;
      }
      dragCard = null;
      canvas.style.cursor = 'default';
    }
    try {
      if (canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
    } catch(err) {}
  }

  canvas.addEventListener('pointerup', handlePointerUp);
  canvas.addEventListener('pointercancel', handlePointerUp);

  function draw() {
    if (!container.isConnected || !container.contains(canvas)) {
      if (animId) cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      return;
    }

    t += 0.025;
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2 - 12;

    ctx.clearRect(0, 0, w, h);

    // Subtle background grid
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // Top Title Badge & Headline
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    // Small pill badge
    ctx.fillStyle = '#4f46e5';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(w / 2 - 60, 10, 120, 20, 10);
    else ctx.rect(w / 2 - 60, 10, 120, 20);
    ctx.fill();
    ctx.font = 'bold 11px Pretendard, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('중1 수학 Ⅰ단원', w / 2, 14);

    // Title
    ctx.font = '800 18px Pretendard, sans-serif';
    ctx.fillStyle = '#0f172a';
    ctx.fillText('Ⅰ. 소인수분해 (Prime Factorization)', w / 2, 34);

    // Energy Rays from center to each subunit card
    subUnits.forEach((card, idx) => {
      const cardMidX = card.x + card.width / 2;
      const cardMidY = card.y + card.height / 2;
      const isSel = (card === selectedCard);

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cardMidX, cardMidY);
      ctx.strokeStyle = isSel ? card.color : 'rgba(203, 213, 225, 0.6)';
      ctx.lineWidth = isSel ? 2.5 : 1.2;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Flowing energy quantum particle
      const qT = (t * 0.5 + idx * 0.25) % 1;
      const qx = cx + (cardMidX - cx) * qT;
      const qy = cy + (cardMidY - cy) * qT;
      ctx.fillStyle = card.color;
      ctx.beginPath();
      ctx.arc(qx, qy, isSel ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Central Atom / Molecule Ring (Atomic Orbits)
    primeAtoms.forEach(atom => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(atom.tilt);

      // Orbit ellipse
      ctx.beginPath();
      ctx.ellipse(0, 0, atom.rx, atom.ry, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([3, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Prime particle position
      const angle = t * atom.speed + atom.phase;
      const px = atom.rx * Math.cos(angle);
      const py = atom.ry * Math.sin(angle);

      // Particle halo
      ctx.beginPath();
      ctx.arc(px, py, 11, 0, Math.PI * 2);
      ctx.fillStyle = atom.color + '33';
      ctx.fill();

      // Particle body
      ctx.beginPath();
      ctx.arc(px, py, 8, 0, Math.PI * 2);
      ctx.fillStyle = atom.color;
      ctx.fill();

      // Particle label (Prime number: 2, 3, 5, 7)
      ctx.font = 'bold 9px Pretendard, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(atom.num, px, py);

      ctx.restore();
    });

    // Central Nucleus: "자연수" Core
    const pulseNucleus = Math.sin(t * 3) * 3;
    const coreGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 32 + pulseNucleus);
    coreGrad.addColorStop(0, '#6366f1');
    coreGrad.addColorStop(0.7, '#312e81');
    coreGrad.addColorStop(1, 'rgba(49, 46, 129, 0)');

    ctx.beginPath();
    ctx.arc(cx, cy, 32 + pulseNucleus, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();

    // Nucleus Solid Inner Circle
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, Math.PI * 2);
    ctx.fillStyle = '#1e1b4b';
    ctx.strokeStyle = '#818cf8';
    ctx.lineWidth = 2.5;
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 11px Pretendard, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('자연수', cx, cy - 5);
    ctx.font = '8px Pretendard, sans-serif';
    ctx.fillStyle = '#a5b4fc';
    ctx.fillText('소수의 결합', cx, cy + 8);

    // 4 Subunit Pulsing Cards
    subUnits.forEach((card, idx) => {
      const isSel = (card === selectedCard);
      const isHov = card.isHovered;
      const pulse = (Math.sin(t * 3.5 + idx * 1.5) + 1) / 2;

      ctx.save();
      // Outer glow when selected or hovered
      if (isSel || isHov) {
        ctx.shadowColor = card.color;
        ctx.shadowBlur = 12 + pulse * 6;
      } else {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
      }

      // Card Body
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(card.x, card.y, card.width, card.height, 10);
      else ctx.rect(card.x, card.y, card.width, card.height);
      ctx.fill();
      ctx.restore();

      // Card Border with pulse
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(card.x, card.y, card.width, card.height, 10);
      else ctx.rect(card.x, card.y, card.width, card.height);
      ctx.strokeStyle = (isSel || isHov) ? card.color : '#cbd5e1';
      ctx.lineWidth = isSel ? 3 : (isHov ? 2.5 : (1.5 + pulse * 0.8));
      ctx.stroke();

      // Top color bar
      ctx.fillStyle = card.color;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(card.x, card.y, card.width, 4, [10, 10, 0, 0]);
      else ctx.rect(card.x, card.y, card.width, 4);
      ctx.fill();

      // Card Content
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      // Badge
      ctx.font = 'bold 9px Pretendard, sans-serif';
      ctx.fillStyle = card.color;
      ctx.fillText(`● 소단원 ${card.code}`, card.x + 10, card.y + 10);

      // Title
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(card.title, card.x + 10, card.y + 25);

      // Subtitle
      ctx.font = '10px Pretendard, sans-serif';
      ctx.fillStyle = '#64748b';
      ctx.fillText(card.subtitle, card.x + 10, card.y + 44);

      // Drag hint icon ⠿ on top-right
      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.textAlign = 'right';
      ctx.fillText('⠿', card.x + card.width - 8, card.y + 10);
    });

    // Bottom Selected Card Detail Banner
    if (selectedCard) {
      const bannerH = 46;
      const bannerY = h - bannerH - 12;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = selectedCard.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(20, bannerY, w - 40, bannerH, 8);
      else ctx.rect(20, bannerY, w - 40, bannerH);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 12px Pretendard, sans-serif';
      ctx.fillStyle = selectedCard.color;
      ctx.fillText(`📖 [${selectedCard.title}]`, 32, bannerY + 16);

      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText(selectedCard.desc, 32, bannerY + 32);
    }

    // Helper hint
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.font = '10px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('💡 카드를 마우스로 드래그하거나 클릭하여 소단원별 학습 내용을 탐색하세요.', w / 2, h - 2);

    animId = requestAnimationFrame(draw);
  }

  draw();
}

function drawCanvas_0_1(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  canvas.style.touchAction = 'none';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;
  let t = 0;

  const nodes = [
    {
      id: 'elem',
      title: '초등 5~6학년',
      grade: '초등 연계',
      concept: '약수와 배수',
      desc: '자연수의 나눗셈과 배수 관계, 공약수와 공배수의 기초 원리 탐구',
      mathMeaning: '약수를 통해 수를 쪼개고, 배수를 통해 규칙적으로 확장하는 수의 기본 규칙',
      relX: 0.16,
      relY: 0.35,
      radius: 38,
      color: '#0284c7',
      isTarget: false,
      isHovered: false
    },
    {
      id: 'g1',
      title: '중1 (현재 단원)',
      grade: '중1 핵심',
      concept: '소인수분해',
      desc: '자연수를 오직 소수들의 곱으로 나타내어 수의 본질을 분석',
      mathMeaning: '물질의 원자처럼 자연수를 이루는 근본 소수 벽돌을 규명하는 핵심 관문',
      relX: 0.38,
      relY: 0.65,
      radius: 42,
      color: '#4f46e5',
      isTarget: true,
      isHovered: false
    },
    {
      id: 'g2',
      title: '중2 연계',
      grade: '중2 심화',
      concept: '유리수와 순환소수',
      desc: '분수를 소수로 나타낼 때 유한소수와 순환소수 판별',
      mathMeaning: '기약분수 분모를 소인수분해하여 2나 5뿐인지 확인하는 판별 기준 활용',
      relX: 0.62,
      relY: 0.35,
      radius: 38,
      color: '#059669',
      isTarget: false,
      isHovered: false
    },
    {
      id: 'g3',
      title: '중3 연계',
      grade: '중3 확장',
      concept: '제곱근과 실수',
      desc: '제곱하여 a가 되는 수와 무리수의 도입',
      mathMeaning: '소인수분해의 지수가 짝수가 되도록 맞추어 근호(√) 밖으로 탈출시키는 원리',
      relX: 0.84,
      relY: 0.65,
      radius: 38,
      color: '#d97706',
      isTarget: false,
      isHovered: false
    }
  ];

  let selectedNode = nodes[1];

  function initNodePositions() {
    const w = canvas.width;
    const h = canvas.height;
    nodes.forEach(n => {
      n.x = n.relX * w;
      n.y = n.relY * h;
    });
  }
  initNodePositions();

  function resize() {
    if (!container || !canvas) return;
    const newW = container.clientWidth || 560;
    const newH = container.clientHeight || 460;
    if (canvas.width !== newW || canvas.height !== newH) {
      canvas.width = newW;
      canvas.height = newH;
      initNodePositions();
    }
  }
  window.addEventListener('resize', resize);

  let isDragging = false;
  let dragNode = null;
  let dragOffsetX = 0;
  let dragOffsetY = 0;
  let hasMoved = false;

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / (rect.width || 1);
    const scaleY = canvas.height / (rect.height || 1);
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function hitTestNode(pos) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const dist = Math.hypot(pos.x - n.x, pos.y - n.y);
      if (dist <= n.radius + 6) return n;
    }
    return null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    const pos = getCanvasPos(e);
    const n = hitTestNode(pos);
    if (n) {
      isDragging = true;
      dragNode = n;
      dragOffsetX = n.x - pos.x;
      dragOffsetY = n.y - pos.y;
      hasMoved = false;
      selectedNode = n;
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(580, 'sine', 0.08);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pos = getCanvasPos(e);
    if (isDragging && dragNode) {
      const newX = pos.x + dragOffsetX;
      const newY = pos.y + dragOffsetY;
      if (Math.hypot(newX - dragNode.x, newY - dragNode.y) > 3) hasMoved = true;
      dragNode.x = Math.max(50, Math.min(canvas.width - 50, newX));
      dragNode.y = Math.max(65, Math.min(canvas.height - 110, newY));
      dragNode.relX = dragNode.x / canvas.width;
      dragNode.relY = dragNode.y / canvas.height;
      canvas.style.cursor = 'grabbing';
    } else {
      const n = hitTestNode(pos);
      nodes.forEach(node => node.isHovered = (node === n));
      canvas.style.cursor = n ? 'grab' : 'default';
    }
  });

  function handlePointerUp(e) {
    if (isDragging && dragNode) {
      if (!hasMoved) {
        selectedNode = dragNode;
      }
      isDragging = false;
      dragNode = null;
      canvas.style.cursor = 'default';
    }
    try {
      if (canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
    } catch(err) {}
  }

  canvas.addEventListener('pointerup', handlePointerUp);
  canvas.addEventListener('pointercancel', handlePointerUp);

  function draw() {
    if (!container.isConnected || !container.contains(canvas)) {
      if (animId) cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      return;
    }

    t += 0.025;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Subtle background grid
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // Top Header Badge & Title
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';

    // Badge
    ctx.fillStyle = '#4f46e5';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(w / 2 - 75, 10, 150, 20, 10);
    else ctx.rect(w / 2 - 75, 10, 150, 20);
    ctx.fill();
    ctx.font = 'bold 11px Pretendard, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('수학 계통도 (Curriculum Map)', w / 2, 14);

    // Title
    ctx.font = '800 17px Pretendard, sans-serif';
    ctx.fillStyle = '#0f172a';
    ctx.fillText('초등 ➔ 중1 ➔ 중2 ➔ 중3 수학의 유기적 확장', w / 2, 34);

    // Dynamic Bezier Curves connecting nodes
    for (let i = 0; i < nodes.length - 1; i++) {
      const n1 = nodes[i];
      const n2 = nodes[i + 1];
      const x1 = n1.x;
      const y1 = n1.y;
      const x2 = n2.x;
      const y2 = n2.y;

      const cx1 = (x1 + x2) / 2;
      const cy1 = y1;
      const cx2 = (x1 + x2) / 2;
      const cy2 = y2;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 3.5;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Flowing energy quantum particles along curve
      for (let pIdx = 0; pIdx < 2; pIdx++) {
        const pRatio = (t * 0.45 + i * 0.33 + pIdx * 0.5) % 1;
        const px = Math.pow(1 - pRatio, 3) * x1 + 3 * Math.pow(1 - pRatio, 2) * pRatio * cx1 + 3 * (1 - pRatio) * Math.pow(pRatio, 2) * cx2 + Math.pow(pRatio, 3) * x2;
        const py = Math.pow(1 - pRatio, 3) * y1 + 3 * Math.pow(1 - pRatio, 2) * pRatio * cy1 + 3 * (1 - pRatio) * Math.pow(pRatio, 2) * cy2 + Math.pow(pRatio, 3) * y2;

        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = n2.color;
        ctx.shadowColor = n2.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Draw Nodes
    nodes.forEach(n => {
      const isCur = (n === selectedNode);
      const isHov = n.isHovered;

      // Pulse ring for target node (중1 소인수분해)
      if (n.isTarget) {
        const pulse = (Math.sin(t * 3) + 1) / 2;
        ctx.strokeStyle = `rgba(79, 70, 229, ${0.25 + pulse * 0.45})`;
        ctx.lineWidth = 4 + pulse * 6;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius + 8 + pulse * 6, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Outer Glow when selected or hovered
      if (isCur || isHov) {
        ctx.shadowColor = n.color;
        ctx.shadowBlur = 14;
      } else {
        ctx.shadowColor = 'rgba(0,0,0,0.08)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
      }

      // Node Circle Body
      ctx.fillStyle = isCur ? n.color : '#ffffff';
      ctx.strokeStyle = n.color;
      ctx.lineWidth = isCur ? 4 : (isHov ? 3.5 : 2.5);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // Drag indicator icon
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '9px sans-serif';
      ctx.fillStyle = isCur ? 'rgba(255,255,255,0.7)' : '#94a3b8';
      ctx.fillText('⠿', n.x, n.y - n.radius + 8);

      // Node Labels
      ctx.font = 'bold 11px Pretendard, sans-serif';
      ctx.fillStyle = isCur ? '#ffffff' : '#64748b';
      ctx.fillText(n.title, n.x, n.y - 6);

      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillStyle = isCur ? '#ffffff' : n.color;
      ctx.fillText(n.concept, n.x, n.y + 12);
    });

    // Detail / Mathematical significance Card at bottom
    if (selectedNode) {
      const cardH = 78;
      const cardY = h - cardH - 12;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = selectedNode.color;
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0,0,0,0.06)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(25, cardY, w - 50, cardH, 10);
      else ctx.rect(25, cardY, w - 50, cardH);

// 0-2 (p.7): 물질 원소와 자연수의 구성 요소

function drawCanvas_0_2(container) {
  container.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.width = container.clientWidth || 560;
  canvas.height = container.clientHeight || 460;
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  canvas.style.display = 'block';
  canvas.style.touchAction = 'none';
  container.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let animId = null;
  let t = 0;

  // Default atom slots (chem & prime)
  const defaultAtoms = [
    { id: 1, type: 'chem', label: 'H', sub: '수소', color: '#0284c7', r: 22, slotX: 0.10, slotY: 0.16 },
    { id: 2, type: 'chem', label: 'H', sub: '수소', color: '#0284c7', r: 22, slotX: 0.20, slotY: 0.16 },
    { id: 3, type: 'chem', label: 'O', sub: '산소', color: '#dc2626', r: 26, slotX: 0.31, slotY: 0.16 },
    { id: 4, type: 'prime', label: '2', sub: '소수', color: '#4f46e5', r: 24, slotX: 0.46, slotY: 0.16 },
    { id: 5, type: 'prime', label: '2', sub: '소수', color: '#4f46e5', r: 24, slotX: 0.57, slotY: 0.16 },
    { id: 6, type: 'prime', label: '3', sub: '소수', color: '#059669', r: 24, slotX: 0.68, slotY: 0.16 },
    { id: 7, type: 'prime', label: '5', sub: '소수', color: '#d97706', r: 24, slotX: 0.79, slotY: 0.16 },
    { id: 8, type: 'prime', label: '7', sub: '소수', color: '#ec4899', r: 24, slotX: 0.90, slotY: 0.16 }
  ];

  let atoms = defaultAtoms.map(a => ({
    ...a,
    x: a.slotX * canvas.width,
    y: a.slotY * canvas.height,
    isHovered: false,
    isDragging: false
  }));

  function resetAtoms() {
    atoms.forEach(a => {
      a.x = a.slotX * canvas.width;
      a.y = a.slotY * canvas.height;
    });
    particles = [];
    lastComboKey = '';
    if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(380, 'sine', 0.08);
  }

  function resize() {
    if (!container || !canvas) return;
    const newW = container.clientWidth || 560;
    const newH = container.clientHeight || 460;
    if (canvas.width !== newW || canvas.height !== newH) {
      canvas.width = newW;
      canvas.height = newH;
      resetAtoms();
    }
  }
  window.addEventListener('resize', resize);

  // Particles for energy bond burst
  let particles = [];
  function spawnBondParticles(cx, cy, color) {
    for (let i = 0; i < 30; i++) {
      const angle = (Math.PI * 2 * i) / 30 + (Math.random() - 0.5) * 0.3;
      const speed = 2.0 + Math.random() * 4.0;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 3 + Math.random() * 3,
        color: color || '#4f46e5',
        life: 1.0,
        decay: 0.02 + Math.random() * 0.02
      });
    }
    if (window.SoundFX && window.SoundFX.unlock) SoundFX.unlock();
  }

  let lastComboKey = '';

  // Pointer drag handling
  let draggedAtom = null;
  let dragOffset = { x: 0, y: 0 };
  let isDragging = false;

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / (rect.width || 1);
    const scaleY = canvas.height / (rect.height || 1);
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function hitTestAtom(pos) {
    for (let i = atoms.length - 1; i >= 0; i--) {
      const a = atoms[i];
      if (Math.hypot(pos.x - a.x, pos.y - a.y) <= a.r + 5) return a;
    }
    return null;
  }

  function hitTestResetBtn(pos) {
    return (pos.x >= canvas.width - 105 && pos.x <= canvas.width - 15 && pos.y >= 10 && pos.y <= 36);
  }

  canvas.addEventListener('pointerdown', (e) => {
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
    const pos = getCanvasPos(e);

    if (hitTestResetBtn(pos)) {
      resetAtoms();
      return;
    }

    const a = hitTestAtom(pos);
    if (a) {
      draggedAtom = a;
      isDragging = true;
      dragOffset.x = pos.x - a.x;
      dragOffset.y = pos.y - a.y;
      a.isDragging = true;
      if (window.SoundFX && window.SoundFX.playTone) SoundFX.playTone(520, 'sine', 0.06);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const pos = getCanvasPos(e);
    if (isDragging && draggedAtom) {
      draggedAtom.x = Math.max(draggedAtom.r, Math.min(canvas.width - draggedAtom.r, pos.x - dragOffset.x));
      draggedAtom.y = Math.max(draggedAtom.r + 10, Math.min(canvas.height - draggedAtom.r - 20, pos.y - dragOffset.y));
      canvas.style.cursor = 'grabbing';
    } else {
      const a = hitTestAtom(pos);
      atoms.forEach(atom => atom.isHovered = (atom === a));
      canvas.style.cursor = (a || hitTestResetBtn(pos)) ? 'pointer' : 'default';
    }
  });

  function stopDrag(e) {
    if (draggedAtom) {
      draggedAtom.isDragging = false;
      draggedAtom = null;
      isDragging = false;
      canvas.style.cursor = 'default';
    }
    try {
      if (canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
    } catch(err) {}
  }

  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);

  function draw() {
    if (!container.isConnected || !container.contains(canvas)) {
      if (animId) cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      return;
    }

    t += 0.025;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    // Subtle background grid
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    for (let y = 0; y < h; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    // Top Header: Title & Reset Button
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '800 15px Pretendard, sans-serif';
    ctx.fillStyle = '#0f172a';
    ctx.fillText('⚗️ 원소 & 소수 결합 연구소 (p.7)', 20, 24);

    // Reset Button (Top Right)
    ctx.save();
    ctx.fillStyle = '#f1f5f9';
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(w - 105, 10, 90, 26, 6);
    else ctx.rect(w - 105, 10, 90, 26);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#475569';
    ctx.font = 'bold 11px Pretendard, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⟲ 원자 초기화', w - 60, 23);
    ctx.restore();

    // Top Docks (Two labeled shelves)
    const dockY = 48;
    const dockH = 68;

    // Chemical shelf
    const chemW = w * 0.38;
    ctx.fillStyle = '#f0fdf4';
    ctx.strokeStyle = '#bbf7d0';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(14, dockY, chemW, dockH, 8);
    else ctx.rect(14, dockY, chemW, dockH);
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 10px Pretendard, sans-serif';
    ctx.fillStyle = '#166534';
    ctx.textAlign = 'left';
    ctx.fillText('🧪 화학 원소 (물질의 기본)', 24, dockY + 12);

    // Prime shelf
    const primeX = 22 + chemW;
    const primeW = w - primeX - 14;
    ctx.fillStyle = '#eef2ff';
    ctx.strokeStyle = '#c7d2fe';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(primeX, dockY, primeW, dockH, 8);
    else ctx.rect(primeX, dockY, primeW, dockH);
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 10px Pretendard, sans-serif';
    ctx.fillStyle = '#3730a3';
    ctx.fillText('🔢 소수 원자 (자연수의 기본)', primeX + 10, dockY + 12);

    // Chamber Area (Center bottom)
    const cx = w / 2;
    const cy = h * 0.65;
    const cr = Math.min(w * 0.40, h * 0.31);

    // Pulsing chamber ring
    const chamberPulse = Math.sin(t * 3) * 2;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, cr + chamberPulse, 0, Math.PI * 2);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 6]);
    ctx.stroke();
    ctx.restore();

    // Chamber Radial Glow Fill
    const chamberGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, cr);
    chamberGrad.addColorStop(0, '#ffffff');
    chamberGrad.addColorStop(0.85, '#f8fafc');
    chamberGrad.addColorStop(1, '#f1f5f9');
    ctx.fillStyle = chamberGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();

    // Chamber Title
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 12px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('⚗️ 원자 & 소수 조립 챔버 (원자를 끌어다 놓으세요)', cx, cy - cr + 14);

    // Check atoms inside chamber
    const inside = atoms.filter(a => Math.hypot(a.x - cx, a.y - cy) < cr - 10);
    const hCount = inside.filter(a => a.label === 'H').length;
    const oCount = inside.filter(a => a.label === 'O').length;
    const p2Count = inside.filter(a => a.label === '2').length;
    const p3Count = inside.filter(a => a.label === '3').length;
    const p5Count = inside.filter(a => a.label === '5').length;
    const p7Count = inside.filter(a => a.label === '7').length;

    // Draw Bond lines between atoms inside chamber
    if (inside.length >= 2) {
      ctx.save();
      for (let i = 0; i < inside.length; i++) {
        for (let j = i + 1; j < inside.length; j++) {
          const a1 = inside[i];
          const a2 = inside[j];
          ctx.beginPath();
          ctx.moveTo(a1.x, a1.y);
          ctx.lineTo(a2.x, a2.y);
          ctx.strokeStyle = 'rgba(99, 102, 241, 0.45)';
          ctx.lineWidth = 3;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // Chamber Combination Detection & Feedback Card
    let resultText = '';
    let resultSub = '';
    let resultColor = '#4f46e5';

    if (hCount === 2 && oCount === 1) {
      const curKey = 'H2O';
      if (lastComboKey !== curKey) {
        spawnBondParticles(cx, cy, '#0284c7');
        lastComboKey = curKey;
      }
      resultText = '💥 화학 결합 성공: 물 분자 (H₂O) 형성!';
      resultSub = '수소(H) 원자 2개와 산소(O) 원자 1개가 결합하여 새로운 물질(물)을 이룹니다.';
      resultColor = '#0284c7';
    } else {
      const primeInsideCount = p2Count + p3Count + p5Count + p7Count;
      if (primeInsideCount >= 2) {
        const val = Math.pow(2, p2Count) * Math.pow(3, p3Count) * Math.pow(5, p5Count) * Math.pow(7, p7Count);
        const formula = [];
        if (p2Count > 0) formula.push(p2Count === 1 ? '2' : `2^${p2Count}`);
        if (p3Count > 0) formula.push(p3Count === 1 ? '3' : `3^${p3Count}`);
        if (p5Count > 0) formula.push(p5Count === 1 ? '5' : `5^${p5Count}`);
        if (p7Count > 0) formula.push(p7Count === 1 ? '7' : `7^${p7Count}`);

        const curKey = `PRIME_${val}`;
        if (lastComboKey !== curKey) {
          spawnBondParticles(cx, cy, '#4f46e5');
          lastComboKey = curKey;
        }
        resultText = `🔢 자연수 결합 성공: 합성수 ${val} = ${formula.join(' × ')}`;
        resultSub = `자연수의 기본 원소인 소수들의 곱으로 합성수 ${val}이(가) 조립되었습니다!`;
        resultColor = '#4f46e5';
      } else if (inside.length === 1) {
        lastComboKey = '';
        resultText = `🔍 기본 원소 1개: [${inside[0].label}] (${inside[0].sub})`;
        resultSub = '다른 원자를 함께 넣어 분자나 합성수를 조립해 보세요.';
        resultColor = '#64748b';
      } else {
        lastComboKey = '';
      }
    }

    // Result Card rendering
    if (resultText) {
      const cardW = Math.min(w - 40, 480);
      const cardH = 48;
      const cardY = cy + cr - 42;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = resultColor;
      ctx.lineWidth = 2;
      ctx.shadowColor = resultColor;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(cx - cardW / 2, cardY, cardW, cardH, 8);
      else ctx.rect(cx - cardW / 2, cardY, cardW, cardH);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = resultColor;
      ctx.font = 'bold 13px Pretendard, sans-serif';
      ctx.fillText(resultText, cx, cardY + 16);

      ctx.fillStyle = '#475569';
      ctx.font = '11px Pretendard, sans-serif';
      ctx.fillText(resultSub, cx, cardY + 34);
    }

    // Draw Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Draw Atoms
    atoms.forEach(a => {
      ctx.save();
      if (a.isDragging || a.isHovered) {
        ctx.shadowColor = a.color;
        ctx.shadowBlur = 12;
      } else {
        ctx.shadowColor = 'rgba(0,0,0,0.12)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
      }

      ctx.fillStyle = a.color;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // White outline
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.stroke();

      // Atom Label
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 14px Pretendard, sans-serif';
      ctx.fillText(a.label, a.x, a.y);
    });

    // Helper hint at the very bottom
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.font = '10px Pretendard, sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('💡 H 2개 + O 1개 ➔ H₂O 결합 / 소수들을 모아 합성수(6=2×3, 12=2²×3 등)를 조립해 보세요.', w / 2, h - 2);

    animId = requestAnimationFrame(draw);
  }

  draw();
}
