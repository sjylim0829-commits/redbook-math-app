function gradeStep1_9() {
  const q1Input = document.getElementById('ans-1-9-1');
  const q2Input = document.getElementById('ans-1-9-2');
  const q3Input = document.getElementById('ans-1-9-3');
  const q4Input = document.getElementById('ans-1-9-4');
  const fb = document.getElementById('feedback-1-9');
  if (!q1Input || !q2Input || !q3Input || !q4Input || !fb) return;

  const raw1 = (q1Input.value || '').trim();
  const raw2 = (q2Input.value || '').trim();
  const raw3 = (q3Input.value || '').trim();
  const raw4 = (q4Input.value || '').trim();

  // Normalize
  const norm = (s) => s.toLowerCase().replace(/\s+/g, '');

  const a1 = norm(raw1);
  const a2 = norm(raw2);
  const a3 = norm(raw3);
  const a4 = norm(raw4);

  // Q1: -7
  const isQ1Correct = (a1 === '-7');

  // Q2: 6 (or +6)
  const isQ2Correct = (a2 === '6' || a2 === '+6');

  // Q3: -4
  const isQ3Correct = (a3 === '-4');

  // Q4: -5
  const isQ4Correct = (a4 === '-5');

  const allCorrect = isQ1Correct && isQ2Correct && isQ3Correct && isQ4Correct;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab1_9) state.lab1_9.isPassed = true;
    state.substepProgress['1-9'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (교과서 p.75 문제 7 완벽 해결)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          • ⑴ $3x - 1 = 3 \\times (-2) - 1 = -6 - 1 = -7$<br>
          • ⑵ $4 - x = 4 - (-2) = 4 + 2 = 6$<br>
          • ⑶ $-x^2 = -(-2)^2 = -(4) = -4$ ($-x^2$과 $(-x)^2$의 차이 완벽 구별!)<br>
          • ⑷ $\\frac{10}{x} = \\frac{10}{-2} = -5$<br>
          음수 대입 시의 부호 규칙과 거듭제곱 연산을 빈틈없이 정확하게 마스터했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    // Remote LMS DB save
    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('1-9', { score: 100, passed: true }, 'unit3');
    }

    // Auto unlock next substep 1-10
    if (!state.unlockedSubSteps.includes('1-10')) {
      state.unlockedSubSteps.push('1-10');
    }
  } else {
    let errorMsg = [];
    if (!isQ1Correct) errorMsg.push('⑴ $3x - 1$: $3 \\times (-2) - 1 = -6 - 1 = -7$ (입력: -7) 입니다.');
    if (!isQ2Correct) errorMsg.push('⑵ $4 - x$: $4 - (-2) = 4 + 2 = 6$ (입력: 6) 입니다.');
    if (!isQ3Correct) errorMsg.push('⑶ $-x^2$: $-(-2)^2 = -(4) = -4$ (입력: -4) 입니다. 괄호 밖의 음부호(-)에 주의하세요.');
    if (!isQ4Correct) errorMsg.push('⑷ $\\frac{10}{x}$: $\\frac{10}{-2} = -5$ (입력: -5) 입니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">

  if (!state.lab1_10) resetLab1_10();

  const cardW = Math.min(W - 40, 560);
  const cardH = 340;
  const cardX = W / 2;
  const cardY = 190;

  const cardBg = two.makeRoundedRectangle(cardX, cardY, cardW, cardH, 12);

  cardBg.stroke = '#e2e8f0';
  cardBg.linewidth = 1.5;

  // Header Title
  const titleBox = two.makeRoundedRectangle(cardX, cardY - 135, cardW - 24, 40, 8);
  titleBox.fill = '#f1f5f9';

  titleBox.linewidth = 1;

  const titles = {
    'q1': '문제 8-(1) : 2a - 3b 에서 두 문자 a, b 에 각각 수 대입',

  titleTxt.size = 13.5;
  titleTxt.weight = 700;
  titleTxt.fill = '#1e293b';

  // Value Selectors: Top Row for a, Bottom Row for b
  const aPresets = [1, 2, 3, 4];
  const bPresets = [-5, -4, -3, -2, 2];

  // a selector
  const aLabel = two.makeText('문자 a =', cardX - 170, cardY - 95);
  aLabel.size = 12; aLabel.weight = 700; aLabel.fill = '#0284c7';

  aPresets.forEach((val, idx) => {
    const pX = cardX - 110 + idx * 46;
    const isAct = (a === val);
    const pBtn = two.makeRoundedRectangle(pX, cardY - 95, 38, 24, 5);
    pBtn.fill = isAct ? '#0284c7' : '#f0f9ff';
    pBtn.stroke = isAct ? '#0369a1' : '#bae6fd';
    pBtn.linewidth = 1;

    const pTxt = two.makeText(val.toString(), pX, cardY - 95);
    pTxt.size = 11.5; pTxt.weight = 700; pTxt.fill = isAct ? '#ffffff' : '#0369a1';

    two.update();
    if (pBtn._renderer && pBtn._renderer.elem) {
      pBtn._renderer.elem.style.cursor = 'pointer';
      pBtn._renderer.elem.onclick = () => setValA1_10(val);
    }
  });

  // b selector
  const bLabel = two.makeText('문자 b =', cardX + 75, cardY - 95);
  bLabel.size = 12; bLabel.weight = 700; bLabel.fill = '#dc2626';

  bPresets.forEach((val, idx) => {
    const pX = cardX + 130 + idx * 42;
    const isAct = (b === val);
    const pBtn = two.makeRoundedRectangle(pX, cardY - 95, 36, 24, 5);
    pBtn.fill = isAct ? '#dc2626' : '#fef2f2';
    pBtn.stroke = isAct ? '#b91c1c' : '#fecaca';
    pBtn.linewidth = 1;

    const pTxt = two.makeText(val.toString(), pX, cardY - 95);
    pTxt.size = 11; pTxt.weight = 700; pTxt.fill = isAct ? '#ffffff' : '#b91c1c';

    two.update();
    if (pBtn._renderer && pBtn._renderer.elem) {
      pBtn._renderer.elem.style.cursor = 'pointer';
      pBtn._renderer.elem.onclick = () => setValB1_10(val);
    }
  });

  // Stage Center: Step-by-Step Dual Substitution Card
  const stageY = cardY + 18;
  const stageBox = two.makeRoundedRectangle(cardX, stageY, 430, 110, 8);
  stageBox.fill = '#faf5ff';
  stageBox.stroke = '#c084fc';
  stageBox.linewidth = 1.5;

  if (curQ === 'q1') {
    // 2a - 3b
    const s1 = two.makeText('원래 식:  2 a  -  3 b', cardX, stageY - 32);
    s1.size = 14; s1.weight = 700; s1.fill = '#1e293b';

    const s2 = two.makeText(`a = (${a}),  b = (${b})  대입 ➜  2 × (${a}) - 3 × (${b})`, cardX, stageY - 6);
    s2.size = 14; s2.weight = 800; s2.fill = '#7e22ce';

    const term1 = 2 * a;
    const term2 = 3 * b;
    const res = term1 - term2;
    const s3 = two.makeText(`계산: (${term1}) - (${term2}) = ${term1} + (${-term2}) = ${res}`, cardX, stageY + 22);
    s3.size = 14.5; s3.weight = 800; s3.fill = '#15803d';
  } else {
    // ab + b^2
    const s1 = two.makeText('원래 식:  a b  +  b²', cardX, stageY - 32);
    s1.size = 14; s1.weight = 700; s1.fill = '#1e293b';

    const s2 = two.makeText(`a = (${a}),  b = (${b})  대입 ➜  (${a}) × (${b}) + (${b})²`, cardX, stageY - 6);
    s2.size = 14; s2.weight = 800; s2.fill = '#7e22ce';

    const term1 = a * b;
    const term2 = b * b;
    const res = term1 + term2;
    const s3 = two.makeText(`계산: (${term1}) + (${term2}) = ${res}`, cardX, stageY + 22);
    s3.size = 14.5; s3.weight = 800; s3.fill = '#15803d';
  }

  // Tip Banner inside Card
  const tipY = cardY + 125;
  const tipBox = two.makeRoundedRectangle(cardX, tipY, cardW - 32, 34, 6);
  tipBox.fill = '#f0fdf4';
  tipBox.stroke = '#86efac';
  tipBox.linewidth = 1;

  const tips = {
    'q1': '2a - 3b ➜ 2 × 3 - 3 × (-4) = 6 - (-12) = 6 + 12 = 18 (부호 주의!)',
    'q2': 'ab + b² ➜ 3 × (-4) + (-4)² = -12 + 16 = 4 (거듭제곱 부호 주의!)'
  };

  const tipTxt = two.makeText(tips[curQ], cardX, tipY);
  tipTxt.size = 12.5;
  tipTxt.weight = 700;
  tipTxt.fill = '#15803d';
}

function gradeStep1_10() {
  const q1Input = document.getElementById('ans-1-10-1');

  const raw2 = (q2Input.value || '').trim();

  // Normalize
  const norm = (s) => s.toLowerCase().replace(/\s+/g, '');

  const a1 = norm(raw1);
  const a2 = norm(raw2);

  // Q1: 18 (or +18)
  const isQ1Correct = (a1 === '18' || a1 === '+18');

  const isQ2Correct = (a2 === '4' || a2 === '+4');

  const allCorrect = isQ1Correct && isQ2Correct;

          두 개 이상의 문자가 있는 식에서도 각 문자에 정확히 수를 괄호 대입하여 완벽하게 계산했습니다!

function gradeStep1_11() {
  const q1Input = document.getElementById('ans-1-11-1');
  const q2Input = document.getElementById('ans-1-11-2');
  const q3Input = document.getElementById('ans-1-11-3');
  const q4Input = document.getElementById('ans-1-11-4');
  const fb = document.getElementById('feedback-1-11');

  if (!q1Input || !q2Input || !q3Input || !q4Input || !fb) return;

  const norm = (s) => (s || '').toLowerCase().replace(/\s+/g, '');

  const a1 = norm(q1Input.value);
  const a2 = norm(q2Input.value);
  const a3 = norm(q3Input.value);
  const a4 = norm(q4Input.value);

  const is1Correct = (a1 === '-3ab' || a1 === '-3ba');
  const is2Correct = (
    a2 === 'x/5' ||
    a2 === '(x)/5' ||
    a2 === '(1/5)x' ||
    a2 === '1/5x' ||
    a2 === '(1/5)*x' ||
    a2 === '1/5*x' ||
    a2 === '0.2x' ||
    a2 === '+x/5' ||
    a2 === '+(1/5)x'
  );
  const is3Correct = (a3 === '0.1ab' || a3 === '0.1ba');
  const is4Correct = (
    a4 === '(x-1)/y' ||
    a4 === '((x-1)/y)' ||
    a4 === '(x-1)*(1/y)' ||
    a4 === '(1/y)(x-1)' ||
    a4 === '-(1-x)/y'
  );

  const allCorrect = is1Correct && is2Correct && is3Correct && is4Correct;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab1_11) state.lab1_11.isPassed = true;
    state.substepProgress['1-11'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (스스로 확인하기 1번 완성)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          • ⑴ $a \\times (-3) \\times b = -3ab$<br>
          • ⑵ $x \\div 5 = \\frac{x}{5}$ 또는 $\\frac{1}{5}x$<br>
          • ⑶ $a \\times 0.1 \\times b = 0.1ab$ ($0.1$의 $1$은 생략 안 함)<br>
          • ⑷ $(x - 1) \\div y = \\frac{x - 1}{y}$<br>
          곱셈과 나눗셈 기호의 생략 규칙 4가지를 완벽히 적용했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('1-11', { score: 100, passed: true }, 'unit3');
    }

    if (!state.unlockedSubSteps.includes('1-12')) {
      state.unlockedSubSteps.push('1-12');
    }
  } else {
    let errorMsg = [];
    if (!is1Correct) errorMsg.push('⑴: 수 $(-3)$을 맨 앞에 쓰고 알파벳 순서로 $-3ab$ 입니다.');
    if (!is2Correct) errorMsg.push('⑵: 나눗셈을 분수 꼴로 나타내어 $\\frac{x}{5}$ 또는 $\\frac{1}{5}x$ (입력: x/5) 입니다.');
    if (!is3Correct) errorMsg.push('⑶: 소수 $0.1$의 $1$은 생략하지 않고 수 $0.1$을 앞에 써서 $0.1ab$ 입니다.');
    if (!is4Correct) errorMsg.push('⑷: 분수 꼴에서 괄호를 생략하여 $\\frac{x-1}{y}$ (입력: (x-1)/y) 입니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.3rem;">💡</span>
          <h6 style="color:#9f1239; font-weight:700; margin:0;">다시 확인해 보세요!</h6>
        </div>
        <div style="font-size:0.86rem; color:#be123c; line-height:1.6;">
          ${errorMsg.map(msg => `<div>• ${msg}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

function drawMode2TrapezoidGeo(two, w, h) {
  const a = (state.lab1_12 && state.lab1_12.trapA) || 4;
  const b = (state.lab1_12 && state.lab1_12.trapB) || 8;
  const th = (state.lab1_12 && state.lab1_12.trapH) || 5;
  const showDouble = (state.lab1_12 && state.lab1_12.showDoubleTrap) || false;

  const titleTxt = two.makeText('스스로 확인하기 2-⑵: 사다리꼴 넓이 공식 기하 유도 (교과서 p.76)', w / 2, 24);
  titleTxt.size = 14;
  titleTxt.weight = 800;
  titleTxt.fill = '#1e293b';

  const toggleBtn = two.makeRoundedRectangle(w / 2, 54, 320, 28, 6);
  toggleBtn.fill = showDouble ? '#10b981' : '#4f46e5';
  toggleBtn.stroke = showDouble ? '#059669' : '#4338ca';
  toggleBtn.linewidth = 1.5;

  const toggleTxt = two.makeText(
    showDouble ? '🧩 결합 해제 (원래 사다리꼴만 보기)' : '🧩 합동인 사다리꼴 1개 더 붙이기 (평행사변형 유도)',
    w / 2,
    54
  );
  toggleTxt.size = 11.5;
  toggleTxt.weight = 800;
  toggleTxt.fill = '#ffffff';

  if (toggleBtn._renderer && toggleBtn._renderer.elem) {
    toggleBtn._renderer.elem.style.cursor = 'pointer';
    toggleBtn._renderer.elem.onclick = toggleDoubleTrap1_12;
  }

  const scale = 20;
  const baseY = 240;
  const topY = baseY - th * scale;

  const totalW = showDouble ? (a + b) * scale : b * scale;
  const startX = (w - totalW) / 2;

  const t1_bl = { x: startX, y: baseY };
  const t1_br = { x: startX + b * scale, y: baseY };
  const t1_tr = { x: startX + a * scale + (b - a) * scale * 0.4, y: topY };
  const t1_tl = { x: startX + (b - a) * scale * 0.4, y: topY };

  const path1 = two.makePath(t1_bl.x, t1_bl.y, t1_br.x, t1_br.y, t1_tr.x, t1_tr.y, t1_tl.x, t1_tl.y, false);
  path1.fill = '#dbeafe';
  path1.stroke = '#2563eb';
  path1.linewidth = 2;

  const aLbl = two.makeText(`윗변 a = ${a} cm`, (t1_tl.x + t1_tr.x) / 2, topY - 12);
  aLbl.size = 12;
  aLbl.weight = 800;
  aLbl.fill = '#1d4ed8';

  const bLbl = two.makeText(`아랫변 b = ${b} cm`, (t1_bl.x + t1_br.x) / 2, baseY + 18);
  bLbl.size = 12;
  bLbl.weight = 800;
  bLbl.fill = '#1d4ed8';

  const hLine = two.makeLine(t1_tl.x, topY, t1_tl.x, baseY);
  hLine.stroke = '#dc2626';
  hLine.linewidth = 1.5;
  hLine.dashes = [4, 3];

  const hLbl = two.makeText(`h = ${th} cm`, t1_tl.x - 28, (topY + baseY) / 2);
  hLbl.size = 11.5;
  hLbl.weight = 800;
  hLbl.fill = '#dc2626';

  if (showDouble) {
    const t2_bl = { x: t1_br.x, y: baseY };
    const t2_br = { x: t1_br.x + a * scale, y: baseY };
    const t2_tr = { x: t1_tr.x + b * scale, y: topY };
    const t2_tl = { x: t1_tr.x, y: topY };

    const path2 = two.makePath(t2_bl.x, t2_bl.y, t2_br.x, t2_br.y, t2_tr.x, t2_tr.y, t2_tl.x, t2_tl.y, false);
    path2.fill = '#fef3c7';
    path2.stroke = '#d97706';
    path2.linewidth = 2;
    path2.opacity = 0.85;

    const twinLbl = two.makeText('합동인 사다리꼴 (뒤집어 결합)', (t2_bl.x + t2_tr.x) / 2, (topY + baseY) / 2);
    twinLbl.size = 11;
    twinLbl.weight = 700;
    twinLbl.fill = '#b45309';

    const paraLbl = two.makeText(`합성 평행사변형 밑변 = a + b = ${a + b} cm`, startX + (a + b) * scale / 2, baseY + 36);
    paraLbl.size = 12.5;
    paraLbl.weight = 800;
    paraLbl.fill = '#047857';
  }

  const cardW = w - 40;
  const fBox = two.makeRoundedRectangle(w / 2, 316, cardW, 58, 8);
  fBox.fill = '#f8fafc';
  fBox.stroke = '#cbd5e1';
  fBox.linewidth = 1.5;

  const fHead = two.makeText('📐 사다리꼴 넓이 공식의 문자식 표현', w / 2, 300);
  fHead.size = 12;
  fHead.weight = 700;
  fHead.fill = '#334155';

  const fBody = two.makeText(
    showDouble
      ? `(평행사변형 넓이) = (a + b) × h ➜ (사다리꼴 1개) = (a + b)h / 2 = (${a}+${b})×${th}/2 = ${(a + b) * th / 2} cm²`
      : '사다리꼴의 넓이 = (윗변 + 아랫변) × 높이 ÷ 2 ➜ 문자로 표현: (a + b)h / 2  또는  1/2(a + b)h',
    w / 2,
    328
  );
  fBody.size = 13.5;
  fBody.weight = 800;
  fBody.fill = '#1e293b';
}

function gradeStep1_12() {
  const q1Input = document.getElementById('ans-1-12-1');
  const q2Input = document.getElementById('ans-1-12-2');
  const fb = document.getElementById('feedback-1-12');

  if (!q1Input || !q2Input || !fb) return;

  const norm = (s) => (s || '').toLowerCase().replace(/\s+/g, '');

  const a1 = norm(q1Input.value);
  const a2 = norm(q2Input.value);

  // 2-⑴: 800x+1200y or 1200y+800x
  const is1Correct = (
    a1 === '800x+1200y' ||
    a1 === '1200y+800x' ||
    a1 === '800*x+1200*y' ||
    a1 === '1200*y+800*x'
  );

  // 2-⑵: (a+b)h/2 or ((a+b)h)/2 or 1/2(a+b)h or (1/2)(a+b)h or h(a+b)/2 or (b+a)h/2
  const is2Correct = (
    a2 === '(a+b)h/2' ||
    a2 === '((a+b)h)/2' ||
    a2 === '((a+b)*h)/2' ||
    a2 === '(a+b)*h/2' ||
    a2 === '(b+a)h/2' ||
    a2 === 'h(a+b)/2' ||
    a2 === 'h*(a+b)/2' ||
    a2 === '(1/2)(a+b)h' ||
    a2 === '1/2(a+b)h' ||
    a2 === '(1/2)*(a+b)*h' ||
    a2 === '1/2*(a+b)*h' ||
    a2 === '0.5(a+b)h' ||
    a2 === '0.5*(a+b)*h'
  );

  const allCorrect = is1Correct && is2Correct;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab1_12) state.lab1_12.isPassed = true;
    state.substepProgress['1-12'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (스스로 확인하기 2번 완성)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          • ⑴ 연필 $x$자루와 공책 $y$권 구매 금액: $800x + 1200y$ 원<br>
          • ⑵ 사다리꼴의 넓이: $\\frac{(a + b)h}{2}\\text{ cm}^2$ 또는 $\\frac{1}{2}(a + b)h\\text{ cm}^2$<br>
          문장제 상황을 문자를 사용한 식으로 완벽하게 표현했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('1-12', { score: 100, passed: true }, 'unit3');
    }

    if (!state.unlockedSubSteps.includes('1-13')) {
      state.unlockedSubSteps.push('1-13');
    }
  } else {
    let errorMsg = [];
    if (!is1Correct) errorMsg.push('⑴: 연필 가격 $800x$와 공책 가격 $1200y$의 합인 $800x + 1200y$ 입니다.');
    if (!is2Correct) errorMsg.push('⑵: 사다리꼴 넓이는 (윗변+아랫변)×높이÷2 이므로 $\\frac{(a+b)h}{2}$ (입력: (a+b)h/2) 입니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.3rem;">💡</span>
          <h6 style="color:#9f1239; font-weight:700; margin:0;">다시 확인해 보세요!</h6>
        </div>
        <div style="font-size:0.86rem; color:#be123c; line-height:1.6;">
          ${errorMsg.map(msg => `<div>• ${msg}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }

// Grading Logic (⑴ 3항목, ⑵ 4항목 전수 채점 및 관용성)
// -------------------------------------------------------------
function gradeStep2_1() {
  const q1Terms = document.getElementById('ans-2-1-1');
  const q1Const = document.getElementById('ans-2-1-2');
  const q1Coeff = document.getElementById('ans-2-1-3');

  const q2Terms = document.getElementById('ans-2-1-4');
  const q2Const = document.getElementById('ans-2-1-5');
  const q2CoeffA = document.getElementById('ans-2-1-6');
  const q2CoeffB = document.getElementById('ans-2-1-7');

  const fb = document.getElementById('feedback-2-1');

  if (!q1Terms || !q1Const || !q1Coeff || !q2Terms || !q2Const || !q2CoeffA || !q2CoeffB || !fb) return;

  const norm = (s) => (s || '').toLowerCase().replace(/\s+/g, '');
  const parseList = (s) => norm(s).split(',').filter(x => x.length > 0).sort();

  // ⑴ 2x - 5
  // Terms: '2x', '-5'
  const t1 = parseList(q1Terms.value);
  const isQ1TermsOk = (t1.length === 2 && t1.includes('2x') && t1.includes('-5'));
  const isQ1ConstOk = (norm(q1Const.value) === '-5');
  const isQ1CoeffOk = (norm(q1Coeff.value) === '2' || norm(q1Coeff.value) === '+2');

  // ⑵ -a + 3b - 1
  // Terms: '-a', '3b', '-1'
  const t2 = parseList(q2Terms.value);
  const isQ2TermsOk = (t2.length === 3 && t2.includes('-a') && t2.includes('3b') && t2.includes('-1'));
  const isQ2ConstOk = (norm(q2Const.value) === '-1');
  const isQ2CoeffAOk = (norm(q2CoeffA.value) === '-1');
  const isQ2CoeffBOk = (norm(q2CoeffB.value) === '3' || norm(q2CoeffB.value) === '+3');

  const allQ1 = isQ1TermsOk && isQ1ConstOk && isQ1CoeffOk;
  const allQ2 = isQ2TermsOk && isQ2ConstOk && isQ2CoeffAOk && isQ2CoeffBOk;
  const allCorrect = allQ1 && allQ2;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab2_1) state.lab2_1.isPassed = true;
    state.substepProgress['2-1'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (다항식의 용어 마스터)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          <b>[⑴ $2x - 5$ 정답 해설]</b><br>
          • 항: $2x, -5$<br>
          • 상수항: $-5$ (음부호 포함)<br>
          • $x$의 계수: $2$<br><br>
          <b>[⑵ $-a + 3b - 1$ 정답 해설]</b><br>
          • 항: $-a, 3b, -1$<br>
          • 상수항: $-1$<br>
          • $a$의 계수: $-1$ ($-1 \\times a$에서 $1$ 생략 주의!)<br>
          • $b$의 계수: $3$<br>
          다항식의 항 분해, 상수항 판정, 계수 식별을 모두 정확하게 수행했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('2-1', { score: 100, passed: true }, 'unit3');
    }

    if (!state.unlockedSubSteps.includes('2-2')) {
      state.unlockedSubSteps.push('2-2');
    }
  } else {
    let errorMsg = [];
    if (!isQ1TermsOk) errorMsg.push('⑴의 항은 덧셈으로 연결된 $2x$와 $-5$ 입니다. (입력 예: 2x, -5)');
    if (!isQ1ConstOk) errorMsg.push('⑴의 상수항은 수로만 이루어진 $-5$ 입니다.');
    if (!isQ1CoeffOk) errorMsg.push('⑴의 $x$의 계수는 $x$ 앞에 곱해진 수 $2$ 입니다.');
    if (!isQ2TermsOk) errorMsg.push('⑵의 항은 $-a, 3b, -1$ 입니다. (쉼표로 구분)');
    if (!isQ2ConstOk) errorMsg.push('⑵의 상수항은 $-1$ 입니다.');
    if (!isQ2CoeffAOk) errorMsg.push('⑵의 $a$의 계수는 $-1 \\times a$이므로 $-1$ 입니다.');
    if (!isQ2CoeffBOk) errorMsg.push('⑵의 $b$의 계수는 $3$ 입니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.3rem;">💡</span>
          <h6 style="color:#9f1239; font-weight:700; margin:0;">다시 확인해 보세요!</h6>
        </div>
        <div style="font-size:0.86rem; color:#be123c; line-height:1.6;">
          ${errorMsg.map(msg => `<div>• ${msg}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

// -------------------------------------------------------------
// Grading Logic (문제 2 차수 4항목 + 일차식 선택 전수 채점)
// -------------------------------------------------------------
function gradeStep2_2() {
  const q1 = document.getElementById('ans-2-2-1');
  const q2 = document.getElementById('ans-2-2-2');
  const q3 = document.getElementById('ans-2-2-3');
  const q4 = document.getElementById('ans-2-2-4');
  const q5 = document.getElementById('ans-2-2-5');
  const fb = document.getElementById('feedback-2-2');

  if (!q1 || !q2 || !q3 || !q4 || !q5 || !fb) return;

  const norm = (s) => (s || '').toLowerCase().replace(/\s+/g, '');

  const a1 = norm(q1.value);
  const a2 = norm(q2.value);
  const a3 = norm(q3.value);
  const a4 = norm(q4.value);
  const a5 = norm(q5.value);

  // 차수 검증
  const is1Ok = (a1 === '1' || a1 === '1차');
  const is2Ok = (a2 === '2' || a2 === '2차');
  const is3Ok = (a3 === '0' || a3 === '0차');
  const is4Ok = (a4 === '1' || a4 === '1차');

  // 일차식 선택 검증 (⑴, ⑷ 또는 1, 4 조합)
  // Clean string to digits or numbers
  const cleaned = a5.replace(/[()⑴⑵⑶⑷,]/g, (m) => {
    if (m === '⑴') return '1';
    if (m === '⑵') return '2';
    if (m === '⑶') return '3';
    if (m === '⑷') return '4';
    return m === ',' ? ',' : '';
  });
  const parts = cleaned.split(',').filter(x => x.length > 0).sort();

  const is5Ok = (
    (parts.length === 2 && parts.includes('1') && parts.includes('4')) ||
    a5 === '⑴,⑷' ||
    a5 === '⑷,⑴' ||
    a5 === '1,4' ||
    a5 === '4,1'
  );

  const allCorrect = is1Ok && is2Ok && is3Ok && is4Ok && is5Ok;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab2_2) state.lab2_2.isPassed = true;
    state.substepProgress['2-2'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (다항식의 차수와 일차식 완성)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          <b>[1. 각 다항식의 차수 정답]</b><br>
          • ⑴ $-2x + 1$: 차수 $1$ (문자 $x$가 1개 곱해짐)<br>
          • ⑵ $a^2 - 3a + 2$: 차수 $2$ (최고차항 $a^2$의 차수 $2$)<br>
          • ⑶ $5$: 차수 $0$ (문자가 없는 상수항)<br>
          • ⑷ $\\frac{y}{4} - 1$: 차수 $1$ (최고차항 $\\frac{1}{4}y$의 차수 $1$)<br><br>
          <b>[2. 일차식 정답]</b><br>
          • 차수가 1인 다항식: <b>⑴, ⑷</b><br>
          다항식의 차수 판정 및 일차식의 개념을 완벽하게 이해했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('2-2', { score: 100, passed: true }, 'unit3');
    }

    if (!state.unlockedSubSteps.includes('2-3')) {
      state.unlockedSubSteps.push('2-3');
    }
  } else {
    let errorMsg = [];
    if (!is1Ok) errorMsg.push('⑴ $-2x + 1$의 차수는 문자 $x$가 1개 곱해져 있으므로 $1$ 입니다.');
    if (!is2Ok) errorMsg.push('⑵ $a^2 - 3a + 2$의 차수는 가장 큰 항 $a^2$의 차수인 $2$ 입니다.');
    if (!is3Ok) errorMsg.push('⑶ $5$는 수로만 이루어진 상수항이므로 차수가 $0$ 입니다.');
    if (!is4Ok) errorMsg.push('⑷ $\\frac{y}{4} - 1$은 $\\frac{1}{4}y - 1$이므로 차수가 $1$ 입니다.');
    if (!is5Ok) errorMsg.push('일차식은 차수가 1인 다항식이므로 ⑴과 ⑷ 입니다. (입력 예: ⑴, ⑷ 또는 1, 4)');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.3rem;">💡</span>
          <h6 style="color:#9f1239; font-weight:700; margin:0;">다시 확인해 보세요!</h6>
        </div>
        <div style="font-size:0.86rem; color:#be123c; line-height:1.6;">
          ${errorMsg.map(msg => `<div>• ${msg}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

function gradeStep2_3() {

  const a3 = norm(q3.value);

  const is3Ok = (a3 === '4b' || a3 === '+4b');
  const is4Ok = (a4 === '4y' || a4 === '+4y');

  const allCorrect = is1Ok && is2Ok && is3Ok && is4Ok;

  fb.style.display = 'block';

    fb.innerHTML = `

          <b>[문제 3 계산 완벽 정답]</b><br>
          • ⑴ $2x \\times 5 = (2 \\times 5)x = 10x$<br>
          • ⑵ $(-3) \\times 4a = (-3 \\times 4)a = -12a$<br>
          • ⑶ $16b \\div 4 = 16b \\times \\frac{1}{4} = 4b$<br>
          • ⑷ $(-10y) \\div \\left(-\\frac{5}{2}\\right) = (-10y) \\times \\left(-\\frac{2}{5}\\right) = 4y$<br>
          단항식과 수의 곱셈 및 나눗셈(역수 변환) 원리를 완벽하게 마스터했습니다!

// -------------------------------------------------------------
// Model 1: 분배법칙 면적 분할 모델 (Area Partition Model)
// -------------------------------------------------------------
function drawMode1AreaModel(two, w, h) {
  const k = state.lab2_4 ? state.lab2_4.k : 2;
  const a = state.lab2_4 ? state.lab2_4.a : 3;
  const b = state.lab2_4 ? state.lab2_4.b : 1;

  // Title Box
  const titleBox = two.makeRoundedRectangle(w / 2, 28, w - 32, 34, 6);
  titleBox.fill = '#ffffff';
  titleBox.stroke = '#cbd5e1';
  const bSign = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
  const titleTxt = two.makeText(`📐 분배법칙 면적 모델:  ${k}(${a}x ${bSign}) = ${k * a}x ${k * b >= 0 ? '+ ' + (k * b) : '- ' + Math.abs(k * b)}`, w / 2, 28);
  titleTxt.size = 14;
  titleTxt.weight = 800;
  titleTxt.fill = '#1e293b';

  // Stepper Controls Container (Y = 68)
  const ctrlY = 66;

  function makeStepper(cx, label, valStr, onMinus, onPlus) {
    const lbl = two.makeText(label, cx - 44, ctrlY);
    lbl.size = 12;
    lbl.weight = 700;
    lbl.fill = '#475569';

    // Minus btn
    const btnM = two.makeRoundedRectangle(cx - 10, ctrlY, 20, 20, 4);
    btnM.fill = '#f1f5f9';
    btnM.stroke = '#94a3b8';
    const txtM = two.makeText('−', cx - 10, ctrlY);
    txtM.size = 13;
    txtM.weight = 800;
    txtM.fill = '#334155';

    // Value box
    const valBox = two.makeRoundedRectangle(cx + 12, ctrlY, 24, 20, 4);
    valBox.fill = '#ffffff';
    valBox.stroke = '#cbd5e1';
    const valTxt = two.makeText(valStr, cx + 12, ctrlY);
    valTxt.size = 12;
    valTxt.weight = 800;
    valTxt.fill = '#0f172a';

    // Plus btn
    const btnP = two.makeRoundedRectangle(cx + 34, ctrlY, 20, 20, 4);
    btnP.fill = '#f1f5f9';
    btnP.stroke = '#94a3b8';
    const txtP = two.makeText('+', cx + 34, ctrlY);
    txtP.size = 13;
    txtP.weight = 800;
    txtP.fill = '#334155';

    setTimeout(() => {
      if (btnM._renderer && btnM._renderer.elem) {
        btnM._renderer.elem.style.cursor = 'pointer';
        btnM._renderer.elem.onclick = onMinus;
      }
      if (btnP._renderer && btnP._renderer.elem) {
        btnP._renderer.elem.style.cursor = 'pointer';
        btnP._renderer.elem.onclick = onPlus;
      }
    }, 10);
  }

  const secW = w / 3;
  makeStepper(secW * 0.5, '세로 k =', `${k}`, () => changeMode1K(-1), () => changeMode1K(1));
  makeStepper(secW * 1.5, 'x계수 a =', `${a}`, () => changeMode1A(-1), () => changeMode1A(1));
  makeStepper(secW * 2.5, '상수항 b =', `${b}`, () => changeMode1B(-1), () => changeMode1B(1));

  // Rectangle Drawing Area
  // Height scales with k, Width partitioned into ax and b
  const rectBaseY = 210;
  const rectHeight = 60 + k * 18; // 78px ~ 150px
  const totalW = Math.min(420, w - 80);
  const ratioA = (a * 1.2) / (a * 1.2 + Math.abs(b) + 1);
  const part1W = Math.max(120, Math.min(totalW - 80, totalW * ratioA));
  const part2W = totalW - part1W;

  const startX = (w - totalW) / 2;

  // Left Block (ax width, k height) - Blue Theme
  const b1CenterX = startX + part1W / 2;
  const b1 = two.makeRoundedRectangle(b1CenterX, rectBaseY, part1W - 4, rectHeight, 6);
  b1.fill = '#dbeafe';
  b1.stroke = '#3b82f6';
  b1.linewidth = 2;

  // Right Block (b width, k height) - Amber/Rose Theme depending on sign
  const b2CenterX = startX + part1W + part2W / 2;
  const b2 = two.makeRoundedRectangle(b2CenterX, rectBaseY, part2W - 4, rectHeight, 6);
  if (b >= 0) {
    b2.fill = '#fef3c7';
    b2.stroke = '#f59e0b';
  } else {
    b2.fill = '#ffe4e6';
    b2.stroke = '#f43f5e';
  }
  b2.linewidth = 2;

  // Vertical Dimension Label (Left)
  const kLbl = two.makeText(`세로 ${k}`, startX - 28, rectBaseY);
  kLbl.size = 13;
  kLbl.weight = 800;
  kLbl.fill = '#1e293b';

  // Dimension bracket arrow or line
  const leftLine = two.makeLine(startX - 10, rectBaseY - rectHeight / 2, startX - 10, rectBaseY + rectHeight / 2);
  leftLine.stroke = '#64748b';
  leftLine.linewidth = 1.5;

  // Top Dimension Labels (Horizontal)
  const topY = rectBaseY - rectHeight / 2 - 14;
  const top1Txt = two.makeText(`${a}x`, b1CenterX, topY);
  top1Txt.size = 13;
  top1Txt.weight = 800;
  top1Txt.fill = '#2563eb';

  const top2Txt = two.makeText(b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`, b2CenterX, topY);
  top2Txt.size = 13;
  top2Txt.weight = 800;
  top2Txt.fill = b >= 0 ? '#d97706' : '#e11d48';

  // Inside Area Labels
  // Part 1: k * ax = (k*a)x
  const in1Main = two.makeText(`넓이 ①`, b1CenterX, rectBaseY - 14);
  in1Main.size = 12;
  in1Main.weight = 700;
  in1Main.fill = '#1d4ed8';

  const in1Val = two.makeText(`${k} × ${a}x = ${k * a}x`, b1CenterX, rectBaseY + 10);
  in1Val.size = 14;
  in1Val.weight = 800;
  in1Val.fill = '#1e40af';

  // Part 2: k * b = k*b
  const in2Main = two.makeText(`넓이 ②`, b2CenterX, rectBaseY - 14);
  in2Main.size = 12;
  in2Main.weight = 700;
  in2Main.fill = b >= 0 ? '#b45309' : '#be123c';

  const in2Calc = b >= 0 ? `${k} × ${b} = +${k * b}` : `${k} × (${b}) = ${k * b}`;
  const in2Val = two.makeText(in2Calc, b2CenterX, rectBaseY + 10);
  in2Val.size = 13;
  in2Val.weight = 800;
  in2Val.fill = b >= 0 ? '#92400e' : '#9f1239';

  // Bottom Summary Formula Box (Y = 328)
  const sumY = 326;
  const sumBox = two.makeRoundedRectangle(w / 2, sumY, Math.min(500, w - 40), 40, 8);
  sumBox.fill = '#f0fdf4';
  sumBox.stroke = '#86efac';
  sumBox.linewidth = 1.5;

  const totalFormula = `전체 직사각형 넓이 = 넓이 ① + 넓이 ② = ${k * a}x ${k * b >= 0 ? '+ ' + (k * b) : '- ' + Math.abs(k * b)}`;

// Grading Logic (문제 4 4문항 전수 채점)
// -------------------------------------------------------------
function gradeStep2_4() {
  const q1 = document.getElementById('ans-2-4-1');
  const q2 = document.getElementById('ans-2-4-2');
  const q3 = document.getElementById('ans-2-4-3');
  const q4 = document.getElementById('ans-2-4-4');
  const fb = document.getElementById('feedback-2-4');

  if (!q1 || !q2 || !q3 || !q4 || !fb) return;

  const norm = (s) => (s || '').toLowerCase().replace(/\s+/g, '');

  const a1 = norm(q1.value);
  const a2 = norm(q2.value);
  const a3 = norm(q3.value);
  const a4 = norm(q4.value);

  const is1Ok = (a1 === '8x-12' || a1 === '+8x-12');
  const is2Ok = (a2 === '2a+3' || a2 === '+2a+3');
  const is3Ok = (a3 === '2x-1' || a3 === '+2x-1');
  const is4Ok = (a4 === '3b-2' || a4 === '+3b-2');

  const allCorrect = is1Ok && is2Ok && is3Ok && is4Ok;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab2_4) state.lab2_4.isPassed = true;
    state.substepProgress['2-4'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (분배법칙과 일차식의 계산 마스터)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          <b>[문제 4 계산 완벽 정답]</b><br>
          • ⑴ $4(2x - 3) = 4 \\times 2x - 4 \\times 3 = 8x - 12$<br>
          • ⑵ $(6a + 9) \\times \\frac{1}{3} = 6a \\times \\frac{1}{3} + 9 \\times \\frac{1}{3} = 2a + 3$<br>
          • ⑶ $(10x - 5) \\div 5 = 10x \\times \\frac{1}{5} - 5 \\times \\frac{1}{5} = 2x - 1$<br>
          • ⑷ $(-12b + 8) \\div (-4) = -12b \\times \\left(-\\frac{1}{4}\\right) + 8 \\times \\left(-\\frac{1}{4}\\right) = 3b - 2$<br>
          괄호 밖의 수를 각 항에 빠짐없이 곱하고 부호를 바르게 판정하는 분배법칙을 완벽하게 습득했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('2-4', { score: 100, passed: true }, 'unit3');
    }

    if (!state.unlockedSubSteps.includes('2-5')) {
      state.unlockedSubSteps.push('2-5');
    }
  } else {
    let errorMsg = [];
    if (!is1Ok) errorMsg.push('⑴: $4(2x - 3) = 4 \\times 2x - 4 \\times 3 = 8x - 12$ (입력: 8x-12) 입니다.');
    if (!is2Ok) errorMsg.push('⑵: $(6a + 9) \\times \\frac{1}{3} = 2a + 3$ (입력: 2a+3) 입니다.');
    if (!is3Ok) errorMsg.push('⑶: $(10x - 5) \\div 5 = 2x - 1$ (입력: 2x-1) 입니다.');
    if (!is4Ok) errorMsg.push('⑷: $(-12b + 8) \\div (-4) = 3b - 2$ (입력: 3b-2) 입니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.3rem;">💡</span>
          <h6 style="color:#9f1239; font-weight:700; margin:0;">다시 확인해 보세요!</h6>
        </div>
        <div style="font-size:0.86rem; color:#be123c; line-height:1.6;">
          ${errorMsg.map(msg => `<div>• ${msg}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

// -------------------------------------------------------------
function gradeStep2_5() {
  const q1 = document.getElementById('ans-2-5-1');
  const q2 = document.getElementById('ans-2-5-2');
  const q3 = document.getElementById('ans-2-5-3');
  const q4 = document.getElementById('ans-2-5-4');
  const fb = document.getElementById('feedback-2-5');

  if (!q1 || !q2 || !q3 || !q4 || !fb) return;

  const norm = (s) => (s || '').toLowerCase().replace(/\s+/g, '');

  const a1 = norm(q1.value);
  const a2 = norm(q2.value);
  const a3 = norm(q3.value);
  const a4 = norm(q4.value);

  const is1Ok = (a1 === '3x-2' || a1 === '+3x-2');
  const is2Ok = (a2 === '-2a+5' || a2 === '+5-2a' || a2 === '5-2a');
  const is3Ok = (a3 === '6x-4' || a3 === '+6x-4');
  const is4Ok = (a4 === '2x-3' || a4 === '+2x-3');

  const allCorrect = is1Ok && is2Ok && is3Ok && is4Ok;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab2_5) state.lab2_5.isPassed = true;
    state.substepProgress['2-5'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (일차식과 수의 나눗셈 마스터)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          <b>[나눗셈 실전 완벽 정답]</b><br>
          • ⑴ $(12x - 8) \\div 4 = 12x \\times \\frac{1}{4} - 8 \\times \\frac{1}{4} = 3x - 2$<br>
          • ⑵ $(6a - 15) \\div (-3) = 6a \\times \\left(-\\frac{1}{3}\\right) - 15 \\times \\left(-\\frac{1}{3}\\right) = -2a + 5$<br>
          • ⑶ $(-9x + 6) \\div \\left(-\\frac{3}{2}\\right) = (-9x + 6) \\times \\left(-\\frac{2}{3}\\right) = 6x - 4$<br>
          • ⑷ $\\frac{8x - 12}{4} = \\frac{8x}{4} - \\frac{12}{4} = 2x - 3$<br>
          역수 곱셈 변환과 분수 분할을 능숙하게 활용하고 음수 부호까지 정확하게 계산했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('2-5', { score: 100, passed: true }, 'unit3');
    }

    if (!state.unlockedSubSteps.includes('2-6')) {
      state.unlockedSubSteps.push('2-6');
    }
  } else {
    let errorMsg = [];
    if (!is1Ok) errorMsg.push('⑴: $(12x - 8) \\div 4 = 3x - 2$ (입력: 3x-2) 입니다.');
    if (!is2Ok) errorMsg.push('⑵: $(6a - 15) \\div (-3) = -2a + 5$ (입력: -2a+5) 입니다.');
    if (!is3Ok) errorMsg.push('⑶: $(-9x + 6) \\times \\left(-\\frac{2}{3}\\right) = 6x - 4$ (입력: 6x-4) 입니다.');
    if (!is4Ok) errorMsg.push('⑷: $\\frac{8x - 12}{4} = 2x - 3$ (입력: 2x-3) 입니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.3rem;">💡</span>
          <h6 style="color:#9f1239; font-weight:700; margin:0;">다시 확인해 보세요!</h6>
        </div>
        <div style="font-size:0.86rem; color:#be123c; line-height:1.6;">
          ${errorMsg.map(msg => `<div>• ${msg}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

    // --- End Substep 2-5 Implementation ---

    // Router for Substep
    function loadSubStep(code) {
      state.subStep = code;
      const data = SUBSTEPS_DATA[code];
      const tabIdx = data ? data.tab : 0;
      state.currentMainTab = tabIdx;

      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === tabIdx);
      });

      const select = document.getElementById('substep-dropdown-select');
      if (select) select.value = code;

      const tabCodes = ALL_SUBSTEPS.filter(c => SUBSTEPS_DATA[c] && SUBSTEPS_DATA[c].tab === tabIdx);
      const curIdx = tabCodes.indexOf(code);
      const badge = document.getElementById('substep-counter-badge');
      if (badge) badge.innerText = `${curIdx + 1} / ${tabCodes.length}`;

      const fb = document.getElementById('feedback-banner');
      if (fb) fb.style.display = 'none';

      if (code === '0-1') {
        renderToolbar0_1();
        renderSubstep0_1();
      } else if (code === '0-2') {
        renderToolbar0_2();
        renderSubstep0_2();
      } else if (code === '0-3') {
        renderToolbar0_3();
        renderSubstep0_3();
      } else if (code === '0-4') {
        renderToolbar0_4();
        renderSubstep0_4();
      } else if (code === '1-1') {
        renderToolbar1_1();
        renderSubstep1_1();
      } else if (code === '1-2') {
        renderToolbar1_2();
        renderSubstep1_2();
      } else if (code === '1-3') {
        renderToolbar1_3();
        renderSubstep1_3();
      } else if (code === '1-4') {
        renderToolbar1_4();
        renderSubstep1_4();
      } else if (code === '1-5') {
        renderToolbar1_5();
        renderSubstep1_5();
      } else if (code === '1-6') {
        renderToolbar1_6();
        renderSubstep1_6();
      } else if (code === '1-7') {
        renderToolbar1_7();
        renderSubstep1_7();
      } else if (code === '1-8') {
        renderToolbar1_8();
        renderSubstep1_8();
      } else if (code === '1-9') {
        renderToolbar1_9();
        renderSubstep1_9();
      } else if (code === '1-10') {
        renderToolbar1_10();
        renderSubstep1_10();
      } else if (code === '1-11') {
        renderToolbar1_11();
        renderSubstep1_11();
      } else if (code === '1-12') {
        renderToolbar1_12();
        renderSubstep1_12();
      } else if (code === '1-13') {
        renderToolbar1_13();
        renderSubstep1_13();
      } else if (code === '1-14') {
        renderToolbar1_14();
        renderSubstep1_14();
      } else if (code === '1-15') {
        renderToolbar1_15();
        renderSubstep1_15();
      } else if (code === '2-1') {
        renderToolbar2_1();
        renderSubstep2_1();
      } else if (code === '2-2') {
        renderToolbar2_2();
        renderSubstep2_2();
      } else if (code === '2-3') {
        renderToolbar2_3();
        renderSubstep2_3();
      } else if (code === '2-4') {
        renderToolbar2_4();
        renderSubstep2_4();
      } else if (code === '2-5') {
        renderToolbar2_5();
        renderSubstep2_5();
      } else {
        renderGenericToolbar(code);
        renderGenericSubstep(code);
      }
    }

    function renderGenericToolbar(code) {
      const tb = document.getElementById('plane-toolbar');
      if (!tb) return;
      tb.innerHTML = `
        <span style="font-size:0.85rem; font-weight:700; color:#475569;">[${code}] 캔버스 조작 도구</span>
        <button class="icon-btn" onclick="loadSubStep('${code}')">🔄 캔버스 초기화</button>
        ${state.isTeacherLoggedIn ? `<button class="icon-btn" style="background:#fef08a; color:#854d0e; font-weight:700;" onclick="passCurrentSubstepGeneric('${code}')">🔑 교사 즉시 패스</button>` : ''}
      `;
      const tc = document.getElementById('two-container');
      if (tc) {
        tc.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:440px; color:#64748b;">
          <div style="font-size:2rem; margin-bottom:12px;">📐</div>
          <p style="font-size:1rem; font-weight:600; color:#334155;">[${code}] 탐구 캔버스 랩</p>
          <p style="font-size:0.82rem; color:#94a3b8; margin-top:6px;">현재 서브스텝 순차 개발이 진행 중입니다.</p>
        </div>`;
      }
    }

    function renderGenericSubstep(code) {
      const data = SUBSTEPS_DATA[code];
      const mTitle = document.getElementById('mission-title');
      const mDesc = document.getElementById('mission-desc');
      const cont = document.getElementById('substep-form-content');

      if (mTitle) mTitle.innerText = data ? data.substepLabel : `세부 활동 [${code}]`;
      if (mDesc) mDesc.innerHTML = data ? data.missionText : '좌측 캔버스를 조작하며 학습 목표를 탐구해 보세요.';

      if (cont) {
        cont.innerHTML = `
          <div class="scaffold-card" style="padding:16px; border:1px solid #e2e8f0; border-radius:10px; background:#fff;">
            <p style="font-size:0.88rem; color:#334155; margin-bottom:12px;">교과서 지면 순서에 따라 단계별로 학습이 진행됩니다.</p>
            <button class="primary-btn" onclick="passCurrentSubstepGeneric('${code}')">✅ 학습 완료 확인</button>
          </div>
        `;
      }
    }

    // Auto-init on page load
    window.addEventListener('DOMContentLoaded', () => {
      populateSubstepDropdown();
      loadSubStep('0-1');
    });
  </script>
