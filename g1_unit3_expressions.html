function gradeStep1_6() {
  const q1Input = document.getElementById('ans-1-6-1');
  const q2Input = document.getElementById('ans-1-6-2');
  const q3Input = document.getElementById('ans-1-6-3');
  const fb = document.getElementById('feedback-1-6');
  if (!q1Input || !q2Input || !q3Input || !fb) return;

  const raw1 = (q1Input.value || '').trim();
  const raw2 = (q2Input.value || '').trim();
  const raw3 = (q3Input.value || '').trim();

  // Normalize helper
  const norm = (s) => s.toLowerCase()
    .replace(/\s+/g, '')
    .replace(/×/g, '*')
    .replace(/÷/g, '/');

  const a1 = norm(raw1);
  const a2 = norm(raw2);
  const a3 = norm(raw3);

  // Q1: ah or ha or a*h
  const isQ1Correct = (a1 === 'ah' || a1 === 'ha' || a1 === 'a*h' || a1 === 'h*a');

  // Q2: xy/2 or yx/2 or (1/2)xy or 1/2xy
  const isQ2Correct = (
    a2 === 'xy/2' ||
    a2 === 'yx/2' ||
    a2 === '(xy)/2' ||
    a2 === '(1/2)xy' ||
    a2 === '1/2xy' ||
    a2 === '(1/2)*xy' ||
    a2 === '1/2*xy' ||
    a2 === '0.5xy' ||
    a2 === '0.5*xy'
  );

  // Q3: 4/5x or (4/5)x or 0.8x or 4x/5 or x-1/5x or x-0.2x
  const isQ3Correct = (
    a3 === '4/5x' ||
    a3 === '(4/5)x' ||
    a3 === '0.8x' ||
    a3 === '4x/5' ||
    a3 === '(4x)/5' ||
    a3 === '4/5*x' ||
    a3 === '(4/5)*x' ||
    a3 === '0.8*x' ||
    a3 === 'x-1/5x' ||
    a3 === 'x-(1/5)x' ||
    a3 === 'x-0.2x' ||
    a3 === '(1-0.2)x' ||
    a3 === '(1-1/5)x'
  );

  const allCorrect = isQ1Correct && isQ2Correct && isQ3Correct;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab1_6) state.lab1_6.isPassed = true;
    state.substepProgress['1-6'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (도형 넓이와 할인 가격 식 세우기 완성)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          • ⑴ 평행사변형 넓이: $(\\text{밑변}) \\times (\\text{높이}) = ah\\text{ cm}^2$<br>
          • ⑵ 삼각형 넓이: $\\frac{1}{2} \\times (\\text{밑변}) \\times (\\text{높이}) = \\frac{xy}{2}\\text{ cm}^2$ (또는 $\\frac{1}{2}xy\\text{ cm}^2$)<br>
          • ⑶ $20\\%$ 할인 판매가: 정가에서 $20\\%$를 뺀 $0.8x$원 (또는 $\\frac{4}{5}x$원)<br>
          도형 공식과 실생활 비율 문제를 문자를 사용한 식으로 완벽하게 표현했습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    // Remote LMS DB save
    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('1-6', { score: 100, passed: true }, 'unit3');
    }

    // Auto unlock next substep 1-7
    if (!state.unlockedSubSteps.includes('1-7')) {
      state.unlockedSubSteps.push('1-7');
    }
  } else {
    let errorMsg = [];
    if (!isQ1Correct) errorMsg.push('⑴ 평행사변형 넓이: $(\\text{밑변}) \\times (\\text{높이}) = a \\times h = ah$ (입력: ah)로 씁니다.');
    if (!isQ2Correct) errorMsg.push('⑵ 삼각형 넓이: $\\frac{1}{2} \\times (\\text{밑변}) \\times (\\text{높이}) = \\frac{xy}{2}$ (입력: xy/2 또는 1/2xy)로 씁니다.');
    if (!isQ3Correct) errorMsg.push('⑶ 할인 판매가: $x - x \\times \\frac{20}{100} = \\frac{4}{5}x$ 또는 $0.8x$ (입력: 4/5x 또는 0.8x)로 씁니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">

  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

function gradeStep1_7() {
  const q1Input = document.getElementById('ans-1-7-1');
  const q2Input = document.getElementById('ans-1-7-2');
  const q3Input = document.getElementById('ans-1-7-3');
  const fb = document.getElementById('feedback-1-7');
  if (!q1Input || !q2Input || !q3Input || !fb) return;

  const raw1 = (q1Input.value || '').trim();
  const raw2 = (q2Input.value || '').trim();
  const raw3 = (q3Input.value || '').trim();

  // Normalize helper
  const norm = (s) => s.toLowerCase()
    .replace(/\s+/g, '')
    .replace(/×/g, '*')
    .replace(/÷/g, '/');

  const a1 = norm(raw1);
  const a2 = norm(raw2);
  const a3 = norm(raw3);

  // Q1: 60t or 60*t or t*60
  const isQ1Correct = (a1 === '60t' || a1 === '60*t' || a1 === 't*60');

  // Q2: x/4 or (1/4)x or 1/4x or (x)/4 or 0.25x
  const isQ2Correct = (
    a2 === 'x/4' ||
    a2 === '(x)/4' ||
    a2 === '(1/4)x' ||
    a2 === '1/4x' ||
    a2 === '(1/4)*x' ||
    a2 === '1/4*x' ||
    a2 === '0.25x' ||
    a2 === '0.25*x'
  );

  // Q3: 3a or 3*a or a*3
  const isQ3Correct = (a3 === '3a' || a3 === '3*a' || a3 === 'a*3');

  const allCorrect = isQ1Correct && isQ2Correct && isQ3Correct;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab1_7) state.lab1_7.isPassed = true;
    state.substepProgress['1-7'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">

          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (거·속·시와 농도 식 세우기 완성)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          • ⑴ 이동 거리: $(\\text{속력}) \\times (\\text{시간}) = 60 \\times t = 60t\\text{ km}$<br>
          • ⑵ 걸린 시간: $(\\text{거리}) \\div (\\text{속력}) = x \\div 4 = \\frac{x}{4}\\text{ 시간}$ (또는 $\\frac{1}{4}x\\text{ 시간}$)<br>
          • ⑶ 소금의 양: $(\\text{소금물}) \\times \\frac{\\text{농도}}{100} = 300 \\times \\frac{a}{100} = 3a\\text{ g}$<br>
          거리·속력·시간 공식과 소금물 농도 공식을 문자를 사용한 식으로 완벽히 세웠습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    // Remote LMS DB save
    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('1-7', { score: 100, passed: true }, 'unit3');
    }

    // Auto unlock next substep 1-8
    if (!state.unlockedSubSteps.includes('1-8')) {
      state.unlockedSubSteps.push('1-8');
    }
  } else {
    let errorMsg = [];
    if (!isQ1Correct) errorMsg.push('⑴ 이동 거리: $(\\text{속력}) \\times (\\text{시간}) = 60 \\times t = 60t$ (입력: 60t)로 씁니다.');
    if (!isQ2Correct) errorMsg.push('⑵ 걸린 시간: $(\\text{거리}) \\div (\\text{속력}) = x \\div 4 = \\frac{x}{4}$ (입력: x/4 또는 1/4x)로 씁니다.');
    if (!isQ3Correct) errorMsg.push('⑶ 소금의 양: $300 \\times \\frac{a}{100} = 3a$ (입력: 3a)로 씁니다.');

    fb.innerHTML = `

function drawSoundSpeedVisual(two, cx, cy, cw) {
  const x = state.lab1_8.tempX || 15;

  const presets = [

    { x: 10, label: '10℃' },
    { x: 15, label: '15℃' },
    { x: 20, label: '20℃' },

  ];

  const startX = cx - 180;
  const btnY = cy - 85;

  presets.forEach((p, idx) => {
    const pX = startX + idx * 90;
    const isAct = (x === p.x);
    const pBtn = two.makeRoundedRectangle(pX, btnY, 78, 26, 6);
    pBtn.fill = isAct ? '#4f46e5' : '#f8fafc';
    pBtn.stroke = isAct ? '#3730a3' : '#cbd5e1';
    pBtn.linewidth = 1;

    const pTxt = two.makeText(p.label, pX, btnY);
    pTxt.size = 11;
    pTxt.weight = 700;
    pTxt.fill = isAct ? '#ffffff' : '#475569';

      pBtn._renderer.elem.style.cursor = 'pointer';
      pBtn._renderer.elem.onclick = () => setTempX(p.x);
    }
  });

  // Thermometer Graphic on Left
  const thermX = cx - 140;
  const thermY = cy + 20;

  const tube = two.makeRoundedRectangle(thermX, thermY - 10, 16, 75, 8);
  tube.fill = '#f1f5f9';

  bulb.fill = '#ef4444';
  bulb.stroke = '#dc2626';
  bulb.linewidth = 1.5;

  const mercuryH = Math.max(10, (x / 30) * 60);
  const mercury = two.makeRoundedRectangle(thermX, thermY + 20 - mercuryH / 2, 10, mercuryH, 5);
  mercury.fill = '#ef4444';
  mercury.noStroke();

  const tempTxt = two.makeText(`기온 x = ${x}℃`, thermX, thermY - 58);
  tempTxt.size = 12.5;
  tempTxt.weight = 800;
  tempTxt.fill = '#b91c1c';

  // Calculation Board on Right
  const calcX = cx + 60;
  const calcBox = two.makeRoundedRectangle(calcX, cy + 15, 270, 95, 8);
  calcBox.fill = '#f0fdf4';
  calcBox.stroke = '#86efac';
  calcBox.linewidth = 1.5;

  const speedVal = 331 + 0.6 * x;

  line1.size = 13;
  line1.weight = 700;
  line1.fill = '#1e293b';

  const line2 = two.makeText(`x = ${x} 대입 ➜ 331 + 0.6 × (${x})`, calcX, cy + 10);
  line2.size = 13.5;
  line2.weight = 700;
  line2.fill = '#4f46e5';

  const line3 = two.makeText(`식의 값 = 331 + ${0.6 * x} = ${speedVal} m/초`, calcX, cy + 34);
  line3.size = 14;
  line3.weight = 800;
  line3.fill = '#15803d';

  tipTxt.weight = 700;
  tipTxt.fill = '#1d4ed8';
}

function gradeStep1_8() {
  const q1Input = document.getElementById('ans-1-8-1');
  const q2Input = document.getElementById('ans-1-8-2');
  const q3Input = document.getElementById('ans-1-8-3');
  const fb = document.getElementById('feedback-1-8');
  if (!q1Input || !q2Input || !q3Input || !fb) return;

  const raw1 = (q1Input.value || '').trim();
  const raw2 = (q2Input.value || '').trim();
  const raw3 = (q3Input.value || '').trim();

  // Normalize
  const norm = (s) => s.toLowerCase().replace(/\s+/g, '');

  const a1 = norm(raw1);
  const a2 = norm(raw2);
  const a3 = norm(raw3);

  // Q1: 340 (or 340m/s, 340m/초)
  const isQ1Correct = (a1 === '340' || a1 === '340m/s' || a1 === '340m/초');

  // Q2: 11
  const isQ2Correct = (a2 === '11');

  // Q3: 3
  const isQ3Correct = (a3 === '3');

  const allCorrect = isQ1Correct && isQ2Correct && isQ3Correct;

  fb.style.display = 'block';

  if (allCorrect) {
    if (state.lab1_8) state.lab1_8.isPassed = true;
    state.substepProgress['1-8'] = true;

    fb.innerHTML = `
      <div class="card p-3" style="background:#ecfdf5; border:1.5px solid #10b981; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.4rem;">🎉</span>
          <h5 style="color:#065f46; font-weight:800; margin:0;">100점 완벽 통과! (생각 열기 및 예제 3 식의 값 해결)</h5>
        </div>
        <div style="font-size:0.88rem; color:#047857; line-height:1.6;">
          • ⑴ 생각 열기: $331 + 0.6 \\times 15 = 331 + 9 = 340\\text{ (m/초)}$<br>
          • ⑵ 예제 3-(1): $5 - 2 \\times (-3) = 5 - (-6) = 5 + 6 = 11$<br>
          • ⑶ 예제 3-(2): $\\frac{(-3)^2}{3} = \\frac{9}{3} = 3$<br>
          문자 대신 수를 대입하여 식의 값을 정확히 계산하는 원리와 음수 괄호 대입 규칙을 완벽히 익혔습니다!
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#059669; font-weight:700;">
          ✅ 학습 완료 상태가 영서중 LMS DB에 안전하게 자동 저장되었습니다.
        </div>
      </div>
    `;

    // Remote LMS DB save
    if (window.LMSIntegration && typeof window.LMSIntegration.saveStudentProgress === 'function') {
      window.LMSIntegration.saveStudentProgress('1-8', { score: 100, passed: true }, 'unit3');
    }

    // Auto unlock next substep 1-9
    if (!state.unlockedSubSteps.includes('1-9')) {
      state.unlockedSubSteps.push('1-9');
    }
  } else {
    let errorMsg = [];
    if (!isQ1Correct) errorMsg.push('⑴ 소리의 속력: $331 + 0.6 \\times 15 = 331 + 9 = 340$ (입력: 340) 입니다.');
    if (!isQ2Correct) errorMsg.push('⑵ $5 - 2a$: $a = -3$을 대입하면 $5 - 2 \\times (-3) = 5 - (-6) = 11$ (입력: 11) 입니다.');
    if (!isQ3Correct) errorMsg.push('⑶ $\\frac{a^2}{3}$: $a = -3$을 대입하면 $(-3)^2 = 9$이므로 $\\frac{9}{3} = 3$ (입력: 3) 입니다.');

    fb.innerHTML = `
      <div class="card p-3" style="background:#fff1f2; border:1.5px solid #f43f5e; border-radius:10px;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:1.3rem;">💡</span>
          <h6 style="color:#9f1239; font-weight:700; margin:0;">다시 확인해 보세요!</h6>
        </div>
        <div style="font-size:0.86rem; color:#be123c; line-height:1.6;">
          ${errorMsg.map(msg => `<div>• ${msg}</div>`).join('')}
        </div>
      </div>
    `;
  }

  if (window.renderMathInElement) {
    window.renderMathInElement(fb, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false
    });
  }
}

    // --- End Substep 1-8 Implementation ---

    // Router for Substep
    function loadSubStep(code) {
      state.subStep = code;
      const data = SUBSTEPS_DATA[code];
      const tabIdx = data ? data.tab : 0;
      state.currentMainTab = tabIdx;

      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === tabIdx);
      });

      const select = document.getElementById('substep-dropdown-select');
      if (select) select.value = code;

      const tabCodes = ALL_SUBSTEPS.filter(c => SUBSTEPS_DATA[c] && SUBSTEPS_DATA[c].tab === tabIdx);
      const curIdx = tabCodes.indexOf(code);
      const badge = document.getElementById('substep-counter-badge');
      if (badge) badge.innerText = `${curIdx + 1} / ${tabCodes.length}`;

      const fb = document.getElementById('feedback-banner');
      if (fb) fb.style.display = 'none';

      if (code === '0-1') {
        renderToolbar0_1();
        renderSubstep0_1();
      } else if (code === '0-2') {
        renderToolbar0_2();
        renderSubstep0_2();
      } else if (code === '0-3') {
        renderToolbar0_3();
        renderSubstep0_3();
      } else if (code === '0-4') {
        renderToolbar0_4();
        renderSubstep0_4();
      } else if (code === '1-1') {
        renderToolbar1_1();
        renderSubstep1_1();
      } else if (code === '1-2') {
        renderToolbar1_2();
        renderSubstep1_2();
      } else if (code === '1-3') {
        renderToolbar1_3();
        renderSubstep1_3();
      } else if (code === '1-4') {
        renderToolbar1_4();
        renderSubstep1_4();
      } else if (code === '1-5') {
        renderToolbar1_5();
        renderSubstep1_5();
      } else if (code === '1-6') {
        renderToolbar1_6();
        renderSubstep1_6();
      } else if (code === '1-7') {
        renderToolbar1_7();
        renderSubstep1_7();
      } else if (code === '1-8') {
        renderToolbar1_8();
        renderSubstep1_8();
      } else {
        renderGenericToolbar(code);
        renderGenericSubstep(code);
      }
    }

    function renderGenericToolbar(code) {
      const tb = document.getElementById('plane-toolbar');
      if (!tb) return;
      tb.innerHTML = `
        <span style="font-size:0.85rem; font-weight:700; color:#475569;">[${code}] 캔버스 조작 도구</span>
        <button class="icon-btn" onclick="loadSubStep('${code}')">🔄 캔버스 초기화</button>
        ${state.isTeacherLoggedIn ? `<button class="icon-btn" style="background:#fef08a; color:#854d0e; font-weight:700;" onclick="passCurrentSubstepGeneric('${code}')">🔑 교사 즉시 패스</button>` : ''}
      `;
      const tc = document.getElementById('two-container');
      if (tc) {
        tc.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:440px; color:#64748b;">
          <div style="font-size:2rem; margin-bottom:12px;">📐</div>
          <p style="font-size:1rem; font-weight:600; color:#334155;">[${code}] 탐구 캔버스 랩</p>
          <p style="font-size:0.82rem; color:#94a3b8; margin-top:6px;">현재 서브스텝 순차 개발이 진행 중입니다.</p>
        </div>`;
      }
    }

    function renderGenericSubstep(code) {
      const data = SUBSTEPS_DATA[code];
      const mTitle = document.getElementById('mission-title');
      const mDesc = document.getElementById('mission-desc');
      const cont = document.getElementById('substep-form-content');

      if (mTitle) mTitle.innerText = data ? data.substepLabel : `세부 활동 [${code}]`;
      if (mDesc) mDesc.innerHTML = data ? data.missionText : '좌측 캔버스를 조작하며 학습 목표를 탐구해 보세요.';

      if (cont) {
        cont.innerHTML = `
          <div class="scaffold-card" style="padding:16px; border:1px solid #e2e8f0; border-radius:10px; background:#fff;">
            <p style="font-size:0.88rem; color:#334155; margin-bottom:12px;">교과서 지면 순서에 따라 단계별로 학습이 진행됩니다.</p>
            <button class="primary-btn" onclick="passCurrentSubstepGeneric('${code}')">✅ 학습 완료 확인</button>
          </div>
        `;
      }
    }

    // Auto-init on page load
    window.addEventListener('DOMContentLoaded', () => {
      populateSubstepDropdown();
      loadSubStep('0-1');
    });
  </script>
