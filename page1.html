<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>프로젝트 2 - 페이지 1 (RHA 합동 탐구)</title>
  
  <!-- KaTeX Math Rendering Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Two.js 2D Dynamic Geometry Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/two.js/0.8.10/two.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #0284c7;
      --accent-color: #ec4899;
      --bg-main: #ffffff;
      --border-color: #cbd5e1;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-main);
      display: flex;
      flex-direction: column;
    }

    /* Header & Control Bar */
    header.app-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      min-height: 48px;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
    }

    /* Top Sliders & Control Panel */
    .controls-bar {
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      z-index: 90;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .group-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #334155;
    }

    .control-group.abc { border-left: 4px solid var(--primary-color); }
    .control-group.def { border-left: 4px solid var(--secondary-color); }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
    }

    input[type="range"] {
      width: 100px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .control-group.def input[type="range"] {
      accent-color: var(--secondary-color);
    }

    .val-disp {
      font-size: 0.82rem;
      font-weight: 800;
      color: #0f172a;
      min-width: 44px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #f1f5f9;
    }

    .btn-reset {
      margin-left: auto;
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    /* Full-Screen Two.js Canvas Container */
    .canvas-container {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #ffffff;
    }

    #two-container, #two-container canvas, #two-container svg {
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 검정색 손바닥 커서 */
    #two-container.tool-select, #two-container.tool-select canvas {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1.5"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V2a2 2 0 0 0-4 0v9M6 14v-2.5a2 2 0 0 0-4 0V16c0 4.4 3.6 8 8 8h3c3.9 0 7.1-3.1 7-7v-3a2 2 0 0 0-4 0v-1"/></svg>') 8 8, grab !important;
    }

    #two-container.tool-select.grabbing, #two-container.tool-select.grabbing canvas {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black" stroke="white" stroke-width="1.5"><path d="M18 13v-2a2 2 0 0 0-4 0v2M14 12v-2a2 2 0 0 0-4 0v2M10 12.5v-2.5a2 2 0 0 0-4 0v3M6 14.5v-1a2 2 0 0 0-4 0V16c0 4.4 3.6 8 8 8h3c3.9 0 7.1-3.1 7-7v-3.5a2 2 0 0 0-4 0V13"/></svg>') 8 8, grabbing !important;
    }

    /* Floating Hint Badge */
    .floating-badge {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.86rem;
      pointer-events: none;
      z-index: 80;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">📐 [페이지 1] RHA 합동 대화형 탐구 (자유 이동 & 회전)</h1>
  </header>

  <!-- Control Sliders Panel -->
  <div class="controls-bar">
    <!-- Triangle ABC Controls -->
    <div class="control-group abc">
      <span class="group-title">△ABC</span>
      <label>빗변 AB:</label>
      <input type="range" id="slider-ab-len" min="8" max="18" value="12" step="0.5" oninput="updateGeometries()">
      <span id="disp-ab-len" class="val-disp">12 cm</span>

      <label style="margin-left:8px;">각 B:</label>
      <input type="range" id="slider-ang-b" min="20" max="75" value="55" step="1" oninput="updateGeometries()">
      <span id="disp-ang-b" class="val-disp">55°</span>

      <label style="margin-left:8px;">회전:</label>
      <input type="range" id="slider-rot-abc" min="0" max="360" value="0" step="1" oninput="updateGeometries()">
      <span id="disp-rot-abc" class="val-disp">0°</span>
    </div>

    <!-- Triangle DEF Controls -->
    <div class="control-group def">
      <span class="group-title">△DEF</span>
      <label>빗변 DE:</label>
      <input type="range" id="slider-de-len" min="8" max="18" value="12" step="0.5" oninput="updateGeometries()">
      <span id="disp-de-len" class="val-disp">12 cm</span>

      <label style="margin-left:8px;">각 E:</label>
      <input type="range" id="slider-ang-e" min="20" max="75" value="55" step="1" oninput="updateGeometries()">
      <span id="disp-ang-e" class="val-disp">55°</span>

      <label style="margin-left:8px;">회전:</label>
      <input type="range" id="slider-rot-def" min="0" max="360" value="0" step="1" oninput="updateGeometries()">
      <span id="disp-rot-def" class="val-disp">0°</span>
    </div>

    <button class="btn btn-reset" onclick="resetPage1()">🔄 초기 위치로</button>
  </div>

  <main class="canvas-container">
    <div id="two-container" class="tool-select"></div>
    <div class="floating-badge">
      💡 <b>탐구 팁:</b> 도형을 클릭하여 드래그하면 자유롭게 이동시킬 수 있으며, 회전 슬라이더로 회전시켜 서로 겹쳐볼 수 있습니다!
    </div>
  </main>

  <script>
    let twoInstance = null;

    // 도형 ABC의 상태 (꼭짓점 B가 기준점)
    const shapeABC = {
      bX: 0,
      bY: 0,
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0
    };

    // 도형 DEF의 상태 (꼭짓점 E가 기준점)
    const shapeDEF = {
      eX: 0,
      eY: 0,
      isDragging: false,
      dragOffsetX: 0,
      dragOffsetY: 0
    };

    let activeDragShape = null;

    function initTwoEngine() {
      const container = document.getElementById('two-container');
      if (typeof Two === 'undefined' || !container) return null;

      container.innerHTML = '';
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || (window.innerHeight - 100);

      twoInstance = new Two({
        width: width,
        height: height,
        type: Two.Types.canvas,
        autostart: true
      }).appendTo(container);

      const domEl = twoInstance.renderer.domElement;
      if (domEl) {
        domEl.style.touchAction = 'none';
        domEl.style.userSelect = 'none';
        domEl.style.webkitUserSelect = 'none';
        domEl.style.width = '100%';
        domEl.style.height = '100%';
      }

      // 초기 기준점 위치 설정 (B: 화면 좌측 하단, E: 화면 우측 하단)
      const centerX = width / 2;
      const centerY = height / 2;

      shapeABC.bX = centerX - 220;
      shapeABC.bY = centerY + 80;

      shapeDEF.eX = centerX + 120;
      shapeDEF.eY = centerY + 80;

      setupInteraction(domEl);
      updateGeometries();
    }

    function rotatePoint(px, py, cx, cy, rad) {
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);
      const nx = (cos * (px - cx)) - (sin * (py - cy)) + cx;
      const ny = (sin * (px - cx)) + (cos * (py - cy)) + cy;
      return { x: nx, y: ny };
    }

    function updateGeometries() {
      if (!twoInstance) return;

      const width = twoInstance.width;
      const height = twoInstance.height;
      const centerX = width / 2;
      const centerY = height / 2;

      twoInstance.clear();

      // 1. 옅은 정수 격자점 (Lattice Dots) & 축선
      const step = 30;
      for (let x = step; x <= width; x += step) {
        for (let y = step; y <= height; y += step) {
          const dot = twoInstance.makeCircle(x, y, 1.5);
          dot.fill = '#cbd5e1';
          dot.noStroke();
        }
      }

      twoInstance.makeLine(0, centerY, width, centerY).stroke = '#94a3b8';
      twoInstance.makeLine(centerX, 0, centerX, height).stroke = '#94a3b8';

      // 2. 값 읽기
      const abLenCm = parseFloat(document.getElementById('slider-ab-len').value);
      const angBDeg = parseFloat(document.getElementById('slider-ang-b').value);
      const rotABCDeg = parseFloat(document.getElementById('slider-rot-abc').value);

      const deLenCm = parseFloat(document.getElementById('slider-de-len').value);
      const angEDeg = parseFloat(document.getElementById('slider-ang-e').value);
      const rotDEFDeg = parseFloat(document.getElementById('slider-rot-def').value);

      document.getElementById('disp-ab-len').innerText = `${abLenCm} cm`;
      document.getElementById('disp-ang-b').innerText = `${angBDeg}°`;
      document.getElementById('disp-rot-abc').innerText = `${rotABCDeg}°`;

      document.getElementById('disp-de-len').innerText = `${deLenCm} cm`;
      document.getElementById('disp-ang-e').innerText = `${angEDeg}°`;
      document.getElementById('disp-rot-def').innerText = `${rotDEFDeg}°`;

      // scale factor: 1cm = 15px
      const scale = 15;
      const abPx = abLenCm * scale;
      const dePx = deLenCm * scale;

      const angBRad = angBDeg * Math.PI / 180;
      const angERad = angEDeg * Math.PI / 180;

      const rotABCRad = rotABCDeg * Math.PI / 180;
      const rotDEFRad = rotDEFDeg * Math.PI / 180;

      // --- [삼각형 ABC 계산 (회전 미적용 local 0도 상태 좌표)] ---
      // B가 (0,0), C가 (abPx * cos^2(B), 0), A가 (abPx * cos(B), -abPx * sin(B))
      const rawB = { x: shapeABC.bX, y: shapeABC.bY };
      const rawC = { x: shapeABC.bX + abPx * Math.cos(angBRad) * Math.cos(angBRad), y: shapeABC.bY };
      const rawA = { x: shapeABC.bX + abPx * Math.cos(angBRad), y: shapeABC.bY - abPx * Math.sin(angBRad) };

      // 회전 중심: 꼭짓점 B(rawB.x, rawB.y)
      const pB = rawB;
      const pC = rotatePoint(rawC.x, rawC.y, rawB.x, rawB.y, rotABCRad);
      const pA = rotatePoint(rawA.x, rawA.y, rawB.x, rawB.y, rotABCRad);

      shapeABC.polygonPoints = [pA, pB, pC];

      // ABC 렌더링
      const triABC = twoInstance.makePath(pA.x, pA.y, pB.x, pB.y, pC.x, pC.y, false);
      triABC.fill = 'rgba(79, 70, 229, 0.12)';
      triABC.stroke = '#4f46e5';
      triABC.linewidth = 2.5;

      // C 직각 표시 (회전 적용)
      const rc1 = rotatePoint(rawC.x - 14, rawC.y, rawB.x, rawB.y, rotABCRad);
      const rc2 = rotatePoint(rawC.x - 14, rawC.y - 14, rawB.x, rawB.y, rotABCRad);
      const rc3 = rotatePoint(rawC.x, rawC.y - 14, rawB.x, rawB.y, rotABCRad);
      const rC = twoInstance.makePath(rc1.x, rc1.y, rc2.x, rc2.y, rc3.x, rc3.y, false);
      rC.noFill(); rC.stroke = '#4f46e5'; rC.linewidth = 1.5;

      // 각 B 원호 표시 (삼각형 내부에만 깔끔히 적용)
      const arcB = twoInstance.makeArcSegment(pB.x, pB.y, 0, 26, -angBRad + rotABCRad, rotABCRad);
      arcB.fill = 'rgba(236, 72, 153, 0.18)'; arcB.stroke = '#ec4899'; arcB.linewidth = 1.5;

      // 꼭짓점 원 및 라벨
      twoInstance.makeCircle(pA.x, pA.y, 6).fill = '#4f46e5';
      twoInstance.makeCircle(pB.x, pB.y, 6).fill = '#4f46e5';
      twoInstance.makeCircle(pC.x, pC.y, 6).fill = '#4f46e5';

      const tA = twoInstance.makeText('A', pA.x, pA.y - 18); tA.size = 15; tA.weight = 800;
      const tB = twoInstance.makeText('B', pB.x - 16, pB.y + 16); tB.size = 15; tB.weight = 800;
      const tC = twoInstance.makeText('C', pC.x + 16, pC.y + 16); tC.size = 15; tC.weight = 800;

      // 빗변 AB 라벨
      const midAB = { x: (pA.x + pB.x)/2 - 16, y: (pA.y + pB.y)/2 - 12 };
      const lblAB = twoInstance.makeText(`${abLenCm} cm`, midAB.x, midAB.y);
      lblAB.fill = '#4f46e5'; lblAB.size = 13; lblAB.weight = 800;


      // --- [삼각형 DEF 계산 (E 기준점)] ---
      const rawE = { x: shapeDEF.eX, y: shapeDEF.eY };
      const rawF = { x: shapeDEF.eX + dePx * Math.cos(angERad) * Math.cos(angERad), y: shapeDEF.eY };
      const rawD = { x: shapeDEF.eX + dePx * Math.cos(angERad), y: shapeDEF.eY - dePx * Math.sin(angERad) };

      const pE = rawE;
      const pF = rotatePoint(rawF.x, rawF.y, rawE.x, rawE.y, rotDEFRad);
      const pD = rotatePoint(rawD.x, rawD.y, rawE.x, rawE.y, rotDEFRad);

      shapeDEF.polygonPoints = [pD, pE, pF];

      // DEF 렌더링
      const triDEF = twoInstance.makePath(pD.x, pD.y, pE.x, pE.y, pF.x, pF.y, false);
      triDEF.fill = 'rgba(2, 132, 199, 0.12)';
      triDEF.stroke = '#0284c7';
      triDEF.linewidth = 2.5;

      // F 직각 표시
      const rf1 = rotatePoint(rawF.x - 14, rawF.y, rawE.x, rawE.y, rotDEFRad);
      const rf2 = rotatePoint(rawF.x - 14, rawF.y - 14, rawE.x, rawE.y, rotDEFRad);
      const rf3 = rotatePoint(rawF.x, rawF.y - 14, rawE.x, rawE.y, rotDEFRad);
      const rF = twoInstance.makePath(rf1.x, rf1.y, rf2.x, rf2.y, rf3.x, rf3.y, false);
      rF.noFill(); rF.stroke = '#0284c7'; rF.linewidth = 1.5;

      // 각 E 원호 표시
      const arcE = twoInstance.makeArcSegment(pE.x, pE.y, 0, 26, -angERad + rotDEFRad, rotDEFRad);
      arcE.fill = 'rgba(236, 72, 153, 0.18)'; arcE.stroke = '#ec4899'; arcE.linewidth = 1.5;

      // 꼭짓점 원 및 라벨
      twoInstance.makeCircle(pD.x, pD.y, 6).fill = '#0284c7';
      twoInstance.makeCircle(pE.x, pE.y, 6).fill = '#0284c7';
      twoInstance.makeCircle(pF.x, pF.y, 6).fill = '#0284c7';

      const tD = twoInstance.makeText('D', pD.x, pD.y - 18); tD.size = 15; tD.weight = 800;
      const tE = twoInstance.makeText('E', pE.x - 16, pE.y + 16); tE.size = 15; tE.weight = 800;
      const tF = twoInstance.makeText('F', pF.x + 16, pF.y + 16); tF.size = 15; tF.weight = 800;

      // 빗변 DE 라벨
      const midDE = { x: (pD.x + pE.x)/2 - 16, y: (pD.y + pE.y)/2 - 12 };
      const lblDE = twoInstance.makeText(`${deLenCm} cm`, midDE.x, midDE.y);
      lblDE.fill = '#0284c7'; lblDE.size = 13; lblDE.weight = 800;

      twoInstance.update();
    }

    // Point in Polygon hit-testing
    function isPointInTriangle(pt, poly) {
      const p0 = poly[0], p1 = poly[1], p2 = poly[2];
      const A = 1/2 * (-p1.y * p2.x + p0.y * (-p1.x + p2.x) + p0.x * (p1.y - p2.y) + p1.x * p2.y);
      const sign = A < 0 ? -1 : 1;
      const s = (p0.y * p2.x - p0.x * p2.y + (p2.y - p0.y) * pt.x + (p0.x - p2.x) * pt.y) * sign;
      const t = (p0.x * p1.y - p0.y * p1.x + (p0.y - p1.y) * pt.x + (p1.x - p0.x) * pt.y) * sign;
      return s > 0 && t > 0 && (s + t) < 2 * A * sign;
    }

    function setupInteraction(domEl) {
      const getPos = (evt) => {
        const rect = domEl.getBoundingClientRect();
        const clientX = evt.touches && evt.touches.length > 0 ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches && evt.touches.length > 0 ? evt.touches[0].clientY : evt.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const onStart = (evt) => {
        const pos = getPos(evt);

        // ABC hit test
        if (shapeABC.polygonPoints && isPointInTriangle(pos, shapeABC.polygonPoints)) {
          activeDragShape = shapeABC;
          shapeABC.isDragging = true;
          shapeABC.dragOffsetX = pos.x - shapeABC.bX;
          shapeABC.dragOffsetY = pos.y - shapeABC.bY;
          domEl.parentElement.classList.add('grabbing');
          return;
        }

        // DEF hit test
        if (shapeDEF.polygonPoints && isPointInTriangle(pos, shapeDEF.polygonPoints)) {
          activeDragShape = shapeDEF;
          shapeDEF.isDragging = true;
          shapeDEF.dragOffsetX = pos.x - shapeDEF.eX;
          shapeDEF.dragOffsetY = pos.y - shapeDEF.eY;
          domEl.parentElement.classList.add('grabbing');
          return;
        }
      };

      const onMove = (evt) => {
        if (!activeDragShape) return;
        if (evt.preventDefault) evt.preventDefault();
        const pos = getPos(evt);

        if (activeDragShape === shapeABC) {
          shapeABC.bX = pos.x - shapeABC.dragOffsetX;
          shapeABC.bY = pos.y - shapeABC.dragOffsetY;
        } else if (activeDragShape === shapeDEF) {
          shapeDEF.eX = pos.x - shapeDEF.dragOffsetX;
          shapeDEF.eY = pos.y - shapeDEF.dragOffsetY;
        }

        updateGeometries();
      };

      const onEnd = () => {
        if (activeDragShape) {
          domEl.parentElement.classList.remove('grabbing');
          activeDragShape = null;
        }
      };

      domEl.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      domEl.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    function resetPage1() {
      if (!twoInstance) return;
      const width = twoInstance.width;
      const height = twoInstance.height;
      const centerX = width / 2;
      const centerY = height / 2;

      shapeABC.bX = centerX - 220;
      shapeABC.bY = centerY + 80;

      shapeDEF.eX = centerX + 120;
      shapeDEF.eY = centerY + 80;

      document.getElementById('slider-ab-len').value = 12;
      document.getElementById('slider-ang-b').value = 55;
      document.getElementById('slider-rot-abc').value = 0;

      document.getElementById('slider-de-len').value = 12;
      document.getElementById('slider-ang-e').value = 55;
      document.getElementById('slider-rot-def').value = 0;

      updateGeometries();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTwoEngine();
      window.addEventListener('resize', () => {
        if (twoInstance) {
          const container = document.getElementById('two-container');
          twoInstance.width = container.clientWidth;
          twoInstance.height = container.clientHeight;
          updateGeometries();
        }
      });
    });
  </script>
</body>
</html>
